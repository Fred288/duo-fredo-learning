      - { id: a1-u07-l5-e6, type: paradigm, kind: noun, lemma: peynir, rows: [[ACC], [DAT], [LOC], [ABL], [GEN]], targets: [peyniri, peynire, peynirde, peynirden, peynirin], gloss_de: Käse }
      - { id: a1-u07-l5-e7, type: paradigm, kind: noun, lemma: kahve, rows: [[ACC], [DAT], [LOC], [ABL], [GEN]], targets: [kahveyi, kahveye, kahvede, kahveden, kahvenin], gloss_de: Kaffee }
      - { id: a1-u07-l5-e8, type: paradigm, kind: noun, lemma: ev, rows: [[ACC], [DAT], [LOC], [ABL], [GEN]], targets: [evi, eve, evde, evden, evin], gloss_de: Haus }
      - { id: a1-u07-l5-e9, type: paradigm, kind: noun, lemma: okul, rows: [[ACC], [DAT], [LOC], [ABL], [GEN]], targets: [okulu, okula, okulda, okuldan, okulun], gloss_de: Schule }
      - id: a1-u07-l5-e10
