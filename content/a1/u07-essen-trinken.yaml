  - id: a1-u07-l2
    type: grammar
    title: Es gibt … var und yok
    exercises:
      - id: a1-u07-l2-e1
        type: word_bank
        prompt: Es gibt Brot.
        answers: [Ekmek var.]
        distractors: [yok, Ekmekler]
        explanation: var steht am Satzende.
      - id: a1-u07-l2-e2
        type: word_bank
        prompt: Es gibt keine Milch.
        answers: [Süt yok.]
        distractors: [var, değil]
        explanation: „Es gibt nicht“ heißt yok, nicht değil.
      - id: a1-u07-l2-e3
        type: word_bank
        prompt: Gibt es Käse?
        answers: [Peynir var mı?]
        distractors: [yok, mi]
        explanation: Fragepartikel nach var, mit a → mı.
      - id: a1-u07-l2-e4
        type: word_bank
        prompt: Zu Hause gibt es Tee.
        answers: [Evde çay var.]
        distractors: [Eve, yok]
      - id: a1-u07-l2-e5
        type: word_bank
        prompt: Gibt es hier ein Restaurant?
        answers: [Burada bir lokanta var mı?, Burada lokanta var mı?]
        distractors: [orada, yok]
      - id: a1-u07-l2-e6
        type: multiple_choice
        prompt: Antwort auf „Süt var mı?“, wenn keine da ist
        options: ['Hayır, yok.', 'Hayır, değil.', 'Evet, var.']
        answer: 'Hayır, yok.'
      - id: a1-u07-l2-e7
        type: free_text
        direction: de_tr
        prompt: Es gibt keinen Fisch.
        answers: [Balık yok.]
      - id: a1-u07-l2-e8
        type: free_text
        direction: tr_de
        prompt: Masada zeytin var.
        answers: [Auf dem Tisch sind Oliven., Auf dem Tisch gibt es Oliven., Es gibt Oliven auf dem Tisch., Auf dem Tisch ist eine Olive., Auf dem Tisch liegen Oliven.]
      - id: a1-u07-l2-e9
        type: multiple_choice
        prompt: Was ist der Unterschied? „Çay yok.“ / „Çay değil.“
        options: [Es gibt keinen Tee. / Es ist kein Tee., Beides heißt dasselbe., Es ist kein Tee. / Es gibt keinen Tee.]
        answer: Es gibt keinen Tee. / Es ist kein Tee.
      - id: a1-u07-l2-e10
        type: word_bank
        prompt: Ja, gibt es.
        answers: ['Evet, var.']
        distractors: [yok, Hayır]
      - id: a1-u07-l2-e11
        type: free_text
        direction: de_tr
        prompt: Gibt es Wasser?
        answers: [Su var mı?]
      - id: a1-u07-l2-e12
        type: word_bank
        prompt: Im Kühlschrank gibt es keine Eier.
        answers: [Buzdolabında yumurta yok.]
        distractors: [var, yumurtalar]
        explanation: buzdolabı heißt Kühlschrank, buzdolabında = im Kühlschrank.

  - id: a1-u07-l3
    type: grammar
    title: Ich habe …
    exercises:
      - id: a1-u07-l3-e1
        type: word_bank
        prompt: Ich habe eine Katze.
        answers: [Benim bir kedim var., Bir kedim var., Kedim var., Benim kedim var.]
        distractors: [kedi, yok]
        explanation: Wörtlich „Meine eine Katze gibt es“. Besitz + var.
      - id: a1-u07-l3-e2
        type: word_bank
        prompt: Ich habe kein Auto.
        answers: [Arabam yok., Benim arabam yok.]
        distractors: [var, araba]
      - id: a1-u07-l3-e3
        type: word_bank
        prompt: Hast du Geschwister?
        answers: [Kardeşin var mı?, Senin kardeşin var mı?]
        distractors: [kardeşim, yok]
      - id: a1-u07-l3-e4
        type: word_bank
        prompt: Ayşe hat einen Hund.
        answers: [Ayşe'nin bir köpeği var., Ayşe'nin köpeği var.]
        distractors: [köpek, Ayşe]
        explanation: Besitzer im Genitiv, Besitz mit „sein/ihr“-Endung, dann var.
      - { id: a1-u07-l3-e5, type: suffix_builder, stem: kedi, suffixes: [POSS_1SG], target: kedim, gloss_de: 'meine Katze (ich habe eine Katze)' }
      - { id: a1-u07-l3-e6, type: suffix_builder, stem: köpek, suffixes: [POSS_3SG], target: köpeği, gloss_de: 'sein, ihr Hund' }
      - { id: a1-u07-l3-e7, type: suffix_builder, stem: zaman, suffixes: [POSS_1SG], target: zamanım, gloss_de: 'meine Zeit (ich habe Zeit)' }
      - id: a1-u07-l3-e8
        type: word_bank
        prompt: Ich habe keine Zeit.
        answers: [Zamanım yok., Benim zamanım yok.]
        distractors: [zaman, var]
      - id: a1-u07-l3-e9
        type: free_text
        direction: de_tr
        prompt: Ich habe einen Bruder.
        answers: [Bir erkek kardeşim var., Benim bir erkek kardeşim var., Erkek kardeşim var., Benim erkek kardeşim var., Bir ağabeyim var., Ağabeyim var., Benim bir ağabeyim var., Bir abim var., Abim var., Bir kardeşim var.]
      - id: a1-u07-l3-e10
        type: free_text
        direction: tr_de
        prompt: Paran var mı?
        answers: [Hast du Geld?, Hast du Geld dabei?]
        explanation: para heißt Geld, paran = dein Geld.
      - id: a1-u07-l3-e11
        type: multiple_choice
        prompt: Wie sagt man „Wir haben ein Haus“?
        options: [Bizim bir evimiz var., Biz bir ev var., Bizim bir ev var.]
        answer: Bizim bir evimiz var.
      - id: a1-u07-l3-e12
        type: multiple_choice
        prompt: Was heißt „Hiç vaktim yok“?
        options: [Ich habe überhaupt keine Zeit., Ich habe viel Zeit., Hast du Zeit?]
        answer: Ich habe überhaupt keine Zeit.
        explanation: vakit ist ein anderes Wort für Zeit (vaktim = meine Zeit), hiç verstärkt die Verneinung.

  - id: a1-u07-l4
    type: grammar
    title: Den Tee! Der Akkusativ
    exercises:
      - id: a1-u07-l4-e1
        type: suffix_builder
        stem: çay
        suffixes: [ACC]
        target: çayı
        gloss_de: den Tee (bestimmt)
        explanation: Bestimmtes Objekt → Akkusativ -ı/-i/-u/-ü.
      - { id: a1-u07-l4-e2, type: suffix_builder, stem: peynir, suffixes: [ACC], target: peyniri, gloss_de: den Käse }
      - id: a1-u07-l4-e3
        type: suffix_builder
        stem: ekmek
        suffixes: [ACC]
        target: ekmeği
        gloss_de: das Brot
        explanation: k wird vor Vokal zu ğ.
      - id: a1-u07-l4-e4
        type: suffix_builder
        stem: elma
        suffixes: [ACC]
        target: elmayı
        gloss_de: den Apfel
        explanation: Nach Vokal steht ein y.
      - { id: a1-u07-l4-e5, type: suffix_builder, stem: süt, suffixes: [ACC], target: sütü, gloss_de: die Milch }
      - { id: a1-u07-l4-e6, type: suffix_builder, stem: yumurta, suffixes: [ACC], target: yumurtayı, gloss_de: das Ei }
      - { id: a1-u07-l4-e7, type: suffix_builder, stem: tavuk, suffixes: [ACC], target: tavuğu, gloss_de: das Huhn }
      - { id: a1-u07-l4-e8, type: suffix_builder, stem: balık, suffixes: [ACC], target: balığı, gloss_de: den Fisch }
      - { id: a1-u07-l4-e9, type: suffix_builder, stem: kahve, suffixes: [ACC], target: kahveyi, gloss_de: den Kaffee }
      - id: a1-u07-l4-e10
        type: suffix_builder
        stem: su
        suffixes: [ACC]
        target: suyu
        gloss_de: das Wasser
        explanation: su nimmt immer ein y, suyu.
      - { id: a1-u07-l4-e11, type: suffix_builder, stem: hesap, suffixes: [ACC], target: hesabı, gloss_de: die Rechnung }
      - id: a1-u07-l4-e12
        type: multiple_choice
        prompt: Was ist der Unterschied? „Çay istiyorum.“ / „Çayı istiyorum.“
        options: [Ich möchte Tee. / Ich möchte den Tee., Beides heißt dasselbe., Ich möchte den Tee. / Ich möchte Tee.]
        answer: Ich möchte Tee. / Ich möchte den Tee.
        explanation: istiyorum heißt „ich möchte“. Unbestimmtes Objekt ohne Endung, bestimmtes mit Akkusativ.
      - id: a1-u07-l4-e13
        type: word_bank
        prompt: Ich möchte einen Kaffee.
        answers: [Bir kahve istiyorum., Kahve istiyorum.]
        distractors: [kahveyi, var]
        explanation: Die Form istiyorum lernst du in Unit 8 genauer. Im Café ist „Bir kahve, lütfen.“ höflicher und üblicher.
      - id: a1-u07-l4-e14
        type: word_bank
        prompt: Ich möchte dieses Brot.
        answers: [Bu ekmeği istiyorum.]
        distractors: [ekmek, yok]
        explanation: Mit „bu“ ist das Objekt bestimmt → ekmeği.
      - id: a1-u07-l4-e15
        type: multiple_choice
        prompt: Welche Form ist richtig? (Ich möchte die Rechnung.)
        options: [Hesabı istiyorum., Hesap istiyorum., Hesapı istiyorum.]
        answer: Hesabı istiyorum.

