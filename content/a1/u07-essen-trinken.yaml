        rows: [[ACC], [DAT], [LOC], [ABL], [GEN]]
        targets: [tavuğu, tavuğa, tavukta, tavuktan, tavuğun]
        gloss_de: Huhn

  - id: a1-u07-l6
    type: dialog
    title: Im Café
    exercises:
      - id: a1-u07-l6-e1
        type: word_bank
        prompt: Einen Tee, bitte.
        answers: [Bir çay lütfen., Bir çay.]
        distractors: [çayı, iki]
      - id: a1-u07-l6-e2
        type: word_bank
        prompt: Die Rechnung, bitte.
        answers: [Hesap lütfen.]
        distractors: [Hesabı, var]
        explanation: Als Bitte ohne Verb steht hesap ohne Endung.
      - id: a1-u07-l6-e3
        type: multiple_choice
        prompt: Was fragt der Kellner mit „Ne istersiniz?“
        options: [Was möchten Sie?, Wie geht es Ihnen?, Woher kommen Sie?]
        answer: Was möchten Sie?
        register: formal
        explanation: Feste Frage des Kellners; die Verbform lernst du später.
      - id: a1-u07-l6-e4
        type: word_bank
        prompt: Ich möchte ein Wasser.
        answers: [Bir su istiyorum., Su istiyorum.]
        distractors: [suyu, yok]
      - id: a1-u07-l6-e5
        type: multiple_choice
        prompt: Was sagt man vor dem Essen?
        options: [Afiyet olsun!, Güle güle!, Günaydın!]
        answer: Afiyet olsun!
        explanation: „Afiyet olsun“ heißt etwa „Guten Appetit“ und auch „Wohl bekomm's“ nach dem Essen.
      - id: a1-u07-l6-e6
        type: word_bank
        prompt: Zum Frühstück gibt es Käse, Oliven und Brot.
        answers: ['Kahvaltıda peynir, zeytin ve ekmek var.']
        distractors: [yok, ekmeği]
        explanation: ve heißt „und“.
      - id: a1-u07-l6-e7
        type: free_text
        direction: de_tr
        prompt: Gibt es Fisch?
        answers: [Balık var mı?]
      - id: a1-u07-l6-e8
        type: word_bank
        prompt: Nein, leider nicht. Aber es gibt Huhn.
        answers: ['Hayır, maalesef yok. Ama tavuk var.']
        distractors: [değil, tavuğu]
        explanation: maalesef = leider, ama = aber.
      - id: a1-u07-l6-e9
        type: free_text
        direction: tr_de
        prompt: İki çay, bir kahve lütfen.
        answers: ['Zwei Tee, einen Kaffee, bitte.', 'Zwei Tee und einen Kaffee, bitte.', 'Zwei Tee, ein Kaffee, bitte.']
      - id: a1-u07-l6-e10
        type: multiple_choice
        prompt: Wie bedankst du dich beim Kellner?
        options: [Teşekkürler!, Afiyet olsun!, Hesap!]
        answer: Teşekkürler!
      - id: a1-u07-l6-e11
        type: word_bank
        prompt: Mit Zucker?
        answers: [Şekerli mi?]
        distractors: [Şeker, var]
        explanation: şekerli = mit Zucker, şekersiz = ohne Zucker.
      - id: a1-u07-l6-e12
        type: multiple_choice
        prompt: Was heißt „Bir şey değil“?
        options: [Gern geschehen., Nichts ist da., Kein Problem mit dem Essen.]
        answer: Gern geschehen.
        explanation: Antwort auf ein Danke, wörtlich „keine Sache“, wie rica ederim.

  - id: a1-u07-l7
    type: review
    title: Wiederholung
    exercises:
      - id: a1-u07-l7-e1
        type: word_bank
        prompt: Ich habe keinen Tee.
        answers: [Çayım yok., Benim çayım yok.]
        distractors: [çay, değil]
      - id: a1-u07-l7-e2
        type: free_text
        direction: de_tr
        prompt: den Fisch
        answers: [balığı]
      - id: a1-u07-l7-e3
        type: free_text
        direction: de_tr
        prompt: Es gibt kein Salz.
        answers: [Tuz yok.]
      - id: a1-u07-l7-e4
        type: multiple_choice
        prompt: Welche Form ist richtig? (das Brot, bestimmt)
        options: [ekmeği, ekmeki, ekmeğı]
        answer: ekmeği
      - id: a1-u07-l7-e5
        type: word_bank
        prompt: Gibt es Honig?
        answers: [Bal var mı?]
        distractors: [mi, yok]
      - id: a1-u07-l7-e6
        type: word_bank
        prompt: Mehmet hat zwei Kinder.
        answers: [Mehmet'in iki çocuğu var.]
        distractors: [çocukları, Mehmet]
        explanation: Nach der Zahl kein Plural, auch nicht beim Besitz.
      - id: a1-u07-l7-e7
        type: free_text
        direction: tr_de
        prompt: Buzdolabında süt var mı?
        answers: [Gibt es Milch im Kühlschrank?, Ist Milch im Kühlschrank?, Ist im Kühlschrank Milch?]
      - id: a1-u07-l7-e8
        type: multiple_choice
        prompt: Was heißt „yok“?
        options: [es gibt nicht, ja, ich möchte]
        answer: es gibt nicht
        explanation: „nein“ heißt hayır, „nicht sein“ değil. Umgangssprachlich wird yok auch als „nein“ verwendet.
      - id: a1-u07-l7-e9
        type: free_text
        direction: de_tr
        prompt: das Wasser (bestimmt)
        answers: [suyu]
      - id: a1-u07-l7-e10
        type: word_bank
        prompt: Ich möchte die Milch.
        answers: [Sütü istiyorum.]
        distractors: [Süt, var]
      - id: a1-u07-l7-e11
        type: free_text
        direction: de_tr
        prompt: Frühstück
        answers: [kahvaltı]
      - id: a1-u07-l7-e12
        type: multiple_choice
        prompt: Was heißt „Zamanın var mı?“
        options: [Hast du Zeit?, Wie spät ist es?, Hast du eine Uhr?]
        answer: Hast du Zeit?

