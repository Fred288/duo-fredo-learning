# A1-09: Vorlieben (Verneinung -mA, Ja-Nein-Fragen mit mI am Verb). Claude-Entwurf, ungeprüft (reviewed: false).
id: a1-u09
level: A1
title: Vorlieben
grammar_focus: [verneinung, fragepartikel-verb, kurzantworten]
explainer: explainers/a1-vorlieben.md
source: eigene Formulierung (Claude-Entwurf)
