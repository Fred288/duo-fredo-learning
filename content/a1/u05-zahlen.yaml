# A1-05: Zahlen, Alter, Preise. Claude-Entwurf, ungeprüft (reviewed: false).
id: a1-u05
level: A1
title: Zahlen
grammar_focus: [zahlen, kein-plural-nach-zahlen, alter, preise]
explainer: explainers/a1-zahlen.md
