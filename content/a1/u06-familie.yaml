        gloss_de: Mutter
        explanation: Nach Vokal fällt der Bindevokal weg, bei „sein/ihr“ steht s.
      - { id: a1-u06-l5-e3, type: paradigm, kind: noun, lemma: araba, rows: [[POSS_1SG], [POSS_2SG], [POSS_3SG], [POSS_1PL], [POSS_2PL], [POSS_3PL]], targets: [arabam, araban, arabası, arabamız, arabanız, arabaları], gloss_de: Auto }
      - id: a1-u06-l5-e4
        type: paradigm
        kind: noun
        lemma: kitap
        rows: [[POSS_1SG], [POSS_2SG], [POSS_3SG], [POSS_1PL], [POSS_2PL], [POSS_3PL]]
        targets: [kitabım, kitabın, kitabı, kitabımız, kitabınız, kitapları]
        gloss_de: Buch
        explanation: p wird vor Vokal zu b, vor -ları bleibt es.
      - id: a1-u06-l5-e5
        type: paradigm
        kind: noun
        lemma: oğul
        rows: [[POSS_1SG], [POSS_2SG], [POSS_3SG], [POSS_1PL], [POSS_2PL], [POSS_3PL]]
        targets: [oğlum, oğlun, oğlu, oğlumuz, oğlunuz, oğulları]
        gloss_de: Sohn
        explanation: Das u fällt vor Vokal weg, vor -ları nicht.
      - { id: a1-u06-l5-e6, type: paradigm, kind: noun, lemma: okul, rows: [[POSS_1SG], [POSS_2SG], [POSS_3SG], [POSS_1PL], [POSS_2PL], [POSS_3PL]], targets: [okulum, okulun, okulu, okulumuz, okulunuz, okulları], gloss_de: Schule }
      - { id: a1-u06-l5-e7, type: paradigm, kind: noun, lemma: göz, rows: [[POSS_1SG], [POSS_2SG], [POSS_3SG], [POSS_1PL], [POSS_2PL], [POSS_3PL]], targets: [gözüm, gözün, gözü, gözümüz, gözünüz, gözleri], gloss_de: Auge }
      - { id: a1-u06-l5-e8, type: paradigm, kind: noun, lemma: isim, rows: [[POSS_1SG], [POSS_2SG], [POSS_3SG]], targets: [ismim, ismin, ismi], gloss_de: Name }
      - { id: a1-u06-l5-e9, type: paradigm, kind: noun, lemma: baba, rows: [[POSS_1SG], [POSS_3SG], [GEN], [POSS_1SG, GEN]], targets: [babam, babası, babanın, babamın], gloss_de: Vater }
      - { id: a1-u06-l5-e10, type: paradigm, kind: noun, lemma: kardeş, rows: [[POSS_1SG], [POSS_3SG], [GEN], [POSS_1SG, GEN]], targets: [kardeşim, kardeşi, kardeşin, kardeşimin], gloss_de: Geschwister }

  - id: a1-u06-l6
    type: review
    title: Wiederholung
    exercises:
      - id: a1-u06-l6-e1
        type: word_bank
        prompt: Meine Schwester ist Lehrerin.
        answers: [Kız kardeşim öğretmen., Ablam öğretmen., Kardeşim öğretmen.]
        distractors: [kardeşin, öğretmenim]
      - id: a1-u06-l6-e2
        type: word_bank
        prompt: Mein Sohn ist in der Schule.
        answers: [Oğlum okulda.]
        distractors: [oğulum, okula]
      - id: a1-u06-l6-e3
        type: free_text
        direction: de_tr
        prompt: mein Name
        answers: [ismim, adım, benim ismim, benim adım]
      - id: a1-u06-l6-e4
        type: free_text
        direction: de_tr
        prompt: unsere Familie
        answers: [ailemiz, bizim ailemiz]
      - id: a1-u06-l6-e5
        type: multiple_choice
        prompt: Welche Form ist richtig? (mein Sohn)
        options: [oğlum, oğulum, oğlüm]
        answer: oğlum
      - id: a1-u06-l6-e6
        type: word_bank
        prompt: der Bruder meines Vaters
        answers: [babamın erkek kardeşi, babamın kardeşi, amcam]
        distractors: [babam, kardeşim]
        explanation: Kürzer und üblicher ist „amcam“ (mein Onkel väterlicherseits). „kardeş“ allein lässt offen, ob Bruder oder Schwester.
      - id: a1-u06-l6-e7
        type: free_text
        direction: tr_de
        prompt: Dayım İzmir'de.
        answers: [Mein Onkel ist in Izmir., Mein Onkel wohnt in Izmir., Mein Onkel lebt in Izmir.]
      - id: a1-u06-l6-e8
        type: multiple_choice
        prompt: Was heißt „onun kızı“?
        options: [seine oder ihre Tochter, meine Tochter, das Mädchen]
        answer: seine oder ihre Tochter
      - id: a1-u06-l6-e9
        type: word_bank
        prompt: Wie heißt Ihre Mutter?
        answers: [Annenizin adı ne?, Sizin annenizin adı ne?]
        distractors: [annen, Senin]
        register: formal
      - id: a1-u06-l6-e10
        type: free_text
        direction: de_tr
        prompt: deine Katze
        answers: [kedin, senin kedin]
      - id: a1-u06-l6-e11
        type: multiple_choice
        prompt: „Ayşe'nin …“ – welches Wort passt? (Ayşes älterer Bruder)
        options: [ağabeyi, ağabeyim, ağabey]
        answer: ağabeyi
      - id: a1-u06-l6-e12
        type: word_bank
        prompt: Das ist meine Großmutter.
        answers: [Bu benim babaannem., Bu babaannem., Bu benim anneannem., Bu anneannem., Bu benim ninem., Bu ninem.]
        distractors: [nine, senin]
        explanation: anneanne (Mutter der Mutter), babaanne (Mutter des Vaters); nine ist eher umgangssprachlich.

