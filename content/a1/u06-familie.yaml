# A1-06: Familie (Possessivsuffixe, Genitiv, Genitiv-Possessiv-Verbindung). Claude-Entwurf, ungeprüft (reviewed: false).
id: a1-u06
level: A1
title: Familie
grammar_focus: [possessiv, genitiv, genitiv-possessiv]
explainer: explainers/a1-familie.md
source: eigene Formulierung (Claude-Entwurf)
