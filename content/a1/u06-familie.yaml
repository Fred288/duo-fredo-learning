lessons:
  - id: a1-u06-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a1-u06-l1-e1
        type: multiple_choice
        prompt: Was heißt „anne“?
        options: [Mutter, Vater, Schwester]
        answer: Mutter
      - id: a1-u06-l1-e2
        type: free_text
        direction: de_tr
        prompt: Vater
        answers: [baba]
      - id: a1-u06-l1-e3
        type: multiple_choice
        prompt: Was heißt „kardeş“?
        options: [Geschwister (Bruder oder Schwester), nur Bruder, Cousin]
        answer: Geschwister (Bruder oder Schwester)
        explanation: „kardeş“ ist Bruder oder Schwester, meist jünger. Genauer sagt man „erkek kardeş“ (Bruder) und „kız kardeş“ (Schwester).
      - id: a1-u06-l1-e4
        type: multiple_choice
        prompt: Was heißt „abla“?
        options: [ältere Schwester, jüngere Schwester, Tante]
        answer: ältere Schwester
        explanation: abla ist die ältere Schwester. Man nennt so auch ältere Frauen, freundlich und respektvoll.
      - id: a1-u06-l1-e5
        type: multiple_choice
        prompt: Was heißt „ağabey“ (gesprochen meist „abi“)?
        options: [älterer Bruder, Onkel, Großvater]
        answer: älterer Bruder
      - id: a1-u06-l1-e6
        type: free_text
        direction: de_tr
        prompt: Sohn
        answers: [oğul]
      - id: a1-u06-l1-e7
        type: free_text
        direction: tr_de
        prompt: kız
        answers: [Tochter, Mädchen, die Tochter, das Mädchen]
        explanation: kız heißt Mädchen und Tochter.
      - id: a1-u06-l1-e8
        type: multiple_choice
        prompt: Wer ist „teyze“?
        options: [Schwester der Mutter, Schwester des Vaters, Bruder der Mutter]
        answer: Schwester der Mutter
        explanation: teyze (Schwester der Mutter), hala (Schwester des Vaters), dayı (Bruder der Mutter), amca (Bruder des Vaters).
      - id: a1-u06-l1-e9
        type: multiple_choice
        prompt: Wer ist „amca“?
        options: [Bruder des Vaters, Bruder der Mutter, Großvater]
        answer: Bruder des Vaters
      - id: a1-u06-l1-e10
        type: multiple_choice
        prompt: Wer ist „dayı“?
        options: [Bruder der Mutter, Bruder des Vaters, Vater]
        answer: Bruder der Mutter
      - id: a1-u06-l1-e11
        type: multiple_choice
        prompt: Wer ist „hala“?
        options: [Schwester des Vaters, Schwester der Mutter, Großmutter]
        answer: Schwester des Vaters
      - id: a1-u06-l1-e12
        type: free_text
        direction: de_tr
        prompt: Familie
        answers: [aile]
      - id: a1-u06-l1-e13
        type: multiple_choice
        prompt: Was heißt „dede“?
        options: [Großvater, Onkel, Vater]
        answer: Großvater
      - id: a1-u06-l1-e14
        type: free_text
        direction: tr_de
        prompt: eş
        answers: [Ehepartner, Ehefrau, Ehemann, Frau, Mann, Partner, Partnerin]
      - id: a1-u06-l1-e15
        type: multiple_choice
        prompt: Was heißt „isim“?
        options: [Name, Alter, Familie]
        answer: Name
        explanation: Für „Name“ gibt es zwei Wörter, isim und ad (Adın ne? aus Unit 1).
      - id: a1-u06-l1-e16
        type: multiple_choice
        prompt: Wer ist „anneanne“?
        options: [Mutter der Mutter, Mutter des Vaters, Schwester der Mutter]
        answer: Mutter der Mutter
        explanation: anneanne (Mutter der Mutter), babaanne (Mutter des Vaters). Umgangssprachlich auch nine.
      - id: a1-u06-l1-e17
        type: multiple_choice
        prompt: Wer ist „babaanne“?
        options: [Mutter des Vaters, Mutter der Mutter, Tante]
        answer: Mutter des Vaters

  - id: a1-u06-l2
    type: grammar
    title: mein, dein, sein …
    exercises:
      - id: a1-u06-l2-e1
        type: suffix_builder
        stem: anne
        suffixes: [POSS_1SG]
        target: annem
        gloss_de: meine Mutter
        explanation: „mein“ ist eine Endung, nach Vokal nur -m.
      - { id: a1-u06-l2-e2, type: suffix_builder, stem: baba, suffixes: [POSS_2SG], target: baban, gloss_de: dein Vater }
      - id: a1-u06-l2-e3
        type: suffix_builder
        stem: kardeş
        suffixes: [POSS_1SG]
        target: kardeşim
        gloss_de: 'mein Bruder, meine Schwester'
        explanation: Nach Konsonant mit Vokal, -im nach hellem e.
      - id: a1-u06-l2-e4
        type: suffix_builder
        stem: araba
        suffixes: [POSS_3SG]
        target: arabası
        gloss_de: 'sein, ihr Auto'
        explanation: „sein/ihr“ nach Vokal mit s, -sı/-si/-su/-sü.
      - { id: a1-u06-l2-e5, type: suffix_builder, stem: ev, suffixes: [POSS_3SG], target: evi, gloss_de: 'sein, ihr Haus' }
      - id: a1-u06-l2-e6
        type: suffix_builder
        stem: oğul
        suffixes: [POSS_1SG]
        target: oğlum
        gloss_de: mein Sohn
        explanation: Bei oğul fällt das u vor einer vokalischen Endung weg.
      - id: a1-u06-l2-e7
        type: suffix_builder
        stem: isim
        suffixes: [POSS_1SG]
        target: ismim
        gloss_de: mein Name
      - { id: a1-u06-l2-e8, type: suffix_builder, stem: aile, suffixes: [POSS_1PL], target: ailemiz, gloss_de: unsere Familie }
      - { id: a1-u06-l2-e9, type: suffix_builder, stem: ev, suffixes: [POSS_2PL], target: eviniz, gloss_de: 'euer Haus, Ihr Haus' }
      - id: a1-u06-l2-e10
        type: suffix_builder
        stem: kitap
        suffixes: [POSS_1SG]
        target: kitabım
        gloss_de: mein Buch
        explanation: Vor dem Vokal der Endung wird p zu b.
      - { id: a1-u06-l2-e11, type: suffix_builder, stem: okul, suffixes: [POSS_3PL], target: okulları, gloss_de: "ihre Schule (sie, Plural)" }
      - id: a1-u06-l2-e12
        type: suffix_builder
        stem: kız
        suffixes: [POSS_1SG]
        target: kızım
        gloss_de: meine Tochter
      - id: a1-u06-l2-e13
        type: multiple_choice
        prompt: Was heißt „Öğretmenim“?
        options: [mein Lehrer oder ich bin Lehrer, nur mein Lehrer, nur ich bin Lehrer]
        answer: mein Lehrer oder ich bin Lehrer
        explanation: Beide Endungen klingen gleich (-im). Der Satz zeigt, was gemeint ist.
      - id: a1-u06-l2-e14
        type: suffix_builder
        stem: çocuk
        suffixes: [POSS_1PL]
        target: çocuğumuz
        gloss_de: unser Kind
      - { id: a1-u06-l2-e15, type: suffix_builder, stem: kedi, suffixes: [POSS_2SG], target: kedin, gloss_de: deine Katze }

  - id: a1-u06-l3
    type: grammar
    title: Wessen? Der Genitiv
    exercises:
      - id: a1-u06-l3-e1
        type: multiple_choice
        prompt: Was heißt „benim“?
        options: [mein, dein, sein]
        answer: mein
        explanation: benim (mein), senin (dein), onun (sein, ihr), bizim (unser), sizin (euer, Ihr), onların (ihr, Plural).
      - id: a1-u06-l3-e2
        type: free_text
        direction: de_tr
        prompt: dein (Pronomen)
        answers: [senin]
      - id: a1-u06-l3-e3
        type: multiple_choice
        prompt: Was heißt „bizim“?
        options: [unser, euer, ihr]
        answer: unser
      - id: a1-u06-l3-e4
        type: suffix_builder
        stem: anne
        suffixes: [GEN]
        target: annenin
        gloss_de: der Mutter
        explanation: Genitiv -ın/-in/-un/-ün, nach Vokal mit n.
      - { id: a1-u06-l3-e5, type: suffix_builder, stem: baba, suffixes: [GEN], target: babanın, gloss_de: des Vaters }
      - { id: a1-u06-l3-e6, type: suffix_builder, stem: öğretmen, suffixes: [GEN], target: öğretmenin, gloss_de: des Lehrers, explanation: "öğretmenin kann auch „dein Lehrer“ heißen, der Satz entscheidet." }
      - id: a1-u06-l3-e7
        type: suffix_builder
        stem: Ayşe
        suffixes: [GEN]
        target: Ayşe'nin
        gloss_de: Ayşes
      - { id: a1-u06-l3-e8, type: suffix_builder, stem: Mehmet, suffixes: [GEN], target: Mehmet'in, gloss_de: Mehmets }
      - id: a1-u06-l3-e9
        type: suffix_builder
        stem: çocuk
        suffixes: [GEN]
        target: çocuğun
        gloss_de: des Kindes
      - id: a1-u06-l3-e10
        type: suffix_builder
        stem: kardeş
        suffixes: [POSS_1SG, GEN]
        target: kardeşimin
        gloss_de: meines Bruders, meiner Schwester
        explanation: Erst „mein“ (-im), dann der Genitiv (-in).
      - { id: a1-u06-l3-e11, type: suffix_builder, stem: dede, suffixes: [GEN], target: dedenin, gloss_de: des Großvaters }
      - id: a1-u06-l3-e12
        type: multiple_choice
        prompt: Welche Form ist richtig? (des Hauses)
        options: [evin, evnin, evun]
        answer: evin
        explanation: Nach Konsonant ohne n, -in nach hellem e. evin kann auch „dein Haus“ heißen.

  - id: a1-u06-l4
    type: grammar
    title: Ayşes Mutter
    exercises:
      - id: a1-u06-l4-e1
        type: word_bank
        prompt: Ayşes Mutter
        answers: [Ayşe'nin annesi]
        distractors: [annem, Ayşe]
        explanation: Besitzer mit Genitiv, Besitz mit „sein/ihr“-Endung, wörtlich „Ayşes ihre Mutter“.
      - id: a1-u06-l4-e2
        type: word_bank
        prompt: das Auto des Lehrers
        answers: [öğretmenin arabası]
        distractors: [araba, öğretmen]
      - id: a1-u06-l4-e3
        type: word_bank
        prompt: der Name meiner Mutter
        answers: [annemin adı]
        distractors: [annem, ad]
      - id: a1-u06-l4-e4
        type: word_bank
        prompt: mein Haus
        answers: [benim evim, evim]
        distractors: [senin, ev]
        explanation: „benim“ kann zur Betonung davorstehen, die Endung -im bleibt.
      - id: a1-u06-l4-e5
        type: suffix_builder
        stem: baba
        suffixes: [POSS_3SG]
        target: babası
        gloss_de: (Mehmets) Vater
        explanation: Zu „Mehmet'in …“ gehört die Endung „sein/ihr“, also babası.
      - id: a1-u06-l4-e6
        type: word_bank
        prompt: Mehmets Vater ist Arzt.
        answers: [Mehmet'in babası doktor.]
        distractors: [babam, Mehmet]
      - id: a1-u06-l4-e7
        type: word_bank
        prompt: Das ist das Haus meines Bruders.
        answers: [Bu kardeşimin evi.]
        distractors: [ev, kardeşim]
      - id: a1-u06-l4-e8
        type: multiple_choice
        prompt: Was heißt „Teyzemin kızı“?
        options: [die Tochter meiner Tante, meine Tante und ihre Tochter, meine Tochter]
        answer: die Tochter meiner Tante
      - id: a1-u06-l4-e9
        type: free_text
        direction: de_tr
        prompt: meine Familie
        answers: [ailem, benim ailem]
      - id: a1-u06-l4-e10
        type: free_text
        direction: tr_de
        prompt: Annemin adı Fatma.
        answers: [Meine Mutter heißt Fatma., Der Name meiner Mutter ist Fatma.]
      - id: a1-u06-l4-e11
        type: word_bank
        prompt: Wie heißt dein Vater?
        answers: [Babanın adı ne?, Senin babanın adı ne?]
        distractors: [baban, Benim]
      - id: a1-u06-l4-e12
        type: multiple_choice
        prompt: Welche Form passt? „Ali'nin …“ (Alis Haus)
        options: [evi, evim, ev]
        answer: evi

  - id: a1-u06-l5
    type: grammar
    title: 'Tabellen: mein, dein, sein …'
    exercises:
      - id: a1-u06-l5-e1
