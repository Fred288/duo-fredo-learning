        type: multiple_choice
        prompt: Was heißt „kazak“?
        options: [Pullover, Mantel, Hemd]
        answer: Pullover
      - id: a1-u11-l1-e8
        type: free_text
        direction: de_tr
        prompt: Jacke, Sakko
        answers: [ceket]
      - id: a1-u11-l1-e9
        type: multiple_choice
        prompt: Was heißt „şapka“?
        options: [Hut, Tasche, Schal]
        answer: Hut
      - id: a1-u11-l1-e10
        type: multiple_choice
        prompt: Was heißt „büyük“?
        options: [groß, klein, neu]
        answer: groß
        explanation: büyük (groß), küçük (klein).
      - id: a1-u11-l1-e11
        type: free_text
