  - id: a1-u11-l2
    type: vocab
    title: Farben
    exercises:
      - id: a1-u11-l2-e1
        type: multiple_choice
        prompt: Was heißt „kırmızı“?
        options: [rot, gelb, blau]
        answer: rot
      - id: a1-u11-l2-e2
        type: free_text
        direction: de_tr
        prompt: blau
        answers: [mavi]
      - id: a1-u11-l2-e3
        type: multiple_choice
        prompt: Was heißt „yeşil“?
        options: [grün, grau, gelb]
        answer: grün
      - id: a1-u11-l2-e4
        type: free_text
        direction: de_tr
        prompt: gelb
        answers: [sarı]
      - id: a1-u11-l2-e5
        type: multiple_choice
        prompt: Was heißt „siyah“?
        options: [schwarz, weiß, braun]
        answer: schwarz
      - id: a1-u11-l2-e6
        type: free_text
        direction: de_tr
        prompt: weiß
        answers: [beyaz]
      - id: a1-u11-l2-e7
        type: multiple_choice
        prompt: Was heißt „kahverengi“?
        options: [braun, orange, rosa]
        answer: braun
        explanation: Wörtlich „Kaffeefarbe“, aus kahve und renk (Farbe).
      - id: a1-u11-l2-e8
        type: free_text
        direction: tr_de
        prompt: gri
        answers: [grau]
      - id: a1-u11-l2-e9
        type: multiple_choice
        prompt: Was heißt „pembe“?
        options: [rosa, lila, rot]
        answer: rosa
      - id: a1-u11-l2-e10
        type: free_text
        direction: tr_de
        prompt: turuncu
        answers: [orange]
        explanation: Von turunç (Bitterorange).
      - id: a1-u11-l2-e11
        type: multiple_choice
        prompt: Was heißt „renk“?
        options: [Farbe, Größe, Preis]
        answer: Farbe
      - id: a1-u11-l2-e12
        type: word_bank
        prompt: Welche Farbe?
        answers: [Hangi renk?, Ne renk?]
        distractors: [nerede, rengi]
        explanation: hangi = welcher, welche, welches.
      - id: a1-u11-l2-e13
        type: word_bank
        prompt: Das Hemd ist weiß.
        answers: [Gömlek beyaz.]
        distractors: [siyah, Gömleği]
        explanation: Wie bei „sein“, in der 3. Person ohne Endung.
      - id: a1-u11-l2-e14
        type: multiple_choice
        prompt: Welche Farbe hat der Himmel an einem sonnigen Tag?
        options: [mavi, yeşil, kırmızı]
        answer: mavi

  - id: a1-u11-l3
    type: grammar
    title: dies, das, jenes – bu, şu, o
    exercises:
      - id: a1-u11-l3-e1
        type: multiple_choice
        prompt: Was ist der Unterschied zwischen bu, şu und o?
        options: ['bu nah, şu etwas weiter (zeigend), o weit weg', Kein Unterschied, 'bu Plural, şu Singular']
        answer: 'bu nah, şu etwas weiter (zeigend), o weit weg'
      - id: a1-u11-l3-e2
        type: word_bank
        prompt: Was ist das? (hier bei mir)
        answers: [Bu ne?]
        distractors: [Şu, nerede]
      - id: a1-u11-l3-e3
        type: word_bank
        prompt: Das ist ein Hut.
        answers: [Bu bir şapka.]
        distractors: [şapkalar, var]
      - id: a1-u11-l3-e4
        type: word_bank
        prompt: dieses Hemd
        answers: [bu gömlek]
        distractors: [gömleği, bir]
        explanation: bu, şu, o stehen vor dem Nomen und verändern sich nicht.
      - id: a1-u11-l3-e5
        type: word_bank
        prompt: die Schuhe da (zeigend)
        answers: [şu ayakkabılar]
        distractors: [bu, ayakkabı]
      - id: a1-u11-l3-e6
        type: multiple_choice
        prompt: Was heißt „bunlar“?
        speak_prompt: "bunlar"
        options: [diese (Plural), das hier, dort]
        answer: diese (Plural)
        explanation: bu → bunlar, şu → şunlar, o → onlar (allein stehend, ohne Nomen).
      - id: a1-u11-l3-e7
        type: free_text
        direction: de_tr
        prompt: diese Jacke (hier)
        answers: [bu ceket]
      - id: a1-u11-l3-e8
        type: multiple_choice
        prompt: Was heißt „bunu“?
        options: [dieses (Akkusativ), hier, darin]
        answer: dieses (Akkusativ)
        explanation: bu → bunu, şu → şunu, o → onu. Die Demonstrativa haben eigene Formen mit n.
      - id: a1-u11-l3-e9
        type: word_bank
        prompt: Ich möchte das hier (in meiner Hand).
        answers: [Bunu istiyorum.]
        distractors: [Bu, istiyor]
      - id: a1-u11-l3-e10
        type: word_bank
        prompt: Was ist das dort?
        answers: [O ne?, Şu ne?]
        distractors: [Bu, nerede]
      - id: a1-u11-l3-e11
        type: multiple_choice
        prompt: Welche Form passt? „… ne kadar?“ (Was kostet das hier?)
        options: [Bu, Bunu, Buna]
        answer: Bu
      - id: a1-u11-l3-e12
        type: free_text
        direction: tr_de
        prompt: Şu elbise çok güzel.
        answers: [Das Kleid da ist sehr schön., Dieses Kleid ist sehr schön., Das Kleid dort ist sehr schön., Jenes Kleid ist sehr schön.]
      - id: a1-u11-l3-e13
        type: multiple_choice
        prompt: Was heißt „Bunlar ne?“
        speak_prompt: "Bunlar ne?"
        options: [Was ist das hier? (mehrere Dinge), Wer sind sie?, Wo sind sie?]
        answer: Was ist das hier? (mehrere Dinge)

  - id: a1-u11-l4
    type: grammar
    title: ein rotes Kleid
    exercises:
      - id: a1-u11-l4-e1
        type: word_bank
        prompt: ein rotes Kleid
        answers: [kırmızı bir elbise, bir kırmızı elbise]
        distractors: [kırmızılar, elbiseyi]
        explanation: Üblich ist Adjektiv + bir + Nomen. Das Adjektiv ändert sich nie.
      - id: a1-u11-l4-e2
        type: word_bank
        prompt: ein großes Haus
        answers: [büyük bir ev, bir büyük ev]
        distractors: [büyükler, evi]
      - id: a1-u11-l4-e3
        type: word_bank
        prompt: die neuen Schuhe
        answers: [yeni ayakkabılar]
        distractors: [yeniler, bir]
        explanation: Plural nur am Nomen, nicht am Adjektiv.
      - id: a1-u11-l4-e4
        type: word_bank
        prompt: Das Kleid ist sehr schön.
        answers: [Elbise çok güzel.]
        distractors: [güzeli, bir]
      - id: a1-u11-l4-e5
        type: word_bank
        prompt: Diese Schuhe sind teuer.
        answers: [Bu ayakkabılar pahalı.]
        distractors: [ucuz, pahalıyı]
        explanation: Nach einem Plural-Nomen bleibt das Prädikat ohne -lar.
      - id: a1-u11-l4-e6
        type: multiple_choice
        prompt: Welche Reihenfolge ist richtig? (ein schwarzer Pullover)
        options: [siyah bir kazak, kazak siyah bir, bir kazak siyah]
        answer: siyah bir kazak
      - id: a1-u11-l4-e7
        type: free_text
        direction: de_tr
        prompt: ein blaues Hemd
        answers: [mavi bir gömlek, bir mavi gömlek]
      - id: a1-u11-l4-e8
        type: free_text
        direction: tr_de
        prompt: eski bir ceket
        answers: [eine alte Jacke, ein altes Sakko]
      - id: a1-u11-l4-e9
        type: word_bank
        prompt: Der Rock ist zu kurz.
        answers: [Etek çok kısa.]
        distractors: [uzun, eteği]
        explanation: çok heißt hier „zu“ oder „sehr“, je nach Situation. Genauer ist fazla kısa (zu kurz).
      - id: a1-u11-l4-e10
        type: word_bank
        prompt: Ich habe ein neues Auto.
        answers: [Yeni bir arabam var., Benim yeni bir arabam var.]
        distractors: [yok, araba]
      - id: a1-u11-l4-e11
        type: multiple_choice
        prompt: Was heißt „Bu gömlek beyaz.“?
        options: [Dieses Hemd ist weiß., dieses weiße Hemd, Das ist ein weißes Hemd.]
        answer: Dieses Hemd ist weiß.
        explanation: Adjektiv nach dem Nomen = Aussage (ist weiß). Davor = Beschreibung (bu beyaz gömlek, dieses weiße Hemd).
      - id: a1-u11-l4-e12
        type: word_bank
        prompt: dieses weiße Hemd
        answers: [bu beyaz gömlek]
        distractors: [beyazı, bir]
      - id: a1-u11-l4-e13
        type: free_text
        direction: de_tr
        prompt: ein kleiner Hund
        answers: [küçük bir köpek, bir küçük köpek]

  - id: a1-u11-l5
    type: dialog
    title: Im Geschäft
    exercises:
      - id: a1-u11-l5-e1
        type: suffix_builder
        stem: gömlek
        suffixes: [ACC]
        target: gömleği
        gloss_de: das Hemd (bestimmt)
        explanation: k wird vor Vokal zu ğ.
      - { id: a1-u11-l5-e2, type: suffix_builder, stem: etek, suffixes: [ACC], target: eteği, gloss_de: den Rock }
      - { id: a1-u11-l5-e3, type: suffix_builder, stem: kazak, suffixes: [ACC], target: kazağı, gloss_de: den Pullover }
      - id: a1-u11-l5-e4
        type: suffix_builder
        stem: çorap
        suffixes: [ACC]
        target: çorabı
        gloss_de: die Socke
        explanation: p wird vor Vokal zu b.
      - id: a1-u11-l5-e5
        type: suffix_builder
        stem: ayakkabı
        suffixes: [ACC]
        target: ayakkabıyı
        gloss_de: den Schuh
      - { id: a1-u11-l5-e6, type: suffix_builder, stem: ceket, suffixes: [ACC], target: ceketi, gloss_de: die Jacke }
      - id: a1-u11-l5-e7
        type: word_bank
        prompt: Ich möchte diesen Pullover.
        answers: [Bu kazağı istiyorum.]
        distractors: [kazak, şunu]
      - id: a1-u11-l5-e8
        type: word_bank
        prompt: Was kostet diese Hose?
        answers: [Bu pantolon ne kadar?]
        distractors: [pantolonu, kaç]
      - id: a1-u11-l5-e9
        type: word_bank
        prompt: Gibt es eine andere Farbe?
        answers: [Başka renk var mı?, Başka bir renk var mı?, Başka rengi var mı?]
        distractors: [renkler, yok]
        explanation: başka = anderer, andere.
      - id: a1-u11-l5-e10
        type: word_bank
        prompt: Haben Sie das in Schwarz?
        answers: [Siyahı var mı?, Siyah var mı?]
        distractors: [Siyahta, yok]
        explanation: siyah + ı ist hier „sein Schwarzes (davon)“, wie Mehmet'in arabası. Auch „Siyah var mı?“ ist üblich.
      - id: a1-u11-l5-e11
        type: word_bank
        prompt: Das ist zu teuer.
        answers: [Bu çok pahalı.]
        distractors: [ucuz, pahalılar]
      - id: a1-u11-l5-e12
        type: multiple_choice
        prompt: Die Verkäuferin fragt „Yardımcı olabilir miyim?“. Was heißt das?
        options: [Kann ich Ihnen helfen?, Möchten Sie bezahlen?, Haben Sie eine Tasche?]
        answer: Kann ich Ihnen helfen?
        explanation: Feste Wendung, die Verbform lernst du später.
      - id: a1-u11-l5-e13
        type: word_bank
        prompt: Ich schaue nur, danke.
        answers: ['Sadece bakıyorum, teşekkürler.']
        distractors: [istiyorum, lütfen]
        explanation: sadece = nur, bakmak = schauen.
      - id: a1-u11-l5-e14
        type: free_text
        direction: de_tr
        prompt: den Schuh (bestimmt)
        answers: [ayakkabıyı]

