        type: multiple_choice
        prompt: Was heißt „ucuz“?
        options: [billig, teuer, schön]
        answer: billig
        explanation: ucuz (billig), pahalı (teuer).
      - id: a1-u11-l1-e14
        type: free_text
        direction: de_tr
