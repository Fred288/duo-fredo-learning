# A1-01: Alphabet und Begrüßung. Claude-Entwurf, ungeprüft (reviewed: false).
id: a1-u01
level: A1
title: Alphabet und Begrüßung
grammar_focus: [alphabet, aussprache, begruessung, sen-siz]
explainer: explainers/a1-alphabet.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
reviewed: false
lessons:
  - id: a1-u01-l1
    type: vocab
    title: Begrüßen und verabschieden
    exercises:
      - id: a1-u01-l1-e1
        type: multiple_choice
        prompt: Was heißt „Hallo“?
        options: [Merhaba, Teşekkürler, Hayır]
        answer: Merhaba
      - id: a1-u01-l1-e2
        type: word_bank
        prompt: Guten Morgen!
        answers: [Günaydın!]
        distractors: [İyi, akşamlar]
      - id: a1-u01-l1-e3
        type: free_text
        direction: de_tr
        prompt: Danke
        answers: [Teşekkürler, Teşekkür ederim, Çok teşekkürler, Çok teşekkür ederim, Sağ ol, Sağ olun]
        hint: „Sağ ol“ ist vertraut (sen), „Sağ olun“ höflich oder zu mehreren (siz).
      - id: a1-u01-l1-e4
        type: multiple_choice
        prompt: Du triffst abends Bekannte. Wie begrüßt du sie?
        options: [İyi akşamlar, İyi geceler, Günaydın]
        answer: İyi akşamlar
        explanation: „İyi geceler“ (Gute Nacht) sagt man zum Abschied spät am Abend.
      - id: a1-u01-l1-e5
        type: word_bank
        prompt: Guten Tag! (auch „Schönen Tag noch!“)
        answers: [İyi günler!]
        distractors: [akşamlar, geceler]
        explanation: „İyi günler“ passt zur Begrüßung und zum Abschied tagsüber.
      - id: a1-u01-l1-e6
        type: free_text
        direction: de_tr
        prompt: Gute Nacht!
        answers: [İyi geceler]
      - id: a1-u01-l1-e7
        type: multiple_choice
        prompt: Du gehst nach Hause, deine Freundin bleibt im Café. Was sagst du?
        options: [Hoşça kal, Güle güle, Günaydın]
        answer: Hoşça kal
        register: informal
        explanation: Wer geht, sagt „Hoşça kal“ (höflich oder zu mehreren „Hoşça kalın“). Wer bleibt, antwortet „Güle güle“.
      - id: a1-u01-l1-e8
        type: multiple_choice
        prompt: Dein Besuch verabschiedet sich, du bleibst zu Hause. Was sagst du?
        options: [Güle güle, Hoşça kal, Merhaba]
        answer: Güle güle
        explanation: „Güle güle“ sagt, wer bleibt, zu dem, der geht.
      - id: a1-u01-l1-e9
        type: free_text
        direction: tr_de
        prompt: Görüşürüz!
        answers: [Bis bald, Bis dann, Bis später, Wir sehen uns, Man sieht sich, Tschüss, Tschüs, Auf Wiedersehen]
        explanation: Wörtlich „Wir sehen uns“, ein lockerer Abschied.
      - id: a1-u01-l1-e10
        type: multiple_choice
        prompt: Was bedeutet „Selam“?
        options: [Hallo (vertraut), Danke, Gute Nacht]
        answer: Hallo (vertraut)
        register: informal
        explanation: „Selam“ ist lockerer als „Merhaba“, unter Freunden und Gleichaltrigen üblich.
      - id: a1-u01-l1-e11
        type: free_text
        direction: de_tr
        prompt: Guten Abend!
        answers: [İyi akşamlar]
      - id: a1-u01-l1-e12
        type: multiple_choice
        prompt: Es ist 8 Uhr morgens. Du betrittst eine Bäckerei. Was sagst du?
        options: [Günaydın, İyi geceler, Güle güle]
        answer: Günaydın
      - id: a1-u01-l1-e13
        type: word_bank
        prompt: Auf Wiedersehen! (du gehst, höflich)
        answers: [Hoşça kalın!]
        distractors: [kal, Güle]
        register: formal
      - id: a1-u01-l1-e14
        type: free_text
        direction: tr_de
        prompt: Merhaba!
        answers: [Hallo, Guten Tag, Hi, Servus, Grüß Gott, Moin]

  - id: a1-u01-l2
    type: vocab
    title: Buchstaben und Aussprache
    exercises:
      - id: a1-u01-l2-e1
        type: multiple_choice
        prompt: Welches Wort beginnt mit dem Laut „tsch“?
        options: [çay, cam, şeker]
        answer: çay
        explanation: ç klingt wie „tsch“ (çay, Tee), c wie „dsch“ (cam, Glas).
      - id: a1-u01-l2-e2
        type: multiple_choice
        prompt: Wie spricht man das c in „cam“ (Glas) aus?
        options: [wie „dsch“ in Dschungel, wie „ts“ in Zahl, wie „k“ in Kamm]
        answer: wie „dsch“ in Dschungel
      - id: a1-u01-l2-e3
        type: multiple_choice
        prompt: Welches Wort enthält den Laut „sch“?
        options: [şeker, su, çay]
        answer: şeker
        explanation: ş klingt wie deutsches „sch“; şeker heißt Zucker.
      - id: a1-u01-l2-e4
        type: multiple_choice
        prompt: Was bewirkt das ğ in „dağ“ (Berg)?
        options: [Es dehnt das a davor., Es klingt wie ein deutsches g., Es klingt wie „ch“ in Bach.]
        answer: Es dehnt das a davor.
        explanation: Das „weiche g“ (yumuşak g) wird kaum gesprochen. Nach a, ı, o, u verlängert es den Vokal davor; nach e und i klingt es oft wie ein leichtes j (değil).
      - id: a1-u01-l2-e5
        type: multiple_choice
        prompt: Wie schreibt man „Mädchen“ richtig?
        options: [kız, kiz, kis]
        answer: kız
        explanation: ı ohne Punkt ist ein dumpfes i, ähnlich dem e in „bitte“, aber mit der Zunge weiter hinten und ohne Lippenrundung.
      - id: a1-u01-l2-e6
        type: multiple_choice
        prompt: Was ist die richtige Großschreibung von „istanbul“?
        options: [İSTANBUL, ISTANBUL]
        answer: İSTANBUL
        explanation: Zu i gehört groß İ (mit Punkt), zu ı gehört groß I (ohne Punkt).
      - id: a1-u01-l2-e7
        type: multiple_choice
        prompt: Wie klingt das z in „zor“ (schwer)?
        options: ['stimmhaft wie „s“ in „Sonne“ (norddeutsche Aussprache)', wie „ts“ in „Zeit“]
        answer: 'stimmhaft wie „s“ in „Sonne“ (norddeutsche Aussprache)'
        explanation: Das türkische s ist dagegen immer stimmlos, wie „ss“ in „Wasser“.
      - id: a1-u01-l2-e8
        type: multiple_choice
        prompt: Wie klingt das y in „yol“ (Weg)?
        options: [wie deutsches j in „ja“, wie deutsches ü]
        answer: wie deutsches j in „ja“
      - id: a1-u01-l2-e9
        type: multiple_choice
        prompt: Wie klingt das v in „ev“ (Haus)?
        options: [wie deutsches w, wie deutsches f]
        answer: wie deutsches w
      - id: a1-u01-l2-e10
        type: free_text
        direction: de_tr
        prompt: Tee
        answers: [çay]
        hint: ç klingt wie „tsch“.
      - id: a1-u01-l2-e11
        type: free_text
        direction: de_tr
        prompt: Zucker
        answers: [şeker]
        hint: ş klingt wie „sch“.
      - id: a1-u01-l2-e12
        type: free_text
        direction: de_tr
        prompt: Wasser
        answers: [su]
      - id: a1-u01-l2-e13
        type: free_text
        direction: de_tr
        prompt: Berg
        answers: [dağ]
        hint: Das ğ am Ende dehnt das a.
      - id: a1-u01-l2-e14
        type: multiple_choice
        prompt: Wie heißt „Weg“?
        options: [yol, yöl, jol]
        answer: yol
        explanation: Das türkische y klingt wie deutsches j, j selbst kommt fast nur in Fremdwörtern vor.

  - id: a1-u01-l3
    type: dialog
    title: Höflich und vertraut
    exercises:
      - id: a1-u01-l3-e1
        type: multiple_choice
        prompt: Du fragst eine Freundin, wie es ihr geht.
        options: [Nasılsın?, Nasılsınız?, Adın ne?]
        answer: Nasılsın?
        register: informal
        explanation: Die Endung -sın steht für „du“ (sen). „Nasılsınız?“ ist die Sie-Form (siz).
      - id: a1-u01-l3-e2
        type: multiple_choice
        prompt: Du fragst eine ältere Nachbarin höflich, wie es ihr geht.
        options: [Nasılsınız?, Nasılsın?, Görüşürüz?]
        answer: Nasılsınız?
        register: formal
        explanation: siz ist die höfliche Anrede und zugleich der Plural „ihr“.
      - id: a1-u01-l3-e3
        type: word_bank
        prompt: Mir geht es gut, danke.
        answers: ['İyiyim, teşekkürler.', 'Teşekkürler, iyiyim.', 'İyiyim, teşekkür ederim.']
        distractors: [Nasılsın, Benim]
      - id: a1-u01-l3-e4
        type: free_text
        direction: de_tr
        prompt: Bitte! (als Antwort auf „Danke“)
        answers: [Rica ederim, Bir şey değil, Ne demek]
        explanation: „Rica ederim“ ist die übliche Antwort auf ein Danke; „Bir şey değil“ und „Ne demek“ heißen etwa „Nicht der Rede wert“.
      - id: a1-u01-l3-e5
        type: multiple_choice
        prompt: Du bestellst einen Tee. Welches Wort passt für „bitte“?
        options: [lütfen, rica ederim, affedersiniz]
        answer: lütfen
        explanation: „Lütfen“ bei einer Bitte; „Rica ederim“ antwortet auf ein Danke. Anders als im Deutschen sind das zwei Wörter.
      - id: a1-u01-l3-e6
        type: multiple_choice
        prompt: Du sprichst einen Fremden auf der Straße an. „Entschuldigen Sie …“
        options: [Affedersiniz, Güle güle, Görüşürüz]
        answer: Affedersiniz
        register: formal
        explanation: „Affedersiniz“ dient auch, um höflich Aufmerksamkeit zu bekommen. Für „Es tut mir leid“ sagt man „Özür dilerim“.
      - id: a1-u01-l3-e7
        type: word_bank
        prompt: Wie heißt du?
        answers: [Adın ne?, Senin adın ne?]
        distractors: [Adınız, Benim]
        register: informal
      - id: a1-u01-l3-e8
        type: word_bank
        prompt: Wie heißen Sie?
        answers: [Adınız nedir?, Adınız ne?, Sizin adınız nedir?, Sizin adınız ne?]
        distractors: [Adın, Benim]
        register: formal
      - id: a1-u01-l3-e9
        type: word_bank
        prompt: Ich heiße Ayşe.
        answers: [Benim adım Ayşe., Adım Ayşe.]
        distractors: [Senin, ne]
        explanation: Wörtlich „Mein Name (ist) Ayşe“. „ist“ wird hier nicht ausgedrückt.
      - id: a1-u01-l3-e10
        type: free_text
        direction: de_tr
        prompt: Freut mich!
        answers: [Memnun oldum, Çok memnun oldum, Tanıştığımıza memnun oldum]
      - id: a1-u01-l3-e11
        type: free_text
        direction: de_tr
        prompt: Es tut mir leid. (Entschuldigung)
        answers: [Özür dilerim, Kusura bakma, Kusura bakmayın, Pardon]
        explanation: „Kusura bakma“ (sen) / „Kusura bakmayın“ (siz) heißt wörtlich „Schau nicht auf den Fehler“.
      - id: a1-u01-l3-e12
        type: word_bank
        prompt: Wie geht es dir?
        answers: [Nasılsın?]
        distractors: [Nasılsınız, İyiyim]
        register: informal
      - id: a1-u01-l3-e13
        type: free_text
        direction: tr_de
        prompt: İyiyim.
        answers: [Mir geht es gut., Mir geht's gut., Gut., Es geht mir gut., "Gut, danke.", "Danke, gut."]
      - id: a1-u01-l3-e14
        type: multiple_choice
        prompt: Jemand sagt „Teşekkürler!“. Was antwortest du?
        options: [Rica ederim., Lütfen., Affedersiniz.]
        answer: Rica ederim.

  - id: a1-u01-l4
    type: review
    title: Wiederholung
    exercises:
      - id: a1-u01-l4-e1
        type: multiple_choice
        prompt: Was bedeutet „Güle güle“?
        options: ['Tschüss (sagt, wer bleibt)', Guten Morgen, Danke]
        answer: 'Tschüss (sagt, wer bleibt)'
      - id: a1-u01-l4-e2
        type: free_text
        direction: tr_de
        prompt: Günaydın!
        answers: [Guten Morgen, Morgen]
      - id: a1-u01-l4-e3
        type: free_text
        direction: tr_de
        prompt: Teşekkür ederim.
        answers: [Danke, Danke schön, Dankeschön, Danke sehr, Vielen Dank, Ich danke dir, Ich danke Ihnen]
      - id: a1-u01-l4-e4
        type: word_bank
        prompt: Guten Abend, wie geht es Ihnen?
        answers: ['İyi akşamlar, nasılsınız?']
        distractors: [geceler, nasılsın]
        register: formal
      - id: a1-u01-l4-e5
        type: multiple_choice
        prompt: Was heißt „hayır“?
        options: [nein, ja, bitte]
        answer: nein
      - id: a1-u01-l4-e6
        type: free_text
        direction: de_tr
        prompt: ja
        answers: [evet]
      - id: a1-u01-l4-e7
        type: word_bank
        prompt: Hallo, wie geht es dir?
        answers: ['Merhaba, nasılsın?', 'Selam, nasılsın?']
        distractors: [nasılsınız, Selam]
        register: informal
      - id: a1-u01-l4-e8
        type: free_text
        direction: de_tr
        prompt: Entschuldigen Sie! (um jemanden anzusprechen)
        answers: [Affedersiniz, Pardon]
        register: formal
      - id: a1-u01-l4-e9
        type: multiple_choice
        prompt: Was heißt „Görüşürüz“?
        options: [Wir sehen uns, Freut mich, Gute Nacht]
        answer: Wir sehen uns
      - id: a1-u01-l4-e10
        type: word_bank
        prompt: Freut mich, ich heiße Mehmet.
        answers: ['Memnun oldum, benim adım Mehmet.', 'Memnun oldum, adım Mehmet.']
        distractors: [Senin, nasılsın]
      - id: a1-u01-l4-e11
        type: free_text
        direction: tr_de
        prompt: İyi geceler!
        answers: [Gute Nacht]
      - id: a1-u01-l4-e12
        type: multiple_choice
        prompt: Welche Form ist die höfliche Anrede?
        options: [Nasılsınız?, Nasılsın?]
        answer: Nasılsınız?
        explanation: -sınız gehört zu siz (Sie, ihr), -sın zu sen (du).
      - id: a1-u01-l4-e13
        type: free_text
        direction: de_tr
        prompt: bitte (bei einer Bitte)
        answers: [lütfen]
      - id: a1-u01-l4-e14
        type: multiple_choice
        prompt: Wie schreibt man „Tee“?
        options: [çay, cay, tschay]
        answer: çay

