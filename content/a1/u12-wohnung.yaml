        type: word_bank
        prompt: In der Küche gibt es einen Kühlschrank.
        answers: [Mutfakta buzdolabı var., Mutfakta bir buzdolabı var.]
        distractors: [Mutfak, yok]
      - id: a1-u12-l2-e8
        type: word_bank
        prompt: Im Wohnzimmer gibt es zwei Sessel.
        answers: [Salonda iki koltuk var.]
        distractors: [koltuklar, yok]
        explanation: Nach der Zahl kein Plural.
      - id: a1-u12-l2-e9
        type: word_bank
        prompt: Im Bad gibt es kein Fenster.
        answers: [Banyoda pencere yok.]
        distractors: [var, değil]
      - id: a1-u12-l2-e10
        type: word_bank
        prompt: Die Bücher sind im Schrank.
        answers: [Kitaplar dolapta.]
        distractors: [dolaba, Kitap]
      - id: a1-u12-l2-e11
        type: word_bank
        prompt: Wo ist die Lampe?
        answers: [Lamba nerede?]
        distractors: [nereye, Lambada]
      - id: a1-u12-l2-e12
        type: word_bank
        prompt: Die Katze schläft auf dem Sofa.
        answers: [Kedi kanepede uyuyor.]
        distractors: [kanepeye, uyuyorum]
      - id: a1-u12-l2-e13
        type: free_text
        direction: tr_de
        prompt: Balkonda çiçekler var.
        answers: [Auf dem Balkon sind Blumen., Auf dem Balkon gibt es Blumen., Es gibt Blumen auf dem Balkon.]
