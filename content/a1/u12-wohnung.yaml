      - id: a1-u12-l2-e14
        type: multiple_choice
        prompt: Welche Form ist richtig? (in der Küche)
        options: [mutfakta, mutfağta, mutfakda]
        answer: mutfakta
        explanation: Vor -ta bleibt das k, das d wird nach k zu t.

  - id: a1-u12-l3
    type: grammar
    title: Meine Wohnung
    exercises:
      - id: a1-u12-l3-e1
        type: suffix_builder
        stem: oda
        suffixes: [POSS_1SG, LOC]
        target: odamda
        gloss_de: in meinem Zimmer
        explanation: Erst „mein“, dann „wo“, oda + m + da.
      - { id: a1-u12-l3-e2, type: suffix_builder, stem: ev, suffixes: [POSS_1PL, LOC], target: evimizde, gloss_de: in unserem Haus }
      - id: a1-u12-l3-e3
        type: suffix_builder
        stem: mutfak
        suffixes: [POSS_1SG]
        target: mutfağım
        gloss_de: meine Küche
        explanation: k → ğ vor Vokal.
      - { id: a1-u12-l3-e4, type: suffix_builder, stem: daire, suffixes: [POSS_2SG], target: dairen, gloss_de: deine Wohnung }
      - id: a1-u12-l3-e5
        type: suffix_builder
        stem: ev
        suffixes: [POSS_3SG, LOC]
        target: evinde
        gloss_de: in seinem, ihrem Haus
        explanation: Nach „sein/ihr“ kommt vor dem Lokativ ein n, evi + n + de.
      - id: a1-u12-l3-e6
        type: word_bank
        prompt: In meinem Zimmer gibt es ein Bett und einen Tisch.
        answers: [Odamda bir yatak ve bir masa var., Odamda yatak ve masa var.]
        distractors: [yok, odada]
      - id: a1-u12-l3-e7
        type: word_bank
        prompt: Unser Haus ist nicht groß.
        answers: [Evimiz büyük değil., Bizim evimiz büyük değil.]
        distractors: [yok, küçük]
      - id: a1-u12-l3-e8
        type: word_bank
        prompt: Meine Wohnung hat einen Balkon.
        answers: [Dairemin balkonu var., Dairemin bir balkonu var.]
        distractors: [balkon, yok]
        explanation: Wörtlich „Meiner Wohnung ihr Balkon ist vorhanden“.
      - id: a1-u12-l3-e9
        type: free_text
        direction: de_tr
        prompt: in meinem Zimmer
        answers: [odamda, benim odamda]
      - id: a1-u12-l3-e10
        type: free_text
        direction: tr_de
        prompt: Kira çok pahalı.
        answers: [Die Miete ist sehr teuer., Die Miete ist zu teuer., Die Miete ist sehr hoch., Die Miete ist zu hoch.]
      - id: a1-u12-l3-e11
        type: word_bank
        prompt: Wohnst du in Istanbul?
        answers: [İstanbul'da oturuyor musun?, Sen İstanbul'da oturuyor musun?]
        distractors: [İstanbul'a, oturuyorsun]
      - id: a1-u12-l3-e12
        type: multiple_choice
        prompt: Was heißt „evinde“?
        options: [in seinem/ihrem Haus oder in deinem Haus, nur in meinem Haus, nur im Haus]
        answer: in seinem/ihrem Haus oder in deinem Haus
        explanation: evi + n + de (sein Haus) und evin + de (dein Haus) klingen gleich. Der Satz zeigt, wer gemeint ist.
      - id: a1-u12-l3-e13
        type: word_bank
        prompt: Die Wohnung ist im zweiten Stock.
        answers: [Daire ikinci katta.]
        distractors: [kat, iki]
        explanation: ikinci = zweiter. Ordnungszahlen kommen später.

