  - id: a1-u12-l5
    type: grammar
    title: 'Ausblick: gestern (-dı)'
    exercises:
      - id: a1-u12-l5-e1
        type: multiple_choice
        prompt: Was heißt „geldim“?
        options: [ich bin gekommen, ich komme, ich komme nicht]
        answer: ich bin gekommen
        explanation: Vergangenheit mit -dı/-di/-du/-dü, dann -m für „ich“, gel + di + m.
      - id: a1-u12-l5-e2
        type: multiple_choice
        prompt: Was heißt „gittin“?
        options: [du bist gegangen, du gehst, ihr geht]
        answer: du bist gegangen
        explanation: Nach t wird d zu t, git + ti + n. In der Vergangenheit erweicht git nicht.
      - id: a1-u12-l5-e3
        type: multiple_choice
        prompt: Was heißt „Dün sinemaya gittik.“?
        options: [Gestern sind wir ins Kino gegangen., Morgen gehen wir ins Kino., Heute gehen wir ins Kino.]
        answer: Gestern sind wir ins Kino gegangen.
        explanation: -k steht für „wir“, gittik.
      - id: a1-u12-l5-e4
        type: multiple_choice
        prompt: Was fragt „Dün ne yaptın?“
        options: [Was hast du gestern gemacht?, Was machst du morgen?, Was machst du jetzt?]
        answer: Was hast du gestern gemacht?
      - id: a1-u12-l5-e5
        type: multiple_choice
        prompt: Was heißt „Kitap okudum.“?
        options: [Ich habe ein Buch gelesen., Ich lese ein Buch., Ich lese kein Buch.]
        answer: Ich habe ein Buch gelesen.
      - id: a1-u12-l5-e6
        type: multiple_choice
        prompt: Was heißt „Evde oturdum.“?
        options: [Ich bin zu Hause geblieben., Ich wohne zu Hause., Ich gehe nach Hause.]
        answer: Ich bin zu Hause geblieben.
        explanation: oturmak heißt auch „(zu Hause) bleiben, sitzen“.
      - id: a1-u12-l5-e7
        type: multiple_choice
        prompt: Welche Endung hat „wir“ in der Vergangenheit?
        options: [-k (geldik), -uz (geldiuz), -miz (geldimiz)]
        answer: -k (geldik)
        explanation: Die Endungen ähneln teilweise dem Besitz (-m, -n, -nız), aber „wir“ ist -k, nicht -mız.
      - id: a1-u12-l5-e8
        type: multiple_choice
        prompt: Was heißt „Ayşe dün gelmedi.“?
        options: [Ayşe ist gestern nicht gekommen., Ayşe kommt morgen nicht., Ayşe kommt gestern.]
        answer: Ayşe ist gestern nicht gekommen.
        explanation: Verneinung wie immer mit -me, gel + me + di.
      - id: a1-u12-l5-e9
        type: multiple_choice
        prompt: Was heißt „Balık yedik.“?
        options: [Wir haben Fisch gegessen., Wir essen Fisch., Wir essen keinen Fisch.]
        answer: Wir haben Fisch gegessen.
      - id: a1-u12-l5-e10
        type: multiple_choice
        prompt: Was heißt „Yeni bir daire aldılar.“?
        options: [Sie haben eine neue Wohnung gekauft., Sie kaufen eine neue Wohnung., Sie mieten eine neue Wohnung.]
        answer: Sie haben eine neue Wohnung gekauft.
      - id: a1-u12-l5-e11
        type: multiple_choice
        prompt: Welche Frage ist richtig? (Bist du gekommen?)
        options: [Geldin mi?, Geldi misin?, Gel mi din?]
        answer: Geldin mi?
        explanation: Anders als bei -iyor hängt die Personalendung hier am Verb, die Partikel steht danach.
      - id: a1-u12-l5-e12
        type: free_text
        direction: tr_de
        prompt: Dün çalıştım.
        answers: [Gestern habe ich gearbeitet., Ich habe gestern gearbeitet., Gestern arbeitete ich., Ich arbeitete gestern., Gestern habe ich gelernt., Ich habe gestern gelernt.]

