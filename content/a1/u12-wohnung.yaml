  - id: a1-u12-l2
    type: grammar
    title: Was ist wo?
    exercises:
      - { id: a1-u12-l2-e1, type: suffix_builder, stem: mutfak, suffixes: [LOC], target: mutfakta, gloss_de: in der Küche }
      - { id: a1-u12-l2-e2, type: suffix_builder, stem: banyo, suffixes: [LOC], target: banyoda, gloss_de: im Bad }
      - { id: a1-u12-l2-e3, type: suffix_builder, stem: salon, suffixes: [LOC], target: salonda, gloss_de: im Wohnzimmer }
      - { id: a1-u12-l2-e4, type: suffix_builder, stem: dolap, suffixes: [LOC], target: dolapta, gloss_de: im Schrank }
