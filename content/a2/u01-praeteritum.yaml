      - { id: a2-u01-l4-e10, type: paradigm, kind: verb, lemma: beklemek, tense: past, negative: true, targets: [beklemedim, beklemedin, beklemedi, beklemedik, beklemediniz, beklemediler], gloss_de: nicht warten }

  - id: a2-u01-l5
    type: grammar
    title: Gestern, letzte Woche, vor zwei Jahren
    exercises:
      - id: a2-u01-l5-e1
        type: word_bank
        prompt: Gestern bin ich ins Kino gegangen.
        answers: [Dün sinemaya gittim., Ben dün sinemaya gittim., Dün ben sinemaya gittim.]
        chunks:
          - { text: "Dün", role: time }
          - { text: "sinemaya", role: place }
          - { text: "gittim", role: predicate }
        distractors: [gidiyorum, sinemada]
      - id: a2-u01-l5-e2
        type: word_bank
        prompt: Letzte Woche haben wir meine Großmutter besucht.
        answers: [Geçen hafta anneannemi ziyaret ettik., Geçen hafta babaannemi ziyaret ettik.]
        chunks:
          - { text: "Geçen hafta", role: time }
          - { text: "anneannemi", role: object }
          - { text: "ziyaret ettik", role: predicate }
        distractors: [anneanneme, ediyoruz]
        explanation: ziyaret etmek verlangt ein Objekt im Akkusativ, anneannemi.
      - id: a2-u01-l5-e3
        type: word_bank
        prompt: Vor zwei Jahren bin ich nach Berlin umgezogen.
        answers: [İki yıl önce Berlin'e taşındım.]
        chunks:
          - { text: "İki yıl önce", role: time }
          - { text: "Berlin'e", role: place }
          - { text: "taşındım", role: predicate }
        distractors: ["Berlin'de", sonra]
      - id: a2-u01-l5-e4
        type: word_bank
        prompt: Ich bin 1990 in Izmir geboren.
        answers: [1990'da İzmir'de doğdum., Ben 1990'da İzmir'de doğdum., İzmir'de 1990'da doğdum.]
        chunks:
          - { text: "1990'da", role: time }
          - { text: "İzmir'de", role: place }
          - { text: "doğdum", role: predicate }
        orders:
          - { order: [1, 0, 2], note: "Auch möglich: Ort vor Zeit; betont ist das Glied direkt vor dem Verb, hier das Jahr." }
        distractors: ["İzmir'e", doğuyorum]
        explanation: Jahreszahlen mit Lokativ, 1990'da (bin dokuz yüz doksanda).
      - id: a2-u01-l5-e5
        type: word_bank
        prompt: Am Wochenende habe ich mich mit Freunden getroffen.
        answers: [Hafta sonu arkadaşlarımla buluştum.]
        chunks:
          - { text: "Hafta sonu", role: time }
          - { text: "arkadaşlarımla", role: complement }
          - { text: "buluştum", role: predicate }
        distractors: [arkadaşlarım, buluşuyorum]
        explanation: arkadaşlarımla = mit meinen Freunden (-la/-le = mit).
      - id: a2-u01-l5-e6
        type: multiple_choice
        prompt: Wo steht „önce“ (vor)?
        options: [nach der Zeitangabe (üç gün önce), vor der Zeitangabe (önce üç gün), am Satzende]
        answer: nach der Zeitangabe (üç gün önce)
      - id: a2-u01-l5-e7
        type: free_text
        direction: de_tr
        prompt: vor drei Tagen
        answers: [üç gün önce]
      - id: a2-u01-l5-e8
        type: word_bank
        prompt: Wir haben vor fünf Jahren geheiratet.
        answers: [Beş yıl önce evlendik., Biz beş yıl önce evlendik.]
        distractors: [evleniyoruz, sonra]
      - id: a2-u01-l5-e9
        type: word_bank
        prompt: Zuerst haben wir gegessen, dann sind wir ins Kino gegangen.
        answers: ["Önce yemek yedik, sonra sinemaya gittik."]
        distractors: [yiyoruz, gidiyoruz]
        explanation: önce … sonra = zuerst … dann.
      - id: a2-u01-l5-e10
        type: free_text
        direction: tr_de
        prompt: Geçen yıl Türkiye'ye gittik.
        answers: [Letztes Jahr sind wir in die Türkei gefahren., Letztes Jahr sind wir in die Türkei gereist., Wir sind letztes Jahr in die Türkei gefahren., Wir sind letztes Jahr in die Türkei gereist., Letztes Jahr fuhren wir in die Türkei.]
      - id: a2-u01-l5-e11
        type: multiple_choice
        prompt: Was passt? „Dün akşam televizyon …“
        options: [izledim, izliyorum, izliyor]
        answer: izledim
        explanation: dün (gestern) verlangt die Vergangenheit.
      - id: a2-u01-l5-e12
        type: word_bank
        prompt: Wann bist du zurückgekommen?
        answers: [Ne zaman döndün?]
        distractors: [dönüyorsun, nerede]
        explanation: ne zaman = wann.
      - id: a2-u01-l5-e13
        type: free_text
        direction: de_tr
        prompt: letzte Woche
        answers: [geçen hafta]

  - id: a2-u01-l6
    type: reading
    title: 'Lesetext: Mein Wochenende'
    exercises:
      - id: a2-u01-l6-e1
        type: multiple_choice
        prompt: „Cumartesi sabahı geç kalktım. Kahvaltıdan sonra pazara gittim ve alışveriş yaptım.“ – Was hat die Person nach dem Frühstück gemacht?
        options: [Sie ist auf den Markt gegangen und hat eingekauft., Sie hat lange geschlafen., Sie hat Freunde getroffen.]
        answer: Sie ist auf den Markt gegangen und hat eingekauft.
        explanation: kahvaltıdan sonra = nach dem Frühstück (Ablativ + sonra).
      - id: a2-u01-l6-e2
        type: multiple_choice
        prompt: „Cumartesi sabahı geç kalktım.“ – Wann ist die Person aufgestanden?
        options: ["am Samstagmorgen, spät", am Sonntag früh, am Samstagabend]
        answer: am Samstagmorgen, spät
      - id: a2-u01-l6-e3
        type: multiple_choice
        prompt: '„Akşam Ayşe ile buluştuk. Bir lokantada balık yedik.“ – Was haben sie gegessen?'
        options: [Fisch, Huhn, Fleisch]
        answer: Fisch
      - id: a2-u01-l6-e4
        type: multiple_choice
        prompt: '„Akşam Ayşe ile buluştuk. Bir lokantada balık yedik.“ – Wo waren sie?'
        options: [in einem Restaurant, zu Hause, im Kino]
        answer: in einem Restaurant
      - id: a2-u01-l6-e5
        type: multiple_choice
        prompt: '„Pazar günü hiç evden çıkmadım. Kitap okudum ve müzik dinledim.“ – Was hat die Person am Sonntag nicht gemacht?'
        options: [Sie ist nicht aus dem Haus gegangen., Sie hat nicht gelesen., Sie hat keine Musik gehört.]
        answer: Sie ist nicht aus dem Haus gegangen.
      - id: a2-u01-l6-e6
        type: word_bank
        prompt: Am Sonntag bin ich gar nicht aus dem Haus gegangen.
        answers: [Pazar günü hiç evden çıkmadım., Pazar günü evden hiç çıkmadım.]
        chunks:
          - { text: "Pazar günü", role: time }
          - { text: "hiç", role: complement }
          - { text: "evden", role: place }
          - { text: "çıkmadım", role: predicate }
        orders:
          - { order: [0, 2, 1, 3], note: "Auch üblich: „hiç“ direkt vor dem verneinten Verb; so wird das „gar nicht“ betont." }
        distractors: [evde, çıktım]
      - id: a2-u01-l6-e7
        type: free_text
        direction: tr_de
        prompt: Kitap okudum ve müzik dinledim.
        answers: [Ich habe ein Buch gelesen und Musik gehört., Ich habe gelesen und Musik gehört., Ich las ein Buch und hörte Musik.]
      - id: a2-u01-l6-e8
        type: word_bank
        prompt: Was hast du am Wochenende gemacht?
        answers: [Hafta sonu ne yaptın?]
        distractors: [yapıyorsun, nerede]
      - id: a2-u01-l6-e9
        type: word_bank
        prompt: Ich habe meine Eltern besucht.
        answers: [Annemi ve babamı ziyaret ettim., Annemle babamı ziyaret ettim.]
        distractors: [anneme, ediyorum]
        explanation: Annemle babamı = meine Mutter und meinen Vater (-le = und, mit).
      - id: a2-u01-l6-e10
        type: multiple_choice
        prompt: '„Geçen ay yeni bir daireye taşındık.“ – Was ist passiert?'
        options: [Sie sind letzten Monat in eine neue Wohnung umgezogen., Sie suchen eine neue Wohnung., Sie haben letzten Monat eine Wohnung gekauft.]
        answer: Sie sind letzten Monat in eine neue Wohnung umgezogen.

  - id: a2-u01-l7
    type: review
    title: Wiederholung
    exercises:
      - id: a2-u01-l7-e1
        type: free_text
        direction: de_tr
        prompt: ich bin gekommen
        answers: [geldim, ben geldim]
      - id: a2-u01-l7-e2
        type: free_text
        direction: de_tr
        prompt: wir haben gegessen
        answers: [yedik, biz yedik]
      - id: a2-u01-l7-e3
        type: multiple_choice
        prompt: Welche Form ist richtig? (sie sind gegangen)
        options: [gittiler, gidtiler, gittilar]
        answer: gittiler
      - id: a2-u01-l7-e4
        type: word_bank
        prompt: Ich habe meinen Schlüssel vergessen.
        answers: [Anahtarımı unuttum.]
        distractors: [anahtar, unutuyorum]
        explanation: anahtar = Schlüssel.
      - id: a2-u01-l7-e5
        type: free_text
        direction: tr_de
        prompt: Nerede doğdun?
        answers: [Wo bist du geboren?, Wo wurdest du geboren?]
      - id: a2-u01-l7-e6
        type: multiple_choice
        prompt: Was heißt „Onunla geçen yıl tanıştım.“?
        options: [Ich habe ihn letztes Jahr kennengelernt., Ich lerne ihn nächstes Jahr kennen., Ich kenne ihn seit einem Jahr.]
        answer: Ich habe ihn letztes Jahr kennengelernt.
        explanation: onunla = mit ihm, mit ihr.
