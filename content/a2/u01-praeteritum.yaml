# A2-01: Präteritum -DI (Wochenende, Ereignisse im Leben). Claude-Entwurf, ungeprüft (reviewed: false).
id: a2-u01
level: A2
title: Was hast du gemacht?
grammar_focus: [praeteritum, personalendungen-typ2, zeitangaben-vergangenheit]
explainer: explainers/a2-praeteritum.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
reviewed: false
lessons:
  - id: a2-u01-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a2-u01-l1-e1
        type: multiple_choice
        prompt: Was heißt „dönmek“?
        options: [zurückkehren, abfahren, bleiben]
        answer: zurückkehren
      - id: a2-u01-l1-e2
        type: free_text
        direction: de_tr
        prompt: sich treffen (mit jemandem)
        answers: [buluşmak]
        explanation: Ali ile buluşmak = sich mit Ali treffen.
      - id: a2-u01-l1-e3
        type: multiple_choice
        prompt: Was heißt „ziyaret etmek“?
        options: [besuchen, einladen, anrufen]
        answer: besuchen
      - id: a2-u01-l1-e4
        type: free_text
        direction: de_tr
        prompt: einkaufen
        answers: [alışveriş yapmak]
      - id: a2-u01-l1-e5
        type: multiple_choice
        prompt: Was heißt „doğmak“?
        options: [geboren werden, sterben, wachsen]
        answer: geboren werden
      - id: a2-u01-l1-e6
        type: free_text
        direction: tr_de
        prompt: evlenmek
        answers: [heiraten]
      - id: a2-u01-l1-e7
        type: multiple_choice
        prompt: Was heißt „taşınmak“?
        options: [umziehen, reisen, aufräumen]
        answer: umziehen
      - id: a2-u01-l1-e8
        type: free_text
        direction: de_tr
        prompt: lernen (etwas Neues)
        answers: [öğrenmek]
        explanation: öğrenmek = lernen, erfahren; çalışmak = lernen im Sinne von üben, für die Schule arbeiten.
      - id: a2-u01-l1-e9
        type: multiple_choice
        prompt: Was heißt „unutmak“?
        options: [vergessen, sich erinnern, verlieren]
        answer: vergessen
      - id: a2-u01-l1-e10
        type: free_text
        direction: tr_de
        prompt: tanışmak
        answers: [kennenlernen, sich kennenlernen]
      - id: a2-u01-l1-e11
        type: multiple_choice
        prompt: Was heißt „yaşamak“?
        options: [leben, warten, sterben]
        answer: leben
        explanation: "yaşamak heißt auch wohnen: İstanbul'da yaşıyorum."
      - id: a2-u01-l1-e12
        type: free_text
        direction: de_tr
        prompt: Freund, Freundin
        answers: [arkadaş]
      - id: a2-u01-l1-e13
        type: multiple_choice
        prompt: Was heißt „doğum günü“?
        options: [Geburtstag, Feiertag, Hochzeit]
        answer: Geburtstag
      - id: a2-u01-l1-e14
        type: multiple_choice
        prompt: Was heißt „geçen hafta“?
        options: [letzte Woche, nächste Woche, diese Woche]
        answer: letzte Woche
        explanation: geçen = vergangen, letzte; gelecek = kommend, nächste.
      - id: a2-u01-l1-e15
        type: free_text
        direction: de_tr
        prompt: Jahr
        answers: [yıl, sene]
      - id: a2-u01-l1-e16
        type: multiple_choice
        prompt: Was heißt „iki gün önce“?
        options: [vor zwei Tagen, in zwei Tagen, zwei Tage lang]
        answer: vor zwei Tagen
        explanation: önce steht nach der Zeitangabe, iki gün önce = vor zwei Tagen.

  - id: a2-u01-l2
    type: grammar
    title: ich kam, ich ging
    exercises:
      - id: a2-u01-l2-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: past
        target: geldim
        gloss_de: ich bin gekommen
        explanation: Stamm + di + m. Die Endungen nach -di sind m, n, –, k, niz, ler.
      - id: a2-u01-l2-e2
        type: conjugation
        mode: verb
        lemma: yapmak
        person: 2sg
        tense: past
        target: yaptın
        gloss_de: du hast gemacht
        explanation: Nach p wird d zu t, nach a steht ı.
      - { id: a2-u01-l2-e3, type: conjugation, mode: verb, lemma: okumak, person: 3sg, tense: past, target: okudu, gloss_de: 'er, sie hat gelesen' }
      - id: a2-u01-l2-e4
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 1pl
        tense: past
        target: gittik
        gloss_de: wir sind gegangen
        explanation: Kein Wechsel zu gid, denn -ti beginnt mit einem Konsonanten. Nach t wird d zu t.
      - { id: a2-u01-l2-e5, type: conjugation, mode: verb, lemma: görmek, person: 2pl, tense: past, target: gördünüz, gloss_de: 'ihr habt gesehen, Sie haben gesehen' }
      - { id: a2-u01-l2-e6, type: conjugation, mode: verb, lemma: içmek, person: 3pl, tense: past, target: içtiler, gloss_de: sie haben getrunken }
      - id: a2-u01-l2-e7
        type: conjugation
        mode: verb
        lemma: yemek
        person: 1sg
        tense: past
        target: yedim
        gloss_de: ich habe gegessen
        explanation: Anders als im Präsens (yiyorum) bleibt ye unverändert.
      - { id: a2-u01-l2-e8, type: conjugation, mode: verb, lemma: beklemek, person: 1sg, tense: past, target: bekledim, gloss_de: ich habe gewartet }
      - { id: a2-u01-l2-e9, type: conjugation, mode: verb, lemma: dönmek, person: 3sg, tense: past, target: döndü, gloss_de: 'er, sie ist zurückgekehrt' }
      - { id: a2-u01-l2-e10, type: conjugation, mode: verb, lemma: buluşmak, person: 1pl, tense: past, target: buluştuk, gloss_de: wir haben uns getroffen }
      - { id: a2-u01-l2-e11, type: conjugation, mode: verb, lemma: ziyaret etmek, person: 1sg, tense: past, target: ziyaret ettim, gloss_de: ich habe besucht }
      - { id: a2-u01-l2-e12, type: conjugation, mode: verb, lemma: doğmak, person: 1sg, tense: past, target: doğdum, gloss_de: ich bin geboren }
      - id: a2-u01-l2-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (wir haben gearbeitet)
        options: [çalıştık, çalışdık, çalıştımız]
        answer: çalıştık
        explanation: Nach ş wird d zu t, „wir“ ist -k.
      - id: a2-u01-l2-e14
        type: free_text
        direction: de_tr
        prompt: ich habe gelernt (etwas Neues)
        answers: [öğrendim, ben öğrendim]

  - id: a2-u01-l3
    type: grammar
    title: nicht und Fragen
    exercises:
      - id: a2-u01-l3-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: past
        negative: true
        target: gelmedi
        gloss_de: 'er, sie ist nicht gekommen'
        explanation: Verneinung -me/-ma vor -di. Hier wird nichts verengt, anders als vor -yor.
      - { id: a2-u01-l3-e2, type: conjugation, mode: verb, lemma: yapmak, person: 1sg, tense: past, negative: true, target: yapmadım, gloss_de: ich habe nicht gemacht }
      - { id: a2-u01-l3-e3, type: conjugation, mode: verb, lemma: anlamak, person: 1sg, tense: past, negative: true, target: anlamadım, gloss_de: ich habe nicht verstanden }
      - { id: a2-u01-l3-e4, type: conjugation, mode: verb, lemma: unutmak, person: 1sg, tense: past, negative: true, target: unutmadım, gloss_de: ich habe nicht vergessen }
      - id: a2-u01-l3-e5
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2sg
        tense: past
        question: true
        target: geldin mi?
        gloss_de: Bist du gekommen?
        explanation: Die Endung bleibt am Verb (geldin), die Partikel mi folgt getrennt und ohne Endung.
      - { id: a2-u01-l3-e6, type: conjugation, mode: verb, lemma: yemek, person: 2pl, tense: past, question: true, target: yediniz mi?, gloss_de: 'Habt ihr gegessen? Haben Sie gegessen?' }
      - id: a2-u01-l3-e7
        type: conjugation
        mode: verb
        lemma: yapmak
        person: 2sg
        tense: past
        question: true
        target: yaptın mı?
        gloss_de: Hast du gemacht?
        explanation: Die Partikel folgt dem letzten Vokal ı, also mı.
      - { id: a2-u01-l3-e8, type: conjugation, mode: verb, lemma: görmek, person: 3pl, tense: past, question: true, target: gördüler mi?, gloss_de: Haben sie gesehen? }
      - id: a2-u01-l3-e9
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 2sg
        tense: past
        negative: true
        question: true
        target: gitmedin mi?
        gloss_de: Bist du nicht gegangen?
      - id: a2-u01-l3-e10
        type: multiple_choice
        prompt: Welche Frage ist richtig? (Hast du verstanden?)
        options: [Anladın mı?, Anladı mısın?, Anladın mısın?]
        answer: Anladın mı?
        explanation: Anders als bei -iyor trägt im Präteritum das Verb die Endung, nicht die Partikel.
      - id: a2-u01-l3-e11
        type: word_bank
        prompt: Hast du Ali gesehen? – Nein, ich habe ihn nicht gesehen.
        answers: ['Ali''yi gördün mü? Hayır, görmedim.']
        distractors: [görmüyorum, mi]
      - id: a2-u01-l3-e12
        type: free_text
        direction: tr_de
        prompt: Kahvaltı yaptın mı?
        answers: [Hast du gefrühstückt?, Hast du schon gefrühstückt?]
      - id: a2-u01-l3-e13
        type: free_text
        direction: de_tr
        prompt: Ich habe es nicht vergessen.
        answers: [Unutmadım., Ben unutmadım., Onu unutmadım.]
      - id: a2-u01-l3-e14
        type: multiple_choice
        prompt: Was heißt „Dün hiç uyumadım.“?
        options: [Ich habe gestern gar nicht geschlafen., Ich habe gestern lange geschlafen., Ich schlafe heute nicht.]
        answer: Ich habe gestern gar nicht geschlafen.

  - id: a2-u01-l4
    type: grammar
    title: 'Tabellen: Präteritum'
    exercises:
      - id: a2-u01-l4-e1
