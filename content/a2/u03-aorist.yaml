  - id: a2-u03-l6
    type: reading
    title: 'Lesetext: Meine Freizeit'
    exercises:
      - id: a2-u03-l6-e1
        type: multiple_choice
        prompt: '„Hafta içi çok çalışırım. Akşamları genelde evde kitap okurum.“ – Was macht die Person abends meistens?'
        options: [Sie liest zu Hause., Sie arbeitet lange., Sie geht aus.]
        answer: Sie liest zu Hause.
        explanation: hafta içi = unter der Woche.
      - id: a2-u03-l6-e2
        type: multiple_choice
        prompt: '„Hafta sonları arkadaşlarımla futbol oynarım. Bazen bisiklete bineriz.“ – Was machen sie manchmal?'
        options: [Fahrrad fahren, Fußball spielen, schwimmen]
        answer: Fahrrad fahren
      - id: a2-u03-l6-e3
        type: multiple_choice
        prompt: '„Hafta sonları arkadaşlarımla futbol oynarım.“ – Wann spielt die Person Fußball?'
        options: [an den Wochenenden, jeden Abend, unter der Woche]
        answer: an den Wochenenden
      - id: a2-u03-l6-e4
        type: multiple_choice
        prompt: „Kız kardeşim spor sevmez, ama çok güzel resim yapar.“ – Was stimmt über die Schwester?
        options: ["Sie mag keinen Sport, malt aber sehr schön.", Sie treibt viel Sport., Sie malt nicht gern.]
        answer: Sie mag keinen Sport, malt aber sehr schön.
      - id: a2-u03-l6-e5
        type: multiple_choice
        prompt: '„Annem her sabah yürüyüş yapar, asla asansöre binmez.“ – Was macht die Mutter nie?'
        options: [den Aufzug nehmen, spazieren gehen, früh aufstehen]
        answer: den Aufzug nehmen
      - id: a2-u03-l6-e6
        type: word_bank
        prompt: Unter der Woche arbeite ich viel.
        answers: [Hafta içi çok çalışırım.]
        distractors: [çalışırsın, az]
      - id: a2-u03-l6-e7
        type: word_bank
        prompt: Meine Schwester mag keinen Sport.
        answers: [Kız kardeşim spor sevmez., Kız kardeşim sporu sevmez.]
        chunks:
          - { text: "Kız kardeşim", role: subject }
          - { text: "spor", role: object_bare }
          - { text: "sevmez", role: predicate }
        distractors: [sever, sevmiyorum]
      - id: a2-u03-l6-e8
        type: free_text
        direction: tr_de
        prompt: Bazen bisiklete bineriz.
        answers: [Manchmal fahren wir Fahrrad., Wir fahren manchmal Fahrrad., Manchmal fahren wir Rad., Wir fahren manchmal Rad.]
      - id: a2-u03-l6-e9
        type: multiple_choice
        prompt: Warum steht im Text der Aorist (okurum, oynarım)?
        options: [Er beschreibt Gewohnheiten., Er beschreibt, was gerade passiert., Er beschreibt die Zukunft.]
        answer: Er beschreibt Gewohnheiten.
      - id: a2-u03-l6-e10
        type: word_bank
        prompt: Meine Mutter geht jeden Morgen spazieren.
        answers: [Annem her sabah yürüyüş yapar., Her sabah annem yürüyüş yapar.]
        chunks:
          - { text: "Annem", role: subject }
          - { text: "her sabah", role: time }
          - { text: "yürüyüş", role: object_bare }
          - { text: "yapar", role: predicate }
        orders:
          - { order: [1, 0, 2, 3], note: "Auch üblich: die Zeit am Satzanfang." }
        distractors: [yapıyorum, akşam]

  - id: a2-u03-l7
    type: review
    title: Wiederholung
    exercises:
