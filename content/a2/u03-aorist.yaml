# A2-03: Aorist (Gewohnheit, Angebot, Verneinung -mAz; Freizeit, Hobbys, Sport). Claude-Entwurf, ungeprüft (reviewed: false).
id: a2-u03
level: A2
title: Freizeit und Hobbys
grammar_focus: [aorist, verneinung-maz, angebote, haeufigkeit]
explainer: explainers/a2-aorist.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
