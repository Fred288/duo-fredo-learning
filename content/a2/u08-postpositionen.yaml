  - id: a2-u08-r1
    type: reading
    title: "Lesetext: Wo ist mein Schlüssel?"
    passage:
      sentences:
        - { tr: "Bu sabah işe geç kaldım, çünkü anahtarımı bulamadım.", de: "Heute Morgen kam ich zu spät zur Arbeit, weil ich meinen Schlüssel nicht finden konnte." }
        - { tr: "Önce çantamın içine baktım.", de: "Zuerst habe ich in meine Tasche geschaut." }
        - { tr: "Anahtar çantada yoktu.", de: "Der Schlüssel war nicht in der Tasche." }
