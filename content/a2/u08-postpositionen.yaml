# A2-08: Postpositionen ile, için, gibi, -den önce/sonra, Ortsnomina (Wohnung, Garten, Innenstadt). Claude-Entwurf, ungeprüft (reviewed: false).
id: a2-u08
level: A2
title: Wo genau?
grammar_focus: [postpositionen, ortsnomina, instrumental, ile, icin, gibi]
explainer: explainers/a2-postpositionen.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
reviewed: false
lessons:
  - id: a2-u08-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a2-u08-l1-e1
        type: multiple_choice
        prompt: Was heißt „üst“?
        options: [Oberseite, Unterseite, Innenseite]
        answer: Oberseite
        explanation: üst (oben, Oberseite), alt (unten, Unterseite). masanın üstünde = auf dem Tisch.
      - id: a2-u08-l1-e2
        type: free_text
        direction: de_tr
        prompt: Unterseite (Ortsnomen)
        answers: [alt]
      - id: a2-u08-l1-e3
        type: multiple_choice
        prompt: Was heißt „iç“?
        options: [Inneres, Äußeres, Mitte]
        answer: Inneres
        explanation: iç (innen, Inneres), dış (außen, Äußeres).
      - id: a2-u08-l1-e4
        type: multiple_choice
        prompt: Was heißt „ara“ in „iki evin arasında“?
        options: [Zwischenraum, Ecke, Seite]
        answer: Zwischenraum
        explanation: iki evin arasında = zwischen den zwei Häusern.
      - id: a2-u08-l1-e5
        type: multiple_choice
        prompt: Was heißt „gibi“?
        options: [wie, für, mit]
        answer: wie
        explanation: gibi (wie), için (für), ile (mit).
      - id: a2-u08-l1-e6
        type: free_text
        direction: de_tr
        prompt: legen, stellen, setzen
        answers: [koymak]
      - id: a2-u08-l1-e7
        type: multiple_choice
        prompt: Was heißt „çanta“?
        options: [Tasche, Koffer, Kiste]
        answer: Tasche
        explanation: çanta (Tasche), valiz (Koffer), kutu (Kiste, Schachtel).
      - id: a2-u08-l1-e8
        type: free_text
        direction: tr_de
        prompt: kutu
        answers: [Kiste, Schachtel, Karton, Dose, die Kiste, die Schachtel]
      - id: a2-u08-l1-e9
        type: multiple_choice
        prompt: Was heißt „raf“?
        options: [Regal, Schublade, Schrank]
        answer: Regal
      - id: a2-u08-l1-e10
        type: multiple_choice
        prompt: Was heißt „hediye“?
        options: [Geschenk, Einladung, Blume]
        answer: Geschenk
      - id: a2-u08-l1-e11
        type: free_text
        direction: de_tr
        prompt: Gebäude
        answers: [bina]
      - id: a2-u08-l1-e12
        type: multiple_choice
        prompt: Was heißt „kütüphane“?
        options: [Bibliothek, Buchhandlung, Schule]
        answer: Bibliothek
      - id: a2-u08-l1-e13
        type: multiple_choice
        prompt: Was heißt „şehir merkezi“?
        options: [Stadtzentrum, Stadtplan, Stadtrand]
        answer: Stadtzentrum
        explanation: merkez = Zentrum; şehir merkezi wie okul müdürü, mit -i am zweiten Wort.
      - id: a2-u08-l1-e14
        type: free_text
        direction: de_tr
        prompt: Bäckerei, Konditorei
        answers: [pastane, fırın]
        explanation: pastane (Konditorei mit Kuchen und Gebäck), fırın (Bäckerei, auch Ofen).
      - id: a2-u08-l1-e15
        type: multiple_choice
        prompt: Was heißt „çim“?
        options: [Rasen, Zaun, Baum]
        answer: Rasen
      - id: a2-u08-l1-e16
        type: multiple_choice
        prompt: Was heißt „dışarı“?
        options: [nach draußen, nach drinnen, nach oben]
        answer: nach draußen
        explanation: dışarı (nach draußen), dışarıda (draußen); içeri (nach drinnen), içeride (drinnen).
      - id: a2-u08-l1-e17
        type: free_text
        direction: de_tr
        prompt: Vogel
        answers: [kuş]
      - id: a2-u08-l1-e18
        type: multiple_choice
        prompt: Was heißt „otopark“?
        options: [Parkplatz, Park, Tankstelle]
        answer: Parkplatz

  - id: a2-u08-l2
    type: grammar
    title: auf, unter, in
    exercises:
      - id: a2-u08-l2-e1
        type: suffix_builder
        stem: üst
        suffixes: [POSS_3SG, LOC]
        target: üstünde
        gloss_de: 'auf (ihm, ihr)'
        explanation: Lage = Ortsnomen + Possessiv 3. Person + n + Lokativ, üst-ü-n-de.
      - { id: a2-u08-l2-e2, type: suffix_builder, stem: alt, suffixes: [POSS_3SG, LOC], target: altında, gloss_de: 'unter (ihm, ihr)' }
      - { id: a2-u08-l2-e3, type: suffix_builder, stem: iç, suffixes: [POSS_3SG, LOC], target: içinde, gloss_de: 'in (ihm, ihr), drinnen' }
      - id: a2-u08-l2-e4
        type: suffix_builder
        stem: masa
        suffixes: [GEN]
        target: masanın
        gloss_de: des Tisches
        explanation: Das Bezugswort steht im Genitiv, masanın üstünde = auf dem Tisch.
      - id: a2-u08-l2-e5
        type: word_bank
        prompt: Das Buch liegt auf dem Tisch.
        answers: [Kitap masanın üstünde., Kitap masanın üzerinde., Kitap masada.]
        distractors: [altında, masaya]
        explanation: üzerinde ist gleichbedeutend mit üstünde. Kurz geht auch masada (auf dem/am Tisch).
      - id: a2-u08-l2-e6
        type: suffix_builder
        stem: yatak
        suffixes: [GEN]
        target: yatağın
        gloss_de: des Bettes
      - id: a2-u08-l2-e7
        type: word_bank
        prompt: Die Katze ist unter dem Bett.
        answers: [Kedi yatağın altında.]
        distractors: [üstünde, yatağa]
      - id: a2-u08-l2-e8
        type: word_bank
        prompt: Die Schlüssel sind in der Tasche.
        answers: [Anahtarlar çantanın içinde., Anahtarlar çantada.]
        distractors: [dışında, çanta]
      - id: a2-u08-l2-e9
        type: suffix_builder
        stem: dolap
        suffixes: [GEN]
        target: dolabın
        gloss_de: des Schranks
      - id: a2-u08-l2-e10
        type: word_bank
        prompt: Die Kiste steht auf dem Schrank.
        answers: [Kutu dolabın üstünde., Kutu dolabın üzerinde.]
        distractors: [dolaba, içinde]
      - id: a2-u08-l2-e11
        type: suffix_builder
        stem: üst
        suffixes: [POSS_3SG, DAT]
        target: üstüne
        gloss_de: 'auf (… hin)'
        explanation: Wohin? Dativ, masanın üstüne koy = leg es auf den Tisch.
      - id: a2-u08-l2-e12
        type: word_bank
        prompt: Leg das Buch auf den Tisch!
        answers: [Kitabı masanın üstüne koy!, Kitabı masanın üzerine koy!, Kitabı masaya koy!]
        distractors: [üstünde, kitap]
        explanation: Bestimmtes Objekt im Akkusativ, kitabı.
      - id: a2-u08-l2-e13
        type: word_bank
        prompt: Die Katze ist unter das Bett gekrochen.
        answers: [Kedi yatağın altına girdi.]
        chunks:
          - { text: "Kedi", role: subject }
          - { text: "yatağın altına", role: place }
          - { text: "girdi", role: predicate }
        distractors: [altında, çıktı]
        explanation: girmek = hineingehen, mit Dativ.
      - id: a2-u08-l2-e14
        type: multiple_choice
        prompt: Was heißt „Kutunun içinde ne var?“?
        options: [Was ist in der Kiste?, Was ist auf der Kiste?, Wo ist die Kiste?]
        answer: Was ist in der Kiste?

  - id: a2-u08-l3
    type: grammar
    title: neben, vor, hinter, zwischen
    exercises:
      - { id: a2-u08-l3-e1, type: suffix_builder, stem: yan, suffixes: [POSS_3SG, LOC], target: yanında, gloss_de: neben }
      - { id: a2-u08-l3-e2, type: suffix_builder, stem: ön, suffixes: [POSS_3SG, LOC], target: önünde, gloss_de: vor }
      - { id: a2-u08-l3-e3, type: suffix_builder, stem: arka, suffixes: [POSS_3SG, LOC], target: arkasında, gloss_de: hinter }
      - id: a2-u08-l3-e4
        type: suffix_builder
        stem: ara
        suffixes: [POSS_3SG, LOC]
        target: arasında
        gloss_de: zwischen
        explanation: Nach Vokal steht s, ara-sı-n-da, arka-sı-n-da.
      - id: a2-u08-l3-e5
        type: word_bank
        prompt: Das Auto steht vor dem Haus.
        answers: [Araba evin önünde.]
        distractors: [arkasında, ev]
      - id: a2-u08-l3-e6
        type: word_bank
        prompt: Der Garten ist hinter dem Haus.
        answers: [Bahçe evin arkasında.]
        distractors: [önünde, evde]
      - id: a2-u08-l3-e7
        type: word_bank
        prompt: Die Lampe steht neben dem Sofa.
        answers: [Lamba kanepenin yanında., Lamba koltuğun yanında.]
        distractors: [kanepe, altında]
      - id: a2-u08-l3-e8
        type: word_bank
        prompt: Die Bank ist zwischen der Post und dem Supermarkt.
        answers: [Banka postane ile market arasında., Banka postaneyle market arasında., Banka postaneyle marketin arasında., Banka postane ile marketin arasında.]
        distractors: [yanında, postanede]
        explanation: X ile Y arasında = zwischen X und Y.
      - id: a2-u08-l3-e9
        type: word_bank
        prompt: Die Apotheke ist gegenüber der Bibliothek.
        answers: [Eczane kütüphanenin karşısında.]
        distractors: [kütüphane, yanında]
      - id: a2-u08-l3-e10
        type: suffix_builder
        stem: ön
        suffixes: [POSS_3SG, DAT]
        target: önüne
        gloss_de: 'vor (… hin)'
      - id: a2-u08-l3-e11
        type: word_bank
        prompt: Stell deine Schuhe vor die Tür!
        answers: [Ayakkabılarını kapının önüne koy!]
        distractors: [önünde, kapıya]
      - id: a2-u08-l3-e12
        type: suffix_builder
        stem: arka
        suffixes: [POSS_3SG, ABL]
        target: arkasından
        gloss_de: 'von hinter, hinter … hervor'
        explanation: Woher? Ablativ, arkasından çıktı = kam hinter … hervor.
      - id: a2-u08-l3-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (neben dem Hotel)
        options: [otelin yanında, otel yanında, otelin yanda]
        answer: otelin yanında

      - id: a2-u08-l3-e14
        type: multiple_choice
        prompt: Was heißt „Çocuklar evin dışında oynuyor.“?
        options: [Die Kinder spielen außerhalb des Hauses., Die Kinder spielen im Haus., Die Kinder spielen in ihrem Zimmer.]
        answer: Die Kinder spielen außerhalb des Hauses.
        explanation: evin dışında = außerhalb des Hauses, draußen.
  - id: a2-u08-l4
    type: grammar
    title: mit (ile, -le)
    exercises:
      - id: a2-u08-l4-e1
        type: suffix_builder
        stem: otobüs
        suffixes: [INS]
        target: otobüsle
        gloss_de: mit dem Bus
        explanation: ile wird meist angehängt, -le/-la, nach Vokal -yle/-yla.
      - { id: a2-u08-l4-e2, type: suffix_builder, stem: araba, suffixes: [INS], target: arabayla, gloss_de: mit dem Auto }
      - { id: a2-u08-l4-e3, type: suffix_builder, stem: tren, suffixes: [INS], target: trenle, gloss_de: mit dem Zug }
      - { id: a2-u08-l4-e4, type: suffix_builder, stem: kalem, suffixes: [INS], target: kalemle, gloss_de: mit dem Stift }
      - id: a2-u08-l4-e5
        type: suffix_builder
        stem: anne
        suffixes: [POSS_1SG, INS]
        target: annemle
        gloss_de: mit meiner Mutter
      - id: a2-u08-l4-e6
        type: suffix_builder
        stem: Ayşe
        suffixes: [INS]
        target: Ayşe'yle
        gloss_de: mit Ayşe
        explanation: Auch getrennt möglich, Ayşe ile.
      - id: a2-u08-l4-e7
        type: word_bank
        prompt: Ich fahre mit dem Bus zur Arbeit.
        answers: [İşe otobüsle gidiyorum., Otobüsle işe gidiyorum., İşe otobüs ile gidiyorum., Otobüs ile işe gidiyorum.]
        chunks:
          - { text: "İşe", role: place }
          - { text: "otobüsle", role: complement }
          - { text: "gidiyorum", role: predicate }
        orders:
          - { order: [1, 0, 2], note: "Auch möglich: dann ist das Ziel betont (zur Arbeit, nicht anderswohin)." }
        distractors: [otobüse, işte]
      - id: a2-u08-l4-e8
        type: word_bank
        prompt: Mit wem bist du ins Kino gegangen?
        answers: [Sinemaya kiminle gittin?, Kiminle sinemaya gittin?]
        chunks:
          - { text: "Sinemaya", role: place }
          - { text: "kiminle", role: question }
          - { text: "gittin", role: predicate }
        orders:
          - { order: [1, 0, 2], note: "Auch möglich; meist steht das Fragewort direkt vor dem Verb." }
        distractors: [kime, sinemada]
        explanation: kim + le → kiminle (mit wem), ne + yle → neyle (womit).
      - id: a2-u08-l4-e9
        type: word_bank
        prompt: Ich bin mit Ayşe ins Kino gegangen.
        answers: [Ayşe'yle sinemaya gittim., Ayşe ile sinemaya gittim., Sinemaya Ayşe'yle gittim., Sinemaya Ayşe ile gittim.]
        chunks:
          - { text: "Ayşe'yle", role: complement }
          - { text: "sinemaya", role: place }
          - { text: "gittim", role: predicate }
        orders:
          - { order: [1, 0, 2], note: "Auch möglich: dann ist „mit Ayşe“ betont, es antwortet auf „mit wem?“." }
        distractors: ["Ayşe'ye", gittin]
      - id: a2-u08-l4-e10
        type: word_bank
        prompt: Ich habe mit meiner Mutter gesprochen.
        answers: [Annemle konuştum., Annem ile konuştum.]
        distractors: [annene, konuşuyorum]
      - id: a2-u08-l4-e11
        type: multiple_choice
        prompt: Was heißt „Ali ile Ayşe evlendi.“?
        options: [Ali und Ayşe haben geheiratet., Ali hat mit Ayşe gesprochen., Ali und Ayşe haben sich getrennt.]
        answer: Ali und Ayşe haben geheiratet.
        explanation: Zwischen zwei Personen kann ile auch „und“ heißen.
      - id: a2-u08-l4-e12
        type: word_bank
        prompt: Schreib mit dem Stift!
        answers: [Kalemle yaz!, Kalem ile yaz!]
        distractors: [kaleme, yazın]
      - id: a2-u08-l4-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (mit dem Auto)
        options: [arabayla, arabala, arabaile]
        answer: arabayla

  - id: a2-u08-l5
    type: grammar
    title: für, wie (için, gibi)
    exercises:
      - id: a2-u08-l5-e1
        type: word_bank
        prompt: Diese Blumen sind für dich.
        answers: [Bu çiçekler senin için., Bu çiçekler sana.]
        distractors: [sen, gibi]
        explanation: Personalpronomen stehen vor için und gibi im Genitiv, benim için, senin için, onun gibi (aber onlar için). Nomen bleiben in der Grundform, annem için.
      - id: a2-u08-l5-e2
        type: word_bank
        prompt: Ich habe ein Geschenk für meine Mutter gekauft.
        answers: [Annem için bir hediye aldım., Anneme bir hediye aldım., Annem için hediye aldım., Anneme hediye aldım.]
        chunks:
          - { text: "Annem için", role: complement }
          - { text: "bir hediye", role: object_bare }
          - { text: "aldım", role: predicate }
        distractors: [annemin, gibi]
      - id: a2-u08-l5-e3
        type: word_bank
        prompt: Ich gehe in die Türkei, um Türkisch zu lernen.
        answers: [Türkçe öğrenmek için Türkiye'ye gidiyorum., Türkiye'ye Türkçe öğrenmek için gidiyorum.]
        distractors: ["Türkiye'de", öğreniyorum]
        explanation: Infinitiv + için = um … zu.
      - id: a2-u08-l5-e4
        type: multiple_choice
        prompt: Was heißt „Ne için?“?
        options: [Wofür?, Wie?, Womit?]
        answer: Wofür?
        explanation: Ne için? (wofür, wozu), Neden? / Niçin? (warum).
      - id: a2-u08-l5-e5
        type: word_bank
        prompt: Sie spricht wie ihre Mutter.
        answers: [Annesi gibi konuşuyor., O annesi gibi konuşuyor.]
        distractors: [annesinin, için]
      - id: a2-u08-l5-e6
        type: word_bank
        prompt: Ich will einen Freund wie dich.
        answers: [Senin gibi bir arkadaş istiyorum.]
        distractors: [sen, için]
      - id: a2-u08-l5-e7
        type: multiple_choice
        prompt: Welche Form ist richtig? (wie ich)
        options: [benim gibi, ben gibi, benden gibi]
        answer: benim gibi
      - id: a2-u08-l5-e8
        type: multiple_choice
        prompt: Welche Form ist richtig? (für Ali)
        options: [Ali için, Ali'nin için, Ali'ye için]
        answer: Ali için
        explanation: Bei Nomen und Namen kein Genitiv, Ali için, Ali gibi.
      - id: a2-u08-l5-e9
        type: word_bank
        prompt: Das Haus ist wie ein Museum.
        answers: [Ev bir müze gibi., Ev müze gibi.]
        distractors: [müzede, için]
      - id: a2-u08-l5-e10
        type: free_text
        direction: tr_de
        prompt: Bu hediye senin için.
        answers: [Dieses Geschenk ist für dich., Das Geschenk ist für dich., Das ist ein Geschenk für dich.]
      - id: a2-u08-l5-e11
        type: word_bank
        prompt: Er singt wie ein Vogel.
        answers: [Kuş gibi şarkı söylüyor., O kuş gibi şarkı söylüyor.]
        distractors: [kuşa, için]
      - id: a2-u08-l5-e12
        type: multiple_choice
        prompt: Was heißt „Bunun için geldim.“?
        options: [Deswegen bin ich gekommen., Ich bin wie er gekommen., Ich bin damit gekommen.]
        answer: Deswegen bin ich gekommen.
        explanation: bunun için = dafür, deswegen.

  - id: a2-u08-l6
    type: grammar
    title: vor und nach (-den önce, -den sonra)
    exercises:
      - id: a2-u08-l6-e1
        type: suffix_builder
        stem: yemek
        suffixes: [ABL]
        target: yemekten
        gloss_de: nach dem Essen (yemekten sonra)
        explanation: önce und sonra verlangen den Ablativ, yemekten sonra = nach dem Essen.
      - { id: a2-u08-l6-e2, type: suffix_builder, stem: kahvaltı, suffixes: [ABL], target: kahvaltıdan, gloss_de: vor dem Frühstück (kahvaltıdan önce) }
      - { id: a2-u08-l6-e3, type: suffix_builder, stem: ders, suffixes: [ABL], target: dersten, gloss_de: nach dem Unterricht (dersten sonra) }
      - { id: a2-u08-l6-e4, type: suffix_builder, stem: iş, suffixes: [ABL], target: işten, gloss_de: nach der Arbeit (işten sonra) }
      - id: a2-u08-l6-e5
        type: word_bank
        prompt: Nach dem Essen trinken wir Tee.
        answers: [Yemekten sonra çay içeriz., Yemekten sonra çay içiyoruz.]
        chunks:
          - { text: "Yemekten sonra", role: time }
          - { text: "çay", role: object_bare }
          - { text: "içeriz", role: predicate }
        distractors: [yemek, önce]
      - id: a2-u08-l6-e6
        type: word_bank
        prompt: Vor dem Frühstück gehe ich laufen.
        answers: [Kahvaltıdan önce koşuyorum., Kahvaltıdan önce koşarım., Kahvaltıdan önce koşmaya gidiyorum.]
        distractors: [sonra, kahvaltı]
      - id: a2-u08-l6-e7
        type: word_bank
        prompt: Nach fünf Uhr bin ich zu Hause.
        answers: [Saat beşten sonra evdeyim., Beşten sonra evdeyim.]
        distractors: [önce, beşe]
      - id: a2-u08-l6-e8
        type: multiple_choice
        prompt: Was heißt „Üç gün önce geldim.“?
        options: [Ich bin vor drei Tagen gekommen., Ich bin drei Tage früher gekommen., Ich komme in drei Tagen.]
        answer: Ich bin vor drei Tagen gekommen.
        explanation: Zeitspanne + önce = vor (… Tagen), ohne Ablativ. Zeitspanne + sonra = nach, später.
      - id: a2-u08-l6-e9
        type: word_bank
        prompt: Wir treffen uns in zwei Stunden.
        answers: [İki saat sonra buluşuyoruz., İki saat sonra buluşalım., İki saat sonra buluşacağız.]
        distractors: [saatten, önce]
      - id: a2-u08-l6-e10
        type: multiple_choice
        prompt: Welche Form heißt „vor dem Unterricht“?
        options: [dersten önce, ders önce, derse önce]
        answer: dersten önce
      - id: a2-u08-l6-e11
        type: free_text
        direction: tr_de
        prompt: İşten sonra parka gidiyorum.
        answers: [Nach der Arbeit gehe ich in den Park., Nach der Arbeit gehe ich zum Park., Ich gehe nach der Arbeit in den Park., Ich gehe nach der Arbeit zum Park.]
      - id: a2-u08-l6-e12
        type: word_bank
        prompt: Danach sind wir nach Hause gegangen.
        answers: [Ondan sonra eve gittik., Sonra eve gittik.]
        distractors: [önce, evde]
        explanation: ondan sonra = danach (o + Ablativ = ondan, mit n).

  - id: a2-u08-l7
    type: grammar
    title: 'Tabellen: Ortsnomina und mit'
    exercises:
      - id: a2-u08-l7-e1
        type: paradigm
        kind: noun
        lemma: üst
        rows: [[POSS_3SG, LOC], [POSS_3SG, DAT], [POSS_3SG, ABL]]
