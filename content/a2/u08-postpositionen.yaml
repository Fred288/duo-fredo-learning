        prompt: "Wo hat sie zuerst gesucht?"
        options: ["in der Tasche", "unter dem Bett", "in der Küche"]
        answer: "in der Tasche"
      - id: a2-u08-r1-e3
        type: multiple_choice
        prompt: "Wo war der Schlüssel?"
        options: ["im Kühlschrank", "hinter dem Sofa", "zwischen den Büchern"]
        answer: "im Kühlschrank"
      - id: a2-u08-r1-e4
        type: multiple_choice
        prompt: "Wohin legt sie den Schlüssel jetzt immer?"
        options: ["auf das Regal neben der Tür", "in die Tasche", "auf den Tisch"]
        answer: "auf das Regal neben der Tür"
      - id: a2-u08-r1-e5
        type: free_text
        direction: tr_de
        prompt: "Önce çantamın içine baktım."
        answers: ["Zuerst habe ich in meine Tasche geschaut.", "Zuerst habe ich in meiner Tasche nachgesehen.", "Zuerst schaute ich in meine Tasche.", "Zuerst habe ich in meine Tasche gesehen.", "Zuerst habe ich in meiner Tasche geschaut.", "Zuerst habe ich in meine Tasche geguckt."]

