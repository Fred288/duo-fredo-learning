        - { tr: "Anahtar buzdolabının içindeydi!", de: "Der Schlüssel war im Kühlschrank!" }
        - { tr: "Dün akşam sütle birlikte oraya koymuşum.", de: "Gestern Abend habe ich ihn wohl zusammen mit der Milch hineingelegt." }
        - { tr: "Artık anahtarımı her zaman kapının yanındaki rafa koyuyorum.", de: "Jetzt lege ich meinen Schlüssel immer auf das Regal neben der Tür." }
      glossary:
        - { tr: "bulamadım", de: "ich konnte nicht finden (bulmak + -ama- + -dım)", vocab: "bulmak" }
        - { tr: "yoktu", de: "war nicht da (yok + Vergangenheit)", vocab: "yok" }
        - { tr: "da", de: "auch (nachgestellt, getrennt geschrieben)" }
        - { tr: "sonunda", de: "schließlich, am Ende" }
        - { tr: "içindeydi", de: "war darin (iç + Possessiv + Lokativ + war)", vocab: "iç" }
        - { tr: "birlikte", de: "zusammen (ile birlikte = zusammen mit)" }
        - { tr: "oraya", de: "dorthin", vocab: "orada" }
        - { tr: "artık", de: "jetzt, nun (anders als früher)" }
        - { tr: "yanındaki", de: "neben … befindlich (yan + Possessiv + Lokativ + -ki)", vocab: "yan" }
