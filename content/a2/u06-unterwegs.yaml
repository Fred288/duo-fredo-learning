      - { id: a2-u06-l5-e4, type: paradigm, kind: verb, lemma: yapmak, tense: imperative, persons: [2sg, 3sg, 2pl, 3pl], targets: [yap, yapsın, yapın, yapsınlar], gloss_de: machen }
      - { id: a2-u06-l5-e5, type: paradigm, kind: verb, lemma: beklemek, tense: imperative, persons: [2sg, 3sg, 2pl, 3pl], targets: [bekle, beklesin, bekleyin, beklesinler], gloss_de: warten }
