lessons:
  - id: a2-u06-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a2-u06-l1-e1
        type: multiple_choice
        prompt: Was heißt „sağ“?
        options: [rechts, links, geradeaus]
        answer: rechts
        explanation: sağ (rechts), sol (links), düz (geradeaus).
      - id: a2-u06-l1-e2
        type: free_text
        direction: de_tr
        prompt: links
        answers: [sol]
      - id: a2-u06-l1-e3
        type: multiple_choice
        prompt: Was heißt „düz“?
        options: [geradeaus, zurück, oben]
        answer: geradeaus
      - id: a2-u06-l1-e4
        type: free_text
        direction: de_tr
        prompt: Ecke
        answers: [köşe]
      - id: a2-u06-l1-e5
        type: multiple_choice
        prompt: Was heißt „kavşak“?
        options: [Kreuzung, Brücke, Platz]
        answer: Kreuzung
      - id: a2-u06-l1-e6
        type: free_text
        direction: tr_de
        prompt: köprü
        answers: [Brücke, die Brücke]
      - id: a2-u06-l1-e7
        type: multiple_choice
        prompt: Was heißt „durak“?
        options: [Haltestelle, Bahnhof, Ampel]
        answer: Haltestelle
      - id: a2-u06-l1-e8
        type: free_text
        direction: de_tr
        prompt: Platz (in der Stadt)
        answers: [meydan]
      - id: a2-u06-l1-e9
        type: multiple_choice
        prompt: Was heißt „trafik ışığı“?
        options: [Ampel, Verkehrsschild, Stau]
        answer: Ampel
      - id: a2-u06-l1-e10
        type: multiple_choice
        prompt: Was heißt „geçmek“?
        options: [überqueren, warten, anhalten]
        answer: überqueren
        explanation: geçmek heißt überqueren, vorbeigehen, auch (Zeit) vergehen.
      - id: a2-u06-l1-e11
        type: free_text
        direction: de_tr
        prompt: aussteigen
        answers: [inmek]
        explanation: inmek (aussteigen, hinuntergehen) ist das Gegenteil von binmek.
      - id: a2-u06-l1-e12
        type: multiple_choice
        prompt: Was heißt „uzak“?
        options: [weit, nah, schnell]
        answer: weit
        explanation: uzak (weit), yakın (nah).
      - id: a2-u06-l1-e13
        type: free_text
        direction: de_tr
        prompt: fragen
        answers: [sormak]
      - id: a2-u06-l1-e14
        type: multiple_choice
        prompt: Was heißt „göstermek“?
        options: [zeigen, sehen, suchen]
        answer: zeigen
      - id: a2-u06-l1-e15
        type: multiple_choice
        prompt: Was heißt „karşı“ in „bankanın karşısında“?
        options: [gegenüber, neben, hinter]
        answer: gegenüber
        explanation: bankanın karşısında = gegenüber der Bank, wörtlich „an der Gegenseite der Bank“.
      - id: a2-u06-l1-e16
        type: free_text
        direction: de_tr
        prompt: aufpassen, achten auf
        answers: [dikkat etmek]
      - id: a2-u06-l1-e17
        type: free_text
        direction: de_tr
        prompt: Post (Gebäude)
        answers: [postane]
      - id: a2-u06-l1-e18
        type: multiple_choice
        prompt: Was heißt „harita“?
        options: [Karte, Fahrplan, Fahrkarte]
        answer: Karte
        explanation: harita = Landkarte, Stadtplan.
      - id: a2-u06-l1-e19
        type: multiple_choice
        prompt: Was heißt „yanında“ in „otelin yanında“?
        options: [neben, hinter, vor]
        answer: neben
        explanation: yan (Seite), ön (Vorderseite), arka (Rückseite) – otelin yanında, önünde, arkasında.

  - id: a2-u06-l2
    type: grammar
    title: Komm! Geh! (du)
    exercises:
      - id: a2-u06-l2-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2sg
        tense: imperative
        target: gel
        gloss_de: komm!
        explanation: Die du-Form ist einfach der Stamm, gelmek → gel!
      - { id: a2-u06-l2-e2, type: conjugation, mode: verb, lemma: okumak, person: 2sg, tense: imperative, target: oku, gloss_de: lies! }
      - { id: a2-u06-l2-e3, type: conjugation, mode: verb, lemma: beklemek, person: 2sg, tense: imperative, target: bekle, gloss_de: warte! }
      - { id: a2-u06-l2-e4, type: conjugation, mode: verb, lemma: dönmek, person: 2sg, tense: imperative, target: dön, gloss_de: bieg ab! }
      - { id: a2-u06-l2-e5, type: conjugation, mode: verb, lemma: gitmek, person: 2sg, tense: imperative, target: git, gloss_de: geh! }
      - id: a2-u06-l2-e6
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2sg
        tense: imperative
        negative: true
        target: gelme
        gloss_de: komm nicht!
        explanation: Verbot = Stamm + me/ma.
      - { id: a2-u06-l2-e7, type: conjugation, mode: verb, lemma: yapmak, person: 2sg, tense: imperative, negative: true, target: yapma, gloss_de: mach das nicht! }
      - { id: a2-u06-l2-e8, type: conjugation, mode: verb, lemma: unutmak, person: 2sg, tense: imperative, negative: true, target: unutma, gloss_de: vergiss nicht! }
      - { id: a2-u06-l2-e9, type: conjugation, mode: verb, lemma: korkmak, person: 2sg, tense: imperative, negative: true, target: korkma, gloss_de: hab keine Angst! }
      - id: a2-u06-l2-e10
        type: word_bank
        prompt: Komm her!
        answers: [Buraya gel!, Gel buraya!]
        distractors: [burada, gelin]
        explanation: buraya = hierher (bura + Dativ).
      - id: a2-u06-l2-e11
        type: word_bank
        prompt: Warte einen Moment!
        answers: [Bir dakika bekle!]
        distractors: [bekliyor, iki]
      - id: a2-u06-l2-e12
        type: word_bank
        prompt: Bieg rechts ab!
        answers: [Sağa dön!]
        distractors: [sağda, sola]
        explanation: Richtung mit Dativ, sağa (nach rechts), sola (nach links).
      - { id: a2-u06-l2-e13, type: suffix_builder, stem: sağ, suffixes: [DAT], target: sağa, gloss_de: nach rechts }
      - { id: a2-u06-l2-e14, type: suffix_builder, stem: sol, suffixes: [DAT], target: sola, gloss_de: nach links }

  - id: a2-u06-l3
    type: grammar
    title: Gehen Sie! (ihr, Sie)
    exercises:
      - id: a2-u06-l3-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2pl
        tense: imperative
        target: gelin
        gloss_de: 'kommt! kommen Sie!'
        explanation: -(y)in/-ın/-un/-ün, für ihr und die höfliche Anrede.
      - id: a2-u06-l3-e2
        type: conjugation
        mode: verb
        lemma: okumak
        person: 2pl
        tense: imperative
        target: okuyun
        gloss_de: 'lest! lesen Sie!'
        explanation: Nach Vokal steht ein y.
      - id: a2-u06-l3-e3
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 2pl
        tense: imperative
        target: gidin
        gloss_de: 'geht! gehen Sie!'
        explanation: git → gid vor dem Vokal der Endung.
      - { id: a2-u06-l3-e4, type: conjugation, mode: verb, lemma: dönmek, person: 2pl, tense: imperative, target: dönün, gloss_de: 'biegt ab! biegen Sie ab!' }
      - { id: a2-u06-l3-e5, type: conjugation, mode: verb, lemma: geçmek, person: 2pl, tense: imperative, target: geçin, gloss_de: 'überquert! überqueren Sie!' }
      - { id: a2-u06-l3-e6, type: conjugation, mode: verb, lemma: beklemek, person: 2pl, tense: imperative, target: bekleyin, gloss_de: 'wartet! warten Sie!' }
      - id: a2-u06-l3-e7
        type: conjugation
        mode: verb
        lemma: devam etmek
        person: 2pl
        tense: imperative
        target: devam edin
        gloss_de: 'geht weiter! gehen Sie weiter!'
        explanation: et → ed vor Vokal, wie bei gidin.
      - id: a2-u06-l3-e8
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2pl
        tense: imperative
        polite: true
        target: geliniz
        gloss_de: kommen Sie! (sehr höflich, schriftlich)
        explanation: -iniz ist die förmlichste Form, z. B. auf Schildern und in Anleitungen.
      - id: a2-u06-l3-e9
        type: conjugation
        mode: verb
        lemma: dikkat etmek
        person: 2pl
        tense: imperative
        target: dikkat edin
        gloss_de: 'passt auf! passen Sie auf!'
      - id: a2-u06-l3-e10
        type: conjugation
        mode: verb
        lemma: unutmak
        person: 2pl
        tense: imperative
        negative: true
        target: unutmayın
        gloss_de: 'vergesst nicht! vergessen Sie nicht!'
        explanation: Verneint me/ma + y + in.
      - { id: a2-u06-l3-e11, type: conjugation, mode: verb, lemma: inmek, person: 2pl, tense: imperative, target: inin, gloss_de: 'steigt aus! steigen Sie aus!' }
      - id: a2-u06-l3-e12
        type: word_bank
        prompt: Gehen Sie geradeaus!
        answers: [Düz gidin!]
        distractors: [git, düzde]
      - id: a2-u06-l3-e13
        type: word_bank
        prompt: Biegen Sie an der Ampel links ab!
        answers: [Trafik ışığında sola dönün!, Işıklardan sola dönün!]
        distractors: [sağa, dön]
        explanation: "trafik ışığı = Ampel (zusammengesetztes Wort mit -ı); + n + da → trafik ışığında. Umgangssprachlich: ışıklardan."
      - id: a2-u06-l3-e14
        type: multiple_choice
        prompt: Welche Form ist richtig? (Lesen Sie!)
        options: [Okuyun!, Okuin!, Okusun!]
        answer: Okuyun!

  - id: a2-u06-l4
    type: grammar
    title: Er soll … (-sin)
    exercises:
      - id: a2-u06-l4-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: imperative
        target: gelsin
        gloss_de: 'er, sie soll kommen'
        explanation: 3. Person mit -sin/-sın/-sun/-sün.
      - id: a2-u06-l4-e2
        type: conjugation
        mode: verb
        lemma: beklemek
        person: 3sg
        tense: imperative
        target: beklesin
        gloss_de: 'er, sie soll warten'
      - id: a2-u06-l4-e3
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 3pl
        tense: imperative
        target: gitsinler
        gloss_de: sie sollen gehen
        explanation: Kein gid, denn -sin beginnt mit einem Konsonanten.
      - { id: a2-u06-l4-e4, type: conjugation, mode: verb, lemma: okumak, person: 3sg, tense: imperative, target: okusun, gloss_de: 'er, sie soll lesen' }
      - { id: a2-u06-l4-e5, type: conjugation, mode: verb, lemma: gelmek, person: 3pl, tense: imperative, negative: true, target: gelmesinler, gloss_de: sie sollen nicht kommen }
      - { id: a2-u06-l4-e6, type: conjugation, mode: verb, lemma: yapmak, person: 3sg, tense: imperative, negative: true, target: yapmasın, gloss_de: 'er, sie soll das nicht machen' }
      - id: a2-u06-l4-e7
        type: word_bank
        prompt: Ali soll morgen anrufen.
        answers: [Ali yarın arasın., Yarın Ali arasın.]
        distractors: [arıyor, aradı]
        explanation: aramak = anrufen, suchen.
      - id: a2-u06-l4-e8
        type: multiple_choice
        prompt: Was heißt „Kolay gelsin!“?
        options: ['Frohes Schaffen! (zu jemandem, der arbeitet)', Komm leicht!, Gute Reise!]
        answer: 'Frohes Schaffen! (zu jemandem, der arbeitet)'
        explanation: Wörtlich „Es möge leicht kommen“, sehr häufig im Alltag.
      - id: a2-u06-l4-e9
        type: multiple_choice
        prompt: Was heißt „Allah korusun!“?
        speak_prompt: "Allah korusun!"
        options: [Gott bewahre!, Gute Nacht!, Herzlichen Glückwunsch!]
        answer: Gott bewahre!
        explanation: korumak = schützen. Die 3. Person drückt hier einen Wunsch aus.
      - id: a2-u06-l4-e10
        type: word_bank
        prompt: Lass die Kinder spielen. (Die Kinder sollen spielen.)
        answers: [Çocuklar oynasın., Çocuklar oynasınlar.]
        distractors: [oynuyor, oynadı]
        explanation: Bei 3. Person Plural ist -lar freiwillig.
      - id: a2-u06-l4-e11
        type: multiple_choice
        prompt: Welche Form ist richtig? (sie sollen gehen)
        options: [gitsinler, gidsinler, gitsinlar]
        answer: gitsinler
      - id: a2-u06-l4-e12
        type: multiple_choice
        prompt: Was heißt „Gidelim!“?
        speak_prompt: "Gidelim!"
        options: [Lass uns gehen!, Geht!, Er soll gehen!]
        answer: Lass uns gehen!
        explanation: Vorschau, -elim/-alım = lass uns, gidelim, bakalım.

