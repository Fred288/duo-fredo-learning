  - id: a2-u06-l6
    type: dialog
    title: Wo ist …? Den Weg beschreiben
    exercises:
      - id: a2-u06-l6-e1
        type: word_bank
        prompt: Entschuldigung, wo ist der Bahnhof?
        answers: ['Affedersiniz, istasyon nerede?']
        distractors: [nereye, istasyonda]
      - id: a2-u06-l6-e2
        type: word_bank
        prompt: Gehen Sie geradeaus, dann biegen Sie rechts ab.
        answers: ['Düz gidin, sonra sağa dönün.']
        distractors: [sola, önce]
      - id: a2-u06-l6-e3
        type: word_bank
        prompt: Biegen Sie in die zweite Straße links ab.
        answers: [İkinci sokaktan sola dönün.]
        distractors: [sokağa, sağa]
        explanation: İkinci sokaktan = in die zweite Straße, wörtlich „von der zweiten Straße“.
      - id: a2-u06-l6-e4
        type: word_bank
        prompt: Die Bank ist gegenüber der Post.
        answers: [Banka postanenin karşısında.]
        distractors: [postane, yanında]
        explanation: postane = Post, karşısında = gegenüber, yanında = neben.
      - id: a2-u06-l6-e5
        type: word_bank
        prompt: Ist es weit?
        answers: [Uzak mı?]
        distractors: [Yakın, mi]
      - id: a2-u06-l6-e6
        type: word_bank
        prompt: Nein, zu Fuß fünf Minuten.
        answers: ['Hayır, yürüyerek beş dakika.']
        distractors: [uzak, saat]
        explanation: "yürüyerek = zu Fuß (-erek = Art und Weise, Vorschau). Auch üblich: yürüyerek beş dakika sürer."
      - id: a2-u06-l6-e7
        type: word_bank
        prompt: Überqueren Sie die Brücke.
        answers: [Köprüyü geçin.]
        distractors: [köprüde, geç]
        explanation: köprüyü geçmek = die Brücke überqueren; köprüden geçmek = über die Brücke gehen; karşıya geçmek = auf die andere Seite gehen.
      - id: a2-u06-l6-e8
        type: multiple_choice
        prompt: Was heißt „Köşede sola dönün.“?
        options: [Biegen Sie an der Ecke links ab., Gehen Sie zur Ecke links., Die Ecke ist links.]
        answer: Biegen Sie an der Ecke links ab.
      - id: a2-u06-l6-e9
        type: word_bank
        prompt: Können Sie es mir auf der Karte zeigen?
        answers: [Haritada gösterebilir misiniz?, Bana haritada gösterebilir misiniz?, Haritada bana gösterebilir misiniz?]
        distractors: [gösterin, harita]
        explanation: harita = Karte, Stadtplan.
      - id: a2-u06-l6-e10
        type: word_bank
        prompt: Ich habe mich verlaufen.
        answers: [Kayboldum.]
        distractors: [kaybettim, kayboluyorum]
        explanation: kaybolmak = sich verirren, verloren gehen.
      - id: a2-u06-l6-e11
        type: free_text
        direction: tr_de
        prompt: Meydana kadar düz gidin.
        answers: [Gehen Sie geradeaus bis zum Platz., Gehen Sie bis zum Platz geradeaus., Geht geradeaus bis zum Platz., Geht bis zum Platz geradeaus., Gehen Sie bis zum Platz., Laufen Sie geradeaus bis zum Platz.]
      - id: a2-u06-l6-e12
        type: multiple_choice
        prompt: Was heißt „Müze otelin yanında.“?
        options: [Das Museum ist neben dem Hotel., Das Museum ist gegenüber dem Hotel., Das Museum ist hinter dem Hotel.]
        answer: Das Museum ist neben dem Hotel.
      - id: a2-u06-l6-e13
        type: free_text
        direction: de_tr
        prompt: Biegen Sie rechts ab!
        answers: [Sağa dönün!, Sağa dönünüz!]
      - id: a2-u06-l6-e14
        type: multiple_choice
        prompt: Was heißt „Burası çok yakın.“?
        options: [Es ist ganz in der Nähe., Hier ist es sehr weit., Hier ist es gefährlich.]
        answer: Es ist ganz in der Nähe.
        explanation: burası = dieser Ort hier.

  - id: a2-u06-l7
    type: dialog
    title: Mit Bus und Metro
    exercises:
      - id: a2-u06-l7-e1
        type: word_bank
        prompt: Welcher Bus fährt nach Taksim?
        answers: [Hangi otobüs Taksim'e gidiyor?, Hangi otobüs Taksim'e gider?, Taksim'e hangi otobüs gidiyor?, Taksim'e hangi otobüs gider?]
        distractors: ["Taksim'de", nereye]
      - id: a2-u06-l7-e2
        type: word_bank
        prompt: Steigen Sie nach drei Haltestellen aus.
        answers: [Üç durak sonra inin.]
        distractors: [binin, önce]
      - id: a2-u06-l7-e3
        type: word_bank
        prompt: Wo kann ich das Ticket kaufen?
        answers: [Bileti nereden alabilirim?, Nereden bilet alabilirim?, Bilet nereden alabilirim?]
        distractors: [nereye, alıyorum]
      - id: a2-u06-l7-e4
        type: word_bank
        prompt: Steigen Sie in die Metro.
        answers: [Metroya binin.]
        distractors: [metroda, bindi]
      - id: a2-u06-l7-e5
        type: suffix_builder
        stem: durak
        suffixes: [ABL]
        target: duraktan
        gloss_de: von der Haltestelle
      - id: a2-u06-l7-e6
        type: suffix_builder
        stem: durak
        suffixes: [DAT]
        target: durağa
        gloss_de: zur Haltestelle
        explanation: k wird vor Vokal zu ğ.
      - id: a2-u06-l7-e7
        type: multiple_choice
        prompt: Ein Schild sagt „Sigara içmeyiniz.“ Was bedeutet das?
        options: [Bitte nicht rauchen., Rauchen erlaubt., Zigaretten hier kaufen.]
        answer: Bitte nicht rauchen.
        explanation: Die förmliche Form -iniz steht oft auf Schildern.
      - id: a2-u06-l7-e8
        type: word_bank
        prompt: Passen Sie auf, der Bus kommt!
        answers: ['Dikkat edin, otobüs geliyor!']
        distractors: [dikkat et, gitti]
      - id: a2-u06-l7-e9
        type: free_text
        direction: tr_de
        prompt: Bir sonraki durakta inin.
