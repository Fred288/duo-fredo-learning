      - { id: a2-u06-l5-e8, type: paradigm, kind: verb, lemma: dönmek, tense: imperative, persons: [2sg, 3sg, 2pl, 3pl], targets: [dön, dönsün, dönün, dönsünler], gloss_de: 'abbiegen, zurückkehren' }
