      - id: a2-u04-l5-e10
        type: word_bank
        prompt: Das Wetter war sehr schön.
        answers: [Hava çok güzeldi.]
        distractors: [güzel, güzelmiş]
        explanation: hava = Wetter, Luft.
      - id: a2-u04-l5-e11
        type: word_bank
        prompt: Das Essen soll sehr gut gewesen sein.
        answers: [Yemek çok güzelmiş.]
        distractors: [güzeldi, iyi]
      - id: a2-u04-l5-e12
        type: multiple_choice
        prompt: Welche Form ist richtig? (Wo warst du?)
        options: [Neredeydin?, Neredeidin?, Nerededin?]
        answer: Neredeydin?
      - id: a2-u04-l5-e13
        type: free_text
        direction: de_tr
        prompt: Ich war krank.
        answers: [Hastaydım., Ben hastaydım., Hasta idim., Ben hasta idim.]

