lessons:
  - id: a2-u04-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a2-u04-l1-e1
        type: multiple_choice
        prompt: Was heißt „duymak“?
        options: [hören, sehen, sagen]
        answer: hören
        explanation: duymak heißt hören und auch „erfahren, mitbekommen“.
      - id: a2-u04-l1-e2
        type: free_text
        direction: de_tr
        prompt: erzählen
        answers: [anlatmak]
      - id: a2-u04-l1-e3
        type: multiple_choice
        prompt: Was heißt „haber“?
        options: [Nachricht, Zeitung, Brief]
        answer: Nachricht
        explanation: haberler = die Nachrichten (im Fernsehen).
      - id: a2-u04-l1-e4
        type: free_text
        direction: de_tr
        prompt: Nachbar, Nachbarin
        answers: [komşu]
      - id: a2-u04-l1-e5
        type: multiple_choice
        prompt: Was heißt „kaza“?
        options: [Unfall, Feuer, Diebstahl]
        answer: Unfall
      - id: a2-u04-l1-e6
        type: free_text
        direction: tr_de
        prompt: kaybetmek
        answers: [verlieren]
      - id: a2-u04-l1-e7
        type: multiple_choice
        prompt: Was heißt „kazanmak“?
        options: [gewinnen, ausgeben, verlieren]
        answer: gewinnen
        explanation: kazanmak heißt gewinnen und (Geld) verdienen.
      - id: a2-u04-l1-e8
        type: free_text
        direction: de_tr
        prompt: finden
        answers: [bulmak]
      - id: a2-u04-l1-e9
        type: multiple_choice
        prompt: Was heißt „düşmek“?
        options: [fallen, laufen, springen]
        answer: fallen
      - id: a2-u04-l1-e10
        type: free_text
        direction: de_tr
        prompt: krank
        answers: [hasta]
      - id: a2-u04-l1-e11
        type: multiple_choice
        prompt: Was heißt „galiba“?
        options: [anscheinend, sicher, niemals]
        answer: anscheinend
        explanation: galiba = anscheinend, wohl; herhalde = wahrscheinlich.
      - id: a2-u04-l1-e12
        type: multiple_choice
        prompt: Was heißt „masal“?
        options: [Märchen, Lied, Witz]
        answer: Märchen
      - id: a2-u04-l1-e13
        type: free_text
        direction: tr_de
        prompt: olmak
        answers: [werden, sein, passieren, geschehen]
        explanation: olmak heißt werden, passieren und sein (ne oldu? = was ist passiert?).
      - id: a2-u04-l1-e14
        type: multiple_choice
        prompt: Was heißt „şaşırmak“?
        options: [sich wundern, sich freuen, sich ärgern]
        answer: sich wundern
      - id: a2-u04-l1-e15
        type: multiple_choice
        prompt: Was heißt „Ne oldu?“
        options: [Was ist passiert?, Was machst du?, Wer ist das?]
        answer: Was ist passiert?
      - id: a2-u04-l1-e16
        type: free_text
        direction: de_tr
        prompt: sagen
        answers: [demek, söylemek]
      - id: a2-u04-l1-e17
        type: multiple_choice
        prompt: Was heißt „hava“?
        options: [Wetter, Wasser, Wind]
        answer: Wetter
        explanation: hava heißt auch Luft.
      - id: a2-u04-l1-e18
        type: multiple_choice
        prompt: Was heißt „yorgun“?
        options: [müde, krank, traurig]
        answer: müde
      - id: a2-u04-l1-e19
        type: free_text
        direction: de_tr
        prompt: glücklich
        answers: [mutlu]

  - id: a2-u04-l2
    type: grammar
    title: Er soll gekommen sein
    exercises:
      - id: a2-u04-l2-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: evidential
        target: gelmiş
        gloss_de: 'er, sie ist (wohl) gekommen'
        explanation: -miş für Dinge, die man nicht selbst erlebt hat, sondern gehört oder erschlossen hat.
      - { id: a2-u04-l2-e2, type: conjugation, mode: verb, lemma: yapmak, person: 3pl, tense: evidential, target: yapmışlar, gloss_de: 'sie haben (angeblich) gemacht' }
      - id: a2-u04-l2-e3
        type: conjugation
        mode: verb
        lemma: okumak
        person: 3sg
        tense: evidential
        target: okumuş
        gloss_de: 'er, sie hat (wohl) gelesen'
        explanation: Vierfach-Harmonie, nach u → muş.
      - { id: a2-u04-l2-e4, type: conjugation, mode: verb, lemma: görmek, person: 3sg, tense: evidential, target: görmüş, gloss_de: 'er, sie hat (angeblich) gesehen' }
      - id: a2-u04-l2-e5
        type: conjugation
        mode: verb
        lemma: kazanmak
        person: 3sg
        tense: evidential
        target: kazanmış
        gloss_de: 'er, sie hat (angeblich) gewonnen'
      - { id: a2-u04-l2-e6, type: conjugation, mode: verb, lemma: düşmek, person: 3sg, tense: evidential, target: düşmüş, gloss_de: 'er, sie ist (wohl) gefallen' }
      - id: a2-u04-l2-e7
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 3pl
        tense: evidential
        target: gitmişler
        gloss_de: 'sie sind (angeblich) gegangen'
        explanation: Kein Wechsel zu gid, -miş beginnt mit einem Konsonanten.
      - id: a2-u04-l2-e8
        type: conjugation
        mode: verb
        lemma: unutmak
        person: 1sg
        tense: evidential
        target: unutmuşum
        gloss_de: ich habe (offenbar) vergessen
        explanation: In der 1. Person drückt -miş Überraschung aus, „ich habe es wohl vergessen“.
      - { id: a2-u04-l2-e9, type: conjugation, mode: verb, lemma: kaybetmek, person: 3sg, tense: evidential, target: kaybetmiş, gloss_de: 'er, sie hat (angeblich) verloren' }
      - { id: a2-u04-l2-e10, type: conjugation, mode: verb, lemma: bulmak, person: 3pl, tense: evidential, target: bulmuşlar, gloss_de: 'sie haben (angeblich) gefunden' }
      - { id: a2-u04-l2-e11, type: conjugation, mode: verb, lemma: evlenmek, person: 3pl, tense: evidential, target: evlenmişler, gloss_de: 'sie haben (angeblich) geheiratet' }
      - { id: a2-u04-l2-e12, type: conjugation, mode: verb, lemma: olmak, person: 3sg, tense: evidential, target: olmuş, gloss_de: 'es ist (anscheinend) passiert' }
      - id: a2-u04-l2-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (er hat angeblich gelesen)
        options: [okumuş, okumiş, okudumuş]
        answer: okumuş
      - id: a2-u04-l2-e14
        type: word_bank
        prompt: Ali hat angeblich ein Auto gekauft.
        answers: [Ali bir araba almış., Ali araba almış.]
        chunks:
          - { text: "Ali", role: subject }
          - { text: "bir araba", role: object_bare }
          - { text: "almış", role: predicate }
        distractors: [aldı, alıyor]
        explanation: Mit -miş gibt man wieder, was man gehört hat.

  - id: a2-u04-l3
    type: grammar
    title: nicht und Fragen
    exercises:
      - id: a2-u04-l3-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: evidential
        negative: true
        target: gelmemiş
        gloss_de: 'er, sie ist (angeblich) nicht gekommen'
      - { id: a2-u04-l3-e2, type: conjugation, mode: verb, lemma: yapmak, person: 3pl, tense: evidential, negative: true, target: yapmamışlar, gloss_de: 'sie haben (angeblich) nicht gemacht' }
      - { id: a2-u04-l3-e3, type: conjugation, mode: verb, lemma: anlamak, person: 1sg, tense: evidential, negative: true, target: anlamamışım, gloss_de: ich habe (offenbar) nicht verstanden }
      - { id: a2-u04-l3-e4, type: conjugation, mode: verb, lemma: duymak, person: 3sg, tense: evidential, negative: true, target: duymamış, gloss_de: 'er, sie hat (angeblich) nicht gehört' }
      - id: a2-u04-l3-e5
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: evidential
        question: true
        target: gelmiş mi?
        gloss_de: 'Ist er, sie (wohl) gekommen?'
        explanation: Die Partikel steht wie im Präsens getrennt und trägt die Endung, außer bei -ler (gelmişler mi?).
      - { id: a2-u04-l3-e6, type: conjugation, mode: verb, lemma: kazanmak, person: 3pl, tense: evidential, question: true, target: kazanmışlar mı?, gloss_de: Haben sie (wohl) gewonnen? }
      - { id: a2-u04-l3-e7, type: conjugation, mode: verb, lemma: okumak, person: 3sg, tense: evidential, question: true, target: okumuş mu?, gloss_de: "Hat er, sie (wohl) gelesen?" }
      - id: a2-u04-l3-e8
        type: multiple_choice
        prompt: Was heißt „Hiç İstanbul'a gitmiş mi?“
        options: [Ist er/sie (angeblich) schon einmal in Istanbul gewesen?, Ist er/sie nie in Istanbul gewesen?, Geht er/sie nach Istanbul?]
        answer: Ist er/sie (angeblich) schon einmal in Istanbul gewesen?
        explanation: hiç in der Frage = jemals.
      - id: a2-u04-l3-e9
        type: word_bank
        prompt: Mehmet ist angeblich gestern nicht zur Arbeit gegangen.
        answers: [Mehmet dün işe gitmemiş., Dün Mehmet işe gitmemiş.]
        chunks:
          - { text: "Mehmet", role: subject }
          - { text: "dün", role: time }
          - { text: "işe", role: place }
          - { text: "gitmemiş", role: predicate }
        orders:
          - { order: [1, 0, 2, 3], note: "Auch üblich: die Zeit am Satzanfang." }
        distractors: [gitmedi, işte]
        explanation: işe = zur Arbeit (iş + Dativ).
      - id: a2-u04-l3-e10
        type: free_text
        direction: tr_de
        prompt: Ayşe hiç gelmemiş.
        answers: [Ayşe ist gar nicht gekommen., Ayşe ist angeblich gar nicht gekommen., Ayşe ist offenbar gar nicht gekommen., Ayşe ist überhaupt nicht gekommen., Ayşe ist nie gekommen., Ayşe soll gar nicht gekommen sein., Ayşe ist offenbar überhaupt nicht gekommen.]
      - id: a2-u04-l3-e11
        type: multiple_choice
        prompt: Welche Frage ist richtig? (Hat er es angeblich gefunden?)
        options: [Bulmuş mu?, Bulmuşmu?, Buldu mu mış?]
        answer: Bulmuş mu?
      - id: a2-u04-l3-e12
        type: word_bank
        prompt: Sie haben das Spiel (angeblich) nicht gewonnen.
        answers: [Maçı kazanmamışlar.]
        distractors: [kazandılar, maç]
      - id: a2-u04-l3-e13
        type: free_text
        direction: de_tr
        prompt: 'er hat (angeblich) nicht gehört'
        answers: [duymamış, o duymamış]
      - id: a2-u04-l3-e14
        type: conjugation
        mode: verb
        lemma: uyumak
        person: 1sg
        tense: evidential
        target: uyumuşum
        gloss_de: ich bin (offenbar) eingeschlafen

  - id: a2-u04-l4
    type: grammar
    title: -dı oder -miş?
    exercises:
      - id: a2-u04-l4-e1
        type: multiple_choice
        prompt: Du hast es selbst gesehen. Wie sagst du „Ali ist gekommen“?
        options: [Ali geldi., Ali gelmiş., Ali geliyor.]
        answer: Ali geldi.
        explanation: -dı für selbst Erlebtes, -miş für Gehörtes oder Erschlossenes.
      - id: a2-u04-l4-e2
        type: multiple_choice
        prompt: Deine Schwester hat es dir erzählt. Wie sagst du „Ali ist gekommen“?
        options: [Ali gelmiş., Ali geldi., Ali gelecek.]
        answer: Ali gelmiş.
        explanation: -miş markiert, dass man es nicht selbst gesehen hat. -dı wäre hier nicht falsch, klingt aber so, als wäre man sicher.
      - id: a2-u04-l4-e3
        type: multiple_choice
        prompt: Du kommst nach Hause, der Boden ist nass. Was sagst du?
        options: [Yağmur yağmış., Yağmur yağdı., Yağmur yağıyor.]
        answer: Yağmur yağmış.
        explanation: Du schließt aus den Spuren, dass es geregnet hat → -miş.
      - id: a2-u04-l4-e4
        type: multiple_choice
        prompt: Du hast den Film gestern gesehen. Was sagst du?
        options: [Dün filmi izledim., Dün filmi izlemişim., Dün filmi izlemiş.]
        answer: Dün filmi izledim.
      - id: a2-u04-l4-e5
        type: word_bank
        prompt: Laut Nachrichten gab es einen Unfall.
        answers: [Haberlere göre bir kaza olmuş.]
        chunks:
          - { text: "Haberlere göre", role: complement }
          - { text: "bir kaza", role: subject }
          - { text: "olmuş", role: predicate }
        distractors: [olacak, kazada]
        explanation: haberlere göre = laut Nachrichten, … göre = laut, gemäß.
      - id: a2-u04-l4-e6
        type: word_bank
        prompt: Oh, ich habe meinen Schlüssel ja vergessen! (du merkst es gerade erst)
        answers: [Aa, anahtarımı unutmuşum!]
        distractors: [unutacağım, anahtar]
        explanation: In der 1. Person drückt -miş eine plötzliche Erkenntnis aus.
      - id: a2-u04-l4-e7
        type: multiple_choice
        prompt: Was drückt „Aa, çok güzelmiş!“ aus?
        options: ['Überraschung, „Oh, das ist ja sehr schön!“', eine Vermutung über morgen, eine Bitte]
        answer: 'Überraschung, „Oh, das ist ja sehr schön!“'
        explanation: güzel + miş, Vorschau auf -(y)miş in Lektion 5.
      - id: a2-u04-l4-e8
        type: word_bank
        prompt: Ich habe gehört, dass dein Bruder geheiratet hat.
        answers: [Duydum ki kardeşin evlenmiş.]
        distractors: [evlenecek, duyuyorum]
        explanation: duydum ki = ich habe gehört, dass. Das Gehörte steht dann im -miş.
      - id: a2-u04-l4-e9
        type: multiple_choice
        prompt: Welche Zeit passt? „Ben dün sinemaya …“ (selbst erlebt)
        options: [gittim, gitmişim, gitmiş]
        answer: gittim
      - id: a2-u04-l4-e10
        type: free_text
        direction: tr_de
        prompt: Komşumuz Almanya'ya taşınmış.
        answers: [Unser Nachbar ist nach Deutschland gezogen., Unser Nachbar ist angeblich nach Deutschland gezogen., Unsere Nachbarin ist nach Deutschland gezogen., Unser Nachbar ist offenbar nach Deutschland gezogen., Unser Nachbar soll nach Deutschland gezogen sein., Unsere Nachbarin ist angeblich nach Deutschland gezogen., Unsere Nachbarin ist offenbar nach Deutschland gezogen., Unsere Nachbarin soll nach Deutschland gezogen sein.]
      - id: a2-u04-l4-e11
        type: multiple_choice
        prompt: Womit beginnt ein türkisches Märchen?
        options: ['Bir varmış, bir yokmuş …', Bir gün geldi …, Evvel zaman sonra …]
        answer: 'Bir varmış, bir yokmuş …'
        explanation: Wörtlich „Es gab einmal, es gab einmal nicht …“, wie „Es war einmal“. Märchen erzählt man im -miş.
      - id: a2-u04-l4-e12
        type: word_bank
        prompt: Was ist passiert?
        answers: [Ne oldu?, Ne olmuş?]
        distractors: [olacak, kim]
        explanation: Ne oldu? ist die neutrale Frage. Ne olmuş? klingt, als hätte man schon Spuren bemerkt oder etwas gehört.
      - id: a2-u04-l4-e13
        type: free_text
        direction: de_tr
        prompt: laut Nachrichten
        answers: [haberlere göre]

  - id: a2-u04-l5
