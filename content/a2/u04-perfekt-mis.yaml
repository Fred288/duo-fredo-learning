      - { id: a2-u04-l5-e8, type: conjugation, mode: copula, lemma: öğretmen, person: 3sg, tense: evidential, target: öğretmenmiş, gloss_de: 'er, sie soll Lehrer sein' }
      - id: a2-u04-l5-e9
        type: word_bank
        prompt: Gestern war ich zu Hause.
        answers: [Dün evdeydim., Ben dün evdeydim.]
        distractors: [evdeyim, evde]
