  - id: a2-u04-l7
    type: reading
    title: 'Lesetext: Neuigkeiten'
    exercises:
      - id: a2-u04-l7-e1
        type: multiple_choice
        prompt: '„Duydun mu? Komşumuz Ahmet piyangoda para kazanmış!“ – Was ist passiert?'
        options: [Ahmet hat angeblich in der Lotterie gewonnen., Ahmet hat Geld verloren., Ahmet ist umgezogen.]
        answer: Ahmet hat angeblich in der Lotterie gewonnen.
        explanation: piyango = Lotterie. Die Sprecherin hat es nur gehört → -miş.
      - id: a2-u04-l7-e2
        type: multiple_choice
        prompt: '„Duydun mu? Komşumuz Ahmet piyangoda para kazanmış!“ – Woher weiß die Sprecherin das?'
        options: [Sie hat es gehört., Sie war dabei., Sie hat selbst gewonnen.]
        answer: Sie hat es gehört.
      - id: a2-u04-l7-e3
        type: multiple_choice
        prompt: '„Sonra yeni bir araba almış ve İzmir''e taşınmışlar.“ – Wohin sind sie gezogen?'
        options: [nach Izmir, nach Istanbul, ins Ausland]
        answer: nach Izmir
      - id: a2-u04-l7-e4
        type: multiple_choice
        prompt: '„Ama karısı hiç mutlu değilmiş, çünkü İstanbul''u çok seviyormuş.“ – Warum ist seine Frau nicht glücklich?'
        options: [Sie liebt Istanbul sehr., Sie mag das Auto nicht., Sie hat ihre Arbeit verloren.]
        answer: Sie liebt Istanbul sehr.
        explanation: çünkü = weil, karısı = seine Frau, değilmiş = sei nicht (değil + miş), seviyormuş = sie liebe angeblich (-iyor + -muş, Vorschau).
      - id: a2-u04-l7-e5
        type: word_bank
        prompt: Hast du gehört? Unser Nachbar hat gewonnen!
        answers: ['Duydun mu? Komşumuz kazanmış!']
        distractors: [kazandı, duydum]
      - id: a2-u04-l7-e6
        type: free_text
        direction: tr_de
        prompt: Yeni bir araba almışlar.
        answers: [Sie haben ein neues Auto gekauft., Sie haben angeblich ein neues Auto gekauft., Sie sollen ein neues Auto gekauft haben., Sie haben offenbar ein neues Auto gekauft., Sie haben sich ein neues Auto gekauft.]
      - id: a2-u04-l7-e7
        type: multiple_choice
        prompt: '„Bir varmış, bir yokmuş, bir köyde yaşlı bir adam yaşarmış.“ – Was ist das?'
        options: [der Anfang eines Märchens, eine Wegbeschreibung, ein Zeitungsbericht von heute]
        answer: der Anfang eines Märchens
        explanation: köy = Dorf, yaşlı bir adam = ein alter Mann, yaşarmış = lebte (Aorist + -mış, typisch für Märchen, Vorschau).
      - id: a2-u04-l7-e8
        type: word_bank
        prompt: Es war einmal …
        answers: ["Bir varmış, bir yokmuş"]
        distractors: [vardı, yoktu]
      - id: a2-u04-l7-e9
        type: multiple_choice
        prompt: Warum stehen Märchen im -miş?
        options: [Weil der Erzähler die Geschichte nicht selbst erlebt hat., Weil sie in der Zukunft spielen., Weil sie Fragen sind.]
        answer: Weil der Erzähler die Geschichte nicht selbst erlebt hat.
      - id: a2-u04-l7-e10
        type: word_bank
        prompt: Gestern war ich in Izmir, das Wetter war sehr schön.
        answers: ["Dün İzmir'deydim, hava çok güzeldi."]
        distractors: [güzelmiş, "İzmir'e"]

