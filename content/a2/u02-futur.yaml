  - id: a2-u02-l5
    type: grammar
    title: Morgen, nächste Woche, nächstes Jahr
    exercises:
      - id: a2-u02-l5-e1
        type: word_bank
        prompt: Morgen werde ich nach Istanbul fahren.
        answers: [Yarın İstanbul'a gideceğim., Ben yarın İstanbul'a gideceğim.]
        distractors: ["İstanbul'da", gittim]
      - id: a2-u02-l5-e2
        type: word_bank
        prompt: Nächste Woche werden wir das Museum besuchen.
        answers: [Gelecek hafta müzeyi ziyaret edeceğiz.]
        distractors: [müzeye, ettik]
      - id: a2-u02-l5-e3
        type: word_bank
        prompt: Nächstes Jahr werde ich Türkisch lernen.
        answers: [Seneye Türkçe öğreneceğim., Gelecek yıl Türkçe öğreneceğim.]
        distractors: [öğrendim, geçen]
        explanation: seneye = nächstes Jahr, auch gelecek yıl.
      - id: a2-u02-l5-e4
        type: word_bank
        prompt: Im Sommer fahren wir ans Meer.
        answers: [Yazın denize gideceğiz.]
        distractors: [denizde, gittik]
        explanation: yazın = im Sommer, kışın = im Winter.
      - id: a2-u02-l5-e5
        type: word_bank
        prompt: Vielleicht werde ich nicht kommen.
        answers: [Belki gelmeyeceğim.]
        distractors: [gelmedim, yarın]
      - id: a2-u02-l5-e6
        type: word_bank
        prompt: In zwei Tagen fahren wir zurück.
        answers: [İki gün sonra döneceğiz.]
        distractors: [önce, döndük]
        explanation: … sonra = in, nach (zeitlich), iki gün sonra = in zwei Tagen.
      - id: a2-u02-l5-e7
        type: multiple_choice
        prompt: Was heißt „üç gün sonra“?
        options: [in drei Tagen, vor drei Tagen, drei Tage lang]
        answer: in drei Tagen
      - id: a2-u02-l5-e8
        type: free_text
        direction: de_tr
        prompt: nächste Woche
        answers: [gelecek hafta, haftaya, önümüzdeki hafta]
        explanation: haftaya ist umgangssprachlich für nächste Woche.
      - id: a2-u02-l5-e9
        type: word_bank
        prompt: Was wirst du am Wochenende machen?
        answers: [Hafta sonu ne yapacaksın?]
        distractors: [yaptın, nerede]
      - id: a2-u02-l5-e10
        type: free_text
        direction: tr_de
        prompt: Akşam evde dinleneceğim.
        answers: [Am Abend werde ich mich zu Hause ausruhen., Abends werde ich mich zu Hause ausruhen., Heute Abend ruhe ich mich zu Hause aus., Am Abend ruhe ich mich zu Hause aus., Heute Abend werde ich mich zu Hause ausruhen., Am Abend werde ich mich zu Hause erholen.]
      - id: a2-u02-l5-e11
        type: multiple_choice
        prompt: Was passt? „Yarın sabah erken …“
        options: [kalkacağım, kalktım, kalkmadım]
        answer: kalkacağım
      - id: a2-u02-l5-e12
        type: multiple_choice
        prompt: Wofür steht das Präsens -iyor in „Yarın geliyorum.“?
        options: [für einen festen Plan, für die Vergangenheit, für eine Gewohnheit]
        answer: für einen festen Plan
        explanation: Wie im Deutschen („Morgen komme ich“) kann -iyor feste Pläne ausdrücken. -ecek betont Absicht oder Vorhersage.
      - id: a2-u02-l5-e13
        type: free_text
        direction: de_tr
        prompt: in zwei Tagen
        answers: [iki gün sonra]

  - id: a2-u02-l6
    type: dialog
    title: Eine Reise planen
    exercises:
      - id: a2-u02-l6-e1
        type: word_bank
        prompt: Wohin fährst du in den Urlaub?
        answers: [Tatile nereye gideceksin?, Tatilde nereye gideceksin?]
        distractors: [nerede, gittin]
      - id: a2-u02-l6-e2
        type: word_bank
        prompt: Ich werde nach Antalya fliegen.
        answers: [Antalya'ya uçacağım., Uçakla Antalya'ya gideceğim., Antalya'ya uçakla gideceğim.]
        distractors: ["Antalya'da", uçtum]
        explanation: uçmak = fliegen, uçakla = mit dem Flugzeug.
      - id: a2-u02-l6-e3
        type: word_bank
        prompt: Wir werden mit dem Bus fahren.
        answers: [Otobüsle gideceğiz., Otobüse bineceğiz.]
        distractors: [otobüste, gittik]
        explanation: -le/-la = mit (Verkehrsmittel), otobüsle.
      - id: a2-u02-l6-e4
        type: word_bank
        prompt: Ich werde zwei Wochen in einem Hotel bleiben.
        answers: [İki hafta bir otelde kalacağım., Bir otelde iki hafta kalacağım.]
        distractors: [otele, haftalar]
      - id: a2-u02-l6-e5
        type: word_bank
        prompt: Hast du das Ticket gekauft?
        answers: [Bileti aldın mı?]
        distractors: [bilet, alacak]
      - id: a2-u02-l6-e6
        type: word_bank
        prompt: Nein, ich kaufe es morgen.
        answers: ['Hayır, yarın alacağım.', 'Hayır, yarın alıyorum.']
        distractors: [aldım, dün]
      - id: a2-u02-l6-e7
        type: multiple_choice
        prompt: Am Schalter sagt man „İstanbul'a bir bilet, lütfen.“ Was möchtest du?
        options: [ein Ticket nach Istanbul, ein Ticket aus Istanbul, Informationen über Istanbul]
        answer: ein Ticket nach Istanbul
      - id: a2-u02-l6-e8
        type: word_bank
        prompt: Wann fährt der Zug ab?
        answers: [Tren ne zaman kalkacak?, Tren saat kaçta kalkacak?, Tren ne zaman kalkıyor?, Tren saat kaçta kalkıyor?]
        distractors: [kalktı, nerede]
        explanation: kalkmak heißt auch „abfahren, abfliegen“. Für Fahrpläne ist das Präsens üblich, kalkıyor.
      - id: a2-u02-l6-e9
        type: free_text
        direction: tr_de
        prompt: Pasaportunu unutma!
        answers: [Vergiss deinen Pass nicht!, Vergiss deinen Reisepass nicht!]
        explanation: unutma = vergiss nicht. Der Imperativ kommt in einer späteren Unit.
      - id: a2-u02-l6-e10
        type: word_bank
        prompt: Ich werde meinen Koffer heute Abend packen.
        answers: [Valizimi bu akşam hazırlayacağım., Bu akşam valizimi hazırlayacağım., Valizi bu akşam hazırlayacağım., Bu akşam valizi hazırlayacağım.]
        distractors: [valiz, hazırladım]
        explanation: valiz hazırlamak = den Koffer packen.
      - id: a2-u02-l6-e11
        type: multiple_choice
        prompt: Was heißt „İyi yolculuklar!“?
        options: [Gute Reise!, Guten Appetit!, Gute Besserung!]
        answer: Gute Reise!
      - id: a2-u02-l6-e12
        type: word_bank
        prompt: Wir werden viel besichtigen.
        answers: [Çok gezeceğiz.]
        distractors: [gezdik, az]

