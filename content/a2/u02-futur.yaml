lessons:
  - id: a2-u02-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a2-u02-l1-e1
        type: multiple_choice
        prompt: Was heißt „tatil“?
        options: [Urlaub, Reise, Ausflug]
        answer: Urlaub
        explanation: tatil heißt Urlaub, Ferien und auch Feiertag.
      - id: a2-u02-l1-e2
        type: free_text
        direction: de_tr
        prompt: Meer
        answers: [deniz]
      - id: a2-u02-l1-e3
        type: multiple_choice
        prompt: Was heißt „uçak“?
        options: [Flugzeug, Zug, Schiff]
        answer: Flugzeug
      - id: a2-u02-l1-e4
        type: free_text
        direction: de_tr
        prompt: Zug
        answers: [tren]
      - id: a2-u02-l1-e5
        type: multiple_choice
        prompt: Was heißt „otobüs“?
        options: [Bus, Auto, Taxi]
        answer: Bus
      - id: a2-u02-l1-e6
        type: free_text
        direction: tr_de
        prompt: bilet
        answers: [Fahrkarte, Ticket, Eintrittskarte, Karte]
      - id: a2-u02-l1-e7
        type: multiple_choice
        prompt: Was heißt „valiz“?
        options: [Koffer, Tasche, Rucksack]
        answer: Koffer
      - id: a2-u02-l1-e8
        type: free_text
        direction: de_tr
        prompt: Reisepass
        answers: [pasaport]
      - id: a2-u02-l1-e9
        type: multiple_choice
        prompt: Was heißt „kalmak“?
        options: [bleiben, fahren, kommen]
        answer: bleiben
      - id: a2-u02-l1-e10
        type: multiple_choice
        prompt: Was heißt „gezmek“?
        options: ['herumgehen, besichtigen', schlafen, arbeiten]
        answer: 'herumgehen, besichtigen'
        explanation: gezmek = umhergehen, bummeln, eine Stadt besichtigen.
      - id: a2-u02-l1-e11
        type: free_text
        direction: tr_de
        prompt: binmek
        answers: [einsteigen, nehmen, steigen, fahren mit]
        explanation: Mit Dativ und für Verkehrsmittel, otobüse binmek = in den Bus steigen, den Bus nehmen.
      - id: a2-u02-l1-e12
        type: multiple_choice
        prompt: Was heißt „hazırlamak“?
        options: [vorbereiten, abholen, buchen]
        answer: vorbereiten
      - id: a2-u02-l1-e13
        type: free_text
        direction: de_tr
        prompt: sich ausruhen, sich erholen
        answers: [dinlenmek]
      - id: a2-u02-l1-e14
        type: multiple_choice
        prompt: Was heißt „gelecek hafta“?
        options: [nächste Woche, letzte Woche, jede Woche]
        answer: nächste Woche
      - id: a2-u02-l1-e15
        type: multiple_choice
        prompt: Was heißt „belki“?
        options: [vielleicht, sicher, nie]
        answer: vielleicht
      - id: a2-u02-l1-e16
        type: free_text
        direction: de_tr
        prompt: reisen
        answers: [seyahat etmek, yolculuk etmek]

  - id: a2-u02-l2
    type: grammar
    title: ich werde …
    exercises:
      - id: a2-u02-l2-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: future
        target: geleceğim
        gloss_de: ich werde kommen
        explanation: Stamm + ecek + im. Vor dem Vokal von -im wird k zu ğ.
      - id: a2-u02-l2-e2
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2sg
        tense: future
        target: geleceksin
        gloss_de: du wirst kommen
        explanation: Vor -sin bleibt das k, die Endung beginnt mit einem Konsonanten.
      - { id: a2-u02-l2-e3, type: conjugation, mode: verb, lemma: yapmak, person: 3sg, tense: future, target: yapacak, gloss_de: 'er, sie wird machen' }
      - id: a2-u02-l2-e4
        type: conjugation
        mode: verb
        lemma: okumak
        person: 1pl
        tense: future
        target: okuyacağız
        gloss_de: wir werden lesen
        explanation: Nach Vokal steht ein y vor -acak.
      - id: a2-u02-l2-e5
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 1sg
        tense: future
        target: gideceğim
        gloss_de: ich werde gehen
        explanation: git wird vor dem Vokal zu gid, wie im Präsens.
      - { id: a2-u02-l2-e6, type: conjugation, mode: verb, lemma: kalmak, person: 2pl, tense: future, target: kalacaksınız, gloss_de: 'ihr werdet bleiben, Sie werden bleiben' }
      - { id: a2-u02-l2-e7, type: conjugation, mode: verb, lemma: gezmek, person: 3pl, tense: future, target: gezecekler, gloss_de: "sie werden sich umsehen, herumreisen" }
      - id: a2-u02-l2-e8
        type: conjugation
        mode: verb
        lemma: yemek
        person: 1sg
        tense: future
        target: yiyeceğim
        gloss_de: ich werde essen
        explanation: Unregelmäßig, ye → yi + yecek.
      - { id: a2-u02-l2-e9, type: conjugation, mode: verb, lemma: beklemek, person: 1sg, tense: future, target: bekleyeceğim, gloss_de: ich werde warten }
      - { id: a2-u02-l2-e10, type: conjugation, mode: verb, lemma: binmek, person: 1pl, tense: future, target: bineceğiz, gloss_de: wir werden einsteigen }
      - { id: a2-u02-l2-e11, type: conjugation, mode: verb, lemma: hazırlamak, person: 1sg, tense: future, target: hazırlayacağım, gloss_de: ich werde vorbereiten }
      - { id: a2-u02-l2-e12, type: conjugation, mode: verb, lemma: seyahat etmek, person: 1pl, tense: future, target: seyahat edeceğiz, gloss_de: wir werden reisen }
      - id: a2-u02-l2-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (ich werde machen)
        options: [yapacağım, yapacakım, yapaceğim]
        answer: yapacağım
      - id: a2-u02-l2-e14
        type: free_text
        direction: de_tr
        prompt: wir werden bleiben
        answers: [kalacağız, biz kalacağız]

  - id: a2-u02-l3
    type: grammar
    title: nicht und Fragen
    exercises:
      - id: a2-u02-l3-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: future
        negative: true
        target: gelmeyeceğim
        gloss_de: ich werde nicht kommen
        explanation: me + y + ecek + im, nach der Verneinung steht ein y.
      - { id: a2-u02-l3-e2, type: conjugation, mode: verb, lemma: yapmak, person: 3sg, tense: future, negative: true, target: yapmayacak, gloss_de: 'er, sie wird nicht machen' }
      - id: a2-u02-l3-e3
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 1pl
        tense: future
        negative: true
        target: gitmeyeceğiz
        gloss_de: wir werden nicht gehen
        explanation: Nach git folgt -me, darum bleibt das t.
      - { id: a2-u02-l3-e4, type: conjugation, mode: verb, lemma: kalmak, person: 2sg, tense: future, negative: true, target: kalmayacaksın, gloss_de: du wirst nicht bleiben }
      - id: a2-u02-l3-e5
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2sg
        tense: future
        question: true
        target: gelecek misin?
        gloss_de: Wirst du kommen?
        explanation: Wie im Präsens trägt die Partikel die Endung, gelecek misin.
      - { id: a2-u02-l3-e6, type: conjugation, mode: verb, lemma: yapmak, person: 2pl, tense: future, question: true, target: yapacak mısınız?, gloss_de: 'Werdet ihr machen? Werden Sie machen?' }
      - { id: a2-u02-l3-e7, type: conjugation, mode: verb, lemma: gitmek, person: 3sg, tense: future, question: true, target: gidecek mi?, gloss_de: 'Wird er, sie gehen?' }
      - id: a2-u02-l3-e8
        type: conjugation
        mode: verb
        lemma: kalmak
        person: 1sg
        tense: future
        question: true
        target: kalacak mıyım?
        gloss_de: Werde ich bleiben?
        explanation: In der Frage bleibt das k, denn die Endung hängt an der Partikel.
      - { id: a2-u02-l3-e9, type: conjugation, mode: verb, lemma: gezmek, person: 3pl, tense: future, question: true, target: gezecekler mi?, gloss_de: Werden sie sich umsehen? }
      - { id: a2-u02-l3-e10, type: conjugation, mode: verb, lemma: gelmek, person: 2sg, tense: future, negative: true, question: true, target: gelmeyecek misin?, gloss_de: Wirst du nicht kommen? }
      - id: a2-u02-l3-e11
        type: multiple_choice
        prompt: Welche Frage ist richtig? (Wirst du kommen?)
        options: [Gelecek misin?, Geleceksin mi?, Geleceğin mi?]
        answer: Gelecek misin?
      - id: a2-u02-l3-e12
        type: word_bank
        prompt: Wirst du morgen kommen? – Nein, ich werde nicht kommen.
        answers: ['Yarın gelecek misin? Hayır, gelmeyeceğim.']
        distractors: [gelmedim, mi]
      - id: a2-u02-l3-e13
        type: free_text
        direction: tr_de
        prompt: Bu yaz tatile gidecek misiniz?
        answers: [Werdet ihr diesen Sommer in den Urlaub fahren?, Fahren Sie diesen Sommer in den Urlaub?, Werden Sie diesen Sommer in den Urlaub fahren?, Fahrt ihr diesen Sommer in den Urlaub?, Fahrt ihr diesen Sommer in Urlaub?, Macht ihr diesen Sommer Urlaub?]
        explanation: bu yaz = diesen Sommer, tatile gitmek = in den Urlaub fahren.
      - id: a2-u02-l3-e14
        type: free_text
        direction: de_tr
        prompt: Ich werde nicht warten.
        answers: [Beklemeyeceğim., Ben beklemeyeceğim.]

