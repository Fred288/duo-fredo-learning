  - id: a2-u09-l2
    type: grammar
    title: Berufe mit -ci
    exercises:
      - id: a2-u09-l2-e1
        type: suffix_builder
        stem: kitap
        suffixes: [CI]
        target: kitapçı
        gloss_de: 'Buchhändler(in), Buchhandlung'
        explanation: -ci/-cı/-cu/-cü macht aus einer Sache den, der damit arbeitet. Nach einem stimmlosen Laut (p, ç, t, k, s, ş, f, h) wird c zu ç, kitapçı.
      - id: a2-u09-l2-e2
        type: suffix_builder
        stem: gazete
        suffixes: [CI]
        target: gazeteci
        gloss_de: 'Journalist(in)'
        explanation: Nach Vokal oder stimmhaftem Konsonant bleibt c, gazeteci.
      - { id: a2-u09-l2-e3, type: suffix_builder, stem: balık, suffixes: [CI], target: balıkçı, gloss_de: 'Fischer(in), Fischhändler(in)' }
      - { id: a2-u09-l2-e4, type: suffix_builder, stem: çiçek, suffixes: [CI], target: çiçekçi, gloss_de: 'Florist(in), Blumenladen' }
      - { id: a2-u09-l2-e5, type: suffix_builder, stem: süt, suffixes: [CI], target: sütçü, gloss_de: Milchmann }
      - { id: a2-u09-l2-e6, type: suffix_builder, stem: yol, suffixes: [CI], target: yolcu, gloss_de: 'Reisende(r), Fahrgast' }
      - { id: a2-u09-l2-e7, type: suffix_builder, stem: futbol, suffixes: [CI], target: futbolcu, gloss_de: 'Fußballspieler(in)' }
      - { id: a2-u09-l2-e8, type: suffix_builder, stem: iş, suffixes: [CI], target: işçi, gloss_de: 'Arbeiter(in)' }
      - { id: a2-u09-l2-e9, type: suffix_builder, stem: dondurma, suffixes: [CI], target: dondurmacı, gloss_de: Eisverkäufer }
      - id: a2-u09-l2-e10
        type: multiple_choice
        prompt: Welche Form ist richtig? (Bäcker für Sesamringe, simit)
        options: [simitçi, simitci, simitçı]
        answer: simitçi
        explanation: t ist stimmlos, also ç; i im Stamm, also i in der Endung.
      - id: a2-u09-l2-e11
        type: word_bank
        prompt: Mein Vater ist Fischer.
        answers: [Babam balıkçı.]
        distractors: [balık, balıkçılar]
      - id: a2-u09-l2-e12
        type: word_bank
        prompt: Wo ist die Buchhandlung?
        answers: [Kitapçı nerede?]
        distractors: [kitap, nereye]
      - id: a2-u09-l2-e13
        type: word_bank
        prompt: Die Fahrgäste warten auf den Bus.
        answers: [Yolcular otobüsü bekliyor., Yolcular otobüsü bekliyorlar.]
        distractors: [yollar, otobüse]
      - id: a2-u09-l2-e14
        type: multiple_choice
        prompt: Was heißt „dişçi“?
        options: [Zahnarzt, Zahnbürste, Zahnschmerz]
        answer: Zahnarzt
        explanation: dişçi ist umgangssprachlich, offiziell diş hekimi.
      - id: a2-u09-l2-e15
        type: suffix_builder
        stem: kitap
        suffixes: [CI, DAT]
        target: kitapçıya
        gloss_de: zur Buchhandlung
        explanation: Nach der Ableitung folgen Plural, Possessiv und Kasus wie bei jedem Nomen.

  - id: a2-u09-l3
    type: grammar
    title: mit und ohne (-li, -siz)
    exercises:
      - id: a2-u09-l3-e1
        type: suffix_builder
        stem: şeker
        suffixes: [LI]
        target: şekerli
        gloss_de: mit Zucker
        explanation: -li/-lı/-lu/-lü = mit, -siz/-sız/-suz/-süz = ohne.
      - { id: a2-u09-l3-e2, type: suffix_builder, stem: şeker, suffixes: [SIZ], target: şekersiz, gloss_de: ohne Zucker }
      - { id: a2-u09-l3-e3, type: suffix_builder, stem: süt, suffixes: [LI], target: sütlü, gloss_de: mit Milch }
      - { id: a2-u09-l3-e4, type: suffix_builder, stem: süt, suffixes: [SIZ], target: sütsüz, gloss_de: ohne Milch }
      - { id: a2-u09-l3-e5, type: suffix_builder, stem: çocuk, suffixes: [LI], target: çocuklu, gloss_de: mit Kindern }
      - { id: a2-u09-l3-e6, type: suffix_builder, stem: bahçe, suffixes: [LI], target: bahçeli, gloss_de: mit Garten }
      - id: a2-u09-l3-e7
        type: suffix_builder
        stem: iş
        suffixes: [SIZ]
        target: işsiz
        gloss_de: arbeitslos
      - id: a2-u09-l3-e8
        type: suffix_builder
        stem: Ankara
        suffixes: [LI]
        target: Ankaralı
        gloss_de: aus Ankara
        explanation: Herkunft mit -li, ohne Apostroph, denn es entsteht ein neues Wort, Ankaralı, İstanbullu, Berlinli.
      - id: a2-u09-l3-e9
        type: conjugation
        mode: copula
        lemma: İstanbullu
        person: 1sg
        target: İstanbulluyum
        gloss_de: ich bin aus Istanbul
      - id: a2-u09-l3-e10
        type: word_bank
        prompt: Einen Tee ohne Zucker, bitte.
        answers: [Şekersiz bir çay lütfen., 'Bir şekersiz çay, lütfen.', 'Bir çay, şekersiz lütfen.']
        distractors: [şekerli, şeker]
      - id: a2-u09-l3-e11
        type: word_bank
        prompt: Wir suchen eine Wohnung mit Balkon.
        answers: [Balkonlu bir daire arıyoruz., Balkonlu bir ev arıyoruz.]
        distractors: [balkonsuz, balkonda]
      - id: a2-u09-l3-e12
        type: conjugation
        mode: copula
        lemma: evli
        person: 2sg
        question: true
        target: evli misin
        gloss_de: bist du verheiratet?
      - id: a2-u09-l3-e13
        type: word_bank
        prompt: Ja, ich bin verheiratet und habe zwei Kinder.
        answers: ['Evet, evliyim ve iki çocuğum var.']
        distractors: [bekârım, çocuklar]
      - id: a2-u09-l3-e14
        type: multiple_choice
        prompt: Was heißt „Giriş ücretsiz.“?
        options: [Der Eintritt ist frei., Der Eingang ist geschlossen., Der Eintritt kostet etwas.]
        answer: Der Eintritt ist frei.
        explanation: giriş = Eingang, Eintritt.
      - id: a2-u09-l3-e15
        type: multiple_choice
        prompt: Was heißt „renkli“?
        options: [bunt, farblos, schwarz-weiß]
        answer: bunt
        explanation: renk erweicht vor Vokal (rengi), vor -li nicht, renkli.

  - id: a2-u09-l4
