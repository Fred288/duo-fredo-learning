      - { id: a2-u09-l4-e3, type: suffix_builder, stem: kitap, suffixes: [LIK], target: kitaplık, gloss_de: Bücherregal }
      - { id: a2-u09-l4-e4, type: suffix_builder, stem: güzel, suffixes: [LIK], target: güzellik, gloss_de: Schönheit }
      - { id: a2-u09-l4-e5, type: suffix_builder, stem: arkadaş, suffixes: [LIK], target: arkadaşlık, gloss_de: Freundschaft }
      - { id: a2-u09-l4-e6, type: suffix_builder, stem: çocuk, suffixes: [LIK], target: çocukluk, gloss_de: Kindheit }
      - id: a2-u09-l4-e7
        type: suffix_builder
        stem: göz
        suffixes: [LIK, POSS_1SG]
        target: gözlüğüm
        gloss_de: meine Brille
        explanation: -lik erweicht vor Vokal, gözlüğüm, gözlüğü.
      - { id: a2-u09-l4-e8, type: suffix_builder, stem: hafta, suffixes: [LIK], target: haftalık, gloss_de: 'wöchentlich, für eine Woche' }
      - id: a2-u09-l4-e9
        type: word_bank
        prompt: Ich möchte ein Doppelzimmer.
        answers: [İki kişilik bir oda istiyorum., İki kişilik oda istiyorum.]
        distractors: [kişi, tek]
        explanation: iki kişilik = für zwei Personen.
      - id: a2-u09-l4-e10
        type: word_bank
        prompt: Wo ist meine Brille?
        answers: [Gözlüğüm nerede?]
        distractors: [gözlük, gözüm]
      - id: a2-u09-l4-e11
        type: multiple_choice
        prompt: Was heißt „temizlikçi“?
        options: [Reinigungskraft, sauber, Sauberkeit]
        answer: Reinigungskraft
        explanation: temiz (sauber) + lik (Sauberkeit) + çi (wer damit arbeitet). Ableitungen lassen sich stapeln.
      - id: a2-u09-l4-e12
        type: multiple_choice
        prompt: Was heißt „Sağlık her şeyden önemli.“?
        options: [Gesundheit ist wichtiger als alles andere., Gesundheit ist nicht wichtig., Alles ist gesund.]
        answer: Gesundheit ist wichtiger als alles andere.
        explanation: sağ (gesund, lebendig) + lık = sağlık. her şeyden = als alles (Ablativ beim Vergleich).
      - id: a2-u09-l4-e13
        type: free_text
        direction: tr_de
        prompt: günlük
        answers: [täglich, Tagebuch, für einen Tag, Tages-, eintägig]

  - id: a2-u09-l5
    type: grammar
    title: der auf dem Tisch (-ki)
    exercises:
      - id: a2-u09-l5-e1
        type: suffix_builder
        stem: masa
        suffixes: [LOC, KI]
        target: masadaki
        gloss_de: der/die/das auf dem Tisch
        explanation: Lokativ + ki macht aus einer Ortsangabe ein Adjektiv, masadaki kitap = das Buch auf dem Tisch.
      - { id: a2-u09-l5-e2, type: suffix_builder, stem: dolap, suffixes: [LOC, KI], target: dolaptaki, gloss_de: der/die/das im Schrank }
      - { id: a2-u09-l5-e3, type: suffix_builder, stem: İstanbul, suffixes: [LOC, KI], target: "İstanbul'daki", gloss_de: der/die/das in Istanbul }
      - id: a2-u09-l5-e4
        type: suffix_builder
        stem: bugün
        suffixes: [KI]
        target: bugünkü
        gloss_de: heutig
        explanation: Nach Zeitwörtern steht ki direkt, yarınki, akşamki. Nur bugünkü, dünkü und öbürkü haben ü.
      - { id: a2-u09-l5-e5, type: suffix_builder, stem: dün, suffixes: [KI], target: dünkü, gloss_de: gestrig }
      - { id: a2-u09-l5-e6, type: suffix_builder, stem: yarın, suffixes: [KI], target: yarınki, gloss_de: morgig }
      - id: a2-u09-l5-e7
        type: word_bank
        prompt: Das Buch auf dem Tisch gehört mir.
        answers: [Masadaki kitap benim.]
        distractors: [masada, seninki]
      - id: a2-u09-l5-e8
        type: word_bank
        prompt: Die heutige Besprechung ist um drei Uhr.
        answers: [Bugünkü toplantı saat üçte.]
        distractors: [dünkü, üçe]
      - id: a2-u09-l5-e9
        type: word_bank
        prompt: Hast du die gestrige Zeitung gelesen?
        answers: [Dünkü gazeteyi okudun mu?]
        distractors: [dün, gazete]
      - id: a2-u09-l5-e10
        type: word_bank
        prompt: Mein Freund in Istanbul ruft mich oft an.
        answers: [İstanbul'daki arkadaşım beni sık sık arıyor., İstanbul'daki arkadaşım sık sık beni arıyor.]
        distractors: ["İstanbul'da", bana]
      - id: a2-u09-l5-e11
        type: word_bank
        prompt: Meine Tasche ist schwarz, deine ist rot.
        answers: ['Benim çantam siyah, seninki kırmızı.', 'Çantam siyah, seninki kırmızı.']
        distractors: [senin, benimki]
        explanation: benimki (meins), seninki (deins), onunki (seins/ihrs) – Genitiv + ki.
      - id: a2-u09-l5-e12
        type: suffix_builder
        stem: Ali
        suffixes: [GEN, KI]
        target: "Ali'ninki"
        gloss_de: der/die/das von Ali
      - id: a2-u09-l5-e13
        type: suffix_builder
        stem: oda
        suffixes: [LOC, KI, PL]
        target: odadakiler
        gloss_de: die im Zimmer
        explanation: Nach -ki können Plural und Kasus folgen, odadakiler, odadakileri.
      - id: a2-u09-l5-e14
        type: multiple_choice
        prompt: Welche Form ist richtig? (heutig)
        options: [bugünkü, bugünki, bugünkı]
        answer: bugünkü
      - id: a2-u09-l5-e15
        type: multiple_choice
        prompt: Welche Form ist richtig? (der/die/das im Haus)
        options: [evdeki, evdekı, evteki]
        answer: evdeki
        explanation: -ki bleibt fast immer ki, auch nach a, ı, o, u, masadaki, okuldaki.

  - id: a2-u09-l6
    type: grammar
    title: 'Tabellen: Ableitungen'
    exercises:
      - id: a2-u09-l6-e1
        type: paradigm
        kind: noun
        lemma: süt
        rows: [[LI], [SIZ], [CI]]
        targets: [sütlü, sütsüz, sütçü]
        gloss_de: 'Milch: mit, ohne, Milchmann'
        explanation: Alle drei folgen der vierfachen Harmonie, ü nach ü.
      - { id: a2-u09-l6-e2, type: paradigm, kind: noun, lemma: tuz, rows: [[LI], [SIZ], [LIK]], targets: [tuzlu, tuzsuz, tuzluk], gloss_de: 'Salz: salzig, ungesalzen, Salzstreuer' }
      - { id: a2-u09-l6-e3, type: paradigm, kind: noun, lemma: şeker, rows: [[LI], [SIZ], [LIK]], targets: [şekerli, şekersiz, şekerlik], gloss_de: 'Zucker: mit, ohne, Zuckerdose' }
      - id: a2-u09-l6-e4
        type: paradigm
        kind: noun
        lemma: kitap
        rows: [[CI], [LIK], [CI, LIK]]
        targets: [kitapçı, kitaplık, kitapçılık]
        gloss_de: 'Buch: Buchhändler, Bücherregal, Buchhandel'
        explanation: kitap erweicht nicht vor Konsonant, kitapçı, kitaplık.
      - id: a2-u09-l6-e5
        type: paradigm
        kind: noun
        lemma: göz
        rows: [[LIK], [LIK, POSS_1SG], [LIK, CI]]
        targets: [gözlük, gözlüğüm, gözlükçü]
        gloss_de: 'Brille, meine Brille, Optiker'
      - id: a2-u09-l6-e6
        type: paradigm
        kind: noun
        lemma: ev
        rows: [[LOC, KI], [LOC, KI, PL], [LOC, KI, ACC]]
        targets: [evdeki, evdekiler, evdekini]
        gloss_de: 'der/die/das im Haus, die Leute im Haus, den/die/das im Haus'
        explanation: Nach -ki steht wie nach dem Possessiv ein n vor dem Akkusativ, evdekini.
      - id: a2-u09-l6-e7
        type: paradigm
        kind: noun
        lemma: Berlin
        rows: [[LI], [LI, PL], [LOC, KI]]
        targets: [Berlinli, Berlinliler, "Berlin'deki"]
        gloss_de: 'Berliner, Berliner (Pl.), der/die in Berlin'
        explanation: Ableitung ohne Apostroph (Berlinli), Kasus mit Apostroph (Berlin'deki).
      - id: a2-u09-l6-e8
        type: paradigm
        kind: copula
        lemma: evli
        persons: [1sg, 2sg, 3sg, 1pl, 2pl]
        targets: [evliyim, evlisin, evli, evliyiz, evlisiniz]
        gloss_de: verheiratet sein

  - id: a2-u09-l7
    type: dialog
    title: Im Geschäft
    exercises:
      - id: a2-u09-l7-e1
        type: word_bank
        prompt: Haben Sie dieses Hemd eine Nummer größer?
        answers: [Bu gömleğin bir büyük bedeni var mı?, Bu gömleğin daha büyük bedeni var mı?]
        distractors: [gömlek, numara]
        explanation: gömlek erweicht, gömleğin. beden = Kleidergröße.
      - id: a2-u09-l7-e2
        type: word_bank
        prompt: Wie viel kostet das?
        answers: [Bu ne kadar?, Bunun fiyatı ne kadar?, Fiyatı ne kadar?, Ne kadar?]
        distractors: [kaç, fiyat]
      - id: a2-u09-l7-e3
        type: word_bank
        prompt: Ist das reduziert?
        answers: [Bu indirimli mi?, İndirimli mi?]
        distractors: [indirim, mı]
      - id: a2-u09-l7-e4
        type: word_bank
        prompt: Zahlen Sie bar oder mit Karte?
        answers: [Nakit mi kartla mı?, 'Nakit mi, kartla mı?', 'Nakit mi ödeyeceksiniz, kartla mı?', Nakit mi kartla mı ödeyeceksiniz?]
        distractors: [karta, kartı]
      - id: a2-u09-l7-e5
        type: word_bank
        prompt: Kann ich mit Kreditkarte bezahlen?
        answers: [Kredi kartıyla ödeyebilir miyim?, Kredi kartı ile ödeyebilir miyim?]
        distractors: [kartı, ödüyorum]
        explanation: kredi kartı + yla = kredi kartıyla.
      - id: a2-u09-l7-e6
        type: word_bank
        prompt: Möchten Sie eine Tüte?
        answers: [Poşet ister misiniz?, Poşet istiyor musunuz?]
        distractors: [poşetler, istiyorum]
      - id: a2-u09-l7-e7
        type: word_bank
        prompt: Nein danke, ich habe meine eigene Tasche.
        answers: ['Hayır teşekkürler, kendi çantam var.', 'Hayır, teşekkürler, kendi çantam var.']
        distractors: [çanta, yok]
        explanation: kendi çantam = meine eigene Tasche, mehr zu kendi in A2-10.
      - id: a2-u09-l7-e8
