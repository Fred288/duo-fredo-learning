lessons:
  - id: a2-u05-l1
    type: vocab
    title: Der Körper
    exercises:
      - id: a2-u05-l1-e1
        type: multiple_choice
        prompt: Was heißt „baş“?
        options: [Kopf, Hals, Bauch]
        answer: Kopf
      - id: a2-u05-l1-e2
        type: free_text
        direction: de_tr
        prompt: Hals (innen), Rachen
        answers: [boğaz]
      - id: a2-u05-l1-e3
        type: multiple_choice
        prompt: Was heißt „karın“?
        options: [Bauch, Rücken, Brust]
        answer: Bauch
        explanation: Vor einer vokalischen Endung fällt das ı weg, karnım (mein Bauch).
      - id: a2-u05-l1-e4
        type: free_text
        direction: de_tr
        prompt: Zahn
        answers: [diş]
      - id: a2-u05-l1-e5
        type: multiple_choice
        prompt: Was heißt „kol“?
        options: [Arm, Bein, Hand]
        answer: Arm
      - id: a2-u05-l1-e6
        type: free_text
        direction: de_tr
        prompt: Bein
        answers: [bacak]
      - id: a2-u05-l1-e7
        type: multiple_choice
        prompt: Was heißt „ayak“?
        options: [Fuß, Knie, Finger]
        answer: Fuß
      - id: a2-u05-l1-e8
        type: free_text
        direction: tr_de
        prompt: el
        answers: [Hand, die Hand]
      - id: a2-u05-l1-e9
        type: multiple_choice
        prompt: Was heißt „mide“?
        options: [Magen, Herz, Lunge]
        answer: Magen
      - id: a2-u05-l1-e10
        type: free_text
        direction: de_tr
        prompt: Medikament, Arznei
        answers: [ilaç]
      - id: a2-u05-l1-e11
        type: multiple_choice
        prompt: Was heißt „ateş“?
        options: [Fieber, Husten, Schnupfen]
        answer: Fieber
        explanation: ateş heißt auch Feuer.
      - id: a2-u05-l1-e12
        type: free_text
        direction: tr_de
        prompt: öksürük
        answers: [Husten, der Husten]
      - id: a2-u05-l1-e13
        type: multiple_choice
        prompt: Was heißt „ağrı“?
        options: [Schmerz, Wunde, Krankheit]
        answer: Schmerz
        explanation: ağrımak = schmerzen, wehtun.
      - id: a2-u05-l1-e14
        type: multiple_choice
        prompt: Was heißt „reçete“?
        options: [Rezept (vom Arzt), Rechnung, Termin]
        answer: Rezept (vom Arzt)
      - id: a2-u05-l1-e15
        type: multiple_choice
        prompt: Was sagt man zu jemandem, der krank ist?
        options: [Geçmiş olsun!, Afiyet olsun!, İyi yolculuklar!]
        answer: Geçmiş olsun!
        explanation: Wörtlich „Möge es vorbei sein“, also „Gute Besserung“.
      - id: a2-u05-l1-e16
        type: free_text
        direction: de_tr
        prompt: sich hinlegen, im Bett liegen
        answers: [yatmak]

  - id: a2-u05-l2
    type: grammar
    title: Mir tut … weh
    exercises:
      - id: a2-u05-l2-e1
        type: suffix_builder
        stem: baş
        suffixes: [POSS_1SG]
        target: başım
        gloss_de: mein Kopf
      - id: a2-u05-l2-e2
        type: word_bank
        prompt: Ich habe Kopfschmerzen.
        answers: [Başım ağrıyor.]
        distractors: [ağrı, baş]
        explanation: Wörtlich „Mein Kopf schmerzt“, Körperteil mit „mein“ + ağrıyor.
      - id: a2-u05-l2-e3
        type: suffix_builder
        stem: karın
        suffixes: [POSS_1SG]
        target: karnım
        gloss_de: mein Bauch
        explanation: karın verliert das ı vor einer vokalischen Endung.
      - { id: a2-u05-l2-e4, type: suffix_builder, stem: boğaz, suffixes: [POSS_1SG], target: boğazım, gloss_de: mein Hals }
      - id: a2-u05-l2-e5
        type: suffix_builder
        stem: ayak
        suffixes: [POSS_1SG]
        target: ayağım
        gloss_de: mein Fuß
        explanation: k wird vor Vokal zu ğ.
      - { id: a2-u05-l2-e6, type: suffix_builder, stem: diş, suffixes: [POSS_1SG], target: dişim, gloss_de: mein Zahn }
      - { id: a2-u05-l2-e7, type: suffix_builder, stem: bacak, suffixes: [POSS_1SG], target: bacağım, gloss_de: mein Bein }
      - id: a2-u05-l2-e8
        type: word_bank
        prompt: Ich habe Bauchschmerzen.
        answers: [Karnım ağrıyor.]
        distractors: [karınım, ağrım]
      - id: a2-u05-l2-e9
        type: word_bank
        prompt: Ich habe Fieber.
        answers: [Ateşim var.]
        distractors: [ateş, yok]
        explanation: Wie „haben“ aus A1, mein Fieber ist vorhanden.
      - id: a2-u05-l2-e10
        type: word_bank
        prompt: Ich habe Husten.
        answers: [Öksürüğüm var.]
        distractors: [öksürük, ağrıyor]
        explanation: öksürük + üm, k wird zu ğ.
      - id: a2-u05-l2-e11
        type: word_bank
        prompt: Was fehlt Ihnen? (Was haben Sie?)
        answers: [Neyiniz var?]
        distractors: [nerede, yok]
        explanation: "ne + y + iniz + var, wörtlich „Ihr Was ist vorhanden?“. Ebenso üblich: Şikâyetiniz nedir? (Was sind Ihre Beschwerden?)"
      - id: a2-u05-l2-e12
        type: free_text
        direction: tr_de
        prompt: Dişim ağrıyor.
        answers: [Ich habe Zahnschmerzen., Mein Zahn tut weh., Mir tut der Zahn weh., Ich habe Zahnweh., Mir tut ein Zahn weh.]
      - id: a2-u05-l2-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (mein Bauch)
        options: [karnım, karınım, karnüm]
        answer: karnım
      - id: a2-u05-l2-e14
        type: word_bank
        prompt: Ich habe (die) Grippe.
        answers: [Gribim., Grip oldum.]
        distractors: [ateş, yok]
        explanation: Gribim = ich bin vergrippt (wie hastayım), grip olmak = Grippe bekommen. Erkältung heißt nezle.
      - id: a2-u05-l2-e15
        type: word_bank
        prompt: Ich bin krank, heute kann ich nicht kommen.
        answers: ['Hastayım, bugün gelemem.']
        distractors: [hasta, gelmem]

  - id: a2-u05-l3
    type: grammar
    title: können -ebil
    exercises:
      - id: a2-u05-l3-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: aorist
        ability: true
        target: gelebilirim
        gloss_de: ich kann kommen
        explanation: Stamm + ebil + ir + im. Der Aorist von bil ist -ir.
      - id: a2-u05-l3-e2
        type: conjugation
        mode: verb
        lemma: yapmak
        person: 2sg
        tense: aorist
        ability: true
        target: yapabilirsin
        gloss_de: du kannst machen
        explanation: Zweifache Harmonie, nach a → abil.
      - id: a2-u05-l3-e3
        type: conjugation
        mode: verb
        lemma: okumak
        person: 3sg
        tense: aorist
        ability: true
        target: okuyabilir
        gloss_de: 'er, sie kann lesen'
        explanation: Nach Vokal steht ein y.
      - { id: a2-u05-l3-e4, type: conjugation, mode: verb, lemma: yüzmek, person: 1pl, tense: aorist, ability: true, target: yüzebiliriz, gloss_de: wir können schwimmen }
      - id: a2-u05-l3-e5
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 1sg
        tense: aorist
        ability: true
        target: gidebilirim
        gloss_de: ich kann gehen
        explanation: git → gid vor dem Vokal von -ebil.
      - { id: a2-u05-l3-e6, type: conjugation, mode: verb, lemma: konuşmak, person: 3pl, tense: aorist, ability: true, target: konuşabilirler, gloss_de: sie können sprechen }
      - id: a2-u05-l3-e7
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 2pl
        tense: aorist
        ability: true
        question: true
        target: gelebilir misiniz?
        gloss_de: Können Sie kommen?
        explanation: Höfliche Bitte, gelebilir misiniz.
      - id: a2-u05-l3-e8
        type: conjugation
        mode: verb
        lemma: yardım etmek
        person: 2sg
        tense: aorist
        ability: true
        question: true
        target: yardım edebilir misin?
        gloss_de: Kannst du helfen?
      - id: a2-u05-l3-e9
        type: conjugation
        mode: verb
        lemma: yemek
        person: 1sg
        tense: aorist
        ability: true
        target: yiyebilirim
        gloss_de: ich kann essen
        explanation: ye → yi vor -yebil, wie im Futur.
      - id: a2-u05-l3-e10
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: past
        ability: true
        target: gelebildim
        gloss_de: ich konnte kommen
        explanation: -ebil lässt sich mit jeder Zeit kombinieren, gelebildim = ich konnte kommen.
      - { id: a2-u05-l3-e11, type: conjugation, mode: verb, lemma: yürümek, person: 1sg, tense: present, ability: true, target: yürüyebiliyorum, gloss_de: ich kann (jetzt wieder) gehen }
      - id: a2-u05-l3-e12
        type: word_bank
        prompt: Kann ich hier rauchen?
        answers: [Burada sigara içebilir miyim?]
        chunks:
          - { text: "Burada", role: place }
          - { text: "sigara", role: object_bare }
          - { text: "içebilir miyim", role: predicate }
        distractors: [içer, misin]
        explanation: sigara içmek = rauchen.
      - id: a2-u05-l3-e13
        type: free_text
        direction: tr_de
        prompt: Türkçe konuşabilir misiniz?
        answers: [Können Sie Türkisch sprechen?, Sprechen Sie Türkisch?, Könnt ihr Türkisch sprechen?]
      - id: a2-u05-l3-e14
        type: multiple_choice
        prompt: Welche Form ist richtig? (er kann lesen)
        options: [okuyabilir, okuabilir, okuyebilir]
        answer: okuyabilir

