  - id: a2-u05-l7
    type: dialog
    title: Beim Arzt und in der Apotheke
    exercises:
      - id: a2-u05-l7-e1
        type: word_bank
        prompt: Ich möchte einen Termin beim Arzt.
        answers: [Doktordan randevu almak istiyorum.]
        distractors: [doktorda, alıyorum]
        explanation: randevu almak = einen Termin bekommen, doktordan = vom Arzt.
      - id: a2-u05-l7-e2
        type: word_bank
        prompt: Seit drei Tagen habe ich Fieber.
        answers: [Üç gündür ateşim var.]
        chunks:
          - { text: "Üç gündür", role: time }
          - { text: "ateşim", role: subject }
          - { text: "var", role: predicate }
        distractors: [önce, yok]
        explanation: üç gündür = seit drei Tagen (-dir an der Zeitangabe).
      - id: a2-u05-l7-e3
        type: word_bank
        prompt: Ich brauche ein Medikament.
        answers: [Bir ilaç lazım., Bana bir ilaç lazım., Bana ilaç lazım., İlaç lazım.]
        distractors: [ilacı, yok]
        explanation: lazım = nötig, gebraucht. Bana … lazım = ich brauche …
