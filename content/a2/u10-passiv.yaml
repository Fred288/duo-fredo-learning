lessons:
  - id: a2-u10-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: a2-u10-l1-e1
        type: multiple_choice
        prompt: Was heißt „mektup“?
        options: [Brief, Paket, Briefmarke]
        answer: Brief
        explanation: mektup (Brief), paket (Paket), pul (Briefmarke), zarf (Umschlag).
      - id: a2-u10-l1-e2
        type: free_text
        direction: de_tr
        prompt: Paket
        answers: [paket, koli]
      - id: a2-u10-l1-e3
        type: multiple_choice
        prompt: Was heißt „göndermek“?
        options: [schicken, bekommen, abholen]
        answer: schicken
      - id: a2-u10-l1-e4
        type: free_text
        direction: de_tr
        prompt: schreiben
        answers: [yazmak]
      - id: a2-u10-l1-e5
        type: multiple_choice
        prompt: Was heißt „pul“?
        options: [Briefmarke, Umschlag, Adresse]
        answer: Briefmarke
      - id: a2-u10-l1-e6
        type: free_text
        direction: de_tr
        prompt: Adresse
        answers: [adres]
      - id: a2-u10-l1-e7
        type: multiple_choice
        prompt: Was heißt „mesaj“?
        options: ['Nachricht (SMS, Chat)', Anruf, Antwort]
        answer: 'Nachricht (SMS, Chat)'
        explanation: mesaj (Textnachricht), haber (Neuigkeit, Nachrichten im Fernsehen), cevap (Antwort).
      - id: a2-u10-l1-e8
        type: free_text
        direction: de_tr
        prompt: Antwort
        answers: [cevap, yanıt]
      - id: a2-u10-l1-e9
        type: multiple_choice
        prompt: Was heißt „doldurmak“?
        options: [ausfüllen, unterschreiben, abgeben]
        answer: ausfüllen
        explanation: formu doldurmak (das Formular ausfüllen), imzalamak (unterschreiben).
      - id: a2-u10-l1-e10
        type: multiple_choice
        prompt: Was heißt „imzalamak“?
        options: [unterschreiben, stempeln, ausfüllen]
        answer: unterschreiben
      - id: a2-u10-l1-e11
        type: multiple_choice
        prompt: Was heißt „kimlik“?
        options: [Ausweis, Formular, Quittung]
        answer: Ausweis
      - id: a2-u10-l1-e12
        type: multiple_choice
        prompt: Was heißt „teslim etmek“?
        options: [zustellen, abholen, einpacken]
        answer: zustellen
        explanation: teslim etmek = übergeben, zustellen, abgeben.
      - id: a2-u10-l1-e13
        type: multiple_choice
        prompt: Was heißt „meşgul“?
        options: [besetzt, frei, ausgeschaltet]
        answer: besetzt
        explanation: Hat meşgul. = Die Leitung ist besetzt. meşgul heißt auch beschäftigt.
      - id: a2-u10-l1-e14
        type: free_text
        direction: de_tr
        prompt: benutzen
        answers: [kullanmak]
      - id: a2-u10-l1-e15
        type: multiple_choice
        prompt: Was heißt „kendi“?
        options: [selbst, andere, jeder]
        answer: selbst
        explanation: kendi = selbst, eigen; kendim (ich selbst), kendi evim (mein eigenes Haus).
      - id: a2-u10-l1-e16
        type: multiple_choice
        prompt: Was heißt „giyinmek“?
        options: [sich anziehen, sich waschen, sich beeilen]
        answer: sich anziehen
        explanation: giymek (etwas anziehen), giyinmek (sich anziehen).
      - id: a2-u10-l1-e17
        type: free_text
        direction: de_tr
        prompt: sich waschen
        answers: [yıkanmak]
      - id: a2-u10-l1-e18
        type: multiple_choice
        prompt: Was heißt „Çok sevindim!“?
        options: [Das freut mich sehr!, Ich bin sehr verliebt!, Ich habe es sehr gemocht!]
        answer: Das freut mich sehr!
        explanation: sevinmek = sich freuen, von sevmek (lieben) mit -in.

  - id: a2-u10-l2
    type: grammar
    title: wurde geschickt (Passiv)
    exercises:
      - id: a2-u10-l2-e1
        type: conjugation
        mode: verb
        lemma: göndermek
        person: 3sg
        tense: past
        passive: true
        target: gönderildi
        gloss_de: wurde geschickt
        explanation: Passiv = Stamm + il (vierfache Harmonie), dann die Zeit, gönder-il-di.
      - { id: a2-u10-l2-e2, type: conjugation, mode: verb, lemma: yazmak, person: 3sg, tense: past, passive: true, target: yazıldı, gloss_de: wurde geschrieben }
      - { id: a2-u10-l2-e3, type: conjugation, mode: verb, lemma: satmak, person: 3sg, tense: past, passive: true, target: satıldı, gloss_de: wurde verkauft }
      - id: a2-u10-l2-e4
        type: conjugation
        mode: verb
        lemma: bulmak
        person: 3sg
        tense: past
        passive: true
        target: bulundu
        gloss_de: wurde gefunden
      - id: a2-u10-l2-e5
        type: conjugation
        mode: verb
        lemma: ödemek
        person: 3sg
        tense: past
        passive: true
        target: ödendi
        gloss_de: wurde bezahlt
        explanation: Nach Vokal nur n, öde-n-di.
      - { id: a2-u10-l2-e6, type: conjugation, mode: verb, lemma: söylemek, person: 3sg, tense: past, passive: true, target: söylendi, gloss_de: wurde gesagt }
      - id: a2-u10-l2-e7
        type: conjugation
        mode: verb
        lemma: çalmak
        person: 3sg
        tense: past
        passive: true
        target: çalındı
        gloss_de: wurde gestohlen
        explanation: Nach l steht ın statt ıl, çal-ın-dı; ebenso bil-in-ir.
      - id: a2-u10-l2-e8
        type: conjugation
        mode: verb
        lemma: teslim etmek
        person: 3sg
        tense: future
        passive: true
        target: teslim edilecek
        gloss_de: wird zugestellt werden
        explanation: et → ed vor dem Vokal, edilecek.
      - id: a2-u10-l2-e9
        type: conjugation
        mode: verb
        lemma: beklemek
        person: 3sg
        tense: present
        passive: true
        target: bekleniyor
        gloss_de: 'wird erwartet'
      - id: a2-u10-l2-e10
        type: word_bank
        prompt: Der Brief wurde gestern geschickt.
        answers: [Mektup dün gönderildi., Dün mektup gönderildi.]
        chunks:
          - { text: "Mektup", role: subject }
          - { text: "dün", role: time }
          - { text: "gönderildi", role: predicate }
        orders:
          - { order: [1, 0, 2], note: "Auch üblich: die Zeit am Satzanfang." }
        distractors: [gönderdi, mektubu]
        explanation: Im Passiv steht das Objekt ohne Akkusativ, es ist jetzt Subjekt.
      - id: a2-u10-l2-e11
        type: word_bank
        prompt: Mein Handy wurde gestohlen!
        answers: [Telefonum çalındı!, Cep telefonum çalındı!]
        distractors: [çaldı, telefonumu]
        explanation: Telefonum çaldı. heißt dagegen „Mein Telefon hat geklingelt“.
      - id: a2-u10-l2-e12
        type: word_bank
        prompt: Das Paket wird morgen zugestellt.
        answers: [Paket yarın teslim edilecek., Yarın paket teslim edilecek.]
        chunks:
          - { text: "Paket", role: subject }
          - { text: "yarın", role: time }
          - { text: "teslim edilecek", role: predicate }
        orders:
          - { order: [1, 0, 2], note: "Auch üblich: die Zeit am Satzanfang." }
        distractors: [paketi, etti]
      - id: a2-u10-l2-e13
        type: word_bank
        prompt: Der Brief wurde von Ali geschrieben.
        answers: [Mektup Ali tarafından yazıldı.]
        chunks:
          - { text: "Mektup", role: subject }
          - { text: "Ali tarafından", role: complement }
          - { text: "yazıldı", role: predicate }
        distractors: [yazdı, "Ali'ye"]
        explanation: tarafından = von (beim Passiv). Meist lässt man es weg.
      - id: a2-u10-l2-e14
        type: word_bank
        prompt: Die Besprechung wurde abgesagt.
        answers: [Toplantı iptal edildi.]
        distractors: [etti, toplantıyı]
        explanation: iptal etmek = absagen.
      - id: a2-u10-l2-e15
        type: multiple_choice
        prompt: Was heißt „Bu ev satıldı.“?
        options: [Dieses Haus wurde verkauft., Dieses Haus wird verkauft., Er hat dieses Haus verkauft.]
        answer: Dieses Haus wurde verkauft.
        explanation: Zu verkaufen = satılık (Schild am Haus).

  - id: a2-u10-l3
    type: grammar
    title: Wie schreibt man das? (man)
    exercises:
      - id: a2-u10-l3-e1
        type: conjugation
        mode: verb
        lemma: yazmak
        person: 3sg
        tense: aorist
        passive: true
        question: true
        target: yazılır mı
        gloss_de: schreibt man es?
        explanation: Passiv im Aorist ersetzt das deutsche „man“, im Passiv immer -ır/-ir/-ur/-ür.
      - id: a2-u10-l3-e2
        type: word_bank
        prompt: Wie schreibt man dieses Wort?
        answers: [Bu kelime nasıl yazılır?]
        distractors: [yazıyor, kelimeyi]
      - id: a2-u10-l3-e3
        type: word_bank
        prompt: Wie sagt man das auf Türkisch?
        answers: [Bu Türkçede nasıl söylenir?, Türkçede bu nasıl söylenir?, Bunu Türkçe nasıl söylerim?, Bu Türkçe nasıl söylenir?, Bunu Türkçede nasıl söylerim?]
        distractors: [Türkçeyi, söyledi]
        explanation: Sprachnamen ohne Apostroph, Türkçede, Almancada.
      - { id: a2-u10-l3-e4, type: conjugation, mode: verb, lemma: söylemek, person: 3sg, tense: aorist, passive: true, target: söylenir, gloss_de: man sagt }
      - id: a2-u10-l3-e5
        type: conjugation
        mode: verb
        lemma: içmek
        person: 3sg
        tense: aorist
        passive: true
        negative: true
        target: içilmez
        gloss_de: man trinkt (raucht) nicht
        explanation: Verneint -mez/-maz, Burada sigara içilmez. = Hier wird nicht geraucht.
      - id: a2-u10-l3-e6
        type: word_bank
        prompt: Hier wird nicht geraucht.
        answers: [Burada sigara içilmez.]
        distractors: [içmez, sigarayı]
      - id: a2-u10-l3-e7
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 3sg
        tense: aorist
        passive: true
        target: gidilir
        gloss_de: man geht, man kommt (dorthin)
        explanation: Auch Verben ohne Objekt bilden ein Passiv, Oraya nasıl gidilir? = Wie kommt man dorthin?
      - id: a2-u10-l3-e8
        type: word_bank
        prompt: Wie kommt man von hier zum Museum?
        answers: [Buradan müzeye nasıl gidilir?, Müzeye buradan nasıl gidilir?]
        chunks:
          - { text: "Buradan", role: place }
          - { text: "müzeye", role: place }
          - { text: "nasıl", role: question }
          - { text: "gidilir", role: predicate }
        orders:
          - { order: [1, 0, 2, 3], note: "Auch üblich: das Ziel zuerst." }
        distractors: [gider, müzede]
      - id: a2-u10-l3-e9
        type: word_bank
        prompt: Hier wird Deutsch gesprochen.
        answers: [Burada Almanca konuşulur., Burada Almanca konuşuluyor.]
        distractors: [konuşur, Almancayı]
      - id: a2-u10-l3-e10
        type: conjugation
        mode: verb
        lemma: açmak
        person: 3sg
        tense: aorist
        passive: true
        target: açılır
        gloss_de: wird geöffnet
      - id: a2-u10-l3-e11
        type: word_bank
        prompt: Die Post öffnet um neun Uhr.
        answers: [Postane saat dokuzda açılır., Postane dokuzda açılır., Postane saat dokuzda açılıyor., Postane dokuzda açılıyor.]
        chunks:
          - { text: "Postane", role: subject }
          - { text: "saat dokuzda", role: time }
          - { text: "açılır", role: predicate }
        distractors: [açtı, dokuza]
        explanation: Wörtlich „wird geöffnet“ (Passiv im Aorist); umgangssprachlich geht auch Postane dokuzda açar.
      - id: a2-u10-l3-e12
        type: conjugation
        mode: verb
        lemma: ödemek
        person: 3sg
        tense: aorist
        passive: true
        ability: true
        question: true
        target: ödenebilir mi
        gloss_de: kann man bezahlen?
        explanation: Passiv vor können, öde-n-ebil-ir.
      - id: a2-u10-l3-e13
        type: word_bank
        prompt: Kann man mit Karte bezahlen?
        answers: [Kartla ödenebilir mi?, Kredi kartıyla ödenebilir mi?, Kartla ödeyebilir miyim?, Kredi kartıyla ödeyebilir miyim?]
        distractors: [öder, karta]
      - id: a2-u10-l3-e14
        type: multiple_choice
        prompt: Was heißt „Pazar günleri posta dağıtılmaz.“?
        options: [Sonntags wird keine Post ausgetragen., Sonntags ist die Post geschlossen., Am Sonntag kommt die Post.]
        answer: Sonntags wird keine Post ausgetragen.
        explanation: dağıtmak = verteilen, austragen.

  - id: a2-u10-l4
    type: grammar
    title: selbst (kendi)
    exercises:
      - id: a2-u10-l4-e1
        type: suffix_builder
        stem: kendi
        suffixes: [POSS_1SG]
        target: kendim
        gloss_de: ich selbst
        explanation: kendi bekommt das Possessiv der Person, kendim, kendin, kendisi.
      - { id: a2-u10-l4-e2, type: suffix_builder, stem: kendi, suffixes: [POSS_1PL], target: kendimiz, gloss_de: wir selbst }
      - id: a2-u10-l4-e3
        type: suffix_builder
        stem: kendi
        suffixes: [POSS_2SG, DAT]
        target: kendine
        gloss_de: dir selbst
        explanation: Kendine iyi bak! = Pass auf dich auf!
      - { id: a2-u10-l4-e4, type: suffix_builder, stem: kendi, suffixes: [POSS_1SG, ACC], target: kendimi, gloss_de: mich (selbst) }
      - id: a2-u10-l4-e5
        type: word_bank
        prompt: Das habe ich selbst gemacht.
        answers: [Bunu kendim yaptım., Bunu ben kendim yaptım., Ben bunu kendim yaptım.]
        distractors: [kendimi, yaptın]
      - id: a2-u10-l4-e6
        type: word_bank
        prompt: Pass auf dich auf!
        answers: [Kendine iyi bak!]
        distractors: [kendini, sana]
      - id: a2-u10-l4-e7
        type: word_bank
        prompt: Passen Sie auf sich auf!
        answers: [Kendinize iyi bakın!]
        distractors: [kendine, bak]
      - id: a2-u10-l4-e8
        type: word_bank
        prompt: Ich fühle mich nicht gut.
        answers: [Kendimi iyi hissetmiyorum.]
        distractors: [kendim, hissediyorum]
        explanation: hissetmek = fühlen; kendini iyi hissetmek = sich gut fühlen (kendimi = mich).
      - id: a2-u10-l4-e9
        type: word_bank
        prompt: Wir haben ein eigenes Haus.
        answers: [Kendi evimiz var.]
        distractors: [kendimiz, evimizde]
        explanation: kendi + Possessiv am Nomen = eigen, kendi evim, kendi arabası.
      - id: a2-u10-l4-e10
        type: multiple_choice
        prompt: Was heißt „Kendini tanıt.“?
        options: [Stell dich vor., Erkenne dich selbst., Kennst du ihn?]
        answer: Stell dich vor.
        explanation: tanıtmak = vorstellen.
      - id: a2-u10-l4-e11
        type: multiple_choice
        prompt: Was heißt „Çocuk kendi kendine oynuyor.“?
        options: [Das Kind spielt allein (für sich)., Das Kind spielt mit sich selbst Fußball., Das Kind spielt mit seinem Freund.]
        answer: Das Kind spielt allein (für sich).
        explanation: kendi kendine = von selbst, allein.
      - id: a2-u10-l4-e12
        type: suffix_builder
        stem: kendi
        suffixes: [POSS_3SG]
        target: kendisi
        gloss_de: 'er, sie selbst'
      - id: a2-u10-l4-e13
        type: multiple_choice
        prompt: Welche Form ist richtig? (für mich selbst)
        options: [kendim için, kendime için, kendimi için]
        answer: kendim için

  - id: a2-u10-l5
    type: grammar
    title: sich waschen, sich anziehen (-in)
    exercises:
      - id: a2-u10-l5-e1
        type: conjugation
        mode: verb
        lemma: yıkanmak
        person: 1sg
        tense: present
        target: yıkanıyorum
        gloss_de: ich wasche mich
        explanation: yıkamak (waschen) + n = yıkanmak (sich waschen). Reflexive Verben lernt man als eigene Wörter.
      - { id: a2-u10-l5-e2, type: conjugation, mode: verb, lemma: giyinmek, person: 1sg, tense: present, target: giyiniyorum, gloss_de: ich ziehe mich an }
      - { id: a2-u10-l5-e3, type: conjugation, mode: verb, lemma: hazırlanmak, person: 2sg, tense: past, question: true, target: hazırlandın mı, gloss_de: hast du dich fertig gemacht? }
      - id: a2-u10-l5-e4
        type: conjugation
        mode: verb
        lemma: giyinmek
        person: 2sg
        tense: imperative
        target: giyin
        gloss_de: zieh dich an!
      - { id: a2-u10-l5-e5, type: conjugation, mode: verb, lemma: sevinmek, person: 1sg, tense: past, target: sevindim, gloss_de: ich habe mich gefreut }
      - id: a2-u10-l5-e6
        type: word_bank
        prompt: Morgens wasche ich mich und ziehe mich an.
        answers: [Sabahları yıkanıyorum ve giyiniyorum., Sabahları yıkanırım ve giyinirim., 'Sabahları yıkanıyorum, sonra giyiniyorum.', 'Sabahları yıkanırım, sonra giyinirim.']
        distractors: [yıkıyorum, giyiyorum]
      - id: a2-u10-l5-e7
        type: word_bank
        prompt: Ich wasche das Auto.
        answers: [Arabayı yıkıyorum.]
        distractors: [yıkanıyorum, araba]
        explanation: Mit Objekt yıkamak, ohne Objekt (sich selbst) yıkanmak.
      - id: a2-u10-l5-e8
        type: word_bank
        prompt: Die Kinder ziehen sich an.
        answers: [Çocuklar giyiniyor., Çocuklar giyiniyorlar.]
        distractors: [giyiyor, çocukları]
      - id: a2-u10-l5-e9
        type: word_bank
        prompt: Ich freue mich sehr über deine Nachricht.
        answers: [Mesajına çok sevindim.]
        distractors: [mesajını, sevdim]
        explanation: sevinmek steht mit Dativ, mesajına.
      - id: a2-u10-l5-e10
        type: multiple_choice
        prompt: Was ist der Unterschied? „Ali yıkandı.“ / „Ali yıkadı.“
        options: ['Ali hat sich gewaschen. / Ali hat (etwas) gewaschen.', 'Ali wurde gewaschen. / Ali wäscht.', 'Kein Unterschied.']
        answer: 'Ali hat sich gewaschen. / Ali hat (etwas) gewaschen.'
        explanation: -n kann reflexiv oder passiv sein; meist zeigt der Zusammenhang, was gemeint ist.
      - id: a2-u10-l5-e11
        type: multiple_choice
        prompt: Was heißt „giymek“ im Unterschied zu „giyinmek“?
        options: ['etwas anziehen (giymek) / sich anziehen (giyinmek)', 'sich anziehen (giymek) / etwas anziehen (giyinmek)', 'gleiche Bedeutung']
        answer: 'etwas anziehen (giymek) / sich anziehen (giyinmek)'
        explanation: Ceketimi giydim. = Ich habe meine Jacke angezogen. Giyindim. = Ich habe mich angezogen.

