# A2-10: Reflexiv und Passiv (Grundlagen): Post, Telefon, Kommunikation. Claude-Entwurf, ungeprüft (reviewed: false).
id: a2-u10
level: A2
title: Post und Telefon
grammar_focus: [passiv, reflexiv, kendi]
explainer: explainers/a2-passiv.md
source: eigene Formulierung (Claude-Entwurf)
