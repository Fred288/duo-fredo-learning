  - id: b1-u07-r1
    type: reading
    title: 'Lesetext: Unsere Klasse'
    passage:
      sentences:
        - { tr: "Bizim sınıfta yirmi öğrenci var.", de: "In unserer Klasse gibt es zwanzig Schüler." }
        - { tr: "Pencerenin yanında oturan kız Elif.", de: "Das Mädchen, das am Fenster sitzt, ist Elif." }
        - { tr: "Elif üç dil konuşabilen tek öğrenci.", de: "Elif ist die einzige Schülerin, die drei Sprachen sprechen kann." }
        - { tr: "Türkçe öğretmenimiz her sabah tahtaya yeni kelimeler yazıyor.", de: "Unsere Türkischlehrerin schreibt jeden Morgen neue Wörter an die Tafel." }
        - { tr: "Kelimeleri bilmeyen öğrenciler onları evde tekrarlıyor.", de: "Die Schüler, die die Wörter nicht kennen, wiederholen sie zu Hause." }
        - { tr: "Öğretmenimiz derste soru soranlara her zaman sabırla cevap veriyor.", de: "Unsere Lehrerin antwortet im Unterricht immer geduldig denen, die Fragen stellen." }
        - { tr: "Teneffüste bahçede futbol oynayanlar var, kitap okuyanlar da var.", de: "In der Pause gibt es welche, die im Hof Fußball spielen, und auch welche, die Bücher lesen." }
        - { tr: "Geçen hafta sınavda sorulan sorular çok zordu.", de: "Letzte Woche waren die Fragen, die in der Prüfung gestellt wurden, sehr schwer." }
        - { tr: "Ama ders çalışan herkes sınavı geçti.", de: "Aber alle, die gelernt hatten, haben die Prüfung bestanden." }
        - { tr: "Sınava gelmeyen tek bir öğrenci vardı.", de: "Es gab nur einen Schüler, der nicht zur Prüfung gekommen war." }
        - { tr: "O da o gün hastaydı.", de: "Er war an dem Tag krank." }
      glossary:
        - { tr: "Elif", de: "Elif (Name)" }
        - { tr: "tek", de: "einzig (tek bir = nur ein)" }
        - { tr: "sabırla", de: "geduldig (sabır = Geduld)" }
        - { tr: "hastaydı", de: "war krank (hasta + -ydı)", vocab: "hasta" }
        - { tr: "vardı", de: "es gab (var + -dı)", vocab: "var" }
        - { tr: "her", de: "jede(r, s) (her sabah = jeden Morgen)" }
        - { tr: "da", de: "auch (nach Vokal a: okuyanlar da)" }
        - { tr: "zordu", de: "war schwer (zor + -du)", vocab: "zor" }
    exercises:
      - id: b1-u07-r1-e1
        type: multiple_choice
        prompt: Wo sitzt Elif?
        options: [Am Fenster., An der Tür., Neben der Lehrerin.]
        answer: Am Fenster.
      - id: b1-u07-r1-e2
        type: multiple_choice
        prompt: Was macht die Lehrerin jeden Morgen?
        options: [Sie schreibt neue Wörter an die Tafel., Sie schreibt eine Prüfung., Sie spielt mit den Schülern Fußball.]
        answer: Sie schreibt neue Wörter an die Tafel.
      - id: b1-u07-r1-e3
        type: multiple_choice
        prompt: Wer hat die Prüfung bestanden?
        options: ['Alle, die gelernt hatten.', Nur Elif., Niemand.]
        answer: 'Alle, die gelernt hatten.'
      - id: b1-u07-r1-e4
        type: multiple_choice
        prompt: Warum war ein Schüler nicht bei der Prüfung?
