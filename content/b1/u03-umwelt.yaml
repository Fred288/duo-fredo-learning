      - { id: b1-u03-l4-e3, type: conjugation, mode: verb, lemma: olmak, person: 3sg, tense: conditional, target: olsa, gloss_de: 'wenn er, sie, es wäre' }
      - { id: b1-u03-l4-e4, type: conjugation, mode: verb, lemma: yapmak, person: 1pl, tense: conditional, target: yapsak, gloss_de: wenn wir machten }
      - { id: b1-u03-l4-e5, type: conjugation, mode: verb, lemma: almak, person: 3pl, tense: conditional, target: alsalar, gloss_de: wenn sie nähmen }
      - { id: b1-u03-l4-e6, type: conjugation, mode: verb, lemma: gitmek, person: 1sg, tense: conditional, negative: true, target: gitmesem, gloss_de: wenn ich nicht ginge }
      - id: b1-u03-l4-e7
        type: conjugation
        mode: copula
        lemma: zengin
        person: 1sg
        tense: conditional
        target: zenginsem
        gloss_de: wenn ich reich bin
      - { id: b1-u03-l4-e8, type: conjugation, mode: copula, lemma: evde, person: 3sg, tense: conditional, target: evdeyse, gloss_de: 'wenn er, sie zu Hause ist' }
      - { id: b1-u03-l4-e9, type: conjugation, mode: copula, lemma: hasta, person: 2sg, tense: conditional, target: hastaysan, gloss_de: wenn du krank bist }
      - { id: b1-u03-l4-e10, type: conjugation, mode: copula, lemma: öğrenci, person: 1sg, tense: conditional, negative: true, target: öğrenci değilsem, gloss_de: wenn ich kein(e) Student(in) bin }
      - id: b1-u03-l4-e11
        type: multiple_choice
        prompt: Was bedeutet „Zengin olsam dünyayı gezerdim.“?
        options: ['Wenn ich reich wäre, würde ich um die Welt reisen.', 'Weil ich reich bin, reise ich um die Welt.', 'Ich war reich und bin um die Welt gereist.']
        answer: 'Wenn ich reich wäre, würde ich um die Welt reisen.'
        explanation: -se im Nebensatz, -irdi (würde) im Hauptsatz.
      - id: b1-u03-l4-e12
        type: word_bank
        prompt: Wenn ich Zeit hätte, würde ich mehr Bäume pflanzen.
        answers: [Vaktim olsa daha çok ağaç dikerdim., Zamanım olsa daha çok ağaç dikerdim.]
        chunks:
          - { text: "Vaktim olsa", role: complement }
          - { text: "daha çok", role: complement }
          - { text: "ağaç", role: object_bare }
          - { text: "dikerdim", role: predicate }
        distractors: [dikerim, olursa]
      - id: b1-u03-l4-e13
        type: free_text
        direction: de_tr
        prompt: an deiner Stelle (wenn ich du wäre)
        answers: [ben sen olsam, senin yerinde olsam, yerinde olsam, sen olsam]
      - id: b1-u03-l4-e14
        type: multiple_choice
        prompt: Welcher Satz beschreibt einen gedachten Fall?
        options: [Param olsa araba alırdım., Param varsa araba alırım., Param olursa araba alırım.]
        answer: Param olsa araba alırdım.
        explanation: olsa … alırdım = wenn ich Geld hätte, würde ich kaufen.

  - id: b1-u03-l5
    type: dialog
    title: Was können wir für die Umwelt tun?
    exercises:
      - id: b1-u03-l5-e1
        type: word_bank
        prompt: Was können wir für die Umwelt tun?
        answers: [Çevre için ne yapabiliriz?]
        chunks:
          - { text: "Çevre için", role: complement }
          - { text: "ne", role: question }
          - { text: "yapabiliriz", role: predicate }
        distractors: [yapabilirsin, çevreyi]
