      - { id: b1-u03-l2-e3, type: conjugation, mode: verb, lemma: atmak, person: 1pl, tense: aorist, compound: conditional, target: atarsak, gloss_de: wenn wir wegwerfen }
      - { id: b1-u03-l2-e4, type: conjugation, mode: verb, lemma: korumak, person: 3pl, tense: aorist, compound: conditional, target: korurlarsa, gloss_de: wenn sie schützen }
      - { id: b1-u03-l2-e5, type: conjugation, mode: verb, lemma: kirletmek, person: 1sg, tense: aorist, compound: conditional, target: kirletirsem, gloss_de: wenn ich verschmutze }
      - id: b1-u03-l2-e6
        type: conjugation
        mode: verb
        lemma: kapatmak
        person: 2pl
        tense: aorist
        compound: conditional
        negative: true
        target: kapatmazsanız
        gloss_de: wenn ihr nicht ausmacht, wenn Sie nicht schließen
      - { id: b1-u03-l2-e7, type: conjugation, mode: verb, lemma: tasarruf etmek, person: 1pl, tense: aorist, compound: conditional, target: tasarruf edersek, gloss_de: wenn wir sparen }
      - id: b1-u03-l2-e8
        type: multiple_choice
        prompt: Was bedeutet „Yağmur yağarsa evde kalırız.“?
        options: ['Wenn es regnet, bleiben wir zu Hause.', 'Weil es regnet, bleiben wir zu Hause.', 'Es hat geregnet, also sind wir zu Hause geblieben.']
        answer: 'Wenn es regnet, bleiben wir zu Hause.'
        explanation: Die Bedingung steht vorn, mit -se am Verb.
      - id: b1-u03-l2-e9
        type: word_bank
        prompt: Wenn wir den Müll trennen, schützen wir die Umwelt.
        answers: [Çöpleri ayırırsak çevreyi koruruz., Çöpü ayırırsak çevreyi koruruz.]
        chunks:
          - { text: "Çöpleri ayırırsak", role: complement }
          - { text: "çevreyi", role: object }
          - { text: "koruruz", role: predicate }
        distractors: [korursak, ayırırız]
        explanation: ayırmak = trennen, sortieren.
      - id: b1-u03-l2-e10
        type: free_text
        direction: tr_de
        prompt: Işıkları kapatırsan elektrikten tasarruf edersin.
        answers: ['Wenn du das Licht ausmachst, sparst du Strom.', 'Wenn du die Lichter ausmachst, sparst du Strom.', 'Wenn du das Licht ausschaltest, sparst du Strom.', 'Wenn du die Lichter ausschaltest, sparst du Strom.', 'Du sparst Strom, wenn du das Licht ausmachst.', 'Du sparst Strom, wenn du das Licht ausschaltest.', 'Wenn du das Licht ausmachst, sparst du Energie.']
      - id: b1-u03-l2-e11
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: aorist
        compound: conditional
        negative: true
        target: gelmezsem
        gloss_de: wenn ich nicht komme
        explanation: Mit ise steht -mez auch bei „ich“, gelmezsem.

  - id: b1-u03-l3
