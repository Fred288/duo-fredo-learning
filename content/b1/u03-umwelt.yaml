# B1-03: Konditional -se, ise (-irse, -iyorsa, -ecekse, -diyse, -se, -ysa am Nomen); Natur, Umwelt, Erde. Claude-Entwurf, ungeprüft (reviewed: false).
id: b1-u03
level: B1
title: Natur und Umwelt
grammar_focus: [konditional, ise, eger, varsa]
explainer: explainers/b1-konditional.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
reviewed: false
lessons:
  - id: b1-u03-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b1-u03-l1-e1
        type: multiple_choice
        prompt: Was heißt „doğa“?
        options: [Natur, Umwelt, Erde]
        answer: Natur
      - id: b1-u03-l1-e2
        type: multiple_choice
        prompt: Was heißt „çevre“?
        options: [Umwelt, Wald, Klima]
        answer: Umwelt
        explanation: çevre heißt auch „Umgebung“.
      - id: b1-u03-l1-e3
        type: free_text
        direction: de_tr
        prompt: Wald
        answers: [orman]
      - id: b1-u03-l1-e4
        type: multiple_choice
        prompt: Was heißt „nehir“?
        options: [Fluss, See, Meer]
        answer: Fluss
        explanation: Vor Vokal fällt das i aus, nehri (den Fluss).
      - id: b1-u03-l1-e5
        type: free_text
        direction: de_tr
        prompt: See
        answers: [göl]
      - id: b1-u03-l1-e6
        type: multiple_choice
        prompt: Was heißt „iklim“?
        options: [Klima, Wetter, Jahreszeit]
        answer: Klima
        explanation: hava = Wetter (und Luft), iklim = Klima.
      - id: b1-u03-l1-e7
        type: free_text
        direction: de_tr
        prompt: sauber
        answers: [temiz]
      - id: b1-u03-l1-e8
        type: free_text
        direction: de_tr
        prompt: schmutzig
        answers: [kirli, pis]
      - id: b1-u03-l1-e9
        type: multiple_choice
        prompt: Was heißt „çöp“?
        options: [Müll, Flasche, Plastik]
        answer: Müll
      - id: b1-u03-l1-e10
        type: multiple_choice
        prompt: Was heißt „geri dönüşüm“?
        options: [Recycling, Rückfahrt, Umweg]
        answer: Recycling
        explanation: Wörtlich „Zurück-Wandlung“.
      - id: b1-u03-l1-e11
        type: free_text
        direction: de_tr
        prompt: schützen
        answers: [korumak]
      - id: b1-u03-l1-e12
        type: multiple_choice
        prompt: Was heißt „kirletmek“?
        options: [verschmutzen, reinigen, sammeln]
        answer: verschmutzen
        explanation: kirli (schmutzig) + -let, wie temiz → temizlemek (reinigen).
      - id: b1-u03-l1-e13
        type: free_text
        direction: de_tr
        prompt: (einen Baum) pflanzen
        answers: [dikmek, ağaç dikmek]
      - id: b1-u03-l1-e14
        type: multiple_choice
        prompt: Was heißt „tasarruf etmek“?
        options: [sparen, verschwenden, kaufen]
        answer: sparen
        explanation: Mit Ablativ, elektrikten tasarruf etmek = Strom sparen.
      - id: b1-u03-l1-e15
        type: free_text
        direction: de_tr
        prompt: wegwerfen
        answers: [atmak]
        explanation: atmak heißt auch „werfen“.
      - id: b1-u03-l1-e16
        type: multiple_choice
        prompt: Was heißt „zarar vermek“?
        options: [schaden, helfen, sparen]
        answer: schaden
        explanation: Mit Dativ, doğaya zarar vermek = der Natur schaden.
      - id: b1-u03-l1-e17
        type: free_text
        direction: de_tr
        prompt: Welt, Erde
        answers: [dünya]

  - id: b1-u03-l2
