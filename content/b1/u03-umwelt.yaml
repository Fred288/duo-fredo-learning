        distractors: [kullanmalıyız, plastiği]
      - id: b1-u03-l5-e3
        type: multiple_choice
        prompt: Wie sagst du „Wenn du willst, helfe ich dir.“?
        options: [İstersen sana yardım ederim., İstedin sana yardım ettim., İsteyeceksin sana yardım ederim.]
        answer: İstersen sana yardım ederim.
      - id: b1-u03-l5-e4
        type: word_bank
        prompt: Wenn alle Müll sammeln, wird der Park sauber.
        answers: [Herkes çöp toplarsa park temiz olur.]
        chunks:
          - { text: "Herkes çöp toplarsa", role: complement }
          - { text: "park", role: subject }
          - { text: "temiz olur", role: predicate }
        distractors: [toplar, kirli]
      - id: b1-u03-l5-e5
        type: free_text
        direction: tr_de
        prompt: Ağaç dikersek hava daha temiz olur.
        answers: ['Wenn wir Bäume pflanzen, wird die Luft sauberer.', 'Wenn wir Bäume pflanzen, wird die Luft sauberer werden.', 'Die Luft wird sauberer, wenn wir Bäume pflanzen.', 'Wenn wir einen Baum pflanzen, wird die Luft sauberer.']
      - id: b1-u03-l5-e6
        type: word_bank
        prompt: Wir fahren mit dem Fahrrad, wenn das Wetter schön ist.
        answers: [Hava güzelse bisiklete bineriz., Hava güzel olursa bisiklete bineriz.]
        chunks:
          - { text: "Hava güzelse", role: complement }
          - { text: "bisiklete", role: place }
          - { text: "bineriz", role: predicate }
        distractors: [bisiklette, güzeldi]
        explanation: güzelse = güzel + se (wenn es schön ist).
      - id: b1-u03-l5-e7
        type: multiple_choice
        prompt: Was bedeutet „Sorun yoksa başlayalım.“?
        options: ['Wenn es kein Problem gibt, fangen wir an.', 'Es gibt ein Problem, also fangen wir nicht an.', 'Wir haben angefangen, ohne ein Problem.']
        answer: 'Wenn es kein Problem gibt, fangen wir an.'
        explanation: yoksa = wenn es nicht gibt; başlayalım = lass uns anfangen.
      - id: b1-u03-l5-e8
        type: free_text
        direction: de_tr
        prompt: Wenn du krank bist, bleib zu Hause.
        answers: [Hastaysan evde kal., Eğer hastaysan evde kal., Hasta isen evde kal.]

