  - id: b1-u03-r1
    type: reading
    title: 'Lesetext: Unser Wald'
    passage:
      sentences:
        - { tr: "Köyümüzün yanında büyük bir orman var.", de: "Neben unserem Dorf gibt es einen großen Wald." }
        - { tr: "Eskiden orman çok temizdi.", de: "Früher war der Wald sehr sauber." }
        - { tr: "Şimdi insanlar ormana çöp atıyor.", de: "Jetzt werfen die Leute Müll in den Wald." }
        - { tr: "Plastik şişeler toprağa zarar veriyor.", de: "Plastikflaschen schaden dem Boden." }
        - { tr: "Hayvanlar da bundan çok etkileniyor.", de: "Auch die Tiere leiden sehr darunter." }
        - { tr: "Geçen hafta köyün gençleri bir karar verdi.", de: "Letzte Woche haben die jungen Leute des Dorfes einen Beschluss gefasst." }
        - { tr: "Her pazar ormanda çöp toplayacaklar.", de: "Jeden Sonntag werden sie im Wald Müll sammeln." }
        - { tr: "Ben de onlara yardım edeceğim.", de: "Ich werde ihnen auch helfen." }
        - { tr: "Herkes biraz dikkat ederse orman yine temiz olur.", de: "Wenn alle ein bisschen aufpassen, wird der Wald wieder sauber." }
        - { tr: "Ağaç dikersek hava da daha temiz olacak.", de: "Wenn wir Bäume pflanzen, wird auch die Luft sauberer." }
        - { tr: "Doğayı korursak kendimizi de koruruz.", de: "Wenn wir die Natur schützen, schützen wir auch uns selbst." }
      glossary:
        - { tr: "temizdi", de: "war sauber (temiz + di)", vocab: "temiz" }
        - { tr: "da", de: "auch (nachgestellt, getrennt geschrieben)" }
        - { tr: "de", de: "auch (nachgestellt, getrennt geschrieben)" }
        - { tr: "etkileniyor", de: "ist betroffen, leidet darunter (etkilenmek)" }
        - { tr: "her", de: "jede(r, s) (her pazar = jeden Sonntag)" }
        - { tr: "yardım", de: "Hilfe (yardım etmek = helfen)", vocab: "yardım etmek" }
        - { tr: "edeceğim", de: "werde machen (etmek, Futur; yardım edeceğim = ich werde helfen)", vocab: "yardım etmek" }
        - { tr: "dikkat", de: "Aufmerksamkeit (dikkat etmek = aufpassen)", vocab: "dikkat etmek" }
        - { tr: "ederse", de: "wenn … macht (etmek; dikkat ederse = wenn … aufpasst)", vocab: "dikkat etmek" }
        - { tr: "yine", de: "wieder" }
        - { tr: "zarar", de: "Schaden (zarar vermek = schaden)", vocab: "zarar vermek" }
        - { tr: "kendimizi", de: "uns selbst (kendi, Akkusativ)", vocab: "kendi" }
    exercises:
      - id: b1-u03-r1-e1
        type: multiple_choice
        prompt: Wie war der Wald früher?
        options: [sehr sauber, sehr klein, sehr gefährlich]
        answer: sehr sauber
      - id: b1-u03-r1-e2
        type: multiple_choice
        prompt: Was schadet dem Boden?
        options: [Plastikflaschen, Bäume, Tiere]
        answer: Plastikflaschen
      - id: b1-u03-r1-e3
        type: multiple_choice
        prompt: Was haben die jungen Leute beschlossen?
        options: [Jeden Sonntag im Wald Müll zu sammeln., In die Stadt zu ziehen., Den Wald zu verkaufen.]
        answer: Jeden Sonntag im Wald Müll zu sammeln.
      - id: b1-u03-r1-e4
        type: multiple_choice
        prompt: Was passiert laut Text, wenn alle ein bisschen aufpassen?
        options: [Der Wald wird wieder sauber., Die Tiere gehen weg., Es regnet mehr.]
        answer: Der Wald wird wieder sauber.
      - id: b1-u03-r1-e5
        type: free_text
        direction: tr_de
        prompt: Doğayı korursak kendimizi de koruruz.
