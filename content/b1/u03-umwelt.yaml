    exercises:
      - id: b1-u03-l3-e1
        type: conjugation
        mode: verb
        lemma: istemek
        person: 2sg
        tense: present
        compound: conditional
        target: istiyorsan
        gloss_de: wenn du (es wirklich) willst
        explanation: istiyor + san.
      - { id: b1-u03-l3-e2, type: conjugation, mode: verb, lemma: gelmek, person: 3sg, tense: present, compound: conditional, target: geliyorsa, gloss_de: 'wenn er, sie (gerade) kommt' }
      - id: b1-u03-l3-e3
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 2pl
        tense: future
        compound: conditional
        target: gidecekseniz
        gloss_de: wenn ihr gehen wollt, wenn Sie vorhaben zu gehen
        explanation: Das k von -ecek bleibt vor -se.
      - { id: b1-u03-l3-e4, type: conjugation, mode: verb, lemma: yapmak, person: 3sg, tense: future, compound: conditional, target: yapacaksa, gloss_de: 'wenn er, sie (es) machen will' }
      - id: b1-u03-l3-e5
        type: conjugation
        mode: verb
        lemma: bitirmek
        person: 2sg
        tense: past
        compound: conditional
        target: bitirdiysen
        gloss_de: wenn du fertig bist (beendet hast)
        explanation: Nach Vokal mit y, bitirdi-y-sen.
      - { id: b1-u03-l3-e6, type: conjugation, mode: verb, lemma: bilmek, person: 2sg, tense: present, compound: conditional, negative: true, target: bilmiyorsan, gloss_de: wenn du (es) nicht weißt }
      - id: b1-u03-l3-e7
        type: multiple_choice
        prompt: Was bedeutet „İşini bitirdiysen gidebilirsin.“?
        options: ['Wenn du deine Arbeit beendet hast, kannst du gehen.', 'Du hast deine Arbeit beendet, also bist du gegangen.', 'Wenn du deine Arbeit beendest, wirst du gehen.']
        answer: 'Wenn du deine Arbeit beendet hast, kannst du gehen.'
      - id: b1-u03-l3-e8
        type: word_bank
        prompt: Wenn du Zeit hast, komm zu uns.
        answers: [Vaktin varsa bize gel., Zamanın varsa bize gel., Eğer vaktin varsa bize gel.]
        chunks:
          - { text: "Vaktin varsa", role: complement }
          - { text: "bize", role: complement }
          - { text: "gel", role: predicate }
        distractors: [yoksa, gelir]
        explanation: varsa = wenn es gibt, wenn … hat.
      - id: b1-u03-l3-e9
        type: free_text
        direction: tr_de
        prompt: Gideceksen bana söyle.
        answers: ['Wenn du gehen willst, sag mir Bescheid.', 'Wenn du gehst, sag mir Bescheid.', 'Wenn du gehen wirst, sag es mir.', 'Falls du gehst, sag mir Bescheid.', 'Wenn du vorhast zu gehen, sag mir Bescheid.', 'Wenn du gehst, sag es mir.', 'Sag mir Bescheid, wenn du gehst.']
      - id: b1-u03-l3-e10
        type: multiple_choice
        prompt: Was ist der Unterschied? „Yarın gelirsen …“ / „Yarın geleceksen …“
        options: [Falls du morgen kommst … / Wenn du (wie geplant) morgen kommst …, Beides heißt dasselbe., Wenn du gestern gekommen bist … / Wenn du morgen kommst …]
        answer: Falls du morgen kommst … / Wenn du (wie geplant) morgen kommst …

  - id: b1-u03-l4
