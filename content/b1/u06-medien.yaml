  - id: b1-u06-r1
    type: reading
    title: 'Lesetext: Eine Woche ohne Handy'
    passage:
      sentences:
        - { tr: "Geçen ay bir hafta telefonumu kullanmamaya karar verdim.", de: "Letzten Monat habe ich beschlossen, eine Woche lang mein Handy nicht zu benutzen." }
        - { tr: "Annem buna inanmadı.", de: "Meine Mutter hat das nicht geglaubt." }
        - { tr: "\"Bir gün bile dayanamazsın,\" dedi.", de: "„Du hältst es keinen Tag aus“, sagte sie." }
        - { tr: "İlk gün haberleri okumak için gazete aldım.", de: "Am ersten Tag habe ich eine Zeitung gekauft, um die Nachrichten zu lesen." }
        - { tr: "Gazete okumayı çok sevdim.", de: "Das Zeitunglesen hat mir sehr gefallen." }
        - { tr: "Annem her akşam onu aramamı istiyordu ama telefonumu kullanmıyordum.", de: "Meine Mutter wollte, dass ich sie jeden Abend anrufe, aber ich benutzte mein Handy nicht." }
        - { tr: "Bu yüzden arkadaşlarıma mektup yazmaya başladım.", de: "Deshalb habe ich angefangen, meinen Freunden Briefe zu schreiben." }
        - { tr: "Mektupları her gün postaneye gidişim bütün mahallenin dikkatini çekti.", de: "Dass ich jeden Tag mit den Briefen zur Post ging, fiel dem ganzen Viertel auf." }
        - { tr: "Arkadaşlarım mektuplarıma çok şaşırdı.", de: "Meine Freunde waren über meine Briefe sehr überrascht." }
        - { tr: "Bir hafta sonra telefonumu tekrar açtım.", de: "Nach einer Woche habe ich mein Handy wieder eingeschaltet." }
        - { tr: "Şimdi her akşam bir saat telefonsuz kalmaya çalışıyorum.", de: "Jetzt versuche ich, jeden Abend eine Stunde ohne Handy auszukommen." }
      glossary:
        - { tr: "bile", de: "sogar, nicht einmal (mit Verneinung)" }
        - { tr: "dayanamazsın", de: "du hältst es nicht aus (dayanmak = aushalten)" }
        - { tr: "ilk", de: "erste(r, s)" }
        - { tr: "yüzden", de: "wegen (bu yüzden = deshalb)" }
        - { tr: "her", de: "jede(r, s) (her akşam = jeden Abend)" }
        - { tr: "telefonsuz", de: "ohne Handy (telefon + suz)", vocab: "telefon" }
        - { tr: "gidişim", de: "mein Gehen (gitmek + -iş + mein)", vocab: "gitmek" }
        - { tr: "bütün", de: "ganz, alle" }
        - { tr: "dikkatini", de: "die Aufmerksamkeit (dikkat çekmek = auffallen)", vocab: "dikkat etmek" }
        - { tr: "çekti", de: "zog an (çekmek; dikkatini çekti = fiel auf)" }
    exercises:
      - id: b1-u06-r1-e1
        type: multiple_choice
        prompt: Was hat die Person beschlossen?
        options: [Eine Woche lang das Handy nicht zu benutzen., Ein neues Handy zu kaufen., Jeden Tag Nachrichten zu schreiben.]
        answer: Eine Woche lang das Handy nicht zu benutzen.
      - id: b1-u06-r1-e2
        type: multiple_choice
        prompt: Was hat die Mutter gedacht?
        options: [Dass ihr Kind es keinen Tag aushält., Dass es eine gute Idee ist., Dass das Handy kaputt ist.]
        answer: Dass ihr Kind es keinen Tag aushält.
      - id: b1-u06-r1-e3
        type: multiple_choice
        prompt: Wie hat die Person ihre Freunde erreicht?
        options: [Mit Briefen., Mit E-Mails., Gar nicht.]
        answer: Mit Briefen.
      - id: b1-u06-r1-e4
        type: multiple_choice
        prompt: Was versucht die Person jetzt?
        options: [Jeden Abend eine Stunde ohne Handy auszukommen., Nie wieder ein Handy zu benutzen., Jeden Tag Zeitung zu lesen.]
        answer: Jeden Abend eine Stunde ohne Handy auszukommen.
      - id: b1-u06-r1-e5
        type: free_text
        direction: tr_de
        prompt: Gazete okumayı çok sevdim.
        answers: [Das Zeitunglesen hat mir sehr gefallen., Zeitung zu lesen hat mir sehr gefallen., Ich habe sehr gern Zeitung gelesen., Das Zeitunglesen hat mir gut gefallen.]

  - id: b1-u06-l7
    type: review
    title: Wiederholung
    exercises:
      - id: b1-u06-l7-e1
        type: free_text
        direction: de_tr
