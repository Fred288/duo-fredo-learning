# B1-06: Verbalnomen -me und -iş mit Possessiv; Ergänzungssätze (-meyi, -meye, -mem lazım, -meni istiyorum); Medien, Nachrichten. Claude-Entwurf, ungeprüft (reviewed: false).
id: b1-u06
level: B1
title: Medien und Nachrichten
grammar_focus: [me, meyi, meye, mem-lazim, meni-istiyorum, is]
explainer: explainers/b1-me.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
reviewed: false
lessons:
  - id: b1-u06-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b1-u06-l1-e1
        type: multiple_choice
        prompt: Was heißt „dergi“?
        options: [Zeitschrift, Zeitung, Buch]
        answer: Zeitschrift
        explanation: gazete = Zeitung.
      - id: b1-u06-l1-e2
        type: free_text
        direction: de_tr
        prompt: Radio
        answers: [radyo]
      - id: b1-u06-l1-e3
        type: multiple_choice
        prompt: Was heißt „dizi“?
        options: [Fernsehserie, Werbung, Sender]
        answer: Fernsehserie
      - id: b1-u06-l1-e4
        type: free_text
        direction: de_tr
        prompt: Werbung
        answers: [reklam]
      - id: b1-u06-l1-e5
        type: multiple_choice
        prompt: Was heißt „paylaşmak“?
        options: [teilen, folgen, löschen]
        answer: teilen
      - id: b1-u06-l1-e6
        type: multiple_choice
        prompt: Was heißt „takip etmek“?
        options: [folgen, teilen, glauben]
        answer: folgen
        explanation: Mit Akkusativ, bir kanalı takip etmek = einem Kanal folgen.
      - id: b1-u06-l1-e7
        type: free_text
        direction: de_tr
        prompt: glauben
        answers: [inanmak]
        explanation: Mit Dativ, buna inanmıyorum = das glaube ich nicht.
      - id: b1-u06-l1-e8
        type: multiple_choice
        prompt: Was heißt „güvenmek“?
        options: [vertrauen, zweifeln, verstehen]
        answer: vertrauen
        explanation: Mit Dativ, sana güveniyorum = ich vertraue dir.
      - id: b1-u06-l1-e9
        type: free_text
        direction: de_tr
        prompt: richtig, wahr
        answers: [doğru]
      - id: b1-u06-l1-e10
        type: free_text
        direction: de_tr
        prompt: falsch
        answers: [yanlış]
      - id: b1-u06-l1-e11
        type: multiple_choice
        prompt: Was heißt „fikir“?
        options: [Meinung, Nachricht, Frage]
        answer: Meinung
        explanation: Vor Vokal fällt das i aus, fikrim (meine Meinung).
      - id: b1-u06-l1-e12
        type: multiple_choice
        prompt: Was heißt „kaynak“?
        options: [Quelle, Kanal, Ereignis]
        answer: Quelle
        explanation: Vor Vokal wird k zu ğ, kaynağı (die Quelle, Akkusativ).
      - id: b1-u06-l1-e13
        type: free_text
        direction: de_tr
        prompt: Ereignis
        answers: [olay]
      - id: b1-u06-l1-e14
        type: multiple_choice
        prompt: Was heißt „bence“?
        options: [meiner Meinung nach, für mich bestimmt, mit mir]
        answer: meiner Meinung nach
        explanation: Ebenso sence (deiner Meinung nach).
      - id: b1-u06-l1-e15
        type: free_text
        direction: de_tr
        prompt: Handy
        answers: [cep telefonu, telefon, cep]
      - id: b1-u06-l1-e16
        type: multiple_choice
        prompt: Was heißt „tartışmak“?
        options: [diskutieren, erklären, berichten]
        answer: diskutieren

  - id: b1-u06-l2
    type: grammar
    title: Gern tun, anfangen (-meyi, -meye)
    exercises:
      - id: b1-u06-l2-e1
        type: suffix_builder
        stem: okumak
        verbal: VN_MA
        suffixes: [ACC]
        target: okumayı
        gloss_de: 'das Lesen (… sevmek = gern lesen)'
        explanation: sevmek verlangt den Akkusativ; nach Vokal mit y.
      - { id: b1-u06-l2-e2, type: suffix_builder, stem: izlemek, verbal: VN_MA, suffixes: [ACC], target: izlemeyi, gloss_de: 'das Ansehen (… sevmek = gern ansehen)' }
      - { id: b1-u06-l2-e3, type: suffix_builder, stem: yüzmek, verbal: VN_MA, suffixes: [ACC], target: yüzmeyi, gloss_de: 'das Schwimmen (… bilmek = schwimmen können)' }
      - id: b1-u06-l2-e4
        type: suffix_builder
        stem: öğrenmek
        verbal: VN_MA
        suffixes: [DAT]
        target: öğrenmeye
        gloss_de: 'zu lernen (… çalışmak = versuchen zu lernen)'
        explanation: çalışmak (versuchen) verlangt den Dativ.
      - { id: b1-u06-l2-e5, type: suffix_builder, stem: yağmak, verbal: VN_MA, suffixes: [DAT], target: yağmaya, gloss_de: 'zu regnen (… başlamak = anfangen zu regnen)' }
      - { id: b1-u06-l2-e6, type: suffix_builder, stem: anlamak, verbal: VN_MA, suffixes: [DAT], target: anlamaya, gloss_de: zu verstehen (versuchen) }
      - id: b1-u06-l2-e7
        type: multiple_choice
        prompt: Was bedeutet „Haber izlemeyi sevmiyorum.“?
        options: [Ich sehe nicht gern Nachrichten., Ich habe keine Nachrichten gesehen., Ich will keine Nachrichten sehen.]
        answer: Ich sehe nicht gern Nachrichten.
      - id: b1-u06-l2-e8
        type: word_bank
        prompt: Ich versuche, jeden Tag Zeitung zu lesen.
        answers: [Her gün gazete okumaya çalışıyorum.]
        chunks:
          - { text: "Her gün", role: time }
          - { text: "gazete okumaya", role: complement }
          - { text: "çalışıyorum", role: predicate }
        distractors: [okumayı, okuyorum]
      - id: b1-u06-l2-e9
        type: word_bank
        prompt: Es hat angefangen zu regnen.
        answers: [Yağmur yağmaya başladı.]
        chunks:
          - { text: "Yağmur", role: subject }
          - { text: "yağmaya", role: complement }
          - { text: "başladı", role: predicate }
        distractors: [yağmayı, başlıyor]
      - id: b1-u06-l2-e10
        type: free_text
        direction: de_tr
        prompt: Ich lese gern.
        answers: [Okumayı severim., Okumayı seviyorum., Kitap okumayı severim., Kitap okumayı seviyorum., Okumaktan hoşlanırım., Okumaktan hoşlanıyorum., Kitap okumaktan hoşlanıyorum.]
      - id: b1-u06-l2-e11
        type: multiple_choice
        prompt: Welche Form passt? „Türkçe … başladım.“ (lernen)
        options: [öğrenmeye, öğrenmeyi, öğrenmekte]
        answer: öğrenmeye
        explanation: başlamak verlangt den Dativ.
      - id: b1-u06-l2-e12
        type: multiple_choice
        prompt: Welche Form passt? „… biliyor musun?“ (schwimmen können)
        options: [Yüzmeyi, Yüzmeye, Yüzmekten]
        answer: Yüzmeyi

  - id: b1-u06-l3
    type: grammar
    title: Ich muss (-mem lazım)
    exercises:
      - id: b1-u06-l3-e1
        type: suffix_builder
        stem: gitmek
        verbal: VN_MA
        suffixes: [POSS_1SG]
        target: gitmem
        gloss_de: 'dass ich gehe (… lazım = ich muss gehen)'
        explanation: Die Person steht im Possessiv, mein Gehen.
      - { id: b1-u06-l3-e2, type: suffix_builder, stem: gelmek, verbal: VN_MA, suffixes: [POSS_2SG], target: gelmen, gloss_de: 'dass du kommst (… lazım = du musst kommen)' }
      - { id: b1-u06-l3-e3, type: suffix_builder, stem: çalışmak, verbal: VN_MA, suffixes: [POSS_3SG], target: çalışması, gloss_de: 'dass er, sie arbeitet' }
      - { id: b1-u06-l3-e4, type: suffix_builder, stem: okumak, verbal: VN_MA, suffixes: [POSS_1PL], target: okumamız, gloss_de: dass wir lesen }
      - { id: b1-u06-l3-e5, type: suffix_builder, stem: beklemek, verbal: VN_MA, suffixes: [POSS_2PL], target: beklemeniz, gloss_de: 'dass ihr wartet, dass Sie warten' }
      - { id: b1-u06-l3-e6, type: suffix_builder, stem: dinlemek, verbal: VN_MA, suffixes: [POSS_3PL], target: dinlemeleri, gloss_de: dass sie zuhören }
      - id: b1-u06-l3-e7
        type: multiple_choice
        prompt: Was bedeutet „Erken kalkmam lazım.“?
        options: [Ich muss früh aufstehen., Ich bin früh aufgestanden., Du musst früh aufstehen.]
        answer: Ich muss früh aufstehen.
      - id: b1-u06-l3-e8
        type: word_bank
        prompt: Du musst die Nachrichten hören.
        answers: [Haberleri dinlemen lazım., Haberleri dinlemen gerek., Haberleri dinlemen gerekiyor.]
        chunks:
          - { text: "Haberleri", role: object }
          - { text: "dinlemen", role: complement }
          - { text: "lazım", role: predicate }
        distractors: [dinlemem, haberler]
      - id: b1-u06-l3-e9
        type: free_text
        direction: tr_de
        prompt: Bunu herkesin bilmesi gerekiyor.
        answers: [Das muss jeder wissen., Alle müssen das wissen., Jeder muss das wissen., Das müssen alle wissen., Das sollte jeder wissen.]
      - id: b1-u06-l3-e10
        type: free_text
        direction: de_tr
        prompt: Wir müssen gehen.
        answers: [Gitmemiz lazım., Gitmemiz gerek., Gitmemiz gerekiyor., Gitmek zorundayız., Bizim gitmemiz lazım., Gitmeliyiz.]
      - id: b1-u06-l3-e11
        type: multiple_choice
        prompt: Was kann „gitmem“ heißen?
        options: ['mein Gehen (gitmem lazım) oder ich gehe nicht (Aorist)', nur „ich gehe nicht“, nur „mein Gehen“]
        answer: 'mein Gehen (gitmem lazım) oder ich gehe nicht (Aorist)'
        explanation: Beide Formen sehen gleich aus; der Satz zeigt, was gemeint ist.

  - id: b1-u06-l4
    type: grammar
    title: Ich möchte, dass du … (-meni istiyorum)
    exercises:
      - id: b1-u06-l4-e1
        type: suffix_builder
        stem: gelmek
        verbal: VN_MA
        suffixes: [POSS_2SG, ACC]
        target: gelmeni
        gloss_de: 'dass du kommst (… istiyorum = ich möchte, dass du kommst)'
        explanation: Possessiv der anderen Person, dann Akkusativ.
      - { id: b1-u06-l4-e2, type: suffix_builder, stem: okumak, verbal: VN_MA, suffixes: [POSS_3SG, ACC], target: okumasını, gloss_de: 'dass er, sie liest (Akkusativ)' }
      - { id: b1-u06-l4-e3, type: suffix_builder, stem: yardım etmek, verbal: VN_MA, suffixes: [POSS_2PL, ACC], target: yardım etmenizi, gloss_de: 'dass ihr helft, dass Sie helfen (Akkusativ)' }
      - { id: b1-u06-l4-e4, type: suffix_builder, stem: bilmek, verbal: VN_MA, suffixes: [POSS_2SG, ACC], target: bilmeni, gloss_de: 'dass du weißt (… isterim = du sollst wissen)' }
      - id: b1-u06-l4-e5
        type: suffix_builder
        stem: gitmek
        verbal: VN_MA
        negative: true
        suffixes: [POSS_3SG, ACC]
        target: gitmemesini
        gloss_de: 'dass er, sie nicht geht (Akkusativ)'
        explanation: Verneinung -me vor dem Verbalnomen -me, gitme-me-si-ni.
      - id: b1-u06-l4-e6
        type: multiple_choice
        prompt: Was bedeutet „Annem benim doktor olmamı istiyor.“?
        options: ['Meine Mutter möchte, dass ich Arzt werde.', Meine Mutter möchte Ärztin werden., Meine Mutter ist Ärztin.]
        answer: 'Meine Mutter möchte, dass ich Arzt werde.'
      - id: b1-u06-l4-e7
        type: word_bank
        prompt: Ich möchte, dass du mir die Wahrheit sagst.
        answers: [Bana doğruyu söylemeni istiyorum.]
        chunks:
          - { text: "Bana", role: complement }
          - { text: "doğruyu söylemeni", role: object }
          - { text: "istiyorum", role: predicate }
        distractors: [söylemek, söylüyorsun]
        explanation: Auch gerçeği söylemek (die Wahrheit sagen).
      - id: b1-u06-l4-e8
        type: word_bank
        prompt: Der Lehrer möchte, dass wir die Zeitung lesen.
        answers: [Öğretmen gazeteyi okumamızı istiyor.]
        chunks:
          - { text: "Öğretmen", role: subject }
          - { text: "gazeteyi okumamızı", role: object }
          - { text: "istiyor", role: predicate }
        distractors: [okumayı, okuyoruz]
      - id: b1-u06-l4-e9
        type: free_text
        direction: tr_de
        prompt: Senin gelmeni bekliyoruz.
        answers: ['Wir warten darauf, dass du kommst.', 'Wir warten, dass du kommst.', 'Wir erwarten, dass du kommst.', Wir warten auf dich., Wir warten auf dein Kommen.]
      - id: b1-u06-l4-e10
        type: multiple_choice
        prompt: Was ist der Unterschied? „Gitmek istiyorum.“ / „Gitmeni istiyorum.“
        options: ['Ich möchte gehen. / Ich möchte, dass du gehst.', Beides heißt dasselbe., Ich gehe. / Du gehst.]
        answer: 'Ich möchte gehen. / Ich möchte, dass du gehst.'
      - id: b1-u06-l4-e11
        type: suffix_builder
        stem: gelmek
        verbal: VN_IS
        target: geliş
        gloss_de: das Kommen, die Ankunft
        explanation: -iş bildet ein Nomen, oft ein festes Wort.
      - { id: b1-u06-l4-e12, type: suffix_builder, stem: gitmek, verbal: VN_IS, target: gidiş, gloss_de: 'das Gehen, die Hinfahrt (gidiş dönüş = hin und zurück)' }
      - id: b1-u06-l4-e13
        type: multiple_choice
        prompt: Was heißt „bakış açısı“?
        options: [Sichtweise, Fernsehsender, Schlagzeile]
        answer: Sichtweise
        explanation: bakış = Blick (bakmak + -ış), açı = Winkel.

  - id: b1-u06-l5
    type: dialog
    title: Hast du die Nachrichten gehört?
    exercises:
      - id: b1-u06-l5-e1
        type: word_bank
        prompt: Hast du die Nachrichten gehört?
        answers: [Haberleri duydun mu?, Haberleri dinledin mi?]
        distractors: [haber, duyuyor]
      - id: b1-u06-l5-e2
        type: free_text
        direction: tr_de
        prompt: Bu habere inanmak zor.
        answers: [Diese Nachricht ist schwer zu glauben., 'Es ist schwer, diese Nachricht zu glauben.', 'Es ist schwer, dieser Nachricht zu glauben.', Diese Nachricht ist kaum zu glauben., Man kann diese Nachricht kaum glauben., Diese Nachricht kann man kaum glauben.]
      - id: b1-u06-l5-e3
        type: multiple_choice
        prompt: Wie sagst du „Das glaube ich nicht.“?
        options: [Buna inanmıyorum., Bunu inanmıyorum., Buna inandım.]
        answer: Buna inanmıyorum.
        explanation: inanmak verlangt den Dativ, buna.
      - id: b1-u06-l5-e4
        type: word_bank
        prompt: Man muss die Quelle prüfen.
        answers: [Kaynağı kontrol etmek lazım., Kaynağı kontrol etmek gerek.]
        distractors: [kaynakta, ettim]
      - id: b1-u06-l5-e5
        type: word_bank
        prompt: Ich teile nicht gern Nachrichten in den sozialen Medien.
        answers: [Sosyal medyada haber paylaşmayı sevmem., Sosyal medyada haber paylaşmayı sevmiyorum.]
        chunks:
          - { text: "Sosyal medyada", role: place }
          - { text: "haber paylaşmayı", role: object }
          - { text: "sevmem", role: predicate }
        distractors: [paylaşmaya, severim]
      - id: b1-u06-l5-e6
        type: multiple_choice
        prompt: Was bedeutet „Bence bu haber yanlış.“?
        options: [Meiner Meinung nach ist diese Nachricht falsch., Diese Nachricht ist für mich., Ich habe diese Nachricht falsch verstanden.]
        answer: Meiner Meinung nach ist diese Nachricht falsch.
      - id: b1-u06-l5-e7
        type: free_text
        direction: de_tr
        prompt: Was ist deine Meinung?
        answers: [Senin fikrin ne?, Fikrin ne?, Sen ne düşünüyorsun?, Ne düşünüyorsun?, Sence?, Senin fikrin nedir?, Fikrin nedir?, Sen ne dersin?, Ne dersin?]
      - id: b1-u06-l5-e8
        type: conjugation
        mode: verb
        lemma: takip etmek
        person: 1sg
        tense: present
        target: takip ediyorum
        gloss_de: ich folge (einem Kanal), ich verfolge

