      - id: b1-u02-l3-e1
        type: conjugation
        mode: verb
        lemma: yazmak
        person: 3pl
        tense: aorist
        compound: evidential
        target: yazarlarmış
        gloss_de: sie sollen (früher immer) geschrieben haben
