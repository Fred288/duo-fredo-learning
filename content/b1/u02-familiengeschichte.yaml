      - { id: b1-u02-l3-e2, type: conjugation, mode: verb, lemma: yüzmek, person: 3sg, tense: aorist, compound: evidential, target: yüzermiş, gloss_de: 'er, sie soll (immer) geschwommen sein' }
      - { id: b1-u02-l3-e3, type: conjugation, mode: verb, lemma: okumak, person: 3sg, tense: aorist, compound: evidential, target: okurmuş, gloss_de: 'er, sie soll (immer) gelesen haben' }
      - { id: b1-u02-l3-e4, type: conjugation, mode: verb, lemma: gitmek, person: 1pl, tense: aorist, compound: evidential, target: gidermişiz, gloss_de: wir sollen (immer) gegangen sein }
      - { id: b1-u02-l3-e5, type: conjugation, mode: verb, lemma: içmek, person: 3sg, tense: aorist, compound: evidential, negative: true, target: içmezmiş, gloss_de: 'er, sie soll nie getrunken haben' }
      - { id: b1-u02-l3-e6, type: conjugation, mode: verb, lemma: gelmek, person: 3pl, tense: aorist, compound: evidential, target: gelirlermiş, gloss_de: sie sollen (immer) gekommen sein }
      - id: b1-u02-l3-e7
        type: multiple_choice
        prompt: Was bedeutet „Büyük dedem her sabah denizde yüzermiş.“?
        options: [Mein Urgroßvater soll jeden Morgen im Meer geschwommen sein., Mein Urgroßvater schwimmt jeden Morgen im Meer., Mein Urgroßvater ist einmal im Meer geschwommen.]
        answer: Mein Urgroßvater soll jeden Morgen im Meer geschwommen sein.
      - id: b1-u02-l3-e8
        type: word_bank
        prompt: Früher schrieben die Menschen Briefe, heißt es.
        answers: [Eskiden insanlar mektup yazarmış., İnsanlar eskiden mektup yazarmış.]
        chunks:
          - { text: "Eskiden", role: time }
          - { text: "insanlar", role: subject }
          - { text: "mektup", role: object_bare }
          - { text: "yazarmış", role: predicate }
        orders:
          - { order: [1, 0, 2, 3], note: "Auch üblich: das Subjekt zuerst." }
        distractors: [yazardı, mektubu]
      - id: b1-u02-l3-e9
        type: word_bank
        prompt: Als Kind soll ich viel geweint haben.
        answers: [Çocukken çok ağlarmışım.]
        chunks:
          - { text: "Çocukken", role: time }
          - { text: "çok", role: complement }
          - { text: "ağlarmışım", role: predicate }
        distractors: [ağlardım, ağlıyorum]
        explanation: ağlamak = weinen. Man weiß es nicht selbst, die Eltern haben es erzählt.
