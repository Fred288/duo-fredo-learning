# B1-02: Zeiten mit imiş (-iyormuş, -irmiş, -mişmiş, -ecekmiş, -ymiş); Erinnerungen, Familiengeschichte. Claude-Entwurf, ungeprüft (reviewed: false).
id: b1-u02
level: B1
title: Familiengeschichte
grammar_focus: [iyormus, irmis, mismis, ecekmis, masal]
explainer: explainers/b1-imis.md
source: eigene Formulierung (Claude-Entwurf)
license: CC BY-SA 4.0
reviewed: false
lessons:
  - id: b1-u02-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b1-u02-l1-e1
        type: multiple_choice
        prompt: Was heißt „büyük dede“?
        options: [Urgroßvater, Großvater, Onkel]
        answer: Urgroßvater
        explanation: Großvater ist dede oder büyükbaba; büyük dede ist eine Generation weiter. büyükanne ist die Großmutter.
      - id: b1-u02-l1-e2
        type: free_text
        direction: de_tr
        prompt: auswandern
        answers: [göç etmek]
        explanation: göç = Wanderung, Auswanderung; göçmen = Einwanderer(in), Migrant(in).
      - id: b1-u02-l1-e3
        type: multiple_choice
        prompt: Was heißt „akraba“?
        options: [Verwandte(r), Nachbar(in), Freund(in)]
        answer: Verwandte(r)
      - id: b1-u02-l1-e4
        type: multiple_choice
        prompt: Was heißt „torun“?
        options: [Enkel(in), Neffe, Cousin]
        answer: Enkel(in)
      - id: b1-u02-l1-e5
        type: free_text
        direction: de_tr
        prompt: arm
        answers: [fakir, yoksul]
      - id: b1-u02-l1-e6
        type: free_text
        direction: de_tr
        prompt: reich
        answers: [zengin]
      - id: b1-u02-l1-e7
        type: multiple_choice
        prompt: Was heißt „savaş“?
        options: [Krieg, Frieden, Reise]
        answer: Krieg
      - id: b1-u02-l1-e8
        type: multiple_choice
        prompt: Was heißt „meğer“?
        options: [wie sich herausstellte, deshalb, trotzdem]
        answer: wie sich herausstellte
        explanation: meğer steht oft mit -miş, weil man etwas erst später erfährt.
      - id: b1-u02-l1-e9
        type: free_text
        direction: de_tr
        prompt: Schiff
        answers: [gemi]
      - id: b1-u02-l1-e10
        type: multiple_choice
        prompt: Was heißt „terzi“?
        options: [Schneider(in), Bäcker(in), Fischer(in)]
        answer: Schneider(in)
      - id: b1-u02-l1-e11
        type: free_text
        direction: tr_de
        prompt: ayrılmak
        answers: [sich trennen, weggehen, verlassen, sich verabschieden, abreisen]
        explanation: Mit Ablativ, köyden ayrıldı = er hat das Dorf verlassen.
      - id: b1-u02-l1-e12
        type: multiple_choice
        prompt: Was heißt „âşık olmak“?
        options: [sich verlieben, sich streiten, sich erinnern]
        answer: sich verlieben
        explanation: Mit Dativ, birine âşık olmak = sich in jemanden verlieben.
      - id: b1-u02-l1-e13
        type: free_text
        direction: de_tr
        prompt: Geschichte, Erzählung
        answers: [hikâye, hikaye, öykü]
        explanation: hikâye wird mit und ohne â geschrieben.
      - id: b1-u02-l1-e14
        type: multiple_choice
        prompt: Was heißt „yüzyıl“?
        options: [Jahrhundert, Jahrzehnt, hundert Tage]
        answer: Jahrhundert
      - id: b1-u02-l1-e15
        type: free_text
        direction: de_tr
        prompt: alle, jeder
        answers: [herkes]
      - id: b1-u02-l1-e16
        type: multiple_choice
        prompt: Was heißt „nesil“?
        options: [Generation, Familie, Herkunft]
        answer: Generation
        explanation: Vor Vokal fällt das i aus, yeni nesli (die neue Generation, Akkusativ).

