  - id: b1-u02-r1
    type: reading
    title: 'Lesetext: Mein Urgroßvater'
    passage:
      sentences:
        - { tr: "Büyük dedem yüz yıl önce küçük bir köyde doğmuş.", de: "Mein Urgroßvater soll vor hundert Jahren in einem kleinen Dorf geboren worden sein." }
        - { tr: "Ailesi çok fakirmiş.", de: "Seine Familie soll sehr arm gewesen sein." }
        - { tr: "On iki yaşında bir terzinin yanında çalışmaya başlamış.", de: "Mit zwölf hat er angeblich bei einem Schneider zu arbeiten begonnen." }
        - { tr: "Her gün sabahtan akşama kadar çalışırmış.", de: "Er soll jeden Tag von morgens bis abends gearbeitet haben." }
        - { tr: "Yirmi yaşında Almanya'ya gidecekmiş.", de: "Mit zwanzig wollte er angeblich nach Deutschland gehen." }
        - { tr: "Ama sonra bir gemiyle İstanbul'a gitmiş.", de: "Aber dann ist er mit einem Schiff nach Istanbul gefahren." }
        - { tr: "İstanbul'da babaannemin annesiyle tanışmış.", de: "In Istanbul hat er die Mutter meiner Großmutter kennengelernt." }
        - { tr: "İkisi hemen birbirine âşık olmuş ve evlenmişler.", de: "Die beiden sollen sich sofort ineinander verliebt und geheiratet haben." }
        - { tr: "Büyük dedem sonra kendi dükkânını açmış.", de: "Mein Urgroßvater soll später seinen eigenen Laden eröffnet haben." }
        - { tr: "Herkes onun ceketlerini çok severmiş.", de: "Alle sollen seine Jacken sehr gemocht haben." }
        - { tr: "Ben onu hiç görmedim ama babam onun hikâyelerini hep anlatır.", de: "Ich habe ihn nie gesehen, aber mein Vater erzählt immer seine Geschichten." }
      glossary:
        - { tr: "fakirmiş", de: "soll arm gewesen sein (fakir + miş)", vocab: "fakir" }
        - { tr: "birbirine", de: "einander, ineinander (Dativ)" }
        - { tr: "hemen", de: "sofort" }
        - { tr: "âşık", de: "verliebt (âşık olmak = sich verlieben)", vocab: "âşık olmak" }
        - { tr: "dükkânını", de: "seinen Laden (dükkân = Laden, Geschäft)" }
    exercises:
      - id: b1-u02-r1-e1
        type: multiple_choice
        prompt: Wie war die Familie des Urgroßvaters?
        options: [sehr arm, sehr reich, sehr groß]
        answer: sehr arm
      - id: b1-u02-r1-e2
        type: multiple_choice
        prompt: Wo hat er mit zwölf gearbeitet?
        options: [bei einem Schneider, auf einem Schiff, in einer Fabrik]
