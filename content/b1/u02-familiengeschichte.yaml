        type: free_text
        direction: de_tr
        prompt: Mein Großvater soll nie Kaffee getrunken haben.
        answers: [Dedem hiç kahve içmezmiş., Dedem asla kahve içmezmiş., Dedem kahve içmezmiş., Dedem hiç kahve içmemiş.]
      - id: b1-u02-l3-e11
        type: multiple_choice
        prompt: Was ist der Unterschied? „Dedem kahve içmezdi.“ / „Dedem kahve içmezmiş.“
        options: [Ich weiß es selbst. / Ich habe es gehört., Beides heißt dasselbe., Er trinkt jetzt keinen Kaffee. / Er trank früher keinen.]
        answer: Ich weiß es selbst. / Ich habe es gehört.

