      - id: b1-u02-l2-e11
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: present
        compound: evidential
        question: true
        target: geliyor muymuş?
        gloss_de: Kommt er angeblich (gerade)?
        explanation: mi steht vor der Kopula, muymuş.

  - id: b1-u02-l3
