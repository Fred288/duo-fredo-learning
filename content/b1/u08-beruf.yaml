  - id: b1-u08-r1
    type: reading
    title: 'Lesetext: Mein Weg zum Beruf'
    passage:
      sentences:
        - { tr: "Lise yıllarımda hangi mesleği seçeceğimi bilmiyordum.", de: "In meinen Jahren auf dem Gymnasium wusste ich nicht, welchen Beruf ich wählen würde." }
        - { tr: "Babam doktor olmamı istiyordu ama ben bilgisayarları sevdiğim için mühendis olmak istedim.", de: "Mein Vater wollte, dass ich Arzt werde, aber weil ich Computer mochte, wollte ich Ingenieur werden." }
        - { tr: "Sonunda üniversitede bilgisayar mühendisliği okudum.", de: "Am Ende habe ich an der Universität Informatik studiert." }
        - { tr: "Okuduğum bölüm zordu ama çok şey öğrendim.", de: "Das Fach, das ich studiert habe, war schwer, aber ich habe viel gelernt." }
        - { tr: "Son sınıfta küçük bir şirkette staj yaptım.", de: "Im letzten Studienjahr habe ich in einer kleinen Firma ein Praktikum gemacht." }
        - { tr: "Staj yaptığım şirketteki insanlar bana çok yardım etti.", de: "Die Leute in der Firma, in der ich das Praktikum gemacht habe, haben mir sehr geholfen." }
        - { tr: "Mezun oldum ve birçok şirkete başvurdum.", de: "Ich habe meinen Abschluss gemacht und mich bei vielen Firmen beworben." }
        - { tr: "İlk iş görüşmemde ne söyleyeceğimi bilmiyordum.", de: "Bei meinem ersten Vorstellungsgespräch wusste ich nicht, was ich sagen sollte." }
        - { tr: "Ama müdür anlattığım projeleri çok beğendi.", de: "Aber dem Chef haben die Projekte, von denen ich erzählt habe, sehr gefallen." }
        - { tr: "Şimdi o şirkette çalışıyorum ve yaptığım işi çok seviyorum.", de: "Jetzt arbeite ich in dieser Firma und liebe die Arbeit, die ich mache." }
        - { tr: "Gelecek yıl şirketin beni göndereceği bir kursa katılacağım.", de: "Nächstes Jahr werde ich an einem Kurs teilnehmen, zu dem mich die Firma schickt." }
      glossary:
        - { tr: "yıllarımda", de: "in meinen Jahren (yıl + lar + ım + da)", vocab: "yıl" }
        - { tr: "zordu", de: "war schwer (zor + -du)", vocab: "zor" }
        - { tr: "şey", de: "Sache, Ding (çok şey = viel)" }
        - { tr: "mühendisliği", de: "das Ingenieurwesen (mühendis + lik + i)", vocab: "mühendis" }
        - { tr: "şirketteki", de: "in der Firma befindlich (şirket + te + ki)", vocab: "şirket" }
        - { tr: "birçok", de: "viele" }
