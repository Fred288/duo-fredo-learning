  - id: b1-u10-r1
    type: reading
    title: 'Lesetext: Feuer beim Nachbarn'
    passage:
      sentences:
        - { tr: "Dün gece saat ikide bir ses duyup uyandım.", de: "Gestern Nacht um zwei Uhr hörte ich ein Geräusch und wachte auf." }
        - { tr: "Pencereden bakınca komşunun dairesinden duman çıktığını gördüm.", de: "Als ich aus dem Fenster schaute, sah ich, dass aus der Wohnung des Nachbarn Rauch kam." }
        - { tr: "Hemen 112'yi arayıp yangın olduğunu söyledim.", de: "Ich rief sofort die 112 an und sagte, dass es brennt." }
        - { tr: "Telefondaki kadın itfaiyenin beş dakika içinde geleceğini söyledi.", de: "Die Frau am Telefon sagte, dass die Feuerwehr in fünf Minuten kommen würde." }
        - { tr: "Ben de \"Yangın var!\" diye bağırarak komşuları uyandırdım.", de: "Ich weckte die Nachbarn, indem ich „Feuer!“ rief." }
        - { tr: "Komşum yaşlı bir adam ve alt katta yalnız yaşıyor.", de: "Mein Nachbar ist ein alter Mann und lebt allein im Stockwerk unter mir." }
        - { tr: "İtfaiye gelmeden önce onunla birlikte dışarı çıktık.", de: "Bevor die Feuerwehr kam, gingen wir zusammen hinaus." }
        - { tr: "İtfaiyeciler geldikten sonra yangını kısa sürede söndürdü.", de: "Nachdem die Feuerwehrleute gekommen waren, löschten sie den Brand in kurzer Zeit." }
        - { tr: "Neyse ki kimse yaralanmadı.", de: "Zum Glück wurde niemand verletzt." }
        - { tr: "Komşum ağlayarak bana teşekkür etti.", de: "Mein Nachbar bedankte sich weinend bei mir." }
        - { tr: "Yangın çıkalı bir hafta oldu ama hâlâ o geceyi düşünüyorum.", de: "Seit dem Brand ist eine Woche vergangen, aber ich denke immer noch an jene Nacht." }
      glossary:
        - { tr: "112", de: "112 (Notruf)" }
        - { tr: "Telefondaki", de: "am Telefon (telefon + da + ki)", vocab: "telefon" }
        - { tr: "uyandırdım", de: "ich weckte (uyandırmak = wecken)", vocab: "uyanmak" }
