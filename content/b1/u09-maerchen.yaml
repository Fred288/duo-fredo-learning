  - id: b1-u09-l2
    type: grammar
    title: Und dann … (-ip)
    exercises:
      - id: b1-u09-l2-e1
        type: suffix_builder
        stem: gelmek
        verbal: CV_IP
        target: gelip
        gloss_de: 'kam und …, kommen und …'
        explanation: -ip verbindet zwei Handlungen nacheinander; Zeit und Person stehen nur am letzten Verb.
      - { id: b1-u09-l2-e2, type: suffix_builder, stem: almak, verbal: CV_IP, target: alıp, gloss_de: 'nahm und …, nehmen und …' }
      - { id: b1-u09-l2-e3, type: suffix_builder, stem: oturmak, verbal: CV_IP, target: oturup, gloss_de: 'setzte sich und …' }
      - { id: b1-u09-l2-e4, type: suffix_builder, stem: kalkmak, verbal: CV_IP, target: kalkıp, gloss_de: 'stand auf und …' }
      - id: b1-u09-l2-e5
        type: suffix_builder
        stem: gitmek
        verbal: CV_IP
        target: gidip
        gloss_de: 'ging und …, gehen und …'
        explanation: Vor Vokal wird t zu d, gidip.
      - id: b1-u09-l2-e6
        type: suffix_builder
        stem: demek
        verbal: CV_IP
        target: deyip
        gloss_de: 'sagte und …'
        explanation: Anders als diyor, diyecek bleibt das e hier, deyip.
      - id: b1-u09-l2-e7
        type: word_bank
        prompt: Der Fuchs ging in den Wald und versteckte sich.
        answers: [Tilki ormana gidip saklandı.]
        chunks:
          - { text: "Tilki", role: subject }
          - { text: "ormana gidip", role: complement }
          - { text: "saklandı", role: predicate }
        distractors: [gitti, saklanıp]
      - id: b1-u09-l2-e8
        type: word_bank
        prompt: Er stand auf und öffnete das Fenster.
        answers: [Kalkıp pencereyi açtı.]
        distractors: [kalktı, açıp]
      - id: b1-u09-l2-e9
        type: multiple_choice
        prompt: Was bedeutet „Eve gelip yemek yedim.“?
        options: [Ich bin nach Hause gekommen und habe gegessen., 'Ich bin nach Hause gekommen, ohne zu essen.', 'Als ich nach Hause kam, aß ich gerade.']
        answer: Ich bin nach Hause gekommen und habe gegessen.
      - id: b1-u09-l2-e10
        type: free_text
        direction: tr_de
        prompt: Oturup konuşalım.
        answers: [Setzen wir uns und reden wir., Setzen wir uns und reden., Setzen wir uns hin und reden., Setzen wir uns hin und reden wir., Lass uns hinsetzen und reden., Lasst uns hinsetzen und reden.]
        explanation: Die Wunschform -elim gilt für beide Verben.
      - id: b1-u09-l2-e11
        type: free_text
        direction: de_tr
        prompt: Er kam und setzte sich. (mit -ip)
        answers: [Gelip oturdu., O gelip oturdu.]
      - id: b1-u09-l2-e12
        type: multiple_choice
        prompt: Welche Form passt? „Ekmek … eve döndü.“ (kaufte und)
        options: [alıp, almak, alır]
        answer: alıp

  - id: b1-u09-l3
    type: grammar
    title: Lachend, indem … (-erek)
    exercises:
      - id: b1-u09-l3-e1
        type: suffix_builder
        stem: gülmek
        verbal: CV_ARAK
        target: gülerek
        gloss_de: lachend
        explanation: -erek beschreibt, wie oder wodurch etwas geschieht, gleichzeitig mit dem Hauptverb.
      - { id: b1-u09-l3-e2, type: suffix_builder, stem: koşmak, verbal: CV_ARAK, target: koşarak, gloss_de: 'rennend, im Laufschritt' }
      - { id: b1-u09-l3-e3, type: suffix_builder, stem: ağlamak, verbal: CV_ARAK, target: ağlayarak, gloss_de: weinend }
      - { id: b1-u09-l3-e4, type: suffix_builder, stem: düşünmek, verbal: CV_ARAK, target: düşünerek, gloss_de: 'nachdenkend, überlegt' }
      - id: b1-u09-l3-e5
        type: suffix_builder
        stem: demek
        verbal: CV_ARAK
        target: diyerek
        gloss_de: 'indem er, sie sagte; mit den Worten'
        explanation: Vor -yerek wird de zu di, wie diyor.
      - { id: b1-u09-l3-e6, type: suffix_builder, stem: yürümek, verbal: CV_ARAK, target: yürüyerek, gloss_de: 'zu Fuß, gehend' }
      - id: b1-u09-l3-e7
        type: word_bank
        prompt: Das Mädchen lief weinend nach Hause.
        answers: [Kız ağlayarak eve koştu., Kız eve ağlayarak koştu.]
        chunks:
          - { text: "Kız", role: subject }
          - { text: "ağlayarak", role: complement }
          - { text: "eve", role: complement }
          - { text: "koştu", role: predicate }
        orders:
          - { order: [0, 2, 1, 3] }
        distractors: [ağlıyor, koşmak]
      - id: b1-u09-l3-e8
        type: word_bank
        prompt: Wir sind zu Fuß zur Schule gegangen.
        answers: [Okula yürüyerek gittik., Yürüyerek okula gittik.]
        distractors: [yürümek, gidiyoruz]
      - id: b1-u09-l3-e9
        type: multiple_choice
        prompt: Was bedeutet „Gülerek cevap verdi.“?
        options: [Er antwortete lachend., Er lachte und antwortete dann., 'Er antwortete, ohne zu lachen.']
        answer: Er antwortete lachend.
        explanation: Gleichzeitig = -erek; nacheinander wäre gülüp cevap verdi.
      - id: b1-u09-l3-e10
        type: free_text
        direction: tr_de
        prompt: Türkçeyi dizi izleyerek öğrendim.
        answers: ['Ich habe Türkisch gelernt, indem ich Serien geschaut habe.', 'Ich habe Türkisch gelernt, indem ich Serien gesehen habe.', 'Ich habe Türkisch gelernt, indem ich Serien sah.', Ich habe Türkisch durch Serien gelernt., Ich habe Türkisch mit Serien gelernt., Ich habe Türkisch beim Serienschauen gelernt., Ich habe durch Serienschauen Türkisch gelernt.]
      - id: b1-u09-l3-e11
        type: multiple_choice
        prompt: Welche Form passt? „Çocuk … uyudu.“ (weinend)
        options: [ağlayarak, ağlamak, ağlamaya]
        answer: ağlayarak
      - id: b1-u09-l3-e12
        type: free_text
        direction: de_tr
        prompt: lachend
        answers: [gülerek]

  - id: b1-u09-l4
    type: grammar
    title: Ohne zu … (-meden)
    exercises:
      - id: b1-u09-l4-e1
        type: suffix_builder
        stem: söylemek
        verbal: CV_MADAN
        target: söylemeden
        gloss_de: ohne zu sagen
        explanation: -meden ist schon verneint, ein -me davor gibt es nicht.
      - { id: b1-u09-l4-e2, type: suffix_builder, stem: bakmak, verbal: CV_MADAN, target: bakmadan, gloss_de: ohne zu schauen }
      - { id: b1-u09-l4-e3, type: suffix_builder, stem: düşünmek, verbal: CV_MADAN, target: düşünmeden, gloss_de: ohne nachzudenken }
      - id: b1-u09-l4-e4
        type: suffix_builder
        stem: yemek
        verbal: CV_MADAN
        target: yemeden
        gloss_de: ohne zu essen
        explanation: Vor -meden bleibt ye unverändert (yemeden, nicht yimeden).
      - id: b1-u09-l4-e5
        type: suffix_builder
        stem: gelmek
        verbal: CV_MADAN
        ability: true
        target: gelemeden
        gloss_de: ohne kommen zu können
        explanation: Mit -e (können) davor, gel-e-meden.
      - { id: b1-u09-l4-e6, type: suffix_builder, stem: uyumak, verbal: CV_MADAN, target: uyumadan, gloss_de: ohne zu schlafen }
      - id: b1-u09-l4-e7
        type: word_bank
        prompt: 'Er ging, ohne etwas zu sagen.'
        answers: [Bir şey söylemeden gitti., Hiçbir şey söylemeden gitti.]
        distractors: [söyleyip, gidiyor]
      - id: b1-u09-l4-e8
        type: word_bank
        prompt: 'Das Kind ist zur Schule gegangen, ohne zu frühstücken.'
        answers: [Çocuk kahvaltı yapmadan okula gitti., Çocuk okula kahvaltı yapmadan gitti.]
        chunks:
          - { text: "Çocuk", role: subject }
          - { text: "kahvaltı yapmadan", role: complement }
          - { text: "okula", role: complement }
          - { text: "gitti", role: predicate }
        orders:
          - { order: [0, 2, 1, 3] }
        distractors: [yapıp, yapmak]
      - id: b1-u09-l4-e9
        type: multiple_choice
        prompt: Was bedeutet „Düşünmeden konuşma!“?
        options: ['Sprich nicht, ohne nachzudenken!', Denk nach und sprich!, Sprich nicht beim Denken!]
        answer: 'Sprich nicht, ohne nachzudenken!'
      - id: b1-u09-l4-e10
        type: free_text
        direction: tr_de
        prompt: Kapıyı çalmadan içeri girdi.
        answers: ['Er kam herein, ohne anzuklopfen.', 'Sie kam herein, ohne anzuklopfen.', 'Er ist hereingekommen, ohne anzuklopfen.', 'Sie ist hereingekommen, ohne anzuklopfen.', 'Er ging hinein, ohne anzuklopfen.', 'Sie ging hinein, ohne anzuklopfen.', 'Er trat ein, ohne anzuklopfen.', 'Sie trat ein, ohne anzuklopfen.', 'Er kam rein, ohne zu klopfen.', 'Sie kam rein, ohne zu klopfen.']
        explanation: kapıyı çalmak = an die Tür klopfen.
      - id: b1-u09-l4-e11
        type: multiple_choice
        prompt: Welche Form ist richtig? (ohne zu essen)
        options: [yemeden, yimeden, yemedin]
        answer: yemeden
      - id: b1-u09-l4-e12
        type: free_text
        direction: de_tr
        prompt: ohne zu schauen
        answers: [bakmadan]

  - id: b1-u09-l5
    type: dialog
    title: Erzähl mir ein Märchen!
    exercises:
      - id: b1-u09-l5-e1
        type: word_bank
        prompt: Erzähl mir ein Märchen!
        answers: [Bana bir masal anlat!, Bana masal anlat!]
        distractors: [anlattı, masalda]
      - id: b1-u09-l5-e2
        type: multiple_choice
        prompt: Was bedeutet „Masalı dinleyip uyudu.“?
        options: [Er hörte das Märchen und schlief ein., 'Er schlief ein, ohne das Märchen zu hören.', Er hörte das Märchen im Schlaf.]
        answer: Er hörte das Märchen und schlief ein.
      - id: b1-u09-l5-e3
        type: free_text
        direction: tr_de
        prompt: Sonra ne olmuş?
        answers: [Was ist dann passiert?, Was ist danach passiert?, Was passierte dann?, Was geschah dann?, Und was ist dann passiert?, Und dann?]
        explanation: Im Märchen steht -miş, man erzählt Gehörtes.
      - id: b1-u09-l5-e4
        type: word_bank
        prompt: Der Fuchs floh lachend.
        answers: [Tilki gülerek kaçtı.]
        chunks:
          - { text: "Tilki", role: subject }
          - { text: "gülerek", role: complement }
          - { text: "kaçtı", role: predicate }
        distractors: [güldü, kaçmak]
      - id: b1-u09-l5-e5
        type: conjugation
        mode: verb
        lemma: kaçmak
        person: 3sg
        tense: evidential
        target: kaçmış
        gloss_de: 'er, sie floh (im Märchen)'
      - id: b1-u09-l5-e6
        type: multiple_choice
        prompt: Wie endet ein türkisches Märchen oft?
        options: ['Onlar ermiş muradına, biz çıkalım kerevetine.', Bir varmış bir yokmuş., Afiyet olsun.]
        answer: 'Onlar ermiş muradına, biz çıkalım kerevetine.'
        explanation: Etwa „Ihr Wunsch hat sich erfüllt, und wir steigen auf ihren Diwan“ (murat = Wunsch, kerevet = Holzdiwan). Bir varmış bir yokmuş ist der Anfang.
      - id: b1-u09-l5-e7
        type: free_text
        direction: tr_de
        prompt: Cadı sihirli bir elma verip kaybolmuş.
        answers: [Die Hexe gab einen Zauberapfel und verschwand., Die Hexe hat einen Zauberapfel gegeben und ist verschwunden., Die Hexe gab einen verzauberten Apfel und verschwand., Die Hexe gab einen magischen Apfel und verschwand., Die Hexe soll einen Zauberapfel gegeben haben und verschwunden sein.]
      - id: b1-u09-l5-e8
        type: multiple_choice
        prompt: Wie sagst du „ohne zu schlafen“?
        options: [uyumadan, uyuyarak, uyuyup]
        answer: uyumadan

