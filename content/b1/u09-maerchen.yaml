  - id: b1-u09-r1
    type: reading
    title: 'Lesetext: Der kluge Fuchs'
    passage:
      sentences:
        - { tr: "Bir varmış bir yokmuş, büyük bir ormanda akıllı bir tilki yaşarmış.", de: "Es war einmal ein kluger Fuchs, der in einem großen Wald lebte." }
        - { tr: "Bir gün tilki çok acıkmış ve yiyecek aramaya çıkmış.", de: "Eines Tages bekam der Fuchs großen Hunger und machte sich auf die Suche nach etwas zu essen." }
        - { tr: "Yolda eski bir kuyu görüp yanına gitmiş.", de: "Unterwegs sah er einen alten Brunnen und ging zu ihm." }
        - { tr: "Kuyunun içinde ağlayan bir kurt varmış.", de: "Im Brunnen war ein Wolf, der weinte." }
        - { tr: "Kurt ağlayarak \"Lütfen bana yardım et!\" demiş.", de: "Der Wolf sagte weinend: „Bitte hilf mir!“" }
        - { tr: "Tilki hiç düşünmeden kuyuya bir ip atmış.", de: "Der Fuchs warf, ohne nachzudenken, ein Seil in den Brunnen." }
        - { tr: "Kurt ipe tutunup dışarı çıkmış.", de: "Der Wolf hielt sich am Seil fest und kletterte heraus." }
        - { tr: "Ama teşekkür etmeden tilkiyi yemek istemiş.", de: "Aber ohne sich zu bedanken, wollte er den Fuchs fressen." }
        - { tr: "Tilki gülerek \"Görmedin mi? Kuyunun dibinde altın var!\" demiş.", de: "Der Fuchs sagte lachend: „Hast du es nicht gesehen? Unten im Brunnen liegt Gold!“" }
        - { tr: "Açgözlü kurt altını almak için hemen kuyuya atlamış.", de: "Der gierige Wolf sprang sofort in den Brunnen, um das Gold zu holen." }
        - { tr: "Tilki de arkasına bakmadan koşarak kaçmış.", de: "Und der Fuchs rannte davon, ohne sich umzusehen." }
      glossary:
        - { tr: "yiyecek", de: "etwas zu essen (yemek + -ecek)", vocab: "yemek" }
        - { tr: "varmış", de: "es gab (var + -mış, erzählt)", vocab: "var" }
        - { tr: "yokmuş", de: "es gab nicht (yok + -muş; Bir varmış bir yokmuş = Es war einmal)", vocab: "yok" }
        - { tr: "tutunup", de: "hielt sich fest und … (tutunmak)" }
        - { tr: "teşekkür", de: "Dank (teşekkür etmek = sich bedanken)" }
        - { tr: "etmeden", de: "ohne zu machen (etmek; teşekkür etmeden = ohne sich zu bedanken)" }
        - { tr: "dibinde", de: "unten in, am Grund (dip + i + nde)" }
        - { tr: "açgözlü", de: "gierig (aç = hungrig, göz = Auge)" }
        - { tr: "mi", de: "Fragepartikel (Görmedin mi? = Hast du es nicht gesehen?)" }
        - { tr: "yardım", de: "Hilfe (yardım etmek = helfen)", vocab: "yardım etmek" }
    exercises:
      - id: b1-u09-r1-e1
        type: multiple_choice
        prompt: Wo war der Wolf?
        options: [Im Brunnen., Hinter einem Baum., Im Haus des Fuchses.]
        answer: Im Brunnen.
      - id: b1-u09-r1-e2
        type: multiple_choice
        prompt: Was hat der Fuchs gemacht, als der Wolf um Hilfe bat?
        options: [Er warf ein Seil in den Brunnen., Er lief sofort weg., Er holte andere Tiere.]
        answer: Er warf ein Seil in den Brunnen.
      - id: b1-u09-r1-e3
        type: multiple_choice
        prompt: Was wollte der Wolf, als er draußen war?
        options: [Den Fuchs fressen., Nach Hause gehen., Schlafen.]
        answer: Den Fuchs fressen.
      - id: b1-u09-r1-e4
        type: multiple_choice
        prompt: Wie ist der Fuchs entkommen?
        options: [Er hat den Wolf mit dem Gold überlistet., Er hat mit dem Wolf gekämpft., Ein Jäger hat ihn gerettet.]
        answer: Er hat den Wolf mit dem Gold überlistet.
      - id: b1-u09-r1-e5
        type: free_text
        direction: tr_de
        prompt: Tilki arkasına bakmadan kaçmış.
        answers: ['Der Fuchs floh, ohne sich umzusehen.', 'Der Fuchs lief weg, ohne sich umzusehen.', 'Der Fuchs ist geflohen, ohne sich umzusehen.', 'Der Fuchs ist weggelaufen, ohne sich umzusehen.', 'Der Fuchs floh, ohne zurückzuschauen.', 'Der Fuchs lief weg, ohne zurückzuschauen.', 'Der Fuchs floh, ohne sich umzudrehen.', 'Der Fuchs lief weg, ohne sich umzudrehen.']

