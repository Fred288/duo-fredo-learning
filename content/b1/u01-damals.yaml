  - id: b1-u01-r1
    type: reading
    title: 'Lesetext: Meine Kindheit im Dorf'
    passage:
      sentences:
        - { tr: "Ben küçük bir köyde büyüdüm.", de: "Ich bin in einem kleinen Dorf aufgewachsen." }
        - { tr: "Babam tarlada çalışırdı, annem ineklere bakardı.", de: "Mein Vater arbeitete auf dem Feld, meine Mutter kümmerte sich um die Kühe." }
        - { tr: "Her sabah erken kalkardık.", de: "Jeden Morgen standen wir früh auf." }
        - { tr: "Okulumuz uzaktı, her gün yürüyerek giderdik.", de: "Unsere Schule war weit weg, wir gingen jeden Tag zu Fuß." }
        - { tr: "Okuldan sonra derede yüzerdik ya da ağaçlara tırmanırdık.", de: "Nach der Schule schwammen wir im Bach oder kletterten auf Bäume." }
        - { tr: "Akşamları dedem bize masal anlatırdı.", de: "Abends erzählte uns mein Großvater Märchen." }
        - { tr: "Bir akşam masalı ben anlattım, dedem dinledi.", de: "Eines Abends habe ich das Märchen erzählt, und mein Großvater hat zugehört." }
        - { tr: "Babam üniversiteye gitmemi istiyordu.", de: "Mein Vater wollte, dass ich an die Universität gehe." }
        - { tr: "On sekiz yaşında şehre taşındım.", de: "Mit achtzehn bin ich in die Stadt gezogen." }
        - { tr: "O zamana kadar okulu çoktan bitirmiştim.", de: "Bis dahin hatte ich die Schule längst abgeschlossen." }
