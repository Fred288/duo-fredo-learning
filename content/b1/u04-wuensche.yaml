lessons:
  - id: b1-u04-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b1-u04-l1-e1
        type: multiple_choice
        prompt: Was heißt „fırtına“?
        options: [Sturm, Nebel, Wolke]
        answer: Sturm
      - id: b1-u04-l1-e2
        type: free_text
        direction: de_tr
        prompt: Nebel
        answers: [sis]
      - id: b1-u04-l1-e3
        type: multiple_choice
        prompt: Was heißt „şemsiye“?
        options: [Regenschirm, Mantel, Stiefel]
        answer: Regenschirm
      - id: b1-u04-l1-e4
        type: multiple_choice
        prompt: Was heißt „ısınmak“?
        options: [warm werden, kalt werden, schmelzen]
        answer: warm werden
        explanation: Gegenteil soğumak (kalt werden).
      - id: b1-u04-l1-e5
        type: free_text
        direction: de_tr
        prompt: schmelzen
        answers: [erimek]
      - id: b1-u04-l1-e6
        type: multiple_choice
        prompt: Was heißt „buzul“?
        options: [Gletscher, Eis, Schnee]
        answer: Gletscher
        explanation: buz = Eis.
      - id: b1-u04-l1-e7
        type: multiple_choice
        prompt: Was heißt „kuraklık“?
        options: [Dürre, Hochwasser, Hitze]
        answer: Dürre
        explanation: kurak (dürr) + -lık; sel = Hochwasser.
      - id: b1-u04-l1-e8
        type: free_text
        direction: de_tr
        prompt: Hoffnung
        answers: [umut]
        explanation: Vor Vokal wird t zu d, umudum (meine Hoffnung).
      - id: b1-u04-l1-e9
        type: multiple_choice
        prompt: Was heißt „keşke“?
        options: [wenn doch nur, hoffentlich, vielleicht]
        answer: wenn doch nur
      - id: b1-u04-l1-e10
        type: multiple_choice
        prompt: Was heißt „umarım“?
        options: [hoffentlich, leider, natürlich]
        answer: hoffentlich
        explanation: Wörtlich „ich hoffe“ (ummak = hoffen).
      - id: b1-u04-l1-e11
        type: free_text
        direction: de_tr
        prompt: Wetterbericht
        answers: [hava durumu]
      - id: b1-u04-l1-e12
        type: multiple_choice
        prompt: Was heißt „hayal etmek“?
        options: [sich vorstellen, sich erinnern, hoffen]
        answer: sich vorstellen
        explanation: hayal = Vorstellung, Traum; hayal etmek = sich vorstellen, träumen von.
      - id: b1-u04-l1-e13
        type: free_text
        direction: de_tr
        prompt: Ausflug
        answers: [gezi]
      - id: b1-u04-l1-e14
        type: multiple_choice
        prompt: Was heißt „Hadi!“?
        options: [Komm schon! Los!, Halt!, Vorsicht!]
        answer: Komm schon! Los!
      - id: b1-u04-l1-e15
        type: free_text
        direction: tr_de
        prompt: durmak
        answers: [aufhören, stehen bleiben, anhalten, stehen]
        explanation: yağmur durdu = der Regen hat aufgehört.

