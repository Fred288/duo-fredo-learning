# B1-04: Wunschformen (Optativ -eyim/-elim, keşke + -se, keşke + -seydi, umarım); Wetter, Klima, Pläne. Claude-Entwurf, ungeprüft (reviewed: false).
id: b1-u04
level: B1
title: Wetter und Wünsche
grammar_focus: [optativ, keske, seydi, umarim]
explainer: explainers/b1-wunsch.md
source: eigene Formulierung (Claude-Entwurf)
