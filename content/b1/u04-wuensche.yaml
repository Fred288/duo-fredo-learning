  - id: b1-u04-r1
    type: reading
    title: 'Lesetext: Ein Brief an meine Enkelin'
    passage:
      sentences:
        - { tr: "Sevgili torunum, bu mektubu senin için yazıyorum.", de: "Meine liebe Enkelin, diesen Brief schreibe ich für dich." }
        - { tr: "Bugün hava çok sıcak, yazlar her yıl daha da ısınıyor.", de: "Heute ist es sehr heiß, die Sommer werden jedes Jahr noch wärmer." }
        - { tr: "Kışın artık pek kar yağmıyor.", de: "Im Winter schneit es kaum noch." }
        - { tr: "Dağlardaki buzullar eriyor.", de: "Die Gletscher in den Bergen schmelzen." }
        - { tr: "Keşke daha önce bir şey yapsaydık.", de: "Hätten wir doch früher etwas getan." }
        - { tr: "Ama hâlâ umudum var.", de: "Aber ich habe noch Hoffnung." }
        - { tr: "Bu yıl mahallemizde yüz ağaç diktik.", de: "Dieses Jahr haben wir in unserem Viertel hundert Bäume gepflanzt." }
        - { tr: "Hadi, birlikte ağaç dikelim!", de: "Los, lass uns zusammen Bäume pflanzen!" }
        - { tr: "Umarım senin dünyan daha yeşil olur.", de: "Hoffentlich wird deine Welt grüner." }
        - { tr: "Keşke o zaman yanında olsam ve seninle konuşsam.", de: "Ich wünschte, ich könnte dann bei dir sein und mit dir reden." }
        - { tr: "Sevgilerle, büyükannen", de: "Alles Liebe, deine Großmutter" }
      glossary:
        - { tr: "sevgili", de: "lieb (in der Anrede: Sevgili …)" }
        - { tr: "her", de: "jede(r, s) (her yıl = jedes Jahr)" }
        - { tr: "artık", de: "nicht mehr (mit Verneinung), jetzt, inzwischen" }
        - { tr: "da", de: "auch, noch (daha da = noch mehr)" }
        - { tr: "birlikte", de: "zusammen" }
        - { tr: "kışın", de: "im Winter", vocab: "kış" }
        - { tr: "dağlardaki", de: "die in den Bergen (dağ + ler + de + ki)", vocab: "dağ" }
        - { tr: "şey", de: "Sache, Ding (bir şey = etwas)" }
        - { tr: "hâlâ", de: "noch, immer noch" }
        - { tr: "zaman", de: "Zeit (o zaman = dann, damals)", vocab: "zaman" }
        - { tr: "sevgilerle", de: "alles Liebe (Briefschluss)" }
        - { tr: "büyükannen", de: "deine Großmutter (büyükanne + n)" }
    exercises:
      - id: b1-u04-r1-e1
        type: multiple_choice
        prompt: Was passiert mit den Sommern?
        options: [Sie werden jedes Jahr wärmer., Sie werden kürzer., Sie werden kälter.]
        answer: Sie werden jedes Jahr wärmer.
      - id: b1-u04-r1-e2
        type: multiple_choice
        prompt: Was bedauert die Großmutter?
        options: [Dass man nicht früher etwas getan hat., Dass sie keine Bäume gepflanzt hat., Dass ihre Enkelin nicht schreibt.]
        answer: Dass man nicht früher etwas getan hat.
      - id: b1-u04-r1-e3
        type: multiple_choice
        prompt: Was hat das Viertel dieses Jahr gemacht?
        options: [hundert Bäume gepflanzt, einen Park gebaut, Müll gesammelt]
        answer: hundert Bäume gepflanzt
      - id: b1-u04-r1-e4
        type: multiple_choice
        prompt: Welcher Satz drückt eine Hoffnung aus?
        options: [Umarım senin dünyan daha yeşil olur., Keşke daha önce bir şey yapsaydık., Dağlardaki buzullar eriyor.]
        answer: Umarım senin dünyan daha yeşil olur.
      - id: b1-u04-r1-e5
        type: free_text
        direction: tr_de
        prompt: Ama hâlâ umudum var.
        answers: [Aber ich habe noch Hoffnung., Aber ich habe immer noch Hoffnung., Aber ich bin noch hoffnungsvoll., Aber ich hoffe noch.]

  - id: b1-u04-l7
    type: review
    title: Wiederholung
    exercises:
      - id: b1-u04-l7-e1
        type: free_text
        direction: de_tr
        prompt: lass uns gehen
