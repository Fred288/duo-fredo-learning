        type: conjugation
        mode: verb
        lemma: gitmek
        person: 1pl
        tense: optative
        target: gidelim
        gloss_de: lass uns gehen
        explanation: git- + elim, vor Vokal wird t zu d.
      - { id: b1-u04-l2-e2, type: conjugation, mode: verb, lemma: yapmak, person: 1pl, tense: optative, target: yapalım, gloss_de: lass uns machen }
      - id: b1-u04-l2-e3
        type: conjugation
        mode: verb
        lemma: okumak
        person: 1sg
        tense: optative
        target: okuyayım
        gloss_de: ich will mal lesen, lass mich lesen
        explanation: Nach Vokal mit y, oku-y-ayım.
      - { id: b1-u04-l2-e4, type: conjugation, mode: verb, lemma: bakmak, person: 1sg, tense: optative, target: bakayım, gloss_de: lass mich mal schauen }
      - id: b1-u04-l2-e5
        type: conjugation
        mode: verb
        lemma: yemek
        person: 1pl
        tense: optative
        target: yiyelim
        gloss_de: lass uns essen
        explanation: ye- wird vor y zu yi-, yiyelim.
      - { id: b1-u04-l2-e6, type: conjugation, mode: verb, lemma: beklemek, person: 1pl, tense: optative, negative: true, target: beklemeyelim, gloss_de: lass uns nicht warten }
      - id: b1-u04-l2-e7
        type: conjugation
        mode: verb
        lemma: gitmek
        person: 1pl
        tense: optative
        question: true
        target: gidelim mi?
        gloss_de: Sollen wir gehen?
      - { id: b1-u04-l2-e8, type: conjugation, mode: verb, lemma: söylemek, person: 1sg, tense: optative, question: true, target: söyleyeyim mi?, gloss_de: Soll ich es sagen? }
      - id: b1-u04-l2-e9
        type: multiple_choice
        prompt: Was bedeutet „Hadi parka gidelim!“?
        options: ['Komm, lass uns in den Park gehen!', Wir sind in den Park gegangen., Wir gehen jeden Tag in den Park.]
        answer: 'Komm, lass uns in den Park gehen!'
      - id: b1-u04-l2-e10
        type: word_bank
        prompt: Lass uns heute ein Picknick machen.
        answers: [Bugün piknik yapalım.]
        chunks:
          - { text: "Bugün", role: time }
          - { text: "piknik", role: object_bare }
          - { text: "yapalım", role: predicate }
        distractors: [yapıyoruz, dün]
      - id: b1-u04-l2-e11
        type: word_bank
        prompt: Soll ich das Fenster aufmachen?
        answers: [Pencereyi açayım mı?]
        distractors: [açar, pencerede]
      - id: b1-u04-l2-e12
        type: free_text
        direction: tr_de
        prompt: Biraz dinlenelim mi?
        answers: [Ruhen wir uns ein bisschen aus?, Sollen wir uns ein bisschen ausruhen?, Wollen wir uns ein bisschen ausruhen?, Sollen wir uns kurz ausruhen?, Wollen wir uns kurz ausruhen?, Sollen wir eine kurze Pause machen?, Machen wir eine kleine Pause?]
      - id: b1-u04-l2-e13
        type: multiple_choice
        prompt: Wie sagst du „Gehen wir nicht raus, es regnet.“?
        options: ['Dışarı çıkmayalım, yağmur yağıyor.', 'Dışarı çıkmıyoruz, yağmur yağdı.', 'Dışarı çıkalım, yağmur yağıyor.']
        answer: 'Dışarı çıkmayalım, yağmur yağıyor.'

  - id: b1-u04-l3
    type: grammar
    title: Wenn doch nur (keşke + -se)
    exercises:
      - id: b1-u04-l3-e1
        type: conjugation
        mode: verb
        lemma: olmak
        person: 3sg
        tense: conditional
        target: olsa
        gloss_de: 'wenn es doch … wäre (keşke … olsa)'
        explanation: keşke + -se für einen Wunsch jetzt oder später.
      - { id: b1-u04-l3-e2, type: conjugation, mode: verb, lemma: yağmak, person: 3sg, tense: conditional, negative: true, target: yağmasa, gloss_de: wenn es doch nicht regnen würde }
      - { id: b1-u04-l3-e3, type: conjugation, mode: verb, lemma: bilmek, person: 1sg, tense: conditional, target: bilsem, gloss_de: wenn ich es doch wüsste }
      - { id: b1-u04-l3-e4, type: conjugation, mode: verb, lemma: gelmek, person: 2sg, tense: conditional, target: gelsen, gloss_de: wenn du doch kämst }
      - { id: b1-u04-l3-e5, type: conjugation, mode: verb, lemma: ısınmak, person: 3sg, tense: conditional, target: ısınsa, gloss_de: wenn es doch warm würde }
      - id: b1-u04-l3-e6
        type: multiple_choice
        prompt: Was bedeutet „Keşke hava güzel olsa.“?
        options: [Wenn das Wetter doch schön wäre., Das Wetter war schön., Hoffentlich war das Wetter schön.]
        answer: Wenn das Wetter doch schön wäre.
      - id: b1-u04-l3-e7
        type: word_bank
        prompt: Wenn der Regen doch aufhören würde!
        answers: [Keşke yağmur dursa!]
        chunks:
          - { text: "Keşke", role: complement }
          - { text: "yağmur", role: subject }
          - { text: "dursa", role: predicate }
        distractors: [durdu, durursa]
        explanation: Beim Regen sagt man auch dinmek, Keşke yağmur dinse!
      - id: b1-u04-l3-e8
        type: word_bank
        prompt: Ich wünschte, ich hätte mehr Zeit.
        answers: [Keşke daha çok vaktim olsa., Keşke daha çok zamanım olsa.]
        distractors: [olur, vaktin]
      - id: b1-u04-l3-e9
        type: free_text
        direction: de_tr
        prompt: Ich wünschte, du wärst hier!
        answers: [Keşke burada olsan!, Keşke sen burada olsan!, Keşke burada olsaydın!, Keşke sen de burada olsan!]
      - id: b1-u04-l3-e10
        type: multiple_choice
        prompt: Welcher Satz drückt eine Hoffnung aus, keinen kaum erfüllbaren Wunsch?
        options: [Umarım yarın hava güzel olur., Keşke hava güzel olsa., Keşke hava güzel olsaydı.]
        answer: Umarım yarın hava güzel olur.
        explanation: umarım + Aorist oder Futur für Mögliches; keşke für Unwahrscheinliches oder Vergangenes.
      - id: b1-u04-l3-e11
        type: free_text
        direction: tr_de
        prompt: Umarım yarın yağmur yağmaz.
        answers: [Hoffentlich regnet es morgen nicht., 'Ich hoffe, es regnet morgen nicht.', 'Ich hoffe, dass es morgen nicht regnet.', Morgen regnet es hoffentlich nicht., Hoffentlich wird es morgen nicht regnen., 'Ich hoffe, dass es morgen nicht regnen wird.']

  - id: b1-u04-l4
    type: grammar
    title: Hätte ich doch … (keşke + -seydi)
    exercises:
      - id: b1-u04-l4-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 1sg
        tense: conditional
        compound: past
        target: gelseydim
        gloss_de: wäre ich doch gekommen
        explanation: gelse + ydi + m. Der Wunsch betrifft die Vergangenheit.
      - { id: b1-u04-l4-e2, type: conjugation, mode: verb, lemma: bilmek, person: 1sg, tense: conditional, compound: past, target: bilseydim, gloss_de: hätte ich es doch gewusst }
      - { id: b1-u04-l4-e3, type: conjugation, mode: verb, lemma: gitmek, person: 1pl, tense: conditional, compound: past, target: gitseydik, gloss_de: wären wir doch gegangen }
      - { id: b1-u04-l4-e4, type: conjugation, mode: verb, lemma: almak, person: 2sg, tense: conditional, compound: past, target: alsaydın, gloss_de: hättest du doch genommen }
      - { id: b1-u04-l4-e5, type: conjugation, mode: verb, lemma: söylemek, person: 3sg, tense: conditional, compound: past, target: söyleseydi, gloss_de: 'hätte er, sie es doch gesagt' }
      - { id: b1-u04-l4-e6, type: conjugation, mode: verb, lemma: dinlemek, person: 1sg, tense: conditional, compound: past, negative: true, target: dinlemeseydim, gloss_de: hätte ich doch nicht zugehört }
      - { id: b1-u04-l4-e7, type: conjugation, mode: verb, lemma: olmak, person: 1sg, tense: conditional, compound: past, target: olsaydım, gloss_de: wäre ich doch gewesen }
      - id: b1-u04-l4-e8
        type: multiple_choice
        prompt: Was ist der Unterschied? „Keşke gelsen.“ / „Keşke gelseydin.“
        options: [Wenn du doch kämst. / Wärst du doch gekommen., Beides heißt dasselbe., Komm bitte. / Du bist gekommen.]
        answer: Wenn du doch kämst. / Wärst du doch gekommen.
      - id: b1-u04-l4-e9
        type: word_bank
        prompt: Hätte ich doch einen Regenschirm mitgenommen!
        answers: [Keşke şemsiye alsaydım!, Keşke şemsiyemi alsaydım!, Keşke yanıma şemsiye alsaydım!, Keşke yanıma şemsiyemi alsaydım!]
        distractors: [alsam, aldım]
      - id: b1-u04-l4-e10
        type: word_bank
        prompt: Wenn ich es gewusst hätte, wäre ich gekommen.
        answers: [Bilseydim gelirdim.]
        distractors: [bilirsem, gelirim]
        explanation: '-seydi im Nebensatz, -irdi im Hauptsatz. Umgangssprachlich auch Bilsem gelirdim.'
      - id: b1-u04-l4-e11
        type: free_text
        direction: tr_de
        prompt: Keşke daha önce başlasaydık.
        answers: [Hätten wir doch früher angefangen., Hätten wir nur früher angefangen., Wenn wir doch früher angefangen hätten., Hätten wir doch eher angefangen., Wir hätten früher anfangen sollen.]

  - id: b1-u04-l5
    type: dialog
    title: Pläne fürs Wochenende
    exercises:
      - id: b1-u04-l5-e1
        type: word_bank
        prompt: Wie wird das Wetter am Wochenende?
        answers: [Hafta sonu hava nasıl olacak?, Hava hafta sonu nasıl olacak?]
        chunks:
          - { text: "Hafta sonu", role: time }
          - { text: "hava", role: subject }
          - { text: "nasıl", role: question }
          - { text: "olacak", role: predicate }
        orders:
          - { order: [1, 0, 2, 3] }
        distractors: [oldu, nerede]
      - id: b1-u04-l5-e2
        type: free_text
        direction: tr_de
        prompt: Hava durumuna göre cumartesi yağmur yağacak.
        answers: [Laut Wettervorhersage regnet es am Samstag., Laut Wetterbericht regnet es am Samstag., Laut Wetterbericht wird es am Samstag regnen., Laut Wetterbericht soll es am Samstag regnen., Nach dem Wetterbericht regnet es am Samstag., Der Wetterbericht sagt für Samstag Regen voraus.]
        explanation: -e göre = laut, nach.
      - id: b1-u04-l5-e3
        type: word_bank
        prompt: Dann lass uns am Sonntag gehen.
        answers: [O zaman pazar günü gidelim., O zaman pazar gidelim.]
        chunks:
          - { text: "O zaman", role: complement }
          - { text: "pazar günü", role: time }
          - { text: "gidelim", role: predicate }
        distractors: [gittik, cumartesi]
      - id: b1-u04-l5-e4
        type: multiple_choice
        prompt: Wie fragst du „Sollen wir einen Ausflug machen?“?
        options: [Bir gezi yapalım mı?, Bir gezi yaptık mı?, Bir gezi yapar mısın?]
        answer: Bir gezi yapalım mı?
      - id: b1-u04-l5-e5
        type: word_bank
        prompt: Hoffentlich scheint die Sonne.
        answers: [Umarım güneş açar., Umarım hava güneşli olur., Umarım hava açar.]
        distractors: [açtı, keşke]
        explanation: güneş açmak = die Sonne kommt heraus.
      - id: b1-u04-l5-e6
        type: free_text
        direction: de_tr
        prompt: Lass uns einen Regenschirm mitnehmen.
        answers: [Şemsiye alalım., Yanımıza şemsiye alalım., Bir şemsiye alalım., Yanımıza bir şemsiye alalım.]
      - id: b1-u04-l5-e7
        type: multiple_choice
        prompt: Was antwortest du auf „Pikniğe gidelim mi?“, wenn du einverstanden bist?
        options: ['Olur, gidelim!', 'Hayır, gittik.', Keşke gitseydik.]
        answer: 'Olur, gidelim!'
      - id: b1-u04-l5-e8
        type: conjugation
        mode: verb
        lemma: gezmek
        person: 1pl
        tense: optative
        target: gezelim
        gloss_de: lass uns herumlaufen, lass uns die Gegend ansehen

