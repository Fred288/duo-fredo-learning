        answer: Toplantıyı erteleyebilir miyiz?
      - id: b2-u04-l5-e4
        type: free_text
        direction: de_tr
        prompt: Das ist meine Verantwortung.
        answers: [Bu benim sorumluluğum., Bu sorumluluk benim., Sorumluluk bende., Benim sorumluluğum.]
      - id: b2-u04-l5-e5
        type: word_bank
        prompt: Ich habe heute Überstunden gemacht.
        answers: [Bugün fazla mesai yaptım.]
        chunks:
          - { text: "Bugün", role: time }
          - { text: "fazla mesai", role: object_bare }
          - { text: "yaptım", role: predicate }
        distractors: [yapıyorum, mesaiyi]
      - id: b2-u04-l5-e6
        type: multiple_choice
        prompt: Was bedeutet „Maaşıma zam yapıldı.“?
        options: [Mein Gehalt wurde erhöht., Mein Gehalt wurde gekürzt., Ich habe mein Gehalt bekommen.]
        answer: Mein Gehalt wurde erhöht.
      - { id: b2-u04-l5-e7, type: conjugation, mode: verb, lemma: alışmak, person: 1sg, tense: past, target: alıştım, gloss_de: ich habe mich gewöhnt }
      - id: b2-u04-l5-e8
        type: free_text
        direction: tr_de
        prompt: Yöneticim bana çok kızdı.
        answers: [Mein Vorgesetzter wurde sehr böse auf mich., Mein Chef wurde sehr böse auf mich., Meine Chefin wurde sehr böse auf mich., Meine Vorgesetzte wurde sehr böse auf mich., Mein Chef war sehr böse auf mich., Meine Chefin war sehr böse auf mich., Mein Vorgesetzter war sehr böse auf mich., Meine Vorgesetzte war sehr böse auf mich., Mein Chef ist sehr böse auf mich geworden., Meine Chefin ist sehr böse auf mich geworden., Mein Vorgesetzter ist sehr böse auf mich geworden., Meine Vorgesetzte ist sehr böse auf mich geworden.]

