lessons:
  - id: b2-u04-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b2-u04-l1-e1
        type: multiple_choice
        prompt: Was heißt „mesai“?
        options: [Arbeitszeit, Gehalt, Pause]
        answer: Arbeitszeit
        explanation: fazla mesai = Überstunden.
      - id: b2-u04-l1-e2
        type: free_text
        direction: de_tr
        prompt: Aufgabe, Pflicht
        answers: [görev]
      - id: b2-u04-l1-e3
        type: multiple_choice
        prompt: Was heißt „sorumluluk“?
        options: [Verantwortung, Geduld, Erfolg]
        answer: Verantwortung
        explanation: Vor Vokal wird k zu ğ, sorumluluğum.
      - id: b2-u04-l1-e4
        type: multiple_choice
        prompt: Was heißt „yönetici“?
        options: [Vorgesetzte(r), Kollege, Kunde]
        answer: Vorgesetzte(r)
      - id: b2-u04-l1-e5
        type: free_text
        direction: de_tr
        prompt: Kollege, Kollegin
        answers: [meslektaş, iş arkadaşı]
      - id: b2-u04-l1-e6
        type: multiple_choice
        prompt: Was heißt „hata“?
        options: [Fehler, Bericht, Ziel]
        answer: Fehler
        explanation: hata yapmak = einen Fehler machen.
      - id: b2-u04-l1-e7
        type: free_text
        direction: de_tr
        prompt: Bericht
        answers: [rapor]
      - id: b2-u04-l1-e8
        type: multiple_choice
        prompt: Was heißt „ertelemek“?
        options: [verschieben, beenden, vorbereiten]
        answer: verschieben
      - id: b2-u04-l1-e9
        type: multiple_choice
        prompt: Was heißt „alışmak“?
        options: [sich gewöhnen, sich beschweren, sich beeilen]
        answer: sich gewöhnen
        explanation: Mit Dativ, işe alışmak = sich an die Arbeit gewöhnen.
      - id: b2-u04-l1-e10
        type: free_text
        direction: de_tr
        prompt: abschließen, fertigstellen
        answers: [tamamlamak, bitirmek]
      - id: b2-u04-l1-e11
        type: multiple_choice
        prompt: Was heißt „yetişmek“?
        options: [rechtzeitig schaffen, fehlen, zurückkehren]
        answer: rechtzeitig schaffen
        explanation: Mit Dativ, toplantıya yetiştim = ich habe es rechtzeitig zur Sitzung geschafft.
      - id: b2-u04-l1-e12
        type: multiple_choice
        prompt: Was heißt „geç kalmak“?
        options: [sich verspäten, früh aufstehen, lange bleiben]
        answer: sich verspäten
      - id: b2-u04-l1-e13
        type: free_text
        direction: de_tr
        prompt: rufen
        answers: [çağırmak, seslenmek]
      - id: b2-u04-l1-e14
        type: multiple_choice
        prompt: Was heißt „kızmak“?
        options: [böse werden, müde werden, rot werden]
        answer: böse werden
        explanation: Mit Dativ, bana kızdı = er, sie wurde böse auf mich.
      - id: b2-u04-l1-e15
        type: multiple_choice
        prompt: Was heißt „zam“?
        options: [Erhöhung, Rabatt, Steuer]
        answer: Erhöhung
        explanation: Bei Lohn oder Preis; maaşıma zam yapıldı = mein Gehalt wurde erhöht.
      - id: b2-u04-l1-e16
        type: free_text
        direction: de_tr
        prompt: Stress
        answers: [stres]

  - id: b2-u04-l2
    type: grammar
    title: Weil und als (-diği için, -diği zaman)
    exercises:
      - id: b2-u04-l2-e1
        type: suffix_builder
        stem: çalışmak
        verbal: PART_DIK
        suffixes: [POSS_1SG]
        target: çalıştığım
        gloss_de: 'weil ich arbeite (çalıştığım için)'
        explanation: Die Person steht am Partizip, için bleibt unverändert.
      - { id: b2-u04-l2-e2, type: suffix_builder, stem: gelmek, verbal: PART_DIK, negative: true, suffixes: [POSS_2SG], target: gelmediğin, gloss_de: 'weil du nicht kommst (gelmediğin için)' }
      - { id: b2-u04-l2-e3, type: suffix_builder, stem: bitmek, verbal: PART_ACAK, negative: true, suffixes: [POSS_3SG], target: bitmeyeceği, gloss_de: 'weil es nicht enden wird (bitmeyeceği için)' }
      - { id: b2-u04-l2-e4, type: suffix_builder, stem: dönmek, verbal: PART_DIK, suffixes: [POSS_1PL], target: döndüğümüz, gloss_de: 'wenn wir zurückkehren (döndüğümüz zaman)' }
      - { id: b2-u04-l2-e5, type: suffix_builder, stem: başlamak, verbal: PART_DIK, suffixes: [POSS_3PL], target: başladıkları, gloss_de: 'als sie anfingen (başladıkları zaman)' }
      - id: b2-u04-l2-e6
        type: word_bank
        prompt: Weil ich viel gearbeitet habe, bin ich müde.
        answers: [Çok çalıştığım için yorgunum.]
        distractors: [çalıştım, çalışan]
      - id: b2-u04-l2-e7
        type: word_bank
        prompt: Als ich nach Hause kam, schlief mein Sohn.
        answers: [Eve geldiğim zaman oğlum uyuyordu., Oğlum eve geldiğim zaman uyuyordu.]
        chunks:
          - { text: "Eve geldiğim zaman", role: time }
          - { text: "oğlum", role: subject }
          - { text: "uyuyordu", role: predicate }
        orders:
          - { order: [1, 0, 2] }
        distractors: [geldim, gelen]
      - id: b2-u04-l2-e8
        type: word_bank
        prompt: Weil der Bericht nicht fertig wird, verschieben wir die Sitzung.
        answers: [Rapor bitmeyeceği için toplantıyı erteliyoruz., Toplantıyı rapor bitmeyeceği için erteliyoruz.]
        chunks:
          - { text: "Rapor bitmeyeceği için", role: complement }
          - { text: "toplantıyı", role: object }
          - { text: "erteliyoruz", role: predicate }
        orders:
          - { order: [1, 0, 2] }
        distractors: [bitmedi, toplantı]
      - id: b2-u04-l2-e9
        type: free_text
        direction: tr_de
        prompt: Geç kaldığım için özür dilerim.
        answers: ['Entschuldigung, dass ich zu spät bin.', 'Entschuldigung, dass ich zu spät gekommen bin.', 'Entschuldigen Sie, dass ich zu spät bin.', 'Entschuldigen Sie, dass ich zu spät gekommen bin.', 'Es tut mir leid, dass ich zu spät bin.', 'Es tut mir leid, dass ich zu spät gekommen bin.', Entschuldigung für die Verspätung., Ich entschuldige mich für die Verspätung., 'Entschuldigung, dass ich mich verspätet habe.', 'Es tut mir leid, dass ich mich verspätet habe.', 'Entschuldigung, dass ich zu spät komme.', 'Entschuldigen Sie, dass ich zu spät komme.', 'Es tut mir leid, dass ich zu spät komme.', 'Entschuldige, dass ich zu spät bin.', 'Entschuldige, dass ich zu spät komme.', Entschuldigen Sie die Verspätung.]
      - id: b2-u04-l2-e10
        type: free_text
        direction: de_tr
        prompt: 'Wenn du nach Hause kommst, ruf mich an.'
        answers: [Eve geldiğin zaman beni ara., Eve gelince beni ara., Eve vardığın zaman beni ara., Eve döndüğün zaman beni ara., Eve dönünce beni ara., Eve geldiğinde beni ara., Eve döndüğünde beni ara., Eve varınca beni ara., Eve gelince ara., Eve geldiğin zaman ara.]
      - id: b2-u04-l2-e11
        type: multiple_choice
        prompt: Was bedeutet „Toplantıya yetişemediği için üzgün.“?
        options: ['Er, sie ist traurig, weil er, sie es nicht rechtzeitig zur Sitzung geschafft hat.', 'Er, sie schafft es zur Sitzung, obwohl er, sie traurig ist.', 'Er, sie ist traurig, wenn die Sitzung beginnt.']
        answer: 'Er, sie ist traurig, weil er, sie es nicht rechtzeitig zur Sitzung geschafft hat.'
      - id: b2-u04-l2-e12
        type: multiple_choice
        prompt: Welche Form passt? „Sen … zaman ben çıkmıştım.“ (als du kamst)
        options: [geldiğin, geldiğim, gelen]
        answer: geldiğin
        explanation: Die Person des Nebensatzes steht am Partizip, sen → -in.

  - id: b2-u04-l3
    type: grammar
    title: Obwohl und da (-diği halde, -diğinden)
    exercises:
      - id: b2-u04-l3-e1
        type: suffix_builder
        stem: çalışmak
        verbal: PART_DIK
        suffixes: [POSS_3SG, ABL]
        target: çalıştığından
        gloss_de: 'da er, sie arbeitet (formeller als çalıştığı için)'
        explanation: -dik + Possessiv + Ablativ heißt „da, weil“, vor allem geschrieben.
      - { id: b2-u04-l3-e2, type: suffix_builder, stem: bilmek, verbal: PART_DIK, negative: true, suffixes: [POSS_1SG, ABL], target: bilmediğimden, gloss_de: 'da ich nicht weiß' }
      - { id: b2-u04-l3-e3, type: suffix_builder, stem: gelmek, verbal: PART_ACAK, suffixes: [POSS_3PL, ABL], target: geleceklerinden, gloss_de: 'da sie kommen werden' }
      - { id: b2-u04-l3-e4, type: suffix_builder, stem: söylemek, verbal: PART_DIK, suffixes: [POSS_1SG], target: söylediğim, gloss_de: 'obwohl ich sage (söylediğim halde)' }
      - { id: b2-u04-l3-e5, type: suffix_builder, stem: uyumak, verbal: PART_DIK, suffixes: [POSS_2SG], target: uyuduğun, gloss_de: 'obwohl du schläfst, geschlafen hast (uyuduğun halde)' }
      - id: b2-u04-l3-e6
        type: word_bank
        prompt: Obwohl ich viel geschlafen habe, bin ich müde.
        answers: [Çok uyuduğum halde yorgunum.]
        distractors: [uyudum, için]
      - id: b2-u04-l3-e7
        type: word_bank
        prompt: Obwohl sie es wusste, sagte sie mir nichts.
        answers: [Bildiği halde bana bir şey söylemedi., Bana bildiği halde bir şey söylemedi.]
        chunks:
          - { text: "Bildiği halde", role: complement }
          - { text: "bana", role: complement }
          - { text: "bir şey", role: object_bare }
          - { text: "söylemedi", role: predicate }
        orders:
          - { order: [1, 0, 2, 3] }
        distractors: [bilen, için]
      - id: b2-u04-l3-e8
        type: word_bank
        prompt: 'Da die Arbeit nicht abgeschlossen ist, gehen wir heute später.'
        answers: [İş tamamlanmadığından bugün daha geç çıkacağız.]
        distractors: [tamamlandı, için]
      - id: b2-u04-l3-e9
        type: free_text
        direction: tr_de
        prompt: Kaç kere söylediğim halde beni dinlemiyorsun.
        answers: ['Obwohl ich es so oft gesagt habe, hörst du mir nicht zu.', 'Obwohl ich es dir so oft gesagt habe, hörst du mir nicht zu.', 'Obwohl ich es schon so oft gesagt habe, hörst du mir nicht zu.', 'Obwohl ich es dir schon so oft gesagt habe, hörst du mir nicht zu.', 'Obwohl ich es mehrmals gesagt habe, hörst du nicht auf mich.', 'Obwohl ich es so oft gesagt habe, hörst du nicht auf mich.', 'Obwohl ich es dir so oft gesagt habe, hörst du nicht auf mich.', 'Obwohl ich es dir mehrmals gesagt habe, hörst du mir nicht zu.']
      - id: b2-u04-l3-e10
        type: free_text
        direction: de_tr
        prompt: 'Obwohl er krank ist, arbeitet er.'
        answers: [Hasta olduğu halde çalışıyor., O hasta olduğu halde çalışıyor., Hasta olmasına rağmen çalışıyor.]
        explanation: Bei Nomen und Adjektiven hilft olmak, hasta olduğu halde.
      - id: b2-u04-l3-e11
        type: multiple_choice
        prompt: Welches Wort passt? „Çok çalıştığı … işini kaybetti.“ (obwohl)
        options: [halde, için, zaman]
        answer: halde
      - id: b2-u04-l3-e12
        type: multiple_choice
        prompt: Welcher Satz klingt am förmlichsten?
        options: [Raporun gecikeceğinden toplantı ertelenmiştir., Rapor gecikiyor ya toplantıyı erteliyoruz., Rapor gecikecek çünkü toplantı ertelendi.]
        answer: Raporun gecikeceğinden toplantı ertelenmiştir.
        explanation: -diğinden und -miştir sind Kennzeichen geschriebener Sprache.

  - id: b2-u04-l4
    type: grammar
    title: Je mehr und bis (-dikçe, -inceye kadar)
    exercises:
      - id: b2-u04-l4-e1
        type: suffix_builder
        stem: gelmek
        verbal: CV_DIKCA
        target: geldikçe
        gloss_de: 'immer wenn, je mehr … kommt'
        explanation: -dikçe nimmt keine Personenendung; die Person steht im Satz.
      - { id: b2-u04-l4-e2, type: suffix_builder, stem: çalışmak, verbal: CV_DIKCA, target: çalıştıkça, gloss_de: je mehr … arbeitet }
      - { id: b2-u04-l4-e3, type: suffix_builder, stem: okumak, verbal: CV_DIKCA, target: okudukça, gloss_de: je mehr … liest }
      - { id: b2-u04-l4-e4, type: suffix_builder, stem: görmek, verbal: CV_DIKCA, negative: true, target: görmedikçe, gloss_de: solange … nicht sieht }
      - { id: b2-u04-l4-e5, type: suffix_builder, stem: bitmek, verbal: CV_INCAYA, target: bitinceye, gloss_de: 'bis es endet (bitinceye kadar)' }
      - { id: b2-u04-l4-e6, type: suffix_builder, stem: gelmek, verbal: CV_INCAYA, target: gelinceye, gloss_de: 'bis … kommt (gelinceye kadar)' }
      - { id: b2-u04-l4-e7, type: suffix_builder, stem: öğrenmek, verbal: CV_INCAYA, target: öğreninceye, gloss_de: 'bis … lernt (öğreninceye kadar)' }
      - id: b2-u04-l4-e8
        type: word_bank
        prompt: Je mehr ich arbeite, desto mehr nimmt mein Stress zu.
        answers: [Çalıştıkça stresim artıyor.]
        distractors: [çalışınca, azalıyor]
      - id: b2-u04-l4-e9
        type: word_bank
        prompt: Warte hier, bis ich komme.
        answers: [Ben gelinceye kadar burada bekle., Burada ben gelinceye kadar bekle.]
        chunks:
          - { text: "Ben gelinceye kadar", role: time }
          - { text: "burada", role: place }
          - { text: "bekle", role: predicate }
        orders:
          - { order: [1, 0, 2] }
        distractors: [gelen, için]
      - id: b2-u04-l4-e10
        type: word_bank
        prompt: 'Solange du nicht fragst, kannst du es nicht lernen.'
        answers: [Sormadıkça öğrenemezsin.]
        distractors: [sorunca, öğrenirsin]
      - id: b2-u04-l4-e11
        type: free_text
        direction: tr_de
        prompt: Bu işi öğreninceye kadar çok hata yaptım.
        answers: ['Bis ich diese Arbeit gelernt hatte, habe ich viele Fehler gemacht.', 'Bis ich diese Arbeit gelernt habe, habe ich viele Fehler gemacht.', 'Bis ich diese Arbeit gelernt hatte, machte ich viele Fehler.', 'Bis ich diese Arbeit gelernt hatte, habe ich sehr viele Fehler gemacht.', 'Bis ich diese Arbeit gelernt habe, habe ich sehr viele Fehler gemacht.', 'Bis ich die Arbeit gelernt hatte, habe ich viele Fehler gemacht.', 'Bis ich die Arbeit gelernt habe, habe ich viele Fehler gemacht.', 'Bis ich diese Arbeit gelernt hatte, machte ich sehr viele Fehler.', 'Bis ich diesen Beruf gelernt hatte, habe ich viele Fehler gemacht.']
      - id: b2-u04-l4-e12
        type: multiple_choice
        prompt: Was bedeutet „Meslektaşlarımı tanıdıkça işimi daha çok seviyorum.“?
        options: ['Je besser ich meine Kollegen kenne, desto mehr mag ich meine Arbeit.', 'Ich mag meine Arbeit, seit ich meine Kollegen nicht kenne.', 'Wenn ich meine Kollegen kenne, gehe ich zur Arbeit.']
        answer: 'Je besser ich meine Kollegen kenne, desto mehr mag ich meine Arbeit.'
      - id: b2-u04-l4-e13
        type: multiple_choice
        prompt: Welche Form passt? „Toplantı … kadar burada kalacağız.“ (bis … endet)
        options: [bitinceye, bitince, bittikçe]
        answer: bitinceye
        explanation: Auch möglich ist bitene kadar, das im Alltag häufiger ist.

  - id: b2-u04-l5
    type: dialog
    title: Im Büro
    exercises:
      - id: b2-u04-l5-e1
        type: free_text
        direction: tr_de
        prompt: Raporu ne zaman tamamlayabilirsin?
        answers: [Wann kannst du den Bericht fertigstellen?, Wann kannst du den Bericht abschließen?, Wann kannst du den Bericht fertig machen?, Wann kannst du mit dem Bericht fertig werden?, Bis wann kannst du den Bericht fertigstellen?, Wann kannst du den Bericht fertig haben?]
      - id: b2-u04-l5-e2
        type: word_bank
        prompt: Ich schaffe es bis zur Sitzung nicht.
        answers: [Toplantıya yetişemem., Toplantıya yetiştiremem.]
        distractors: [yetişirim, toplantıda]
        explanation: yetişmek = es rechtzeitig schaffen; yetiştirmek = etwas rechtzeitig fertig bekommen.
      - id: b2-u04-l5-e3
        type: multiple_choice
        prompt: Wie sagst du „Können wir die Sitzung verschieben?“
