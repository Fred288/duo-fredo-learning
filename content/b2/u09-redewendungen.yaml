        type: multiple_choice
        prompt: Was bedeutet „Ağzından kaçırdı.“?
        options: [Er hat es versehentlich ausgeplaudert., Er hat den Bus verpasst., Er hat Zahnschmerzen.]
        answer: Er hat es versehentlich ausgeplaudert.
      - id: b2-u09-l4-e4
        type: multiple_choice
        prompt: Was bedeutet „Gözüm yolda kaldı.“?
        options: [Ich habe lange sehnsüchtig gewartet., Ich habe etwas im Auge., Ich habe mich verlaufen.]
        answer: Ich habe lange sehnsüchtig gewartet.
        explanation: gözü yolda = jemand, der ständig wartet.
      - id: b2-u09-l4-e5
        type: multiple_choice
        prompt: Was bedeutet „Elinden geleni yaptı.“?
        options: [Er hat sein Bestes getan., Er hat sich die Hand verletzt., Er hat etwas gebracht.]
        answer: Er hat sein Bestes getan.
      - id: b2-u09-l4-e6
        type: multiple_choice
        prompt: Was bedeutet „Damlaya damlaya göl olur.“?
        options: [Kleinvieh macht auch Mist., Stille Wasser sind tief., Es regnet in Strömen.]
        answer: Kleinvieh macht auch Mist.
        explanation: Wörtlich tropfend entsteht ein See.
      - id: b2-u09-l4-e7
        type: multiple_choice
        prompt: Was bedeutet „Sabrın sonu selamettir.“?
        options: [Geduld führt zum guten Ende., Am Ende verliert man die Geduld., Schluss mit der Geduld.]
        answer: Geduld führt zum guten Ende.
      - id: b2-u09-l4-e8
        type: word_bank
        prompt: Pass bitte auf das Kind auf.
        answers: [Lütfen çocuğa göz kulak ol.]
        distractors: [çocuğu, gözü]
      - id: b2-u09-l4-e9
        type: word_bank
        prompt: Was ist dir passiert?
        answers: [Başına ne geldi?]
        distractors: [başın, gitti]
      - id: b2-u09-l4-e10
        type: word_bank
        prompt: Mein Freund ist verschwiegen, du kannst ihm vertrauen.
        answers: ['Arkadaşımın ağzı sıkıdır, ona güvenebilirsin.']
        distractors: [onu, güveniyor]
      - id: b2-u09-l4-e11
        type: free_text
        direction: tr_de
        prompt: Elinden geleni yap.
        answers: [Tu dein Bestes., Gib dein Bestes., 'Tu, was du kannst.', Mach dein Bestes.]
      - id: b2-u09-l4-e12
        type: free_text
        direction: de_tr
        prompt: Mir ist langweilig.
        answers: [Canım sıkılıyor., Sıkılıyorum.]

