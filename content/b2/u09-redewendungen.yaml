  - id: b2-u09-l2
    type: grammar
    title: Der Gewesene (-miş als Partizip)
    exercises:
      - id: b2-u09-l2-e1
        type: suffix_builder
        stem: görmek
        verbal: PART_MIS
        target: görmüş
        gloss_de: 'der gesehen hat (görmüş geçirmiş = lebenserfahren)'
        explanation: -miş kann vor einem Nomen stehen, dann beschreibt es einen Zustand.
      - { id: b2-u09-l2-e2, type: suffix_builder, stem: geçmek, verbal: PART_MIS, target: geçmiş, gloss_de: 'vergangen (geçmiş günler = vergangene Tage)' }
      - { id: b2-u09-l2-e3, type: suffix_builder, stem: pişmek, verbal: PART_MIS, target: pişmiş, gloss_de: 'gekocht, gar (pişmiş et = gegartes Fleisch)' }
      - { id: b2-u09-l2-e4, type: suffix_builder, stem: bozulmak, verbal: PART_MIS, target: bozulmuş, gloss_de: 'kaputt, verdorben (bozulmuş süt = verdorbene Milch)' }
      - { id: b2-u09-l2-e5, type: suffix_builder, stem: kırılmak, verbal: PART_MIS, target: kırılmış, gloss_de: 'zerbrochen (kırılmış cam = zerbrochenes Glas)' }
      - { id: b2-u09-l2-e6, type: suffix_builder, stem: okumak, verbal: PART_MIS, suffixes: [PL, DAT], target: okumuşlara, gloss_de: den Gebildeten }
      - { id: b2-u09-l2-e7, type: suffix_builder, stem: yorulmak, verbal: PART_MIS, target: yorulmuş, gloss_de: ermüdet }
      - id: b2-u09-l2-e8
        type: multiple_choice
        prompt: Was bedeutet „Görmüş geçirmiş bir adam.“?
        options: [Ein Mann mit viel Lebenserfahrung., Ein Mann ohne Augen., 'Ein Mann, der heute vorbeikam.']
        answer: Ein Mann mit viel Lebenserfahrung.
      - id: b2-u09-l2-e9
        type: word_bank
        prompt: Vergangene Tage kehren nicht zurück.
        answers: [Geçmiş günler geri gelmez.]
        chunks:
          - { text: "Geçmiş günler", role: subject }
          - { text: "geri", role: complement }
          - { text: "gelmez", role: predicate }
        distractors: [geçiyor, gelir]
      - id: b2-u09-l2-e10
        type: word_bank
        prompt: Wirf die verdorbene Milch weg.
        answers: [Bozulmuş sütü at.]
        distractors: [bozuyor, süt]
      - id: b2-u09-l2-e11
        type: free_text
        direction: tr_de
        prompt: Kırılmış cama dikkat et.
        answers: [Pass auf das zerbrochene Glas auf., Achte auf das zerbrochene Glas., Pass auf die zerbrochene Scheibe auf., Achte auf die zerbrochene Scheibe., Vorsicht vor dem zerbrochenen Glas., Pass auf das kaputte Glas auf.]
      - id: b2-u09-l2-e12
        type: multiple_choice
        prompt: Was ist der Unterschied? „Süt bozulmuş.“ / „bozulmuş süt“
        options: [Die Milch ist wohl verdorben. / die verdorbene Milch, Die Milch verdirbt. / Die Milch ist frisch., Beides ist ein ganzer Satz.]
        answer: Die Milch ist wohl verdorben. / die verdorbene Milch

  - id: b2-u09-l3
    type: grammar
    title: Ich habe Lust (-esim var)
    exercises:
      - id: b2-u09-l3-e1
        type: suffix_builder
        stem: gitmek
        verbal: PART_ASI
        suffixes: [POSS_1SG]
        target: gidesim
        gloss_de: 'meine Lust zu gehen (gidesim var = ich habe Lust zu gehen)'
        explanation: Umgangssprachlich, -esi + Possessiv + var oder geldi.
      - { id: b2-u09-l3-e2, type: suffix_builder, stem: uyumak, verbal: PART_ASI, suffixes: [POSS_1SG], target: uyuyasım, gloss_de: meine Lust zu schlafen }
      - { id: b2-u09-l3-e3, type: suffix_builder, stem: ağlamak, verbal: PART_ASI, suffixes: [POSS_1SG], target: ağlayasım, gloss_de: mein Drang zu weinen }
      - { id: b2-u09-l3-e4, type: suffix_builder, stem: gülmek, verbal: PART_ASI, suffixes: [POSS_2SG], target: gülesin, gloss_de: deine Lust zu lachen }
      - { id: b2-u09-l3-e5, type: suffix_builder, stem: görmek, verbal: PART_ASI, suffixes: [POSS_1PL], target: göresimiz, gloss_de: unsere Lust zu sehen }
      - { id: b2-u09-l3-e6, type: suffix_builder, stem: yemek, verbal: PART_ASI, suffixes: [POSS_1SG], target: yiyesim, gloss_de: meine Lust zu essen }
      - id: b2-u09-l3-e7
        type: word_bank
        prompt: Ich möchte heute gar nicht arbeiten.
        answers: [Bugün hiç çalışasım yok.]
        chunks:
          - { text: "Bugün", role: time }
          - { text: "hiç", role: complement }
          - { text: "çalışasım yok", role: predicate }
        distractors: [çalışan, var]
      - id: b2-u09-l3-e8
        type: word_bank
        prompt: Mir war zum Weinen zumute.
        answers: [Ağlayasım geldi.]
        distractors: [ağladım, gitti]
      - id: b2-u09-l3-e9
        type: word_bank
        prompt: Ich habe Lust, nach Hause zu gehen.
        answers: [Eve gidesim var.]
        distractors: [gitti, evi]
      - id: b2-u09-l3-e10
        type: free_text
        direction: tr_de
        prompt: Seni çok göresim geldi.
        answers: [Ich wollte dich so gern sehen., Ich möchte dich so gern sehen., Ich will dich unbedingt sehen., 'Ich habe große Lust, dich zu sehen.', Ich vermisse dich sehr., 'Ich hatte große Lust, dich zu sehen.']
      - id: b2-u09-l3-e11
        type: multiple_choice
        prompt: Welches Register passt zu „gidesim var“?
        options: [Gespräch mit Freunden, amtlicher Brief, Zeitungsbericht]
        answer: Gespräch mit Freunden
      - id: b2-u09-l3-e12
        type: multiple_choice
        prompt: Was bedeutet „Görülesi bir yer.“?
        options: ['Ein Ort, den man gesehen haben sollte.', 'Ein Ort, der nicht sichtbar ist.', Ein Ort voller Menschen.]
        answer: 'Ein Ort, den man gesehen haben sollte.'

  - id: b2-u09-l4
