    title: Redewendungen im Satz
    exercises:
      - id: b2-u09-l4-e1
        type: multiple_choice
        prompt: Was bedeutet „Canım sıkılıyor.“?
        options: [Mir ist langweilig., Meine Seele tut weh., Ich bin glücklich.]
