      - { id: b2-u06-l2-e6, type: conjugation, mode: verb, lemma: almak, person: 1sg, tense: aorist, target: alırım, gloss_de: ich würde kaufen (ich kaufe) }
      - { id: b2-u06-l2-e7, type: conjugation, mode: verb, lemma: gelmek, person: 3sg, tense: aorist, ability: true, target: gelebilir, gloss_de: 'er, sie kann, könnte kommen' }
