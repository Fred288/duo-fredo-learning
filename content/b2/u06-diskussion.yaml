  - id: b2-u06-r1
    type: reading
    title: 'Lesetext: Ohne Internet'
    passage:
      sentences:
        - { tr: "Geçen hafta sınıfta ilginç bir tartışma yaptık.", de: "Letzte Woche hatten wir in der Klasse eine interessante Diskussion." }
        - { tr: "Öğretmenimiz “İnternet olmasaydı hayatımız nasıl olurdu?” diye sordu.", de: "Unsere Lehrerin fragte: „Wie wäre unser Leben, wenn es kein Internet gäbe?“" }
        - { tr: "Önce kimse cevap vermedi.", de: "Zuerst antwortete niemand." }
        - { tr: "Sonra Can “Daha çok kitap okurduk.” dedi.", de: "Dann sagte Can: „Wir würden mehr Bücher lesen.“" }
        - { tr: "Deniz ona katılmadı.", de: "Deniz stimmte ihm nicht zu." }
        - { tr: "“Bence kitap okumazdık, televizyon izlerdik.” dedi.", de: "„Ich glaube, wir würden keine Bücher lesen, sondern fernsehen“, sagte Deniz." }
        - { tr: "Selin “Belki arkadaşlarımızla daha sık görüşürdük.” dedi.", de: "Selin sagte: „Vielleicht würden wir uns öfter mit unseren Freunden treffen.“" }
        - { tr: "Öğretmen gülerek “Anneleriniz ve babalarınız öyle yaşadı, onlara sorun.” dedi.", de: "Die Lehrerin sagte lachend: „Eure Mütter und Väter haben so gelebt, fragt sie.“" }
        - { tr: "Eve gidince babama sordum.", de: "Als ich nach Hause kam, fragte ich meinen Vater." }
        - { tr: "Babam “Gençken internetimiz olsaydı üniversitede bu kadar zorlanmazdım.” dedi.", de: "Mein Vater sagte: „Hätten wir in meiner Jugend Internet gehabt, hätte ich es an der Universität nicht so schwer gehabt.“" }
        - { tr: "“Ama belki annenle tanışmazdım.”", de: "„Aber vielleicht hätte ich deine Mutter nicht kennengelernt.“" }
        - { tr: "Annemle kütüphanede tanışmışlar.", de: "Meine Eltern haben sich offenbar in der Bibliothek kennengelernt." }
        - { tr: "İkisi de aynı kitabı arıyormuş.", de: "Beide suchten wohl dasselbe Buch." }
        - { tr: "İnternet olsaydı o kitabı evden okurlardı.", de: "Hätte es Internet gegeben, hätten sie dieses Buch von zu Hause aus gelesen." }
        - { tr: "Düşündüm: Babam o gün kütüphaneye gitmeseydi ben doğmazdım!", de: "Ich dachte: Wäre mein Vater an dem Tag nicht in die Bibliothek gegangen, wäre ich nicht geboren worden!" }
        - { tr: "Annem gülerek “O kitap hâlâ evde olmalı.” dedi.", de: "Meine Mutter sagte lachend: „Das Buch muss noch im Haus sein.“" }
        - { tr: "Kitabı aradık ama bulamadık.", de: "Wir suchten das Buch, fanden es aber nicht." }
        - { tr: "Babam “Bir kutunun içindedir, belki de bodrumdadır.” dedi.", de: "Mein Vater sagte: „Es ist wohl in einem Karton, vielleicht auch im Keller.“" }
        - { tr: "Annem “Yıllar önce birine vermiş olabilirsin.” dedi.", de: "Meine Mutter sagte: „Vielleicht hast du es vor Jahren jemandem gegeben.“" }
        - { tr: "Keşke o kitabı saklasaydık.", de: "Hätten wir das Buch doch aufgehoben." }
