      - { id: b2-u06-l2-e3, type: conjugation, mode: verb, lemma: olmak, person: 3sg, tense: conditional, target: olsa, gloss_de: wenn es wäre }
      - { id: b2-u06-l2-e4, type: conjugation, mode: verb, lemma: gitmek, person: 1pl, tense: conditional, target: gitsek, gloss_de: wenn wir gingen }
