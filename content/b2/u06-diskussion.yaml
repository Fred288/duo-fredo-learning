        direction: de_tr
        prompt: Wenn ich du wäre, würde ich gehen.
        answers: [Senin yerinde olsam giderim., Senin yerinde olsam giderdim., Yerinde olsam giderim., Yerinde olsam giderdim., Senin yerinde olsaydım giderdim., Yerinde olsaydım giderdim.]
