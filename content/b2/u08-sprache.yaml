        prompt: Welches Wort passt? „Ali gelmedi, … gelmeye söz vermişti.“ (dabei hatte er doch)
        options: [oysa, örneğin, dolayısıyla]
        answer: oysa
        explanation: oysa stellt die Erwartung gegen die Wirklichkeit.
      - id: b2-u08-l4-e4
        type: multiple_choice
        prompt: Welches Wort passt? „Türkçe biliyor, … şiir yazıyor.“ (sogar)
        options: [hatta, ancak, oysa]
        answer: hatta
      - id: b2-u08-l4-e5
        type: multiple_choice
        prompt: Welches Wort passt? „Birçok dil öğrendi, … Türkçe ve Japonca.“ (besonders)
        options: [özellikle, ancak, oysa]
        answer: özellikle
      - id: b2-u08-l4-e6
        type: word_bank
        prompt: Das Wort ist schwer, jedoch sehr wichtig.
        answers: ['Kelime zor, ancak çok önemli.']
        distractors: [çünkü, hatta]
      - id: b2-u08-l4-e7
        type: word_bank
        prompt: Viele Wörter kommen aus dem Arabischen, zum Beispiel kitap.
        answers: ['Birçok kelime Arapçadan gelir, örneğin kitap.']
        distractors: [Arapça, oysa]
      - id: b2-u08-l4-e8
        type: word_bank
        prompt: Bücher sind teuer, außerdem haben wir keinen Platz.
        answers: ['Kitaplar pahalı, üstelik yerimiz yok.']
        distractors: [oysa, yeri]
      - id: b2-u08-l4-e9
        type: free_text
        direction: tr_de
        prompt: Çok okuyor, hatta her gün bir şiir ezberliyor.
        answers: ['Er liest viel, er lernt sogar jeden Tag ein Gedicht auswendig.', 'Sie liest viel, sie lernt sogar jeden Tag ein Gedicht auswendig.', 'Er liest viel und lernt sogar jeden Tag ein Gedicht auswendig.', 'Sie liest viel und lernt sogar jeden Tag ein Gedicht auswendig.']
      - id: b2-u08-l4-e10
        type: free_text
        direction: tr_de
        prompt: Kolay sanıyordum, oysa çok zormuş.
        answers: ['Ich dachte, es sei leicht, dabei ist es sehr schwer.', 'Ich dachte, es wäre leicht, dabei ist es sehr schwer.', 'Ich dachte, es ist leicht, dabei ist es sehr schwer.', 'Ich hielt es für leicht, dabei ist es sehr schwer.', 'Ich dachte, es sei einfach, dabei ist es sehr schwer.', 'Ich dachte, es ist einfach, dabei ist es sehr schwer.', 'Ich dachte, es wäre einfach, dabei ist es sehr schwer.']
      - id: b2-u08-l4-e11
        type: free_text
        direction: de_tr
        prompt: Zum Beispiel ist „kitap“ ein arabisches Wort.
        answers: [Örneğin kitap Arapça bir kelimedir., Örneğin kitap Arapça bir kelime., Mesela kitap Arapça bir kelimedir., Mesela kitap Arapça bir kelime.]
      - id: b2-u08-l4-e12
        type: multiple_choice
        prompt: Welches Wort klingt am förmlichsten?
        options: [bununla birlikte, ama, ya]
        answer: bununla birlikte
        explanation: Bedeutet „dennoch“ und steht vor allem in geschriebenen Texten.

