        stem: cami
        suffixes: [POSS_3SG]
        target: camii
        gloss_de: seine Moschee (Süleymaniye Camii)
        explanation: Früher endete das Wort auf einem Konsonanten, darum ohne s. In Namen steht meist Camii, sonst auch camisi.
      - { id: b2-u08-l3-e2, type: suffix_builder, stem: mevzu, suffixes: [POSS_3SG], target: mevzuu, gloss_de: sein Thema }
      - id: b2-u08-l3-e3
        type: suffix_builder
        stem: cami
        suffixes: [ACC]
        target: camiyi
        gloss_de: die Moschee (Akkusativ)
        explanation: Nur beim Possessiv der 3. Person fällt s weg, sonst regulär.
      - { id: b2-u08-l3-e4, type: suffix_builder, stem: saat, suffixes: [ACC], target: saati, gloss_de: die Uhr (Akkusativ) }
      - { id: b2-u08-l3-e5, type: suffix_builder, stem: kalp, suffixes: [POSS_1SG], target: kalbim, gloss_de: mein Herz }
      - { id: b2-u08-l3-e6, type: suffix_builder, stem: hâl, suffixes: [ACC], target: hâli, gloss_de: den Zustand }
      - { id: b2-u08-l3-e7, type: suffix_builder, stem: ihtimal, suffixes: [PL], target: ihtimaller, gloss_de: Möglichkeiten }
      - { id: b2-u08-l3-e8, type: suffix_builder, stem: kâğıt, suffixes: [ACC], target: kâğıdı, gloss_de: das Papier (Akkusativ) }
      - id: b2-u08-l3-e9
        type: multiple_choice
        prompt: Warum heißt es saati und nicht saatı?
        options: ['Lehnwort, das Endungen hell bildet.', Weil t weich wird., Das ist ein Tippfehler.]
        answer: 'Lehnwort, das Endungen hell bildet.'
      - id: b2-u08-l3-e10
        type: word_bank
        prompt: Die Süleymaniye ist eine alte Moschee in Istanbul.
        answers: [Süleymaniye İstanbul'da eski bir camidir., Süleymaniye İstanbul'da eski bir cami.]
        distractors: [camii, camiyi]
      - id: b2-u08-l3-e11
        type: free_text
        direction: de_tr
        prompt: die Moschee meines Viertels
        answers: [mahallemin camii, mahallemin camisi]
      - id: b2-u08-l3-e12
        type: multiple_choice
        prompt: Was unterscheidet „kâr“ und „kar“?
        options: [Gewinn und Schnee, Schnee und Gewinn, Sie bedeuten dasselbe.]
        answer: Gewinn und Schnee
      - id: b2-u08-l3-e13
        type: multiple_choice
        prompt: Was bedeutet „hâlâ“?
        options: [immer noch, Tante, jetzt nicht]
        answer: immer noch
        explanation: hala ohne Zeichen ist die Tante väterlicherseits.

  - id: b2-u08-l4
