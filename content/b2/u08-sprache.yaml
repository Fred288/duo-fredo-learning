  - id: b2-u08-r1
    type: reading
    title: 'Lesetext: Die Geschichte der Wörter'
    passage:
      sentences:
        - { tr: "Türkçenin tarihi çok uzundur.", de: "Die Geschichte des Türkischen ist sehr lang." }
        - { tr: "Osmanlı döneminde Türkçe Arap harfleriyle yazılırdı.", de: "In osmanischer Zeit wurde Türkisch mit arabischen Buchstaben geschrieben." }
        - { tr: "Ancak bu alfabe Türkçenin seslerine uygun değildi.", de: "Dieses Alphabet passte jedoch nicht zu den Lauten des Türkischen." }
        - { tr: "Türkçede sekiz ünlü vardır, oysa Arap alfabesi bunları göstermekte zorlanır.", de: "Das Türkische hat acht Vokale, das arabische Alphabet tut sich dagegen schwer, sie darzustellen." }
        - { tr: "1928 yılında Latin harflerine dayanan yeni alfabe kabul edildi.", de: "1928 wurde das neue, auf lateinischen Buchstaben beruhende Alphabet eingeführt." }
        - { tr: "Değişiklik kısa sürede uygulandı, hatta yetişkinler için okullar açıldı.", de: "Die Änderung wurde schnell umgesetzt, es wurden sogar Schulen für Erwachsene eröffnet." }
        - { tr: "Harflerle birlikte dil de değişmeye başladı.", de: "Mit den Buchstaben begann sich auch die Sprache zu ändern." }
        - { tr: "Osmanlıcada Arapça ve Farsça kelimeler çoktu.", de: "Im Osmanischen gab es viele arabische und persische Wörter." }
        - { tr: "1932'de kurulan Türk Dil Kurumu bunların yerine Türkçe kelimeler önerdi.", de: "Die 1932 gegründete Türkische Sprachgesellschaft schlug stattdessen türkische Wörter vor." }
        - { tr: "Mektep yerine okul, talebe yerine öğrenci, tayyare yerine uçak denmeye başlandı.", de: "Statt mektep sagte man nun okul, statt talebe öğrenci, statt tayyare uçak." }
        - { tr: "Bununla birlikte eski kelimelerin hepsi kaybolmadı.", de: "Dennoch verschwanden nicht alle alten Wörter." }
        - { tr: "Kitap ve hak kelimeleri Arapçadan gelir.", de: "Die Wörter kitap und hak kommen aus dem Arabischen." }
        - { tr: "Pencere ve şehir ise Farsça kökenlidir.", de: "Pencere und şehir dagegen sind persischer Herkunft." }
        - { tr: "Otobüs ve kuaför Fransızcadan girmiştir.", de: "Otobüs und kuaför kamen aus dem Französischen." }
        - { tr: "Bu kelimelerin bir kısmı kurallara uymaz.", de: "Ein Teil dieser Wörter folgt nicht den Regeln." }
        - { tr: "Örneğin hak hakkı olur, saat ise saati olur.", de: "Zum Beispiel wird hak zu hakkı und saat zu saati." }
        - { tr: "Dolayısıyla Türkçe öğrenenler bu kelimeleri tek tek öğrenmek zorundadır.", de: "Folglich müssen Türkischlernende diese Wörter einzeln lernen." }
        - { tr: "Şapkalı harfler de bu tarihin izidir.", de: "Auch die Buchstaben mit Zirkumflex sind eine Spur dieser Geschichte." }
        - { tr: "Kâr ve kar kelimeleri bu işaretle ayrılır.", de: "Die Wörter kâr und kar werden durch dieses Zeichen unterschieden." }
        - { tr: "Bir dilin kelimeleri o dili konuşan toplumun tarihini anlatır.", de: "Die Wörter einer Sprache erzählen die Geschichte der Gesellschaft, die sie spricht." }
