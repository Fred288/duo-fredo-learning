lessons:
  - id: b2-u02-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b2-u02-l1-e1
        type: multiple_choice
        prompt: Was heißt „bilim“?
        options: [Wissenschaft, Kunst, Bildung]
        answer: Wissenschaft
        explanation: bilim insanı = Wissenschaftler(in); eğitim = Bildung.
      - id: b2-u02-l1-e2
        type: free_text
        direction: de_tr
        prompt: Versuch, Experiment
        answers: [deney]
      - id: b2-u02-l1-e3
        type: multiple_choice
        prompt: Was heißt „araştırma“?
        options: [Forschung, Erfindung, Messung]
        answer: Forschung
        explanation: araştırmak = forschen, untersuchen.
      - id: b2-u02-l1-e4
        type: multiple_choice
        prompt: Was heißt „keşfetmek“?
        options: [entdecken, erfinden, erklären]
        answer: entdecken
        explanation: icat etmek = erfinden.
      - id: b2-u02-l1-e5
        type: free_text
        direction: de_tr
        prompt: herstellen, produzieren
        answers: [üretmek]
      - id: b2-u02-l1-e6
        type: multiple_choice
        prompt: Was heißt „geliştirmek“?
        options: [entwickeln, sich entwickeln, ankommen]
        answer: entwickeln
        explanation: gelişmek = sich entwickeln, mit Kausativ geliştirmek.
      - id: b2-u02-l1-e7
        type: free_text
        direction: de_tr
        prompt: Maschine
        answers: [makine]
      - id: b2-u02-l1-e8
        type: multiple_choice
        prompt: Was heißt „cihaz“?
        options: [Gerät, Ergebnis, Verfahren]
        answer: Gerät
      - id: b2-u02-l1-e9
        type: multiple_choice
        prompt: Was heißt „sonuç“?
        options: [Ergebnis, Anfang, Grund]
        answer: Ergebnis
        explanation: Vor Vokal wird ç zu c, sonucu.
      - id: b2-u02-l1-e10
        type: free_text
        direction: de_tr
        prompt: messen
        answers: [ölçmek]
      - id: b2-u02-l1-e11
        type: multiple_choice
        prompt: Was heißt „yöntem“?
        options: [Methode, Stoff, Richtung]
        answer: Methode
      - id: b2-u02-l1-e12
        type: free_text
        direction: de_tr
        prompt: Weltraum
        answers: [uzay]
      - id: b2-u02-l1-e13
        type: multiple_choice
        prompt: Was heißt „artmak“?
        options: [zunehmen, abnehmen, fehlen]
        answer: zunehmen
        explanation: artırmak = erhöhen; azalmak = abnehmen, azaltmak = verringern.
      - id: b2-u02-l1-e14
        type: multiple_choice
        prompt: Was heißt „çözmek“?
        options: [lösen, binden, wiegen]
        answer: lösen
      - id: b2-u02-l1-e15
        type: free_text
        direction: de_tr
        prompt: gar werden
        answers: [pişmek]
        explanation: pişirmek = etwas kochen, garen.
      - id: b2-u02-l1-e16
        type: multiple_choice
        prompt: Was heißt „batmak“?
        options: [untergehen, aufsteigen, schwimmen]
        answer: untergehen
        explanation: gemi battı = das Schiff ist gesunken; güneş batıyor = die Sonne geht unter.

