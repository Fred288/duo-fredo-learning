        - { tr: "İlk deneylerde cihaz suyu yeterince ısıtmadı.", de: "Bei den ersten Versuchen erhitzte das Gerät das Wasser nicht genug." }
        - { tr: "Elif yöntemini değiştirdi ve deneyleri tekrarladı.", de: "Elif änderte ihre Methode und wiederholte die Versuche." }
        - { tr: "Altı ay sonra sonuçlar çok iyiydi.", de: "Sechs Monate später waren die Ergebnisse sehr gut." }
        - { tr: "Küçük bir fabrikaya yüz cihaz ürettirdi.", de: "Sie ließ von einer kleinen Fabrik hundert Geräte herstellen." }
        - { tr: "Cihazlar evlerin çatılarına yerleştirildi.", de: "Die Geräte wurden auf den Dächern der Häuser angebracht." }
        - { tr: "Artık musluklardan sıcak su akıyor ve yemekler daha kolay pişiriliyor.", de: "Jetzt fließt warmes Wasser aus den Hähnen, und das Essen wird leichter gekocht." }
        - { tr: "Cihazlar evlerin elektrik faturalarını da azalttı.", de: "Die Geräte verringerten auch die Stromrechnungen der Häuser." }
        - { tr: "Gazeteciler köye geldi ve Elif'in çalışmasını haber yaptı.", de: "Journalisten kamen ins Dorf und berichteten über Elifs Arbeit." }
        - { tr: "Elif şimdi köydeki çocuklara basit deneyler yaptırıyor.", de: "Elif lässt die Kinder im Dorf jetzt einfache Versuche machen." }
        - { tr: "Çocuklar suyu ısıtıyor, sıcaklığı ölçüyor ve sonuçları deftere yazıyor.", de: "Die Kinder erhitzen Wasser, messen die Temperatur und schreiben die Ergebnisse ins Heft." }
        - { tr: "Bir çocuk “Bilim insanı olmak zor mu?” diye sordu.", de: "Ein Kind fragte: „Ist es schwer, Wissenschaftler zu werden?“" }
        - { tr: "Elif gülerek “Zor ama bir sorunu çözünce insan çok mutlu oluyor.” dedi.", de: "Elif sagte lachend: „Schwer, aber wenn man ein Problem gelöst hat, ist man sehr glücklich.“" }
        - { tr: "Ona göre bilim sadece büyük şehirlerde yapılmaz.", de: "Ihrer Meinung nach wird Wissenschaft nicht nur in großen Städten betrieben." }
