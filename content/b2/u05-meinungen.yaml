        prompt: Meiner Meinung nach ist das nicht richtig.
        answers: [Bence bu doğru değil., Bana göre bu doğru değil., Bence bu yanlış., Bana göre bu yanlış., Bence doğru değil., Bana göre doğru değil., Benim görüşüme göre bu doğru değil., Bana kalırsa bu doğru değil.]
      - id: b2-u05-l5-e5
        type: word_bank
        prompt: Eigentlich ist das Problem nicht das Geld.
        answers: [Aslında sorun para değil., Sorun aslında para değil.]
        chunks:
          - { text: "Aslında", role: complement }
          - { text: "sorun", role: subject }
          - { text: "para değil", role: predicate }
        orders:
          - { order: [1, 0, 2] }
        distractors: [paralı, yok]
      - id: b2-u05-l5-e6
        type: multiple_choice
        prompt: Was bedeutet „Üstelik bu çözüm çok pahalı.“?
        options: [Außerdem ist diese Lösung sehr teuer., Trotzdem ist diese Lösung sehr billig., Diese Lösung war früher teuer.]
        answer: Außerdem ist diese Lösung sehr teuer.
      - { id: b2-u05-l5-e7, type: conjugation, mode: verb, lemma: desteklemek, person: 1sg, tense: present, target: destekliyorum, gloss_de: ich unterstütze }
      - id: b2-u05-l5-e8
        type: free_text
        direction: tr_de
        prompt: Kesinlikle haklısınız.
        answers: [Sie haben völlig recht., Sie haben absolut recht., Sie haben auf jeden Fall recht., Ihr habt völlig recht., Ihr habt absolut recht., Sie haben ganz recht., Ihr habt ganz recht., Ihr habt auf jeden Fall recht.]

