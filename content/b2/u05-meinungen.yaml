lessons:
  - id: b2-u05-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b2-u05-l1-e1
        type: multiple_choice
        prompt: Was heißt „görüş“?
        options: [Ansicht, Gesetz, Wahl]
        answer: Ansicht
        explanation: bana göre oder benim görüşüme göre = meiner Ansicht nach.
      - id: b2-u05-l1-e2
        type: free_text
        direction: de_tr
        prompt: unterstützen
        answers: [desteklemek, destek olmak]
      - id: b2-u05-l1-e3
        type: multiple_choice
        prompt: Was heißt „karşı çıkmak“?
        options: [widersprechen, abreisen, zustimmen]
        answer: widersprechen
        explanation: Mit Dativ, plana karşı çıkmak = sich gegen den Plan stellen.
      - id: b2-u05-l1-e4
        type: multiple_choice
        prompt: Was heißt „haklı“?
        options: [im Recht, müde, schuldig]
        answer: im Recht
        explanation: Haklısın = Du hast recht; haksız = im Unrecht.
      - id: b2-u05-l1-e5
        type: free_text
        direction: de_tr
        prompt: Recht, Anspruch
        answers: [hak]
        explanation: Vor Vokal verdoppelt sich k, hakkım.
      - id: b2-u05-l1-e6
        type: multiple_choice
        prompt: Was heißt „yasak“?
        options: [verboten, erlaubt, nötig]
        answer: verboten
        explanation: Auch das Verbot; yasaklamak = verbieten.
      - id: b2-u05-l1-e7
        type: multiple_choice
        prompt: Was heißt „belediye“?
        options: [Stadtverwaltung, Polizeiwache, Regierung]
        answer: Stadtverwaltung
      - id: b2-u05-l1-e8
        type: free_text
        direction: de_tr
        prompt: Wahl
        answers: [seçim]
      - id: b2-u05-l1-e9
        type: multiple_choice
        prompt: Was heißt „eleştirmek“?
        options: [kritisieren, loben, erklären]
        answer: kritisieren
      - id: b2-u05-l1-e10
        type: multiple_choice
        prompt: Was heißt „halk“?
        options: [Volk, Haushalt, Hälfte]
        answer: Volk
      - id: b2-u05-l1-e11
        type: free_text
        direction: de_tr
        prompt: Lösung
        answers: [çözüm]
      - id: b2-u05-l1-e12
        type: multiple_choice
        prompt: Was heißt „aslında“?
        options: [eigentlich, deshalb, sofort]
        answer: eigentlich
      - id: b2-u05-l1-e13
        type: multiple_choice
        prompt: Was heißt „üstelik“?
        options: [außerdem, trotzdem, vielleicht]
        answer: außerdem
      - id: b2-u05-l1-e14
        type: free_text
        direction: de_tr
        prompt: auf jeden Fall, unbedingt
        answers: [kesinlikle, mutlaka, muhakkak]
      - id: b2-u05-l1-e15
        type: multiple_choice
        prompt: Was heißt „esnaf“?
        options: [Händler und Handwerker eines Ortes, Beamte, Bauern]
        answer: Händler und Handwerker eines Ortes
      - id: b2-u05-l1-e16
        type: multiple_choice
        prompt: Was heißt „rağmen“?
        options: [trotz, wegen, seit]
        answer: trotz
        explanation: Mit Dativ, yağmura rağmen = trotz des Regens.

  - id: b2-u05-l2
    type: grammar
    title: Trotz und obwohl (-mesine rağmen)
    exercises:
      - id: b2-u05-l2-e1
        type: suffix_builder
        stem: gelmek
        verbal: VN_MA
        suffixes: [POSS_3SG, DAT]
        target: gelmesine
        gloss_de: 'obwohl er, sie kommt (gelmesine rağmen)'
        explanation: -me + Possessiv + Dativ, danach rağmen.
      - { id: b2-u05-l2-e2, type: suffix_builder, stem: çalışmak, verbal: VN_MA, suffixes: [POSS_1SG, DAT], target: çalışmama, gloss_de: 'obwohl ich arbeite (çalışmama rağmen)' }
      - { id: b2-u05-l2-e3, type: suffix_builder, stem: bilmek, verbal: VN_MA, suffixes: [POSS_2SG, DAT], target: bilmene, gloss_de: 'obwohl du weißt (bilmene rağmen)' }
      - { id: b2-u05-l2-e4, type: suffix_builder, stem: söylemek, verbal: VN_MA, suffixes: [POSS_1PL, DAT], target: söylememize, gloss_de: 'obwohl wir sagen (söylememize rağmen)' }
      - { id: b2-u05-l2-e5, type: suffix_builder, stem: istemek, verbal: VN_MA, suffixes: [POSS_3PL, DAT], target: istemelerine, gloss_de: 'obwohl sie wollen (istemelerine rağmen)' }
      - { id: b2-u05-l2-e6, type: suffix_builder, stem: gitmek, verbal: VN_MA, negative: true, suffixes: [POSS_3SG, DAT], target: gitmemesine, gloss_de: 'obwohl er, sie nicht geht (gitmemesine rağmen)' }
      - id: b2-u05-l2-e7
        type: multiple_choice
        prompt: Was bedeutet „çalışmama rağmen“?
        options: [obwohl ich arbeite, obwohl ich nicht arbeite, weil ich arbeite]
        answer: obwohl ich arbeite
        explanation: çalış-ma-ma = -ma + -m + -a; das zweite -ma ist keine Verneinung. Verneint hieße es çalışmamama.
      - id: b2-u05-l2-e8
        type: word_bank
        prompt: Obwohl es regnet, gehen wir spazieren.
        answers: [Yağmur yağmasına rağmen yürüyüş yapıyoruz.]
        chunks:
          - { text: "Yağmur yağmasına rağmen", role: complement }
          - { text: "yürüyüş", role: object_bare }
          - { text: "yapıyoruz", role: predicate }
        distractors: [yağdı, için]
        explanation: yağmur ist unbestimmt, darum kein Genitiv.
      - id: b2-u05-l2-e9
        type: word_bank
        prompt: Obwohl die Stadtverwaltung den Plan erklärt hat, sind viele dagegen.
        answers: [Belediyenin planı açıklamasına rağmen birçok kişi karşı çıkıyor.]
        distractors: [belediyeyi, açıkladı]
        explanation: Das Subjekt steht im Genitiv, belediyenin.
      - id: b2-u05-l2-e10
        type: word_bank
        prompt: Trotz des schlechten Wetters kamen alle.
        answers: [Kötü havaya rağmen herkes geldi.]
        distractors: [hava, için]
      - id: b2-u05-l2-e11
        type: free_text
        direction: tr_de
        prompt: Ona söylememize rağmen gelmedi.
        answers: ['Obwohl wir es ihm gesagt haben, ist er nicht gekommen.', 'Obwohl wir es ihr gesagt haben, ist sie nicht gekommen.', 'Obwohl wir es ihm sagten, kam er nicht.', 'Obwohl wir es ihr sagten, kam sie nicht.', 'Obwohl wir es ihm gesagt hatten, ist er nicht gekommen.', 'Obwohl wir es ihr gesagt hatten, ist sie nicht gekommen.', 'Obwohl wir es ihm gesagt hatten, kam er nicht.', 'Obwohl wir es ihr gesagt hatten, kam sie nicht.', 'Obwohl wir es ihm sagten, ist er nicht gekommen.', 'Obwohl wir es ihr sagten, ist sie nicht gekommen.']
      - id: b2-u05-l2-e12
        type: free_text
        direction: de_tr
        prompt: 'Obwohl ich müde bin, arbeite ich.'
        answers: [Yorgun olmama rağmen çalışıyorum., Yorgun olduğum halde çalışıyorum., Yorgun olsam da çalışıyorum., Ben yorgun olmama rağmen çalışıyorum.]
      - id: b2-u05-l2-e13
        type: multiple_choice
        prompt: Welche Form passt? „Öğrencilerin çok … rağmen sonuçlar iyi değildi.“ (obwohl die Schüler viel lernten)
        options: [çalışmalarına, çalışmaları, çalıştılar]
        answer: çalışmalarına
        explanation: 3. Plural, -me + -leri + -ne; Subjekt im Genitiv. -diklerine rağmen geht auch.

  - id: b2-u05-l3
    type: grammar
    title: Selbst wenn (-se bile, -se de)
    exercises:
      - id: b2-u05-l3-e1
        type: conjugation
        mode: verb
        lemma: gelmek
        person: 3sg
        tense: conditional
        target: gelse
        gloss_de: 'wenn er, sie käme (gelse bile = selbst wenn er, sie käme)'
        explanation: bile und de stehen als eigene Wörter hinter der Form.
      - { id: b2-u05-l3-e2, type: conjugation, mode: verb, lemma: istemek, person: 1sg, tense: conditional, target: istesem, gloss_de: 'wenn ich wollte (istesem de = auch wenn ich wollte)' }
      - { id: b2-u05-l3-e3, type: conjugation, mode: verb, lemma: yapmak, person: 2sg, tense: conditional, target: yapsan, gloss_de: 'wenn du machen würdest (ne yapsan = was du auch machst)' }
      - { id: b2-u05-l3-e4, type: conjugation, mode: verb, lemma: gitmek, person: 1pl, tense: conditional, target: gitsek, gloss_de: 'wenn wir gingen (nereye gitsek = wohin wir auch gehen)' }
      - { id: b2-u05-l3-e5, type: conjugation, mode: verb, lemma: görmek, person: 3pl, tense: conditional, negative: true, target: görmeseler, gloss_de: 'wenn sie nicht sähen' }
      - { id: b2-u05-l3-e6, type: conjugation, mode: verb, lemma: söylemek, person: 3sg, tense: aorist, compound: conditional, target: söylerse, gloss_de: 'wenn er, sie sagt (söylerse de = auch wenn er, sie sagt)' }
      - id: b2-u05-l3-e7
        type: word_bank
        prompt: Selbst wenn du gehst, ändert sich nichts.
        answers: [Sen gitsen bile hiçbir şey değişmez., Gitsen bile hiçbir şey değişmez.]
        distractors: [gidince, değişir]
      - id: b2-u05-l3-e8
        type: word_bank
        prompt: Auch wenn es teuer ist, kaufe ich es.
        answers: [Pahalı olsa da alacağım., Pahalı olsa da alırım.]
        distractors: [pahalıya, aldım]
      - id: b2-u05-l3-e9
        type: word_bank
        prompt: Was du auch sagst, ich glaube dir nicht.
        answers: [Ne söylersen söyle sana inanmıyorum.]
        distractors: [seni, söyledin]
        explanation: Doppelte Form, -irse + Imperativ, ne yaparsan yap = was du auch tust.
      - id: b2-u05-l3-e10
        type: free_text
        direction: tr_de
        prompt: Çok zengin olsa bile mutlu değil.
        answers: ['Selbst wenn er sehr reich ist, ist er nicht glücklich.', 'Selbst wenn sie sehr reich ist, ist sie nicht glücklich.', 'Auch wenn er sehr reich ist, ist er nicht glücklich.', 'Auch wenn sie sehr reich ist, ist sie nicht glücklich.', 'Obwohl er sehr reich ist, ist er nicht glücklich.', 'Obwohl sie sehr reich ist, ist sie nicht glücklich.', 'Er ist zwar sehr reich, aber nicht glücklich.', 'Sie ist zwar sehr reich, aber nicht glücklich.']
      - id: b2-u05-l3-e11
        type: free_text
        direction: de_tr
        prompt: 'Auch wenn du recht hast, schrei nicht.'
        answers: [Haklı olsan da bağırma., Haklı olsan bile bağırma., Sen haklı olsan da bağırma., Sen haklı olsan bile bağırma., Haklı da olsan bağırma.]
      - id: b2-u05-l3-e12
        type: multiple_choice
        prompt: Was ist der Unterschied? „Gelse iyi olur.“ / „Gelse bile iyi olmaz.“
        options: ['Es wäre gut, wenn er käme. / Selbst wenn er käme, wäre es nicht gut.', 'Es wäre schlecht, wenn er käme. / Es wäre gut, wenn er nicht käme.', Beides bedeutet dasselbe.]
        answer: 'Es wäre gut, wenn er käme. / Selbst wenn er käme, wäre es nicht gut.'

  - id: b2-u05-l4
    type: grammar
    title: Ohne zu und statt zu (-meksizin, -mektense)
    exercises:
      - id: b2-u05-l4-e1
        type: suffix_builder
        stem: düşünmek
        verbal: CV_MAKSIZIN
        target: düşünmeksizin
        gloss_de: ohne nachzudenken
        explanation: -meksizin ist die formelle Schwester von -meden.
      - { id: b2-u05-l4-e2, type: suffix_builder, stem: sormak, verbal: CV_MAKSIZIN, target: sormaksızın, gloss_de: ohne zu fragen }
      - { id: b2-u05-l4-e3, type: suffix_builder, stem: dinlemek, verbal: CV_MAKSIZIN, target: dinlemeksizin, gloss_de: ohne zuzuhören }
      - { id: b2-u05-l4-e4, type: suffix_builder, stem: beklemek, verbal: CV_MAKTANSA, target: beklemektense, gloss_de: statt zu warten }
      - { id: b2-u05-l4-e5, type: suffix_builder, stem: yapmak, verbal: CV_MAKTANSA, target: yapmaktansa, gloss_de: statt zu machen }
      - { id: b2-u05-l4-e6, type: suffix_builder, stem: gitmek, verbal: CV_MAKTANSA, negative: true, target: gitmemektense, gloss_de: statt nicht zu gehen }
      - id: b2-u05-l4-e7
        type: word_bank
        prompt: Die Stadtverwaltung hat entschieden, ohne das Volk zu fragen.
        answers: [Belediye halka sormaksızın karar verdi., Halka sormaksızın belediye karar verdi.]
        chunks:
          - { text: "Belediye", role: subject }
          - { text: "halka sormaksızın", role: complement }
          - { text: "karar verdi", role: predicate }
        orders:
          - { order: [1, 0, 2] }
        distractors: [halkı, sorarak]
      - id: b2-u05-l4-e8
        type: word_bank
        prompt: Statt hier zu warten, gehen wir lieber zu Fuß.
        answers: [Burada beklemektense yürüyelim.]
        distractors: [bekleyerek, yürüdük]
      - id: b2-u05-l4-e9
        type: word_bank
        prompt: Lieber arm und glücklich als reich und unglücklich sein.
        answers: [Zengin ve mutsuz olmaktansa fakir ve mutlu olmak daha iyi.]
        distractors: [olarak, olursa]
      - id: b2-u05-l4-e10
        type: free_text
        direction: tr_de
        prompt: Düşünmeksizin cevap verdi.
        answers: [Er antwortete ohne nachzudenken., Sie antwortete ohne nachzudenken., 'Er antwortete, ohne nachzudenken.', 'Sie antwortete, ohne nachzudenken.', Er hat ohne nachzudenken geantwortet., Sie hat ohne nachzudenken geantwortet., 'Er hat geantwortet, ohne nachzudenken.', 'Sie hat geantwortet, ohne nachzudenken.', Ohne nachzudenken antwortete er., Ohne nachzudenken antwortete sie.]
      - id: b2-u05-l4-e11
        type: multiple_choice
        prompt: Welche Form ist alltäglicher? (ohne zu fragen)
        options: [sormadan, sormaksızın, sormaktansa]
        answer: sormadan
        explanation: sormaksızın ist schriftlich; sormaktansa heißt „statt zu fragen“.
      - id: b2-u05-l4-e12
        type: multiple_choice
        prompt: Was bedeutet „Tartışmaktansa konuyu kapatalım.“?
        options: ['Statt zu streiten, lassen wir das Thema lieber.', Wir streiten über das Thema., 'Ohne das Thema zu kennen, streiten wir.']
        answer: 'Statt zu streiten, lassen wir das Thema lieber.'

  - id: b2-u05-l5
    type: dialog
    title: Seine Meinung sagen
    exercises:
      - id: b2-u05-l5-e1
        type: free_text
        direction: tr_de
        prompt: Bu konuda ne düşünüyorsun?
        answers: [Was denkst du zu diesem Thema?, Was denkst du über dieses Thema?, Was meinst du zu diesem Thema?, Was hältst du davon?, Was denkst du darüber?, Was denkst du dazu?, Was hältst du von diesem Thema?]
      - id: b2-u05-l5-e2
        type: word_bank
        prompt: Ich stimme dir nicht zu.
        answers: [Sana katılmıyorum.]
        distractors: [seni, katılıyorum]
        explanation: katılmak heißt auch zustimmen, mit Dativ.
      - id: b2-u05-l5-e3
        type: multiple_choice
        prompt: Wie sagst du „Du hast recht.“?
        options: [Haklısın., Hakkın var sana., Doğrusun.]
        answer: Haklısın.
      - id: b2-u05-l5-e4
        type: free_text
