  - id: b2-u01-r1
    type: reading
    title: 'Lesetext: Unser Umzug'
    passage:
      sentences:
        - { tr: "Geçen ay yeni bir daireye taşındık.", de: "Letzten Monat sind wir in eine neue Wohnung gezogen." }
        - { tr: "Daire güzeldi ama çok eskiydi ve her yerin tamir edilmesi gerekiyordu.", de: "Die Wohnung war schön, aber sehr alt, und alles musste repariert werden." }
        - { tr: "Eşim ve ben ikimiz de çok çalıştığımız için bu işleri kendimiz yapamazdık.", de: "Weil mein Partner und ich beide viel arbeiten, konnten wir diese Arbeiten nicht selbst machen." }
        - { tr: "Bu yüzden önce bir usta bulduk.", de: "Deshalb haben wir zuerst einen Handwerker gefunden." }
        - { tr: "Ustaya duvarları boyattık.", de: "Wir haben die Wände vom Handwerker streichen lassen." }
        - { tr: "Mutfaktaki musluğu değiştirttik.", de: "Den Hahn in der Küche haben wir austauschen lassen." }
        - { tr: "Eski kapıyı da tamir ettirdik.", de: "Auch die alte Tür haben wir reparieren lassen." }
        - { tr: "Usta bizi hiç bekletmedi ve işini iki günde bitirdi.", de: "Der Handwerker ließ uns gar nicht warten und beendete seine Arbeit in zwei Tagen." }
        - { tr: "Eşyalarımızı bir şirkete taşıttık.", de: "Unsere Sachen haben wir von einer Firma transportieren lassen." }
        - { tr: "Şirketin çalışanları hem hızlı hem de dikkatliydi.", de: "Die Angestellten der Firma waren schnell und auch sorgfältig." }
        - { tr: "Sadece bir kutu düştü, içindeki bardaklar kırıldı.", de: "Nur ein Karton fiel herunter, die Gläser darin gingen kaputt." }
        - { tr: "Şirket ücretin bir kısmını geri verdi.", de: "Die Firma gab einen Teil der Gebühr zurück." }
        - { tr: "Sonra evi baştan sona temizlettik.", de: "Dann haben wir die Wohnung von vorn bis hinten putzen lassen." }
        - { tr: "Perdeleri de terziye diktirdik.", de: "Die Vorhänge haben wir auch vom Schneider nähen lassen." }
        - { tr: "Fatura yüksekti ama artık çok rahatız.", de: "Die Rechnung war hoch, aber jetzt haben wir es sehr bequem." }
        - { tr: "Komşumuz bir gün bize geldi ve evi çok beğendi.", de: "Eines Tages kam unser Nachbar zu uns, und die Wohnung gefiel ihm sehr." }
        - { tr: "Bana “Bu duvarları kim boyadı?” diye sordu.", de: "Er fragte mich: „Wer hat diese Wände gestrichen?“" }
        - { tr: "Ben gülerek “Biz boyamadık, boyattık.” dedim.", de: "Ich sagte lachend: „Wir haben sie nicht gestrichen, wir haben sie streichen lassen.“" }
        - { tr: "Bu söz onu çok güldürdü.", de: "Dieser Satz brachte ihn sehr zum Lachen." }
      glossary:
        - { tr: "her", de: "jeder (her yer = überall)" }
        - { tr: "tamir", de: "Reparatur (tamir etmek = reparieren)", vocab: "tamir etmek" }
        - { tr: "edilmesi", de: "dass … gemacht wird (etmek + Passiv + -me + -si)", vocab: "tamir etmek" }
        - { tr: "gerekiyordu", de: "war nötig (gerekmek)", vocab: "gerek" }
        - { tr: "da", de: "auch" }
        - { tr: "de", de: "auch" }
        - { tr: "hem", de: "sowohl (hem … hem de = sowohl … als auch)" }
