# B2-03: Reziprok -(I)ş (görüşmek, bakışmak), birbiri, Reflexiv -(I)n vertieft, unpersönliches Passiv (burada oturulmaz); Beziehungen, Gesellschaft. Claude-Entwurf, ungeprüft (reviewed: false).
