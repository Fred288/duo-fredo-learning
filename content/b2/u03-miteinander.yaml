        - { tr: "Bir gün bir ağaç yüzünden kavga ettiler.", de: "Eines Tages stritten sie wegen eines Baumes." }
        - { tr: "O günden sonra birbirleriyle konuşmadılar.", de: "Von diesem Tag an sprachen sie nicht mehr miteinander." }
        - { tr: "Sokakta karşılaştıklarında selamlaşmıyorlardı.", de: "Wenn sie sich auf der Straße begegneten, grüßten sie sich nicht." }
        - { tr: "Komşular buna çok üzüldü.", de: "Die Nachbarn waren darüber sehr traurig." }
        - { tr: "Ama bizim mahallede bayramda barışılır.", de: "Aber in unserem Viertel versöhnt man sich am Feiertag." }
        - { tr: "Bayram sabahı erken kalkıldı, evler temizlendi, tatlılar yapıldı.", de: "Am Feiertagsmorgen stand man früh auf, die Häuser wurden geputzt, Süßigkeiten wurden gemacht." }
        - { tr: "Çocuklar yıkandı, giyindi ve büyüklerin ellerini öpmeye gitti.", de: "Die Kinder wuschen sich, zogen sich an und gingen, um den Älteren die Hand zu küssen." }
        - { tr: "Hasan Amca'nın torunu Ali dedesine sordu.", de: "Onkel Hasans Enkel Ali fragte seinen Großvater." }
        - { tr: "“Dede, Mehmet Amca ile neden konuşmuyorsunuz?”", de: "„Opa, warum sprecht ihr, du und Onkel Mehmet, nicht miteinander?“" }
        - { tr: "Hasan Amca bir şey söylemedi, sadece düşündü.", de: "Onkel Hasan sagte nichts, er dachte nur nach." }
        - { tr: "Sonra kalktı, giyindi ve yavaş yavaş komşusunun evine yürüdü.", de: "Dann stand er auf, zog sich an und ging langsam zum Haus seines Nachbarn." }
        - { tr: "Mehmet Amca kapıyı açtı ve iki yaşlı adam bir süre bakıştı.", de: "Onkel Mehmet öffnete die Tür, und die beiden alten Männer sahen sich eine Weile an." }
        - { tr: "Sonra hiçbir şey söylemeden kucaklaştılar.", de: "Dann umarmten sie sich, ohne etwas zu sagen." }
        - { tr: "“Ağacı unutalım.” dedi Hasan Amca.", de: "„Vergessen wir den Baum“, sagte Onkel Hasan." }
        - { tr: "Mehmet Amca gülerek “O ağaç ikimizden de yaşlı.” dedi.", de: "Onkel Mehmet sagte lachend: „Der Baum ist älter als wir beide.“" }
        - { tr: "O günden sonra yine her sabah kahvede görüşüyorlar.", de: "Seit diesem Tag sehen sie sich wieder jeden Morgen im Kaffeehaus." }
        - { tr: "Hâlâ anlaşamıyorlar ama artık birbirlerine hiç küsmüyorlar.", de: "Sie sind sich immer noch nicht einig, aber sie sind nie mehr böse aufeinander." }
      glossary:
