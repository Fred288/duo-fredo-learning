    exercises:
      - id: b2-u03-r1-e1
        type: multiple_choice
        prompt: Was taten die Freunde jeden Morgen?
        options: [Sie trafen sich im Kaffeehaus., Sie gingen spazieren., Sie arbeiteten im Garten.]
        answer: Sie trafen sich im Kaffeehaus.
      - id: b2-u03-r1-e2
        type: multiple_choice
        prompt: Warum stritten sie?
        options: [Wegen eines Baumes., Wegen Geld., Wegen der Politik.]
        answer: Wegen eines Baumes.
      - id: b2-u03-r1-e3
        type: multiple_choice
        prompt: Was geschieht in diesem Viertel am Feiertag?
        options: [Man versöhnt sich., Man zieht um., Man verkauft Süßigkeiten.]
        answer: Man versöhnt sich.
      - id: b2-u03-r1-e4
        type: multiple_choice
        prompt: Was geschah an der Tür?
        options: [Die beiden umarmten sich wortlos., Sie stritten weiter., Mehmet schloss die Tür wieder.]
        answer: Die beiden umarmten sich wortlos.
      - id: b2-u03-r1-e5
        type: free_text
        direction: tr_de
        prompt: Bizim mahallede bayramda barışılır.
        answers: [In unserem Viertel versöhnt man sich am Feiertag., In unserem Viertel versöhnt man sich an Feiertagen., Am Feiertag versöhnt man sich in unserem Viertel., In unserer Nachbarschaft versöhnt man sich am Feiertag., In unserer Nachbarschaft versöhnt man sich an Feiertagen., An Feiertagen versöhnt man sich in unserem Viertel.]

