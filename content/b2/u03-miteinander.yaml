lessons:
  - id: b2-u03-l1
    type: vocab
    title: Wortschatz
    exercises:
      - id: b2-u03-l1-e1
        type: multiple_choice
        prompt: Was heißt „ilişki“?
        options: [Beziehung, Gesellschaft, Tradition]
        answer: Beziehung
      - id: b2-u03-l1-e2
        type: free_text
        direction: de_tr
        prompt: Gesellschaft
        answers: [toplum]
      - id: b2-u03-l1-e3
        type: multiple_choice
        prompt: Was heißt „gelenek“?
        options: [Tradition, Zukunft, Feier]
        answer: Tradition
        explanation: Vor Vokal wird k zu ğ, gelenekler, aber geleneği.
      - id: b2-u03-l1-e4
        type: multiple_choice
        prompt: Was heißt „saygı“?
        options: [Respekt, Liebe, Neid]
        answer: Respekt
        explanation: saygı göstermek = Respekt zeigen.
      - id: b2-u03-l1-e5
        type: free_text
        direction: de_tr
        prompt: guter Freund, Freundin
        answers: [dost, arkadaş]
      - id: b2-u03-l1-e6
        type: multiple_choice
        prompt: Was heißt „bayram“?
        options: [Feiertag, Fasten, Hochzeit]
        answer: Feiertag
      - id: b2-u03-l1-e7
        type: multiple_choice
        prompt: Was heißt „anlaşmak“?
        options: [sich verstehen, sich verirren, sich anziehen]
        answer: sich verstehen
        explanation: Auch sich einigen; biz iyi anlaşıyoruz = wir verstehen uns gut.
      - id: b2-u03-l1-e8
        type: free_text
        direction: de_tr
        prompt: sich versöhnen
        answers: [barışmak]
      - id: b2-u03-l1-e9
        type: multiple_choice
        prompt: Was heißt „kavga etmek“?
        options: [sich streiten, sich küssen, sich treffen]
        answer: sich streiten
      - id: b2-u03-l1-e10
        type: multiple_choice
        prompt: Was heißt „küsmek“?
        options: [böse sein und nicht mehr reden, jemanden küssen, sich entschuldigen]
        answer: böse sein und nicht mehr reden
        explanation: Falscher Freund, nicht küssen! Küssen heißt öpmek. Mit Dativ, bana küstü.
      - id: b2-u03-l1-e11
        type: free_text
        direction: de_tr
        prompt: küssen
        answers: [öpmek]
      - id: b2-u03-l1-e12
        type: multiple_choice
        prompt: Was heißt „karşılaşmak“?
        options: [einander begegnen, einander fehlen, sich verlieren]
        answer: einander begegnen
        explanation: Mit ile; Ali ile karşılaştım, sokakta karşılaştık = wir sind uns auf der Straße begegnet.
      - id: b2-u03-l1-e13
        type: multiple_choice
        prompt: Was heißt „selamlaşmak“?
        options: [einander grüßen, einander helfen, einander anrufen]
        answer: einander grüßen
      - id: b2-u03-l1-e14
        type: free_text
        direction: de_tr
        prompt: traurig sein, bedauern
        answers: [üzülmek]
      - id: b2-u03-l1-e15
        type: multiple_choice
        prompt: Was heißt „övünmek“?
        options: [prahlen, sich waschen, sich kämmen]
        answer: prahlen
        explanation: Von övmek (loben), wörtlich sich selbst loben.
      - id: b2-u03-l1-e16
        type: multiple_choice
        prompt: Was heißt „birbiri“?
        options: [einander, jeder, niemand]
        answer: einander
        explanation: Immer mit Possessiv, birbirimizi, birbirinizi, birbirlerini.

  - id: b2-u03-l2
    type: grammar
    title: Einander sehen (-iş)
    exercises:
      - id: b2-u03-l2-e1
        type: conjugation
        mode: verb
        lemma: görmek
        person: 1pl
        tense: present
        reciprocal: true
        target: görüşüyoruz
        gloss_de: wir sehen uns, treffen uns
        explanation: Nach Konsonant -iş mit Harmonie, nach Vokal nur -ş.
      - { id: b2-u03-l2-e2, type: conjugation, mode: verb, lemma: bakmak, person: 3pl, tense: past, reciprocal: true, target: bakıştılar, gloss_de: sie sahen sich an }
      - { id: b2-u03-l2-e3, type: conjugation, mode: verb, lemma: anlamak, person: 1pl, tense: past, reciprocal: true, target: anlaştık, gloss_de: wir haben uns geeinigt }
      - { id: b2-u03-l2-e4, type: conjugation, mode: verb, lemma: bulmak, person: 1pl, tense: future, reciprocal: true, target: buluşacağız, gloss_de: wir werden uns treffen }
      - { id: b2-u03-l2-e5, type: conjugation, mode: verb, lemma: öpmek, person: 3pl, tense: past, reciprocal: true, target: öpüştüler, gloss_de: sie haben sich geküsst }
      - { id: b2-u03-l2-e6, type: conjugation, mode: verb, lemma: tanımak, person: 2pl, tense: past, reciprocal: true, question: true, target: tanıştınız mı, gloss_de: habt ihr euch kennengelernt? }
      - { id: b2-u03-l2-e7, type: conjugation, mode: verb, lemma: görmek, person: 1pl, tense: aorist, reciprocal: true, target: görüşürüz, gloss_de: wir sehen uns }
      - { id: b2-u03-l2-e8, type: conjugation, mode: verb, lemma: anlamak, person: 3pl, tense: aorist, ability: true, reciprocal: true, negative: true, target: anlaşamazlar, gloss_de: sie können sich nicht einigen }
      - id: b2-u03-l2-e9
        type: multiple_choice
        prompt: Was bedeutet „Görüşürüz!“ wörtlich?
        options: [Wir sehen einander., Wir sprechen morgen., Ich sehe dich nicht.]
        answer: Wir sehen einander.
        explanation: Darum heißt es auch auf Wiedersehen; görüşmek ist der Reziprok von görmek.
      - id: b2-u03-l2-e10
        type: word_bank
        prompt: Wir sind uns gestern auf der Straße begegnet.
        answers: [Dün sokakta karşılaştık., Sokakta dün karşılaştık.]
        chunks:
          - { text: "Dün", role: time }
          - { text: "sokakta", role: place }
          - { text: "karşılaştık", role: predicate }
        orders:
          - { order: [1, 0, 2], note: Mit dün direkt vor dem Verb liegt der Ton auf der Zeit. }
        distractors: [karşıladık, sokağı]
      - id: b2-u03-l2-e11
        type: word_bank
        prompt: Die Nachbarn grüßen einander nicht.
        answers: [Komşular selamlaşmıyor., Komşular selamlaşmıyorlar.]
        distractors: [selam, selamlıyor]
      - id: b2-u03-l2-e12
        type: free_text
        direction: tr_de
        prompt: İki kardeş iyi anlaşıyor.
        answers: [Die beiden Geschwister verstehen sich gut., Die zwei Geschwister verstehen sich gut., Zwei Geschwister verstehen sich gut., Die beiden Brüder verstehen sich gut., Die beiden Schwestern verstehen sich gut., Die zwei Brüder verstehen sich gut., Die zwei Schwestern verstehen sich gut., Die beiden Geschwister kommen gut miteinander aus.]
      - id: b2-u03-l2-e13
        type: suffix_builder
        stem: görmek
        verbal: VN_MA
        reciprocal: true
        suffixes: [POSS_1PL, ACC]
        target: görüşmemizi
        gloss_de: 'dass wir uns treffen (Akkusativ)'
        explanation: Der Reziprok bildet einen neuen Stamm, auch für das Verbalnomen.

  - id: b2-u03-l3
    type: grammar
    title: Einander (birbiri)
    exercises:
      - id: b2-u03-l3-e1
        type: multiple_choice
        prompt: Welche Form passt? „Biz … çok seviyoruz.“ (einander)
        options: [birbirimizi, birbirini, birbirlerini]
        answer: birbirimizi
        explanation: Das Possessiv zeigt die Person, wir → -imiz.
      - id: b2-u03-l3-e2
        type: multiple_choice
        prompt: Welche Form passt? „Onlar … tanımıyor.“ (einander)
        options: [birbirlerini, birbirimizi, birbirinizi]
        answer: birbirlerini
      - id: b2-u03-l3-e3
        type: multiple_choice
        prompt: Welche Form passt? „Siz … yardım ediyor musunuz?“ (einander)
        options: [birbirinize, birbirinizi, birbirinizde]
        answer: birbirinize
        explanation: yardım etmek verlangt den Dativ.
      - id: b2-u03-l3-e4
        type: multiple_choice
        prompt: Welche Form passt? „Çocuklar … oynuyor.“ (miteinander)
        options: [birbirleriyle, birbirlerini, birbirlerine]
        answer: birbirleriyle
      - id: b2-u03-l3-e5
        type: word_bank
        prompt: Wir haben uns lange nicht gesehen.
        answers: [Birbirimizi uzun zamandır görmedik., Uzun zamandır görüşmedik., Uzun zamandır birbirimizi görmedik.]
        chunks:
          - { text: "Birbirimizi", role: object }
          - { text: "uzun zamandır", role: time }
          - { text: "görmedik", role: predicate }
        orders:
          - { order: [1, 0, 2] }
        distractors: [birbirini, görüyoruz]
      - id: b2-u03-l3-e6
        type: word_bank
        prompt: Sie sollten einander vertrauen.
        answers: [Birbirlerine güvenmeliler.]
        distractors: [birbirlerini, güveniyorlar]
        explanation: güvenmek verlangt den Dativ.
      - id: b2-u03-l3-e7
        type: free_text
        direction: tr_de
        prompt: Birbirimizi yıllardır tanıyoruz.
        answers: [Wir kennen uns seit Jahren., Wir kennen einander seit Jahren., Seit Jahren kennen wir uns., Seit Jahren kennen wir einander., Wir kennen uns schon seit Jahren., Wir kennen einander schon seit Jahren., Wir kennen uns seit vielen Jahren.]
      - id: b2-u03-l3-e8
        type: free_text
        direction: de_tr
        prompt: Sie lieben einander.
        answers: [Birbirlerini seviyorlar., Onlar birbirlerini seviyorlar., Birbirlerini seviyor., Onlar birbirlerini seviyor., Birbirini seviyorlar., Birbirini seviyor., Onlar birbirini seviyorlar., Onlar birbirini seviyor.]
      - id: b2-u03-l3-e9
        type: multiple_choice
        prompt: Was ist hier richtig? (Mehmet und Ali haben sich gestritten.)
        options: [Mehmet ile Ali kavga etti., Mehmet Ali'yi kavgaladı., Mehmet ile Ali birbiri kavga.]
        answer: Mehmet ile Ali kavga etti.
      - id: b2-u03-l3-e10
        type: multiple_choice
        prompt: Welches Verb darfst du nicht frei mit -iş bilden?
        options: [sevmek, görmek, anlamak]
        answer: sevmek
        explanation: sevişmek meint körperliche Liebe. Für „sich lieben“ sagt man birbirini sevmek.

  - id: b2-u03-l4
    type: grammar
    title: Sich waschen (-in)
    exercises:
      - { id: b2-u03-l4-e1, type: conjugation, mode: verb, lemma: yıkanmak, person: 1sg, tense: past, target: yıkandım, gloss_de: ich habe mich gewaschen }
      - { id: b2-u03-l4-e2, type: conjugation, mode: verb, lemma: giyinmek, person: 3sg, tense: present, target: giyiniyor, gloss_de: 'er, sie zieht sich an' }
      - { id: b2-u03-l4-e3, type: conjugation, mode: verb, lemma: hazırlanmak, person: 1pl, tense: future, target: hazırlanacağız, gloss_de: wir werden uns vorbereiten }
      - { id: b2-u03-l4-e4, type: conjugation, mode: verb, lemma: taranmak, person: 2sg, tense: past, target: tarandın, gloss_de: du hast dich gekämmt, explanation: Im Alltag meist saçını taramak. }
      - { id: b2-u03-l4-e5, type: conjugation, mode: verb, lemma: övünmek, person: 3sg, tense: aorist, target: övünür, gloss_de: 'er, sie prahlt' }
      - id: b2-u03-l4-e6
        type: multiple_choice
        prompt: Was bedeutet „Ayşe saçını taradı.“?
        options: [Ayşe hat ihre Haare gekämmt., Ayşe hat sich die Haare schneiden lassen., Ayşe wurde gekämmt.]
        answer: Ayşe hat ihre Haare gekämmt.
        explanation: Mit Objekt tarar, ohne Objekt taranır.
      - id: b2-u03-l4-e7
        type: multiple_choice
        prompt: Was kann „Araba yıkandı.“ heißen, was „Çocuk yıkandı.“?
        options: [Das Auto wurde gewaschen. / Das Kind hat sich gewaschen., Das Auto wusch sich. / Das Kind wurde verkauft., Das Auto ist nass. / Das Kind ist sauber.]
        answer: Das Auto wurde gewaschen. / Das Kind hat sich gewaschen.
        explanation: -n ist Reflexiv und bei Stämmen auf Vokal auch Passiv; der Sinn entscheidet.
      - id: b2-u03-l4-e8
        type: word_bank
        prompt: Ich wasche mich und ziehe mich an.
        answers: [Yıkanıp giyiniyorum.]
        distractors: [yıkadım, giyiyorum]
        explanation: -ip übernimmt die Zeit und die Person des letzten Verbs.
      - id: b2-u03-l4-e9
        type: word_bank
        prompt: Prahle nicht so sehr.
        answers: [Bu kadar övünme.]
        distractors: [övme, övünüyor]
      - id: b2-u03-l4-e10
        type: free_text
        direction: tr_de
        prompt: Ben kendimi çok yorgun hissediyorum.
        answers: [Ich fühle mich sehr müde., Ich fühle mich sehr erschöpft.]
        explanation: Mit kendi lässt sich die Handlung ausdrücklich auf sich selbst beziehen.
      - id: b2-u03-l4-e11
        type: free_text
        direction: de_tr
        prompt: Ich habe mich sehr gefreut.
        answers: [Çok sevindim., Ben çok sevindim., Çok memnun oldum.]
      - id: b2-u03-l4-e12
        type: multiple_choice
        prompt: Welche Form passt? „Çocuk aynada … bakıyor.“ (sich selbst)
        options: [kendine, kendisi, kendinde]
        answer: kendine
        explanation: bakmak verlangt den Dativ.

